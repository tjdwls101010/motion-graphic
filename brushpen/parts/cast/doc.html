<!doctype html>
<meta charset="utf-8">
<title>cast / doc</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/solid.js"></script>
<script src="../../kit/cast/paper.js"></script>
<script src="../sample.js"></script>
<script>
/* 출연진 견본: 서류 IB.doc의 포즈 둘(IB.doc.POSE.stand, byFolder)과 동작 여섯(IB.doc.MOVE.spin, armDance, watch, cross, leanIn, reach). 서류는 폴더(cast/folder)와 달리 축 처진 종이라 돌지 않고 휜다: sway(위가 옆으로 기욺), sag(가운데가 처짐), wave(S자), 깊이로는 arch, curl, twist. 빠른 회전도 회전이 아니라 앞뒤로 젖힌 두 장으로 그린다(옆으로 서면 선 하나가 되고 뒷면은 비어 있다). 클립 아래 색 메모 셋은 pose.n = [흔들림, 들림]으로 몸을 뒤따르다 가장 늦게 가라앉는다. 팔은 필요할 때만 몸 가장자리 뒤에서 자라 나온다: armDance의 pose.arms('short', 'hip', 'out', 'up', 'low'), 그리고 폴더의 팔을 찾아 뻗는 reach(포즈가 아니라 IB.doc.reachRoot에서 잰 팔 행이고 'clasp'로 끝난다; IB.paperArm으로 몸보다 먼저 그리고, 손이 닿으면 IB.paperClasp). 좌표는 원본 그대로(바닥선 y 893, 서류는 x 1700에서 시작해 1598에서 멈춤)이고 다른 자리에는 opts.at·s·flip으로 옮긴다. 칸마다 원본 그림 목록을 반복하고 마지막 그림을 0.75초 붙잡는다. */
const D = IB.doc, FLOOR = IB.PAPER.floor, POSTER = IB.frame(0.72 * 6), MEET = [1463, 738];
// each move with the frame the 0.72 poster should land on (its most bent drawing): the cell's clock is shifted by that much
const MOVES = [['spin', 6], ['armDance', 10], ['watch', 22], ['cross', 4], ['leanIn', 8]];
const shifted = (f, rows, at) => { const len = rows[rows.length - 1][0] + 18; return f + ((at - POSTER) % len + len); };
const centre = (rows) => { const xs = rows.flatMap(([, p]) => [p.x, ...p.feet.map((q) => q[0])]); return (Math.min(...xs) + Math.max(...xs)) / 2; };
MG.scene({
  title: 'cast / doc',
  duration: 6, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'IB.doc — POSE, MOVE, and its reaching arm (cast/paper.js)');
    const f = IB.frame(t), c = SAMPLE.grid(8, 4), fit = (i, x) => SAMPLE.fit(c[i], [x, FLOOR], 30);
    Object.entries(D.POSE).forEach(([name, p], i) => SAMPLE.cell(ctx, c[i], fit(i, p.x), () => D(ctx, p), `POSE.${name} (x ${p.x})`));
    MOVES.forEach(([name, at], i) => SAMPLE.cell(ctx, c[2 + i], fit(2 + i, centre(D.MOVE[name])), () => D(ctx, SAMPLE.cycle(shifted(f, D.MOVE[name], at), D.MOVE[name])), 'MOVE.' + name));
    // the arm that finds the folder's, from the edge nearest it, while the document stands by the folder; at 'clasp' it runs to where the hands meet (the folder's own arm is in cast/folder-moves)
    const g = shifted(f, D.MOVE.reach, 32), row = SAMPLE.cycle(g, D.MOVE.reach), p = D.POSE.byFolder, root = D.reachRoot(p);
    SAMPLE.cell(ctx, c[7], fit(7, 1530), () => {
      if (row === 'clasp') IB.paperArm(ctx, root, [MEET[0] + 9, MEET[1] - 3], { bow: 5, seed: 420 });
      else IB.paperArm(ctx, root, [root[0] + row.to[0], root[1] + row.to[1]], { ...row, flip: 1, seed: 420 });
      D(ctx, p);
      if (row === 'clasp') IB.paperClasp(ctx, MEET, { held: true });
    }, 'MOVE.reach — IB.paperArm');
  },
});
</script>
