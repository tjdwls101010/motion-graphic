<!doctype html>
<meta charset="utf-8">
<title>work / coffee-queue-shuffle</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/handheld.js"></script>
<script src="../../kit/props/copyroom.js"></script>
<script src="../../kit/camera.js"></script>
<script>
/* 탕비실 커피머신 앞에 컵을 든 셋이 줄 서 있다. 앞사람이 커피를 받아 떠나자 뒤의 둘이 한 장씩 늦게 한 칸씩 당겨 서고, 둘째가 물통의 마지막 물로 커피를 받아 떠난 뒤 마지막 사람이 컵을 놓고 버튼을 누르자 머신이 물 없음 등을 켜고 한 방울만 떨어뜨린다. 원본에 없는 창작 장면으로, 인물 리그(IB.figure, IB.walk, IB.poseMix), 일상 인물(IB.PEOPLE.boss, designer, clerk), 탕비실 소품(IB.counter, IB.coffeeMachine, IB.waterCooler), 종이컵(IB.cup), 말풍선을 썼다. 전달하는 생각: 같은 걸음이 한 장씩 늦게 번지면 줄이 하나의 몸처럼 움직인다.
   Motion notes: 8 s in five shots (IB.shot, on ones): 0 s a wide of the whole line and the cooler (1760 px window); 1.25 s, as the line steps up, a pan after it (on twos, 20 frames, to 1440); 2.58 s a cut to the designer at the machine with the clerk waiting behind her (1000); 4.5 s a cut back to the line (1480) as she leaves and he steps up; 5.75 s an ease in to the machine's grate (600, 14 frames) that lands as the empty light comes on and the drop falls, his face leaning into the close-up; 6.83 s, on the slump, a cut to a medium of him and the machine (1160) for the bubble. Actors are staged once in stage px: three figures 440 px tall (line 3.4 px), dir 1, each with a paper cup (IB.cup) in the near hand, all on twos as walks and lists of drawings, every drawing passing the one before as pose.prev; the pantry parts at s 1.29 (the machine 145 x 217 px on a worktop 233 px up, its cup and button within 0.29 h of the one at the front). A shuffle is one walk cycle from a standing stride (phase 1/3) to the same stride one IB.walkLen (369.6 px) on: 11 walking drawings at 30.8 px each, one drawing thrown forward (lean 0.14) and the stand, so the line's three places are 369.6 px apart and no planted foot slides. The ripple: the boss leaves on frame 30, the designer starts frame 32 and the clerk frame 34, one drawing apart, and each stops one drawing after the one ahead (2.25 s and 2.33 s). Whoever leaves walks on off the right edge and is gone. The machine is a machine: its button sinks for 4 frames, its empty light switches on ones; its stream is drawn and flickers between two drawings on twos, growing in two drawings (0.5, 1). Beats: the boss's stream stops at 0.67 s, he reaches for the cup (an in-between, the grip) at 0.83 s and lifts it at 1.08 s. The designer puts her cup down (in-between 2.58 s, set 2.67 s), lets go, presses the button with the far hand so her face stays clear (2.83 s); the stream runs 3.0-4.0 s while the tank goes from 0.22 to empty; she takes the cup at 4.17 s and walks off at 4.58 s; the clerk follows one drawing later and stops at 5.58 s. He sets his cup down at 5.92 s and presses at 6.08 s; the empty light comes on at 6.25 s, blinks off and on every 6 frames and stays on from 6.75 s; one drop leaves the spout at 6.33 s and is in the cup by 6.67 s, four drawings; he leans in to look (6.42 s) and at 6.83 s slumps with one drawing past (u 1.08, head down 0.5, eyes shut). The bubble opens at 7.0 s and from 7.17 s nothing moves. Three colours: the designer's yellow tee and the clerk's sky shirt, the blue of the water in the tank and the cooler's bottle, and the empty light's yellow; the boss is in charcoal. */
const F = IB.FIG, FLOOR = 960, H = 440, K = H / 340;   // K: the pantry parts are drawn for a 340 px figure
const PEOPLE = {
  boss: { ...IB.PEOPLE.boss, h: H, dir: 1, seed: 90 },
  designer: { ...IB.PEOPLE.designer, h: H, dir: 1, seed: 110 },
  clerk: { ...IB.PEOPLE.clerk, h: H, dir: 1, seed: 130 },
};
const LEN = IB.walkLen(PEOPLE.clerk), PACE = LEN / 12, PH = 1 / 3;   // one shuffle: a whole cycle, from the stride of phase 1/3 to the same stride
const P0 = 1170, PLACE = [P0, P0 - LEN, P0 - 2 * LEN], MX = P0 + 90 * K;   // the three places in the line (P0 is the one at the machine); MX the machine's centre, its cup and button within the arm's reach (0.29 h) from P0
const TOP = FLOOR - 180 * K, CUP = [MX - 9, TOP - 10 * K - 6], RIM = TOP - 10 * K - 36;   // the counter's worktop, the cup on the machine's grate (IB.cup's hand point) and its rim
const BUTTON = [MX - 12 * K, TOP - 142 * K];   // IB.coffeeMachine's right button at this size

/* ---------- drawings, for a figure standing in the stride at X ---------- */
const SHY = (p) => p.hip[1] - (F.torso - 0.012) * H;
const holdCup = (p) => ({ ...p, hands: [p.hands[0], [p.hip[0] + 0.13 * H, SHY(p) + 0.13 * H]], hand: ['relax', 'grip'] });   // the cup in the near hand, held at the chest
const stance = (X, who) => ({ ...IB.stand(X, FLOOR, who), feet: IB.walk(X, FLOOR, who, PH).feet.map((f) => [f[0], FLOOR - F.ankle * H, 0]) });
const D = {
  wait: (X, who) => ({ ...holdCup(stance(X, who)), face: { mouth: 'flat' } }),
  thrown: (X, who) => { const p = stance(X, who); return { ...holdCup({ ...p, hip: [X + 6, p.hip[1] + 2], lean: 0.14 }), face: { mouth: 'flat' } }; },
  watch: (X, who, face = { mouth: 'flat' }) => ({ ...stance(X, who), nod: 0.12, face }),
  grab: (X, who) => { const p = stance(X, who); return { ...p, hip: [X + 6, p.hip[1] + 4], lean: 0.18, nod: 0.12, hands: [p.hands[0], [CUP[0] + 2, CUP[1] - 14]], hand: ['relax', 'grip'], face: { mouth: 'flat' } }; },
  press: (X, who) => { const p = stance(X, who); return { ...p, hip: [X + 4, p.hip[1]], lean: 0.1, hands: [[BUTTON[0] - 10, BUTTON[1] + 4], p.hands[1]], hand: ['point', 'relax'], face: { mouth: 'flat' } }; },
  peek: (X, who) => { const p = stance(X, who); return { ...p, hip: [X + 8, p.hip[1] + 4], lean: 0.24, nod: 0.08, face: { eye: 'wide', mouth: 'flat' } }; },
  slump: (X, who) => { const p = stance(X, who); return { ...p, hip: [X - 4, p.hip[1] + 14], lean: 0.3, nod: 0.5, hands: [[p.hands[0][0] + 14, p.hands[0][1] + 16], [p.hands[1][0] + 18, p.hands[1][1] + 16]], face: { eye: 'closed', mouth: 'frown', brow: -0.8 } }; },
};
const mix = (a, b, u) => ({ ...IB.poseMix(a, b, u), hand: (u < 0.5 ? a : b).hand, face: (u < 0.5 ? a : b).face });

/* A shuffle starting on frame fs from X: 11 walking drawings at PACE each (cup at the chest), one thrown drawing at X + LEN, then standing there. n = Infinity walks on without stopping (leaving) and is null once off the right edge. */
function walkOn(fs, X, who, n = 11) {
  return (f) => {
    const k = 1 + ((f - fs) >> 1);
    if (X + k * PACE > 2050) return null;   // walked off the right edge (the trailing foot is 0.21 h behind the hip): gone
    if (k <= n) return { ...holdCup(IB.walk(X + k * PACE, FLOOR, who, (PH + k / 12) % 1)), face: { mouth: 'flat' } };
    return f - fs < 2 * n + 2 ? D.thrown(X + LEN, who) : D.wait(X + LEN, who);
  };
}
/* Each person: a list of [from frame, pose function of the frame]; within a stretch the poses are an [frame, drawing] table or a walk. The cup: 'hand' (at the near hand), 'grate' (on the machine), or gone with its owner. */
const table = (rows) => (f) => IB.held(rows, f);
const WHO = {
  boss: [
    [0, table([[0, D.watch(P0, PEOPLE.boss)], [20, mix(D.watch(P0, PEOPLE.boss), D.grab(P0, PEOPLE.boss), 0.6)], [22, D.grab(P0, PEOPLE.boss)], [26, D.wait(P0, PEOPLE.boss)]])],
    [30, walkOn(30, P0, PEOPLE.boss, Infinity)],
  ],
  designer: [
    [0, table([[0, D.wait(PLACE[1], PEOPLE.designer)]])],
    [32, walkOn(32, PLACE[1], PEOPLE.designer)],
    [62, table([[62, mix(D.wait(P0, PEOPLE.designer), D.grab(P0, PEOPLE.designer), 0.6)], [64, D.grab(P0, PEOPLE.designer)], [66, mix(D.grab(P0, PEOPLE.designer), D.watch(P0, PEOPLE.designer), 0.5)],
      [68, D.press(P0, PEOPLE.designer)], [74, mix(D.press(P0, PEOPLE.designer), D.watch(P0, PEOPLE.designer), 0.5)], [76, D.watch(P0, PEOPLE.designer)],
      [98, mix(D.watch(P0, PEOPLE.designer), D.grab(P0, PEOPLE.designer), 0.6)], [100, D.grab(P0, PEOPLE.designer)], [104, D.wait(P0, PEOPLE.designer)]])],
    [110, walkOn(110, P0, PEOPLE.designer, Infinity)],
  ],
  clerk: [
    [0, table([[0, D.wait(PLACE[2], PEOPLE.clerk)]])],
    [34, walkOn(34, PLACE[2], PEOPLE.clerk)],
    [112, walkOn(112, PLACE[1], PEOPLE.clerk)],
    [140, table([[140, mix(D.wait(P0, PEOPLE.clerk), D.grab(P0, PEOPLE.clerk), 0.6)], [142, D.grab(P0, PEOPLE.clerk)], [144, mix(D.grab(P0, PEOPLE.clerk), D.watch(P0, PEOPLE.clerk), 0.5)],
      [146, D.press(P0, PEOPLE.clerk)], [150, mix(D.press(P0, PEOPLE.clerk), D.watch(P0, PEOPLE.clerk), 0.5)], [152, D.watch(P0, PEOPLE.clerk)],
      [154, D.peek(P0, PEOPLE.clerk)],
      [164, { ...IB.poseMix(D.peek(P0, PEOPLE.clerk), D.slump(P0, PEOPLE.clerk), 1.08), face: D.slump(P0, PEOPLE.clerk).face }], [166, D.slump(P0, PEOPLE.clerk)]])],
  ],
};
// where each cup is: [from frame, 'hand' | 'grate' | 'gone']
const CUPS = { boss: [[0, 'grate'], [26, 'hand']], designer: [[0, 'hand'], [64, 'grate'], [104, 'hand']], clerk: [[0, 'hand'], [142, 'grate']] };

const poseOn = (name, f) => { let fn = WHO[name][0][1]; for (const [k, g] of WHO[name]) if (f >= k) fn = g; return fn(f); };
const poseAt = (name, t) => { const f = IB.frame(IB.twos(t)), p = poseOn(name, f); return p && { ...p, prev: (f > 0 && poseOn(name, f - 2)) || undefined }; };

/* ---------- the machine: on ones, except the stream and the drop, which are drawn (twos) ---------- */
function machineAt(f) {
  const st = { tank: f < 72 ? 0.22 : f < 96 ? 0.22 * (1 - (f - 72) / 24) : 0, press: (f >= 68 && f < 72) || (f >= 146 && f < 150) };
  const pour = (f0, f1) => { if (f < f0 || f >= f1) return; const k = (f - f0) >> 1; st.stream = k === 0 ? 0.5 : 1; st.flick = k % 2; };
  pour(-24, 16); pour(72, 96);
  if (f >= 150) st.empty = f < 162 ? !IB.alternate(f - 150, 6) : true;
  if (f >= 152 && f < 160) st.drop = ((f - 152) >> 1) / 3;
  return st;
}

// the camera: the whole line, a pan as it steps up, the designer's coffee, the line again, an ease in to the cup for the drop, the slump
const SHOTS = [
  [0, { at: [860, 700], w: 1760 }],
  [30, { at: [1060, 700], w: 1440 }, 'pan', 20],
  [62, { at: [1120, 680], w: 1000 }, 'cut'],
  [108, { at: [1000, 700], w: 1480 }, 'cut'],
  [138, { at: [1268, 620], w: 600 }, 'ease', 14],
  [164, { at: [1120, 660], w: 1160 }, 'cut'],
];

IB.actors = (t) => { const f = IB.frame(t); return { boss: poseAt('boss', t), designer: poseAt('designer', t), clerk: poseAt('clerk', t), machine: machineAt(f) }; };

MG.scene({
  title: 'work / coffee-queue-shuffle',
  duration: 8, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t), ft = IB.frame(IB.twos(t));
    IB.film(ctx, IB.shot(SHOTS, Math.floor(t * 24)), (ctx) => {
      IB.smear(ctx, 820, FLOOR - 10, 1500, { h: 16, seed: 9 });
      IB.waterCooler(ctx, [150, FLOOR], { level: 0.62 }, { s: K, lw: 3.4 });
      IB.counter(ctx, [MX + 140 * K, FLOOR], { s: K, lw: 3.4 });
      IB.coffeeMachine(ctx, [MX, TOP], { ...machineAt(f), to: RIM }, { s: K, lw: 3.4 });
      for (const name of ['clerk', 'designer', 'boss']) {
        const where = IB.held(CUPS[name], ft);
        if (where === 'grate') IB.cup(ctx, CUP);
      }
      for (const name of ['clerk', 'designer', 'boss']) {
        const p = poseAt(name, t);
        if (!p) continue;
        const j = IB.figure(ctx, p, { ...PEOPLE[name], face: p.face });
        if (IB.held(CUPS[name], ft) === 'hand') IB.cup(ctx, [j.hands[1][0] - 4, j.hands[1][1] - 2]);
      }
      IB.bubble(ctx, ['…한 방울?'], t, 7.0, { tip: [P0 + 24, SHY(D.slump(P0, PEOPLE.clerk)) - 0.16 * H], x: P0 - 190, y: FLOOR - H - 40, seed: 500 });
    });
  },
});
</script>
