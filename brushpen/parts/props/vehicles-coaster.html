<!doctype html>
<meta charset="utf-8">
<title>props / vehicles-coaster</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../sample.js"></script>
<script>
/* 소품 견본: 탈것, 롤러코스터 한 벌, 레일 IB.rail, 트랙 IB.coasterTrack, 카트 IB.coasterCart, 오르막의 딸깍 IB.coasterClack, 곤두박질 한 장의 IB.coasterSpeedLines. 레일은 점 11개를 지나는 Catmull-Rom 곡선과 그 위의 호 길이이고, 트랙은 96px마다 회색 지지대와 5.5px 레일 한 획이다(layer로 둘을 나눠 그 사이에 바닥 분필을 깐다). 카트는 바퀴 둘로 레일에 얹혀 휘지 않는 노란 카트와 탄 사람이고 K 1.35배로 그린다. 트랙이 무대 너비를 다 쓰므로 칸 없이 전면으로, market/chart-rollercoaster-rider의 점과 박자 그대로 탄다: 3프레임 단위로 스무 칸 딸깍대며 느리게 오르고, 꼭대기에서 겁먹고, 4.08초에 stretch 2.1인 스미어 한 장으로 바닥까지 떨어진 뒤(충격선 IB.burst 두 장) 작은 언덕을 넘어 멈춘다. 회색 점은 rail이 지나는 점 11개다. 원본 장면은 축(IB.chartAxes)을 깔아 주가 차트로 만든다. */
const { lerp } = MG;
const BASE = 900;
const P = [[270, 838], [430, 792], [690, 340], [820, 246], [905, 330], [1030, 730], [1200, 806], [1390, 580], [1520, 530], [1650, 596], [1790, 580]];
const WHO = { ...IB.PEOPLE.passenger, h: 250, dir: 1, seed: 40 };
const K = 1.35;
const RAIL = IB.rail(P);
const S = (i) => RAIL.len[i * RAIL.per];
const BOTTOM = (() => { let b = 5 * RAIL.per; for (let i = 5 * RAIL.per; i <= 7 * RAIL.per; i++) if (RAIL.pts[i][1] > RAIL.pts[b][1]) b = i; return RAIL.len[b]; })();
const END = S(10) - 150;
/* the scene's ride, drawing by drawing (market/chart-rollercoaster-rider) */
function ride(t) {
  const t2 = IB.twos(t), t3 = IB.threes(t);
  if (t3 < 0.5) return { s: S(1), mood: 'calm' };
  if (t2 < 4 - 1e-6) {
    const k = IB.drawn(t3, 0.5, 8);
    if (k <= 20) { const u = k / 20; return { s: lerp(S(1), S(3) - 24, 1 - Math.pow(1 - u, 1.5)), mood: 'calm', tick: k }; }
    return { s: S(3) - 24 + 8 * Math.min(3, k - 20), mood: 'scared' };
  }
  const k = IB.drawn(t2, IB.T(49));
  if (k < 0) return { s: lerp(S(3), BOTTOM, 0.5), mood: 'drop', smear: true };
  if (k === 0) return { s: BOTTOM, mood: 'drop', thud: 0 };
  if (k <= 6) return { s: lerp(BOTTOM, S(8), MG.ease.outQuad(k / 6)), mood: 'drop', thud: k === 1 ? 1 : null };
  if (k < 14) return { s: lerp(S(8), END, MG.ease.inOutQuad((k - 6) / 8)), mood: 'dizzy' };
  return { s: END, mood: 'dizzy', rock: IB.alternate(IB.frame(t), 3, 162) };
}
/* the rider in the cart's own coordinates: hip low, feet forward and hidden, hands on the bar or thrown up (bar: false) */
function rider(r) {
  const up = r.mood === 'drop', hip = [-14, -52];
  const pose = { hip, lean: up ? -0.12 : 0.03, nod: r.mood === 'dizzy' ? 0.25 + (r.rock ? 0.14 : 0) : up ? -0.3 : r.mood === 'scared' ? 0.1 : 0, feet: [[26, -36, 0], [18, -34, 0]], hands: up ? [[26, -180], [4, -186]] : [[50, -92], [44, -88]], grip: [!up, !up], knee: [1, 1] };
  const face = r.mood === 'calm' ? { mouth: 'smile' } : r.mood === 'scared' ? { eye: 'wide', mouth: 'flat', brow: -1 } : r.mood === 'drop' ? { eye: 'wide', mouth: 'open' } : { eye: 'closed', mouth: 'frown' };
  return { look: { ...WHO, face }, pose, bar: !up };
}
MG.scene({
  title: 'props / vehicles-coaster',
  duration: 7.5, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const r = ride(t);
    IB.coasterTrack(ctx, RAIL, { base: BASE, layer: 'supports' });
    IB.smear(ctx, 1010, BASE + 2, 1500, { h: 12, seed: 9 });
    IB.coasterTrack(ctx, RAIL, { layer: 'rail' });
    P.forEach(([x, y]) => IB.oval(ctx, x, y, 6, 6, { fill: '#9a9a9a', w: 0, n: 8 }));   // the points the rail runs through
    const c = IB.coasterCart(ctx, RAIL, r.s, { stretch: r.smear ? 2.1 : 1, K, rider: rider(r) });
    if (r.tick != null && r.tick > 0) IB.coasterClack(ctx, c, r.tick, { K });
    if (r.smear) IB.coasterSpeedLines(ctx, RAIL, S(3) + 30, r.s - 150);
    if (r.thud != null) IB.burst(ctx, [c.p[0], c.p[1] - 20], { a0: -2.6, da: 0.7, r0: 96 + r.thud * 20, r1: 96 + r.thud * 20 + 44, sy: 0.7, w: 3, seed: 110 + r.thud * 5 });
    const what = r.smear ? 'stretch 2.1 + IB.coasterSpeedLines (one drawing)' : r.tick ? `IB.coasterClack(cart, k ${r.tick}) — climbing on threes` : r.thud != null ? 'landing: IB.burst, two drawings' : r.mood;
    SAMPLE.caption(ctx, `IB.rail + IB.coasterTrack + IB.coasterCart — ${what}`);
  },
});
</script>
