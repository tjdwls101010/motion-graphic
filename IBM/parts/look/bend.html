<!doctype html>
<meta charset="utf-8">
<title>look / bend</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/solid.js"></script>
<script src="../sample.js"></script>
<script>
/* 선·색·질감 견본: 바닥 가운데로 서 있는 종이 한 장의 휨 IB.bend의 여섯 값. 화면 평면에서 보이는 sway(윗변이 높이의 제곱으로 옆으로 밀림: 풀잎), sag(가운데가 처져 위아래 변이 웃는 모양), wave(반은 오르고 반은 내려 S자)와, 종이를 돌리거나 젖혀야 보이는 깊이 방향의 arch(윗변이 뒤로), curl(양옆 변이 뒤로), twist(윗변이 아랫변보다 늦게 도는 것: 발로 도는 종이의 지연)이다. sway·arch·twist는 아랫변을 그대로 두므로 걷는 종이처럼 발에 붙들린 채 위가 늦게 따라오고, sag·wave·curl은 아랫변도 움직인다. 굽어도 늘어나지 않아서 옆이나 깊이로 간 만큼 높이를 잃는다. 값은 서류 IB.doc의 동작이 쓰는 범위다(sway -17~27, sag -5~6, wave -9~5, arch 9~18, twist -0.1~0.16; curl은 서류에 쓰인 적이 없어 ±20을 골랐다). 종이는 서류의 173×238, IB.rim(…, 10)이고, 칸마다 두 값이 반초씩 번갈아 붙잡히고, 깊이 방향 값은 종이를 돌려서 보인다(arch yaw 1.0, curl 0.6, twist 0.9, 셋을 섞은 칸 -0.3). 뒤의 옅은 회색 선은 휘지 않은 같은 종이다. 마지막 칸은 들어온 z로 종이에서 들린 쪽지가 종이와 함께 휘는 것이다. */
const DW = 173, DH = 238;
const sheet = (ctx, M, seed) => {
  IB.ink(ctx, IB.cast(M, IB.rim(-DW / 2, -DH, DW, DH, 10)).pts, { closed: true, smooth: false, fill: IB.C.paper, w: 3.3, seed });
  for (let i = 0; i < 6; i++) IB.ink(ctx, [[20, -182 + i * 15, 0], [42, -182 + i * 15, 0], [64, -182 + i * 15, 0]].map(M), { w: 2.4, seed: seed + 5 + i });   // the ruled lines bend with it
};
// the unbent sheet in the same space, a thin grey line behind the bent one, so a still shows what moved
const flat = (ctx, S) => IB.ink(ctx, IB.cast(S, IB.rim(-DW / 2, -DH, DW, DH, 10)).pts, { closed: true, smooth: false, w: 1.5, color: '#b5b5b5', grain: 0, wob: 0 });
// [label, the two bends it alternates between, the turn of its space]
const ROWS = [
  ['sway', [{ sway: 17 }, { sway: -17 }], {}],
  ['sag', [{ sag: 6 }, { sag: -5 }], {}],
  ['wave', [{ wave: 5 }, { wave: -9 }], {}],
  ['arch', [{ arch: 0 }, { arch: 18 }], { yaw: 1.0 }],
  ['curl', [{ curl: 20 }, { curl: -20 }], { yaw: 0.6 }],
  ['twist', [{ twist: 0.16 }, { twist: -0.1 }], { yaw: 0.9 }],
  ['sway + arch + twist', [{}, { sway: 12, arch: 9, twist: 0.12 }], { yaw: -0.3 }],
];
MG.scene({
  title: 'look / bend',
  duration: 4, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'IB.bend — the flex of a standing sheet (solid.js)');
    const f = IB.frame(t), k = IB.alternate(f, 12), c = SAMPLE.grid(8, 4);
    ROWS.forEach(([name, bends, turn], i) => {
      const b = bends[k], S = IB.space({ at: [960, 640], look: 0.18, ...turn }), B = IB.bend({ w: DW, h: DH, ...b });
      const shown = Object.entries(b).map(([key, v]) => `${key} ${v}`).join(' · ') || `${name}: flat`;
      SAMPLE.cell(ctx, c[i], SAMPLE.fit(c[i], [960, 640], 80), () => { flat(ctx, S); sheet(ctx, (q) => S(B(q)), 31 + i * 20); }, i ? shown : `IB.bend({ ${shown} })`);
    });
    // a note on the sheet whose lower half is lifted toward us (z < 0): it bends with the sheet because bend takes the z it is given
    const b = [{ sway: 17 }, { sway: -12 }][k], S = IB.space({ at: [960, 640], look: 0.18, yaw: -0.3 }), M = (q) => S(IB.bend({ w: DW, h: DH, ...b })(q));
    const NOTE = IB.rim(-60, -227, 82, 149, 6).map(([x, y]) => [x, y, -1.5 - Math.max(0, y + 150) * 0.5]);
    SAMPLE.cell(ctx, c[7], SAMPLE.fit(c[7], [960, 640], 80), () => {
      flat(ctx, S); sheet(ctx, M, 200);
      IB.ink(ctx, IB.cast(M, NOTE).pts, { closed: true, smooth: false, fill: IB.C.mint, w: 2, seed: 34 });
    }, `note lifted (z < 0) · sway ${b.sway}`);
  },
});
</script>
