<title>spot / folder-meets-document</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/solid.js"></script>
<script src="../../kit/cast/paper.js"></script>
<script src="../../kit/props/party.js"></script>
<script src="../../kit/sets/party.js"></script>
<script>
/* 미러볼 아래 다리 달린 파란 폴더가 풍선을 차자 화면이 옆으로 밀려 서류가 드러나고, 둘이 따로 춤추다 다가가 손을 잡으면 하트 풍선이 떠오른다. 원본은 왼쪽에 카피가 있는 화면이고, 여기서는 문구를 빼고 그림 영역만 잘라 화면에 채웠다. 폴더는 빳빳해서 책처럼 벌어지고 통째로 돌며, 종이는 낭창해서 휘고 클립에 물린 메모지가 늦게 따라온다. 전달하는 생각: 따로 놀던 두 가지가 마침내 한자리에 선다.
   Motion notes: one locked shot, no cuts, 11.6 s. Shows the reference frame's region x 356-1920, y 60-940 (CROP) enlarged 1.23x; coordinates in the code are the reference's. The stage pans 291 px on twos with per-step travel 9, 12, 12, 113, 117, 13, 9, 6 px (slow out, two big steps, three to settle), starting 1.75 s; the reference's copy is not drawn.
   Acting is a list of drawings, not a curve: FOLDER and DOC are tables of [frame, pose] at 24 fps, each pose held dead still until the next key, keys two frames apart while something moves (twos). Nothing is interpolated between keys: a move is 2-4 hand-placed drawings (anticipation, extreme, overshoot, rest) and a hold is the absence of keys. Feet are stage coordinates, not offsets from the body: a planted foot keeps its x from key to key while the body moves over it, and a foot changes place only through a drawing where it is off the floor. The one exception is the 191 px gather out of the lunge at 6.58 s, which the reference also pops in a single drawing. The reference has about 60 folder drawings and 55 document drawings in this shot; the tables have about 50 each. The two take turns: while one acts the other holds (the folder holds 4.4-5.9 s under the document's arm dance; the document leans in to watch the folder wind up and rears back two frames after its lunge lands).
   Depth (kit/solid.js): bodies stand in a small 3-D space and are projected into the ink pen. Folder = two stiff covers hinged at the bottom (`open`, rad) that turn as one (`yaw`), with graphite in the gap. It faces about with a hop: crouch -5 and -11 px, one airborne drawing seen nearly edge-on (yaw 1.25, +16 px), landing squash -8, rebound +3. Its spin kick is a crouch held 4 frames, two drawings whirled 0.85-0.92 rad on one foot with the other leg thrown up in an arc, a reach, a landing 36 px low with the covers 0.62 rad apart, a slide of the weight onto the front foot (covers 0.82 rad, the widest they get), and a pop up 7 px before it settles.
   Document = one bendable sheet (IB.bend: sway, sag, wave in the picture plane; arch, twist in depth) whose space can also pitch. Its whirl is 9 drawings (3.46-4.2 s): dip, lean with a leg crossing over, lean back the other way, two extremes where the sheet is tipped 0.9 rad away and then 0.8 rad toward us (its centre line reads 0.66 and 0.64 of its height) with its top and bottom edges in an S (wave 5 and -9 px), then recoveries with sway 18, 9 and -3 px. It never shows a blank back. The papers under its clip swing and lift by their own share (yellow 0.5, lavender 1, green 1.3), go opposite ways on the two extremes and come to rest one key after the sheet (sheet at 4.12 s, papers at 4.29 s); a lifted paper bellies and throws graphite on the sheet under its free edge.
   Limbs (kit/figure.js): rubber-hose legs with a `bow` or a knee (`via`), boots seen from the front at rest and from the side in a step or kick. Arms exist only while used and grow from behind the body edge over 3-4 drawings; a hand on the hip is a ring that leaves the edge and returns to it. Hands change shape with the acting: rest -> reach -> open -> clasp. Line: bodies 3.3-3.7 px, limbs 2.4, hands 2.2.
   Props: the kicked balloon leaves as one stretched smear drawing (2.5:1 along its path), turns one full revolution knot-last to knot-first while it drifts down for 2 s, squashes on landing (44 x 29 against 40 x 33), bounces 8 px and rocks twice. Mirror ball: a sphere of 24 x 10 tiles seen from 3 radii away; tile colours are fixed to the ball and travel across it 0.05 rad per drawing on threes (8 fps); two glints grow and die over 4 drawings each. The ball is the one thing that never holds: the reference's ball also changes every 3 frames through its last frame. Last second: both characters held, and apart from the ball only the heart balloon moves: one narrow drawing as it turns into view, then easing up exponentially (tau 0.45 s) with its string flicking side to side on twos. Floor: a blue chalk puddle with a solid core that stretches to span the feet, plus flat confetti ovals. */
const { lerp } = MG;
const PI = Math.PI;
const CROP = [356, 60, 1564, 880];   // the region of the reference frame this scene shows, enlarged 1.23x: the copy on the left is left out

// stage pan, px left to travel, per 24 fps frame (measured on the disco ball; it steps on twos)
const PAN = [[42, 282], [44, 270], [46, 258], [48, 145], [50, 28], [52, 15], [54, 6], [56, 0]];
const pan = (f) => IB.heldRow(PAN, f, [0, 291])[1];

const CONFETTI = IB.confettiField();

/* The two actors' drawings: each move is the character's own (cast/paper.js), placed here at the frame the reference starts it on. Between moves the last drawing holds: those gaps are the holds. They take turns: while the document dances with its arms (110-134) the folder does not move at all. */
const F = IB.folder, D = IB.doc;
const FOLDER = [[0, F.POSE.front], ...IB.play(F.MOVE.kick, 18), ...IB.play(F.MOVE.aboutFace, 60), ...IB.play(F.MOVE.groove, 75), ...IB.play(F.MOVE.groove, 87), ...IB.play(F.MOVE.hipOut, 99), ...IB.play(F.MOVE.lunge, 142), ...IB.play(F.MOVE.shiftWeight, 173), ...IB.play(F.MOVE.walkOver, 195), ...IB.play(F.MOVE.leanIn, 246)];
const DOC = [[0, D.POSE.stand], ...IB.play(D.MOVE.spin, 83), ...IB.play(D.MOVE.armDance, 110), ...IB.play(D.MOVE.watch, 136), ...IB.play(D.MOVE.cross, 186), ...IB.play(D.MOVE.leanIn, 246)];
// the arms that find each other, and the balloon the folder kicks at frame 0
const FARM = IB.play(F.MOVE.reach, 214), DARM = IB.play(D.MOVE.reach, 216), BALLOON = IB.play(IB.looseBalloon.MOVE.kicked, 0);
const MEET = [1463, 738];   // where the two hands hold
// the actors' drawings at t, for tools/drawings.py (the baseline in STYLE.md)
IB.actors = (t) => { const f = IB.frame(t); return { folder: IB.held(FOLDER, f), doc: IB.held(DOC, f) }; };

MG.scene({
  title: 'spot / folder-meets-document',
  duration: 11.625, ref: [90.083, 101.708], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t), tt = IB.twos(t);
    IB.crop(ctx, CROP);
    ctx.translate(pan(f), 0);

    IB.confetti(ctx, CONFETTI);
    IB.discoBall(ctx, [1302, 215], { f }, { r: 105 });
    IB.partyCorner(ctx);
    const b = IB.held(BALLOON, f);
    IB.looseBalloon(ctx, [b.x, b.y], b);
    // impact: two arcs off the toe for the two drawings of the kick
    if (f >= 22 && f < 26) IB.shake(ctx, 1010, 846, 20, { a: PI * 0.92, n: 2, w: 2.2, gap: 8, seed: 18 + Math.floor(f / 2) });

    const fp = IB.held(FOLDER, f), dp = IB.held(DOC, f);
    // the arms that reach for each other are drawn first, so that each one's root is behind its body's edge
    const fa = f >= FARM[0][0] ? IB.held(FARM, f) : null, da = f >= DARM[0][0] ? IB.held(DARM, f) : null;
    IB.paperReach(ctx, fp, dp, fa, da, MEET);
    IB.doc(ctx, dp);
    IB.folder(ctx, fp);
    if (fa === 'clasp') IB.paperClasp(ctx, MEET, { held: f >= 258 });

    // heart balloon: the only thing moving in the last second
    if (f >= 258) IB.heartBalloon(ctx, [1460, lerp(690, 400, IB.settle(tt - 258 / 24, 0.45, 2.4))], { sway: IB.alternate(f, 2) ? 1 : -1, edge: f < 260 });
  },
});
</script>
