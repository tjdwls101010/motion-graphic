<!doctype html>
<meta charset="utf-8">
<title>school / chalk-dust-sneeze</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/office.js"></script>
<script src="../../kit/props/classroom.js"></script>
<script>
/* 선생님이 칠판을 지우개로 크게 박박 지우자 분필 가루 구름이 피어올라 얼굴을 감싸고, 코를 찡그리며 머리가 점점 뒤로 젖혀지는 세 장 끝에 "에취!" 앞으로 확 숙이는 재채기에 가루 구름이 흩어진다. 원본에 없는 창작 장면으로, 칠판·지우개·분필 가루 구름·아이 책상과 의자(kit/props/classroom.js), 터짐선 IB.burst, 일상 인물 teacher·pupil2를 썼다. 전달하는 생각: 재채기는 터지기 전의 젖힘이 길수록 크다.
   Motion notes: one locked shot, 6.5 s, framed close on the teacher's face: teacher 580 px (line 3.9 px) facing a board that runs off the left edge, child 394 px at her desk. All on twos; every drawing passes the one before as pose.prev for its first two frames, except through the rub (two drawings swapping). 0.5 s: an anticipation drawing with the eraser cocked over her head, then the rub: two drawings swapping on twos for 36 frames (18 drawings), the hand 0.27 h ahead of the shoulder and 0.05 h above it, then 0.07 h ahead and 0.1 h below, the spine 0.3 / 0 rad and the hips 10 px either way, each pair 0.014 h (8 px) higher, so the swath climbs. The board is wiped along the eraser's 18 positions in a 99 px band with a white haze left in it (IB.chalkboard state.wipe). 1.33 s: the chalk dust cloud starts beside the eraser and grows over 6 drawings to r 133 px (35, 60, 78, 90, 97, 100%), rising 8.5 px a drawing for 8 drawings, then holds still in front of her face. 2.08 s: the eraser comes down to her waist (an in-between and the hold). The three drawings before the sneeze, each held, the last longest: 2.42 s nod -0.1 with the eyes shut and the brow down (0.33 s), 2.75 s nod -0.2, lean -0.1, mouth open (0.33 s), 3.08 s nod -0.32, lean -0.19, hips 8.5 px back (0.5 s). 3.58 s the sneeze in one drawing: lean 0.42, nod 0.3, hips 10 px forward and 7 px down, a four-line burst at the mouth for 2 drawings, and the cloud blown left into seven puffs that fly further and shrink over 4 drawings, wind lines on the first 2; a rebound drawing and the bent hold. The child leans in at 3.08 s and flinches back on the sneeze (eyes shut), then stares (wide eyes, open mouth). Bubble 3.75-5.0 s in the hold; at 5.17 s she straightens with a frown in an in-between and the hold; still from 5.33 s. Colours: navy trousers, the yellow eraser, the lavender tee; the board is charcoal, the dust white with a grey (not ink) outline. */
const F = IB.FIG, FLOOR = 1020, H = 580, KH = Math.round(H * 0.68);
const TX = 950, PX = 1620, U = H / 340;   // U: px offsets below were first set on a 340 px teacher
const T = { ...IB.PEOPLE.teacher, h: H, dir: -1, seed: 12 }, P = { ...IB.PEOPLE.pupil2, h: KH, dir: -1, seed: 34 };
const shoulder = (p, look) => { const l = p.lean || 0, u = (F.torso - 0.012) * look.h; return [p.hip[0] + Math.sin(l) * look.dir * u, p.hip[1] - Math.cos(l) * u]; };
const off = (p, look, dx, dy) => { const s = shoulder(p, look); return [s[0] + dx * look.h * look.dir, s[1] + dy * look.h]; };
const set = (p, look, i, dx, dy) => { const hands = p.hands.slice(); hands[i] = off(p, look, dx, dy); return { ...p, hands }; };

/* ---------- the teacher: rub, the three drawings before the sneeze, the sneeze ---------- */
const TS = { ...IB.stand(TX, FLOOR, T), hand: ['relax', 'grip'], face: { mouth: 'flat' } }, TY = TS.hip[1];
const holding = (p) => set(p, T, 1, 0.12, 0.2);   // the eraser held at the waist
const RUB = [14, 50];   // the rub: two drawings swapping on twos, no prev; each pair a little lower on the board
// the far stroke climbs 0.012 h a pair at arm's length (0.28 h from the shoulder); the near one stays at chest height ahead of her chin, so the eraser never crosses her face
const rubA = (n) => { const dy = -0.05 - n * 0.012; return set({ ...TS, hip: [TX - 3 * U, TY + 4], lean: 0.3, nod: 0.02, face: { mouth: 'flat', brow: 0.6 } }, T, 1, Math.sqrt(0.28 * 0.28 - dy * dy), dy); };
const rubB = () => set({ ...TS, hip: [TX + 6 * U, TY + 2 * U], lean: 0.0, nod: -0.02, face: { mouth: 'flat', brow: 0.6 } }, T, 1, 0.1, 0.1);
const TP = {
  start: set({ ...TS, hip: [TX, TY + 3], lean: 0.2 }, T, 1, 0.24, 0.0),
  cock: set({ ...TS, hip: [TX + 4 * U, TY], lean: 0.02, nod: -0.04, face: { mouth: 'flat', brow: 0.6 } }, T, 1, 0.05, -0.2),   // the anticipation: back and up before the first stroke
  down: holding({ ...TS, lean: 0.06, face: { mouth: 'flat' } }),
  sniff1: holding({ ...TS, lean: -0.03, nod: -0.1, face: { eye: 'closed', mouth: 'flat', brow: 1 } }),
  sniff2: holding({ ...TS, hip: [TX + 2 * U, TY], lean: -0.1, nod: -0.2, face: { eye: 'closed', mouth: 'open', brow: 1 } }),
  sniff3: holding({ ...TS, hip: [TX + 5 * U, TY + U + 3], lean: -0.19, nod: -0.32, face: { eye: 'closed', mouth: 'open', brow: 1 } }),
  sneeze: holding({ ...TS, hip: [TX - 6 * U, TY + 4 * U], lean: 0.42, nod: 0.3, face: { eye: 'closed', mouth: 'open', brow: 1 } }),
  rebound: holding({ ...TS, hip: [TX - 4 * U, TY + 3 * U], lean: 0.3, nod: 0.2, face: { eye: 'closed', mouth: 'open', brow: 1 } }),
  after: holding({ ...TS, hip: [TX - 3 * U, TY + 2 * U], lean: 0.24, nod: 0.14, face: { eye: 'closed', mouth: 'flat', brow: 1 } }),
  up: holding({ ...TS, lean: 0.04, nod: 0.02, face: { mouth: 'frown', brow: 1 } }),
};
const T_ACT = [[0, TP.start], [12, TP.cock]];
for (let f = RUB[0], n = 0; f < RUB[1]; f += 2, n++) T_ACT.push([f, n % 2 ? rubB(n >> 1) : rubA(n >> 1)]);
T_ACT.push([50, IB.poseMix(rubB(8), TP.down, 0.55)], [52, TP.down], [58, TP.sniff1], [66, TP.sniff2], [74, TP.sniff3], [86, TP.sneeze], [88, TP.rebound], [90, TP.after], [124, IB.poseMix(TP.after, TP.up, 0.6)], [126, TP.up]);
T_ACT.forEach((row) => { row[1] = { hand: TS.hand, face: TS.face, ...row[1] }; });

/* ---------- the child watching from her desk ---------- */
const PS = IB.sit(PX, FLOOR, P), PY = PS.hip[1], DESK = FLOOR - 0.43 * KH;
const kid = (hip, lean, nod, face) => ({ ...PS, hip, lean, nod, face, hands: [[PX - 0.22 * KH, DESK - 4 * U], [PX - 0.18 * KH, DESK - 4 * U]] });
const KP = {
  sit: kid([PX, PY], 0.06, 0, { mouth: 'smile' }),
  lean: kid([PX - 2 * U, PY], 0.16, 0.06, { mouth: 'flat' }),
  flinch: kid([PX + 3 * U, PY - 2 * U], -0.12, -0.1, { eye: 'closed', mouth: 'flat' }),
  stare: kid([PX + 2 * U, PY - U], -0.08, -0.05, { eye: 'wide', mouth: 'open' }),
};
const K_ACT = [[0, KP.sit], [74, IB.poseMix(KP.sit, KP.lean, 0.6)], [76, KP.lean], [86, KP.flinch], [88, IB.poseMix(KP.flinch, KP.stare, 0.5)], [90, KP.stare]];

/* every drawing passes the one before it as prev for its first two frames, then the hold is dead still; not through the rub */
function drawing(act, f, still) {
  let i = 0;
  while (i + 1 < act.length && act[i + 1][0] <= f) i++;
  const [k, p] = act[i], next = i + 1 < act.length ? act[i + 1][0] : Infinity, trail = i > 0 && !(still && still(f)) && (f - k < 2 || next - k <= 3);
  return { ...p, prev: trail ? act[i - 1][1] : p };
}
// the eraser sits on the hand the rig draws (IB.ik from the rig's own shoulder), not on the target, so it never floats off the fist
const rigShoulder = (p) => { const l = p.lean || 0, d = T.dir, u = (F.torso - 0.012) * H; return [p.hip[0] + Math.sin(l) * d * u + Math.cos(l) * d * 0.004 * H, p.hip[1] - Math.cos(l) * u + Math.sin(l) * 0.004 * H]; };
const drawnHand = (p) => IB.ik(rigShoulder(p), p.hands[1], F.upper * H, F.fore * H, T.dir)[1];
const ERASER = (p, hd = drawnHand(p)) => { const s = rigShoulder(p), a = Math.atan2(hd[1] - s[1], hd[0] - s[0]); return [hd[0] + Math.cos(a) * 12 * U, hd[1] + Math.sin(a) * 12 * U]; };
const DUST = { at: 32, from: [TX - 0.37 * H, FLOOR - 0.72 * H] };   // the cloud starts mid-rub, rising from the eraser
function state(t) {
  const f = IB.frame(t), teacher = drawing(T_ACT, f, (g) => g >= RUB[0] && g < RUB[1]), pupil = drawing(K_ACT, f);
  const wipe = [];
  for (let g = RUB[0]; g <= Math.min(f, RUB[1] - 2); g += 2) wipe.push(ERASER(IB.held(T_ACT, g)));
  const d = (f - (f % 2) - DUST.at) / 2, blow = f >= 86 ? (f - 86) >> 1 : -1;
  return { teacher, pupil, wipe, dust: d < 0 || blow > 3 ? null : { k: Math.min(8, d), blow } };
}
IB.actors = (t) => { const s = state(t); return { teacher: s.teacher, pupil: s.pupil, dust: s.dust, wiped: s.wipe.length }; };

const BOARD_TEXT = [...IB.chalkScript([-120, 270], 1000, { seed: 21, size: 38 }), ...IB.chalkScript([-120, 370], 560, { seed: 22, size: 38 }), ...IB.chalkShape('circle', [580, 350], 44), ...IB.chalkShape('arrow', [700, 350], 44), ...IB.chalkScript([-120, 640], 300, { seed: 24, size: 38 }), ...IB.chalkScript([490, 520], 460, { seed: 23, size: 38 }), ...IB.chalkShape('triangle', [720, 610], 46), ...IB.chalkScript([790, 630], 200, { seed: 25, size: 38 })];

MG.scene({
  title: 'school / chalk-dust-sneeze',
  duration: 6.5, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t), s = state(t), p = s.teacher;
    IB.chalkboard(ctx, [450, 460], { strokes: BOARD_TEXT, wipe: s.wipe.length ? s.wipe : null, smudges: [[60, 430, 300, 46]] }, { w: 1440, h: 600, lw: 4.2, frame: 22, wipeW: 0.17 * H });
    // the child at her desk
    IB.schoolChair(ctx, [PX, FLOOR], { h: KH, dir: -1, lw: IB.figLine(KH), seed: 900 });
    IB.schoolDesk(ctx, [PX, FLOOR], { h: KH, dir: -1, lw: IB.figLine(KH), only: 'legs', seed: 920 });
    IB.smear(ctx, PX - 0.2 * KH, FLOOR - 8, 0.95 * KH, { h: 15, seed: 3 });
    IB.figure(ctx, s.pupil, { ...P, face: s.pupil.face }, 'far');
    IB.schoolDesk(ctx, [PX, FLOOR], { h: KH, dir: -1, lw: IB.figLine(KH), only: 'top', seed: 920 });
    IB.figure(ctx, s.pupil, { ...P, face: s.pupil.face }, 'near');
    // the teacher, the eraser between her arms
    IB.smear(ctx, TX, FLOOR - 10, 0.5 * H, { h: 15, seed: 7 });
    const look = { ...T, face: p.face }, j = IB.figure(ctx, p, look, 'far');
    const e = ERASER(p, j.hands[1]), rubbing = f >= RUB[0] && f < RUB[1];
    IB.boardEraser(ctx, e, { rot: rubbing ? Math.PI / 2 : 0.15, w: 0.155 * H, hgt: 0.06 * H, fill: IB.C.yellow });
    IB.figure(ctx, p, look, 'near');
    if (s.dust) IB.chalkDust(ctx, DUST.from, s.dust, { r: 0.23 * H, dir: -1, rise: 5 * U });
    const b = IB.drawn(IB.twos(t), 86 / 24);
    if (b >= 0 && b < 2) IB.burst(ctx, [j.headAt[0] - 0.09 * H, j.headAt[1] + 0.02 * H], { n: 4, a0: Math.PI - 0.75, da: 0.5, r0: (14 + b * 14) * U, r1: (44 + b * 12) * U, w: 3.6, seed: 300 + b * 5 });
    IB.bubble(ctx, ['에취!'], t, 3.75, { until: 5.0, tip: [j.headAt[0] - 0.1 * H, j.headAt[1] - 0.06 * H], x: j.headAt[0] - 0.55 * H, y: j.headAt[1] - 0.3 * H, seed: 500 });
  },
});
</script>
