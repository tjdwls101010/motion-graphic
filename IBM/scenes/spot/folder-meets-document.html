/* 미러볼 아래 다리 달린 파란 폴더가 풍선을 차자 화면이 옆으로 밀려 서류가 드러나고, 둘이 따로 춤추다 다가가 손을 잡으면 하트 풍선이 떠오른다. 원본은 왼쪽에 카피가 있는 화면이고, 여기서는 문구를 빼고 그림 영역만 잘라 화면에 채웠다. 폴더는 빳빳해서 책처럼 벌어지고 통째로 돌며, 종이는 낭창해서 휘고 클립에 물린 메모지가 늦게 따라온다. 전달하는 생각: 따로 놀던 두 가지가 마침내 한자리에 선다.
   Motion notes: one locked shot, no cuts, 11.6 s. Shows the reference frame's region x 356-1920, y 60-940 (CROP) enlarged 1.23x; coordinates in the code are the reference's. The stage pans 291 px on twos with per-step travel 9, 12, 12, 113, 117, 13, 9, 6 px (slow out, two big steps, three to settle), starting 1.75 s; the reference's copy is not drawn.
   Acting is a list of drawings, not a curve: FOLDER and DOC are tables of [frame, pose] at 24 fps, each pose held dead still until the next key, keys two frames apart while something moves (twos). Nothing is interpolated between keys: a move is 2-4 hand-placed drawings (anticipation, extreme, overshoot, rest) and a hold is the absence of keys. Feet are stage coordinates, not offsets from the body: a planted foot keeps its x from key to key while the body moves over it, and a foot changes place only through a drawing where it is off the floor. The one exception is the 191 px gather out of the lunge at 6.58 s, which the reference also pops in a single drawing. The reference has about 60 folder drawings and 55 document drawings in this shot; the tables have about 50 each. The two take turns: while one acts the other holds (the folder holds 4.4-5.9 s under the document's arm dance; the document leans in to watch the folder wind up and rears back two frames after its lunge lands).
   Depth (kit/solid.js): bodies stand in a small 3-D space and are projected into the ink pen. Folder = two stiff covers hinged at the bottom (`open`, rad) that turn as one (`yaw`), with graphite in the gap. It faces about with a hop: crouch -5 and -11 px, one airborne drawing seen nearly edge-on (yaw 1.25, +16 px), landing squash -8, rebound +3. Its spin kick is a crouch held 4 frames, two drawings whirled 0.85-0.92 rad on one foot with the other leg thrown up in an arc, a reach, a landing 36 px low with the covers 0.62 rad apart, a slide of the weight onto the front foot (covers 0.82 rad, the widest they get), and a pop up 7 px before it settles.
   Document = one bendable sheet (IB.bend: sway, sag, wave in the picture plane; arch, twist in depth) whose space can also pitch. Its whirl is 9 drawings (3.46-4.2 s): dip, lean with a leg crossing over, lean back the other way, two extremes where the sheet is tipped 0.9 rad away and then 0.8 rad toward us (its centre line reads 0.66 and 0.64 of its height) with its top and bottom edges in an S (wave 5 and -9 px), then recoveries with sway 18, 9 and -3 px. It never shows a blank back. The papers under its clip swing and lift by their own share (yellow 0.5, lavender 1, green 1.3), go opposite ways on the two extremes and come to rest one key after the sheet (sheet at 4.12 s, papers at 4.29 s); a lifted paper bellies and throws graphite on the sheet under its free edge.
   Limbs (kit/figure.js): rubber-hose legs with a `bow` or a knee (`via`), boots seen from the front at rest and from the side in a step or kick. Arms exist only while used and grow from behind the body edge over 3-4 drawings; a hand on the hip is a ring that leaves the edge and returns to it. Hands change shape with the acting: rest -> reach -> open -> clasp. Line: bodies 3.3-3.7 px, limbs 2.4, hands 2.2.
   Props: the kicked balloon leaves as one stretched smear drawing (2.5:1 along its path), turns one full revolution knot-last to knot-first while it drifts down for 2 s, squashes on landing (44 x 29 against 40 x 33), bounces 8 px and rocks twice. Mirror ball: a sphere of 24 x 10 tiles seen from 3 radii away; tile colours are fixed to the ball and travel across it 0.05 rad per drawing on threes (8 fps); two glints grow and die over 4 drawings each. The ball is the one thing that never holds: the reference's ball also changes every 3 frames through its last frame. Last second: both characters held, and apart from the ball only the heart balloon moves: one narrow drawing as it turns into view, then easing up exponentially (tau 0.45 s) with its string flicking side to side on twos. Floor: a blue chalk puddle with a solid core that stretches to span the feet, plus flat confetti ovals. */

const pan = (f) => { let v = 291; for (const [k, x] of PAN) if (f >= k) v = x; return v; };

const CONFETTI = (() => { const r = rng(12), out = []; for (let i = 0; i < 46; i++) out.push([720 + r() * 1230, 812 + r() * 150, 26 + r() * 16, r() < 0.5 ? '#d1e2ee' : '#eadeac']); return out; })();

/* held(keys, f) — the drawing on screen at frame f: the last key at or before it. */
const held = (keys, f) => { let v = keys[0][1]; for (const [k, p] of keys) { if (f < k) break; v = p; } return v; };

/* The chalk under a character's shoes: the reference packs it solid in the middle, so a flat ragged core goes under the kit's dusty smear. */
function puddle(ctx, cx, w, seed) {
  IB.ink(ctx, IB.ellipse(cx, FLOOR - 3, w * 0.4, 5.5, 14), { closed: true, fill: C.smear, w: 0, wob: 2.4, seed });
  IB.smear(ctx, cx, FLOOR - 11, w, { h: 14, seed });
}

/* ---------- limbs shared by both characters ---------- */
/* Two legs from the hips (stage px, wherever the body's turn has put them) to the feet. p.feet are [x on the stage, height above the floor line (negative = up)] per ankle, not offsets from the body: a planted foot keeps the same x from key to key while the body's x moves over it, which is what stops it skating. via is a knee, also [stage x, height]; bow / toe / frot are per leg. The foot listed first always takes the hip that is on the left of the screen, so a body that turns round does not cross its legs. */
function legs(ctx, p, hips, fill, seed, shoe) {
  const hs = hips.slice().sort((a, b) => a[0] - b[0]);
  const feet = p.feet.map(([x, dy]) => [x, ANKLE + dy]);
  const down = feet.filter((q) => q[1] > ANKLE - 9);
  if (down.length) {   // a puddle around the shoes, not a line under them: it starts above the soles and stretches to span a wide stance
    const x0 = Math.min(...down.map((q) => q[0])), x1 = Math.max(...down.map((q) => q[0]));
    puddle(ctx, (x0 + x1) / 2, 84 + (x1 - x0), seed);
  }
  feet.forEach((foot, i) => {
    const via = p.via && p.via[i] ? [p.via[i][0], ANKLE + p.via[i][1]] : null;
    IB.hose(ctx, [hs[i][0], hs[i][1] - 10], foot, { bow: p.bow[i], via, w: 18, w1: 14.5, fill, lw: 2.4, seed: seed + 3 + i * 5, shade: 18 });
    IB.boot(ctx, foot, { dir: p.toe[i], rot: p.frot[i], lw: 2.6, seed: seed + 9 + i * 5, ...shoe });
  });
}
/* An arm from a root behind the body's edge to a wrist, with a hand once it is long enough to have one. */
function arm(ctx, root, to, o) {
  const ang = IB.hose(ctx, root, to, { bow: o.bow || 0, w: 10, w1: 8, fill: C.bg, lw: 2.4, seed: o.seed, shade: 34 });
  if (o.hand) IB.mitt(ctx, to, o.aim == null ? ang : o.aim, { kind: o.hand, flip: o.flip || 1, s: 1.25, seed: o.seed + 9 });
}

const folderSpace = (p) => IB.space({ at: [p.x, ANKLE - HIP - p.lift], yaw: p.yaw, roll: p.roll, look: 0.22 });
function drawFolder(ctx, p, seed) {
  const S = folderSpace(p);
  const h = p.open / 2, cs = Math.cos(h), sn = Math.sin(h);
  // a cover leaning `side` of the hinge; the tab belongs to whichever cover is behind, which is what the reference draws from either side
  const cover = (side, tab) => {
    const P = (x, up) => [x, -up * cs, side * (up * sn + 2)];
    return tab ? [P(-100, FH), P(10, FH), P(28, FH + TAB), P(100, FH + TAB), P(100, 0), P(-100, 0)] : [P(-100, FH), P(100, FH), P(100, 0), P(-100, 0)];
  };
  const a = IB.cast(S, cover(1)), b = IB.cast(S, cover(-1)), side = a.z >= b.z ? 1 : -1;
  const far = IB.cast(S, cover(side, true)), near = side === 1 ? b : a;
  legs(ctx, p, [S([-17, 0, 0]), S([17, 0, 0])], C.sky, seed, {});
  IB.ink(ctx, far.pts, { closed: true, smooth: false, fill: C.blue, w: 3.7, seed: 21 });
  if (p.open > 0.07) {
    // graphite inside the gap, along whichever side edge of the near cover the far one shows beyond
    const cx = (q) => q.reduce((s, v) => s + v[0], 0) / q.length, left = cx(far.pts) < cx(near.pts);
    const e0 = near.pts[0][0] < near.pts[1][0] ? (left ? [3, 0] : [2, 1]) : (left ? [2, 1] : [3, 0]);
    ctx.save();
    IB.clip(ctx, far.pts);
    IB.crease(ctx, near.pts[e0[0]], near.pts[e0[1]], 18 + 70 * p.open, { side: left ? 1 : -1, seed: 23, alpha: 0.75 });
    ctx.restore();
  }
  IB.ink(ctx, near.pts, { closed: true, smooth: false, fill: C.blue, w: 3.7, seed: 22 });
}

/* One of the papers under the clip. It hangs from the clip (PIN), swings about it in the plane of the sheet and lifts off it like a flap, each paper by its own share `k` of the pose's [swing, lift]; z < 0 is toward the viewer. A lifted paper also bellies: the middle of its free edge hangs lower than its corners, and it throws graphite onto the sheet below that edge (pass the sheet's outline to keep the tone on the sheet). */
function note(ctx, M, [x, y, w, h], n, k, fill, seed, sheet) {
  const N = 6;   // samples per side of the paper's outline
  const sw = n[0] * k, lf = n[1] * k, c = Math.cos(sw), s = Math.sin(sw), cl = Math.cos(lf), sl = Math.sin(lf);
  const q = IB.cast(M, IB.rim(x, y, w, h, N).map(([px, py]) => {
    const dx = px - PIN[0], dy = py - PIN[1], rx = dx * c - dy * s, ry = dx * s + dy * c, d = Math.max(0, ry), e = (2 * (px - x)) / w - 1;
    const belly = sl * 0.16 * d * (1 - e * e), flick = sl * 0.1 * d * e * Math.sign(sw || 1);
    return [PIN[0] + rx + flick, PIN[1] + (ry > 0 ? d * cl : ry) + belly, -1.5 - d * sl];
  }));
  if (lf > 0.12 && sheet) {
    const e = q.pts.slice(2 * N, 3 * N + 1);   // the free (bottom) edge, right to left: IB.rim lists the sides top, right, bottom, left
    ctx.save();
    IB.clip(ctx, sheet);
    for (let i = 0; i < e.length - 1; i++) IB.crease(ctx, e[i + 1], e[i], 5 + 13 * lf, { side: -1, seed: seed + 50 + i, alpha: 0.5 });
    ctx.restore();
  }
  IB.ink(ctx, q.pts, { closed: true, smooth: false, fill, w: 2, seed });
}

const docSpace = (p) => IB.space({ at: [p.x, ANKLE - HIP - p.lift], yaw: p.yaw, pitch: p.pitch, roll: p.roll, look: 0.18 });
function drawDoc(ctx, p, seed) {
  const S = docSpace(p);
  const B = IB.bend({ w: DW, h: DH, sway: p.sway, sag: p.sag, wave: p.wave, arch: p.arch, curl: p.curl, twist: p.twist });
  const M = (q) => S(B(q));
  const sheet = IB.cast(M, IB.rim(-DW / 2, -DH, DW, DH, 10));
  legs(ctx, p, [S([-18, 0, 0]), S([18, 0, 0])], '#d4d4d4', seed, { s: 1.2, laces: true });
  if (p.arms) [-1, 1].forEach((s, i) => {
    const kind = p.arms[i], root = M([s * 78, -118, 0]);
    if (kind === 'hip') {   // hand on the hip: a ring that leaves the edge and comes back to it, the hand itself behind the sheet
      const ring = Array.from({ length: 9 }, (_, k) => { const a = -PI / 2 + (PI * k) / 8; return M([s * (76 + Math.cos(a) * 30), -76 + Math.sin(a) * 40, 0]); });
      IB.limb(ctx, ring, ring.map(() => 12.5), { fill: C.bg, lw: 2.4, seed: seed + 40 + i, shade: 24 });
    }
    else {
      const to = { short: [s * 10, 50], low: [s * 14, 126], out: [s * 34, 118], up: [s * 58, 102] }[kind];
      arm(ctx, root, [root[0] + to[0], root[1] + to[1]], { bow: kind === 'up' ? s * 11 : kind === 'out' ? s * 8 : s * 4, hand: kind === 'out' || kind === 'up' ? 'open' : 'rest', flip: s, seed: seed + 50 + i * 20 });
    }
  });
  IB.ink(ctx, sheet.pts, { closed: true, smooth: false, fill: C.paper, w: 3.3, seed: 31 });
  const clip = [[-23, -DH - 16], [-23, -DH + 30], [-27, -DH + 38], [-33, -DH + 33], [-33, -DH + 8]];
  // the sheet has no back side: nothing here asks cast() which face is showing, so a pose turned past edge-on (|yaw| > PI / 2) would show the face mirrored, which is how the reference draws the document when it turns round. No key in DOC goes that far
  for (let i = 0; i < 6; i++) IB.ink(ctx, [[20, -182 + i * 15, 0], [42, -182 + i * 15, 0], [64, -182 + i * 15, 0]].map(M), { w: 2.4, seed: 35 + i });
  note(ctx, M, [-60, -227, 82, 149], p.n, 1.3, C.mint, 34, sheet.pts);
  note(ctx, M, [-71, -227, 95, 114], p.n, 1, C.lavender, 32, sheet.pts);
  note(ctx, M, [-58, -227, 57, 52], p.n, 0.5, C.yellow, 33, sheet.pts);
  IB.ink(ctx, clip.map((q) => M([...q, -3])), { w: 2.5, seed: 41 });
}

/* ---------- arms that find each other (stage px relative to each arm's root; keys as for the bodies) ---------- */
const FARM = [
  [214, { to: [8, 28] }], [216, { to: [16, 54], bow: -3 }], [218, { to: [24, 74], bow: -5, hand: 'rest' }], [220, { to: [30, 86], bow: -6, hand: 'rest', aim: 1.35 }],
  [224, { to: [32, 84], bow: -7, hand: 'rest', aim: 1.1 }],
  [228, { to: [40, 86], bow: -7, hand: 'reach', aim: 0.95 }], [230, { to: [46, 86], bow: -8, hand: 'reach', aim: 0.8 }], [232, { to: [52, 86], bow: -8, hand: 'open', aim: 0.7 }], [234, { to: [56, 86], bow: -8, hand: 'open', aim: 0.6 }],
  [244, { to: [34, 88], bow: -6, hand: 'rest', aim: 1.3 }],
  [246, { to: [52, -22], bow: 13, hand: 'open', aim: 0.75 }], [248, { to: [60, -30], bow: 15, hand: 'open', aim: 0.5 }],
  [252, { to: [54, 52], bow: -4, hand: 'reach', aim: 0.7 }],
  [254, 'clasp'],
];
const DARM = [
  [216, { to: [-8, 28] }], [218, { to: [-20, 56], bow: 4, hand: 'rest' }], [220, { to: [-32, 76], bow: 6, hand: 'rest', aim: 1.85 }], [222, { to: [-36, 78], bow: 7, hand: 'rest', aim: 2.05 }],
  [230, { to: [-42, 80], bow: 8, hand: 'reach', aim: 2.25 }], [232, { to: [-48, 80], bow: 8, hand: 'reach', aim: 2.4 }], [234, { to: [-54, 80], bow: 8, hand: 'open', aim: 2.5 }],
  [244, { to: [-36, 82], bow: 6, hand: 'rest', aim: 1.9 }],
  [246, { to: [-72, 30], bow: 10, hand: 'open', aim: 2.95 }], [248, { to: [-82, 26], bow: 12, hand: 'open', aim: 3.05 }],
  [252, { to: [-56, 60], bow: 8, hand: 'reach', aim: 2.6 }],
  [254, 'clasp'],
];

/* ---------- props ---------- */
function discoBall(ctx, cx, cy, R, f) {
  IB.seg(ctx, cx, -10, cx, cy - R, { w: 3, seed: 50 });
  // a real sphere seen from 3 radii away, so the rows bow the way the reference draws them; the tiles keep their colours and ride round with it on threes
  const D = 3, r = R * Math.sqrt(D * D - 1) / D, S = IB.space({ at: [cx, cy], f: r * D, look: 0 });
  const d3 = Math.floor(f / 3), turn = d3 * 0.05, NL = 24, NR = 10, dl = (PI * 2) / NL, top = 1.2, dr = (2 * top) / NR, edge = Math.acos(1 / D) - 0.14;
  const lim = (lat) => Math.acos(Math.min(1, 1 / D / Math.cos(lat))) - 0.004;   // the furthest longitude still on the near side at this latitude
  const pt = (lon, lat) => { const m = lim(lat), l = clamp(lon, -m, m); return S([r * Math.cos(lat) * Math.sin(l), r * Math.sin(lat), -r * Math.cos(lat) * Math.cos(l)]); };
  IB.oval(ctx, cx, cy, R, R, { fill: '#dcdcdc', w: 0, n: 24 });
  const i0 = Math.ceil((-PI / 2 - turn) / dl) - 1;
  for (let k = 0; k <= NL / 2 + 1; k++) for (let j = 0; j < NR; j++) {
    const i = i0 + k, l0 = i * dl + turn, a0 = -top + j * dr, id = ((i % NL) + NL) % NL;
    const h = hash(id * 31 + j, 7), low = j / (NR - 1);   // warm and white tiles up where the light is, blues underneath
    const y = 0.16 + 0.04 * (1 - low), b = y + 0.1 + 0.3 * low, l = b + 0.04 + 0.12 * low;
    const col = h < y ? C.yellow : h < b ? C.blue : h < l ? C.lavender : h < l + 0.3 - 0.12 * low ? C.paper : null;
    if (!col) continue;
    const q = [pt(l0, a0), pt(l0 + dl / 2, a0), pt(l0 + dl, a0), pt(l0 + dl, a0 + dr / 2), pt(l0 + dl, a0 + dr), pt(l0 + dl / 2, a0 + dr), pt(l0, a0 + dr), pt(l0, a0 + dr / 2)];
    IB.ink(ctx, q, { closed: true, smooth: false, fill: col, w: 0, wob: 0 });
  }
  for (let k = 0; k <= NL / 2 + 1; k++) {
    const lon = (i0 + k) * dl + turn, line = [];
    if (Math.abs(lon) > edge) continue;   // a meridian this close to the rim would read as a second outline
    for (let s = 0; s <= 14; s++) { const lat = -top + (2 * top * s) / 14; if (Math.abs(lon) < lim(lat)) line.push(pt(lon, lat)); }
    if (line.length > 2) IB.ink(ctx, line, { w: 2.2, seed: 60 + (((i0 + k) % NL) + NL) % NL, taper: false });
  }
  for (let j = 0; j <= NR; j++) { const lat = -top + j * dr, m = lim(lat); if (m > 0.1) IB.ink(ctx, Array.from({ length: 11 }, (_, s) => pt(-m + (2 * m * s) / 10, lat)), { w: 2.2, seed: 70 + j, taper: false }); }
  IB.oval(ctx, cx, cy, R, R, { w: 3.4, seed: 51, n: 24 });
  // glints: each lives four drawings (small, big, turned, gone) and then jumps to another tile corner
  for (const s of [0, 1]) {
    const life = d3 + s * 2, born = Math.floor(life / 4), age = life % 4, len = [7, 15, 10, 0][age];
    if (!len) continue;
    const a = hash(born, 90 + s) * PI * 2, d = R * (0.35 + 0.6 * hash(born, 95 + s)), gx = cx + Math.cos(a) * d, gy = cy + Math.sin(a) * d, tilt = age === 2 ? PI / 4 : 0;
    for (const b of [0, PI / 2]) IB.seg(ctx, gx - Math.cos(b + tilt) * len, gy - Math.sin(b + tilt) * len, gx + Math.cos(b + tilt) * len, gy + Math.sin(b + tilt) * len, { w: 2.6, color: C.paper, seed: 97 + s, grain: 0 });
  }
}

function party(ctx) {
  // hoop stand: lavender tubing with an ink edge
  const tube = (pts, seed) => IB.tube(ctx, pts, { w: 13, edge: 2.75, fill: C.lavender, seed });
  tube([[1650, 370], [1650, 152], [1930, 152]], 80);
  tube([[1737, 337], [1737, 249], [1860, 249], [1860, 337], [1737, 337]], 81);
  tube([[1810, 362], [1930, 362]], 82);
  // net
  for (let i = 0; i < 6; i++) { IB.seg(ctx, 1708 + i * 20, 322, 1730 + i * 11, 420, { w: 2, seed: 90 + i }); IB.seg(ctx, 1808 - i * 20, 322, 1786 - i * 11, 420, { w: 2, seed: 96 + i }); }
  IB.oval(ctx, 1758, 320, 55, 6, { fill: C.bg, w: 2.6, seed: 89, n: 12 });
  // balloons
  [[1593, 357, C.yellow], [1688, 372, C.lavender], [1630, 265, C.blue], [1620, 306, C.lavender], [1684, 318, C.mint], [1641, 372, C.blue]].forEach(([x, y, col], i) => {
    IB.oval(ctx, x, y, 32, 35, { fill: col, w: 3, seed: 100 + i, n: 12 });
    IB.ink(ctx, IB.ellipse(x - 4, y - 2, 20, 23, 6, 3.4, 4.5), { w: 2.4, color: C.paper, seed: 110 + i });
  });
  // bunting
  const sag = (x) => 12 + 104 * Math.pow((x - 1500) / 430, 1.5);
  IB.ink(ctx, [1500, 1600, 1700, 1800, 1930].map((x) => [x, sag(x) - 14]), { w: 3, seed: 120 });
  [[1500, C.yellow], [1594, C.lavender], [1690, C.blue], [1782, C.mint], [1876, C.yellow]].forEach(([x, col], i) => {
    IB.ink(ctx, [[x, sag(x) - 16], [x + 78, sag(x + 78) - 12], [x + 10 + i * 4, sag(x) + 96]], { closed: true, smooth: false, fill: col, w: 3, seed: 121 + i });
  });
}

/* The kicked balloon, one drawing per key: [frame, x, y, rx, ry, turn of the long axis, where the knot sits (rad round the body)]. It leaves as a single stretched smear, turns once as it sinks, and comes to rest with a squash and two small rocks. */
const BALLOON = [
  [0, 960, 855, 40, 33, 0, -0.45],
  [22, 953, 851, 33, 37, 0, -0.5],
  [24, 874, 722, 61, 24, 0.99, 0.9],
  [26, 812, 646, 34, 41, 0.3, 1.25], [28, 778, 624, 36, 39, 0.1, 1.5], [30, 758, 618, 39, 35, 0, 1.6], [32, 742, 616, 40, 33, 0, 1.75],
  [34, 727, 617, 40, 33, 0, 2.0], [36, 712, 620, 40, 33, 0, 2.3], [38, 698, 626, 40, 33, 0, 2.6], [40, 685, 634, 40, 33, 0, 2.95], [42, 672, 644, 40, 33, 0, 3.3],
  [44, 660, 656, 40, 33, 0, 3.65], [46, 648, 670, 40, 33, 0, 4.0], [48, 636, 686, 40, 33, 0, 4.35], [50, 624, 704, 40, 33, 0, 4.7], [52, 612, 723, 40, 33, 0, 5.0],
  [54, 600, 744, 40, 33, 0, 5.3], [56, 588, 766, 40, 33, 0, 5.55], [58, 576, 789, 40, 33, 0, 5.75], [60, 565, 812, 40, 33, 0, 5.9], [62, 555, 834, 40, 33, 0, 6.02],
  [64, 546, 854, 40, 33, 0, 6.1], [66, 538, 868, 41, 32, 0, 6.15],
  [68, 532, 876, 44, 29, 0, 6.18], [70, 527, 868, 39, 34, 0, 6.12], [72, 522, 864, 40, 33, 0, 6.05], [74, 517, 868, 40, 33, 0, 5.98], [76, 512, 872, 42, 31, 0, 5.94], [78, 508, 872, 40, 33, 0, 5.9],
  [82, 502, 872, 40, 33, 0, 5.82], [86, 497, 872, 40, 33, 0, 5.9], [92, 494, 872, 40, 33, 0, 5.84], [100, 492, 872, 40, 33, 0, 5.87],
].map((row) => [row[0], row]);
function balloon(ctx, f) {
  const [, x, y, rx, ry, turn, knot] = held(BALLOON, f);
  if (y > 836) { const k = clamp((y - 836) / 30); IB.ink(ctx, IB.ellipse(x, 906, 30 * k, 3.2, 10), { closed: true, fill: C.smear, w: 0, wob: 1.2, seed: 15 }); IB.smear(ctx, x, 903, 70 * k, { h: 7, seed: 15 }); }
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(turn);
  const a = knot - turn, kx = Math.cos(a) * rx, ky = Math.sin(a) * ry, ux = Math.cos(a), uy = Math.sin(a);
  IB.ink(ctx, [[kx - uy * 6 + ux * 9, ky + ux * 6 + uy * 9], [kx - ux * 2, ky - uy * 2], [kx + uy * 6 + ux * 9, ky - ux * 6 + uy * 9]], { closed: true, fill: C.lavender, w: 2.4, seed: 17 });
  IB.oval(ctx, 0, 0, rx, ry, { fill: C.lavender, w: 3, seed: 16, n: 12 });
  ctx.restore();
}

MG.scene({
  title: 'spot / folder-meets-document',
  duration: 11.625, ref: [90.083, 101.708], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t), tt = IB.twos(t);
    IB.crop(ctx, CROP);
    ctx.translate(pan(f), 0);

    for (const [x, y, rx, col] of CONFETTI) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, 5, 0, 0, 7); ctx.fill(); }
    discoBall(ctx, 1302, 215, 105, f);
    party(ctx);
    balloon(ctx, f);
    // impact: two arcs off the toe for the two drawings of the kick
    if (f >= 22 && f < 26) IB.shake(ctx, 1010, 846, 20, { a: PI * 0.92, n: 2, w: 2.2, gap: 8, seed: 18 + Math.floor(f / 2) });

    const fp = held(FOLDER, f), dp = held(DOC, f);
    // the arms that reach for each other are drawn first, so that each one's root is behind its body's edge
    const fa = f >= FARM[0][0] ? held(FARM, f) : null, da = f >= DARM[0][0] ? held(DARM, f) : null;
    const fS = folderSpace(fp), dS = docSpace(dp);
    const fRoot = fS([-(FW / 2 - 8), -112, 0]), dRoot = dS([-(DW / 2 - 8), -122, 0]);   // the folder has its back to us by now, so its -x edge is the one on the right
    const H = [1463, 738];
    if (fa === 'clasp') {
      IB.hose(ctx, fRoot, [H[0] - 9, H[1] - 3], { bow: -5, w: 10, w1: 8, fill: C.bg, lw: 2.4, seed: 400, shade: 34 });
      IB.hose(ctx, dRoot, [H[0] + 9, H[1] - 3], { bow: 5, w: 10, w1: 8, fill: C.bg, lw: 2.4, seed: 420, shade: 34 });
    } else {
      if (fa) arm(ctx, fRoot, [fRoot[0] + fa.to[0], fRoot[1] + fa.to[1]], { ...fa, flip: -1, seed: 400 });
      if (da) arm(ctx, dRoot, [dRoot[0] + da.to[0], dRoot[1] + da.to[1]], { ...da, flip: 1, seed: 420 });
    }
    drawDoc(ctx, dp, 300);
    drawFolder(ctx, fp, 200);
    if (fa === 'clasp') IB.clasp(ctx, H, { seed: 440, s: 1.3, rot: f < 258 ? 0.12 : 0 });

    // heart balloon: the only thing moving in the last second
    if (f >= 258) {
      const hy = lerp(690, 400, IB.settle(tt - 258 / 24, 0.45, 2.4)), hx = 1460, k = Math.floor(f / 2) % 2 ? 1 : -1;
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(k * 0.07);
      ctx.scale(f < 260 ? 0.5 : 1.15, 1.15);   // its first drawing is seen edge-on, as if it turned into view
      IB.ink(ctx, [[0, 27], [k * 5, 40], [-k * 4, 54], [k * 2, 68]], { w: 1.8, seed: 410 });
      IB.ink(ctx, [[0, 25], [-14, 12], [-25, -3], [-22, -18], [-10, -22], [0, -11], [10, -22], [22, -18], [25, -3], [14, 12]], { closed: true, fill: C.yellow, w: 2.3, seed: 411 });
      IB.ink(ctx, [[-4, 24], [0, 30], [4, 24]], { w: 2, seed: 412 });
      ctx.restore();
    }
  },
});
</script>
