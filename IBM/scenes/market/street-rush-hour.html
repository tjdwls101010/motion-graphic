<!doctype html>
<meta charset="utf-8">
<title>market / street-rush-hour</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/office.js"></script>
<script src="../../kit/props/handheld.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../../kit/sets/street.js"></script>
<script>
/* 기둥 늘어선 거래소 건물과 고층 빌딩 선화 앞 인도를 사람들이 양쪽으로 바삐 지나가고 노란 택시가 가로지르는데, 연보라 옷 한 사람만 휴대폰을 보고 멈춰 서서 "올랐다!" 하고는 다시 인파에 섞인다. 원본에 없는 창작 장면으로, 원본의 설정 샷(빽빽한 흑백 선화에 색 한두 군데)에 멈춘 무대를 가로지르는 걷기를 여럿 겹쳐 금융가의 출근길을 그렸다. 전달하는 생각: 모두가 바삐 움직이는 거리에서 숫자 하나가 한 사람을 멈춰 세운다.
   Motion notes: one locked shot, 7 s. Three layers, three clocks. The street is an establishing drawing that never moves: 1.5-4 px lines, no fills, windows as texture; only the flag on the roof flips between two drawings on threes. The cab is a machine and runs on ones, 520 px/s, crossing from 1.0 s with its spokes turning. The crowd walks on twos across the still pavement: every walker advances IB.walkLen / 12 per drawing (0.07 h: 16-19 px for these heights), so every planted foot stays put; thirteen walkers in two rows (floor y 930 and 985, heights 228-270; those heading left walk 14 px nearer than those heading right, so walkers who cross pass in front of one another), five of them a second wave that is still off-screen at the start, begin zero to five drawings out of phase so the crowd never steps in unison. The walker in lavender stops at 2.83 s on a drawing with one foot planted and one in the air (phase 5/6), thrown forward for one drawing (lean 0.14) before it stands upright, brings the phone up in one in-between and one drawing a little past the eyes, its head trailing by one drawing (pose.prev), the phone buzzes (shake marks, 4 drawings); bubble 3.5-4.75 s over a held pose while the crowd keeps passing in front and behind; walks on at 4.83 s from the same phase. Colour: yellow (the cab, one coat), lavender (the one who stops), blue for the small rising arrow on the phone; everyone else is white, charcoal or black. */
const { lerp } = MG;
const C = IB.C, F = IB.FIG, ROAD = 856;

/* ---------- the crowd ---------- */
const CROWD = [
  { x0: 300, dir: 1, h: 270, floor: 985, off: 0, ...IB.PASSERSBY[0], hero: true },
  { x0: -120, dir: 1, h: 258, floor: 985, off: 3, ...IB.PASSERSBY[1], prop: 'case' },
  { x0: 1980, dir: -1, h: 262, floor: 985, off: 5, ...IB.PASSERSBY[2], prop: 'cup' },
  { x0: 2460, dir: -1, h: 250, floor: 985, off: 2, ...IB.PASSERSBY[3], prop: 'phone' },
  { x0: 760, dir: 1, h: 232, floor: 930, off: 4, ...IB.PASSERSBY[4], prop: 'cup' },
  { x0: 60, dir: 1, h: 240, floor: 930, off: 1, ...IB.PASSERSBY[5], prop: 'case' },
  { x0: 1560, dir: -1, h: 236, floor: 930, off: 3, ...IB.PASSERSBY[6], prop: 'case' },
  { x0: 2260, dir: -1, h: 228, floor: 930, off: 5, ...IB.PASSERSBY[7], prop: 'phone' },
  // the second wave, still off-screen when the scene starts
  { x0: -640, dir: 1, h: 266, floor: 985, off: 2, ...IB.PASSERSBY[8], prop: 'cup' },
  { x0: -1010, dir: 1, h: 234, floor: 930, off: 0, ...IB.PASSERSBY[9], prop: 'phone' },
  { x0: 2900, dir: -1, h: 260, floor: 985, off: 4, ...IB.PASSERSBY[10], prop: 'case' },
  { x0: 3250, dir: -1, h: 238, floor: 930, off: 1, ...IB.PASSERSBY[11], prop: 'cup' },
  { x0: -420, dir: 1, h: 230, floor: 930, off: 5, ...IB.PASSERSBY[12], prop: 'case' },
].map((w, i) => ({ ...w, seed: 800 + i * 30 }));
// those walking left keep 14 px nearer the viewer than those walking right, so two who cross pass in front of one another instead of merging
const ROWS = CROWD.map((w) => ({ ...w, floor: w.floor + (w.dir < 0 ? 14 : 0) })).sort((a, b) => a.floor - b.floor);
const STOP = 34, GO = 58, PH_STOP = (STOP / 12) % 1;   // the hero stops on drawing 34 (2.83 s) and walks on at drawing 58 (4.83 s)

/* A walker's pose on drawing k, with what its hands hold. */
function walkerPose(w, k) {
  const pace = IB.walkLen(w) / 12, d = w.dir;
  let p, x, phone = 0;
  if (w.hero && k >= STOP) {
    const moved = Math.max(0, k - GO);
    x = w.x0 + pace * (STOP + moved);
    p = IB.walk(x, w.floor, w, ((STOP + moved) / 12) % 1);
    // the stop: one drawing thrown forward, then upright; the phone comes up half-way, a little past the eyes, back
    if (k < GO) { p.feet = p.feet.map((ft) => [ft[0], w.floor - F.ankle * w.h, 0]); p.hip[1] = IB.stand(x, w.floor, w).hip[1]; p.lean = k === STOP ? 0.14 : 0.02; phone = [0.5, 1.12][k - STOP] ?? 1; }
  } else { x = w.x0 + d * pace * k; p = IB.walk(x, w.floor, w, ((k + w.off) / 12) % 1); }
  const sh = [p.hip[0], p.hip[1] - F.torso * w.h], prop = phone ? 'look' : w.prop;
  // what the hands are busy with, each target inside the arm's reach
  if (prop === 'cup') p.hands = [p.hands[0], [sh[0] + 0.15 * w.h * d, sh[1] + 0.13 * w.h]];
  if (prop === 'phone') { p.hands = [p.hands[0], [sh[0] - 0.035 * w.h * d, sh[1] - 0.085 * w.h]]; p.elbow = [1, -1]; }   // at the ear, behind the face, the elbow folded back so the forearm does not cross the eyes
  if (prop === 'look') { const base = IB.stand(x, w.floor, w).hands[1]; p.hands = [p.hands[0], [lerp(base[0], sh[0] + 0.17 * w.h * d, phone), lerp(base[1], sh[1] - 0.02 * w.h, phone)]]; p.nod = 0.2 * Math.min(1, phone); }
  return { p, x, phone: Math.min(1, phone), prop };
}
function walker(ctx, w, k) {
  const { p, x, phone, prop } = walkerPose(w, k), d = w.dir;
  if (x < -160 || x > 2080) return null;
  if (w.hero && k > 0) p.prev = walkerPose(w, k - 1).p;   // the hero's head trails the stop and the look by one drawing
  const face = phone === 1 ? { eye: 'wide', mouth: k >= STOP + 6 ? 'smile' : 'flat' } : { mouth: 'flat' };
  const j = IB.figure(ctx, p, { ...w, face, lw: IB.figLine(w.h) }), lw = IB.figLine(w.h);
  if (prop === 'case') IB.briefcase(ctx, j.hands[0], { h: w.h, fill: w.bottom === C.ink ? C.charcoal : C.paper, lw, seed: w.seed + 20 });
  if (prop === 'cup') IB.smallCup(ctx, j.hands[1], { d, lw: lw * 0.85, seed: w.seed + 22 });
  if (prop === 'phone' || prop === 'look') { const [hx, hy] = j.hands[1]; IB.mobilePhone(ctx, [hx + (prop === 'look' ? 6 : -2) * d, hy - (prop === 'look' ? 30 : 26)], { up: phone === 1, lw: lw * 0.85, seed: w.seed + 23 }); }
  return { x, j, phone };
}

// the hero's drawings, for tools/drawings.py (the crowd is the walk cycle itself)
IB.actors = (t) => { const k = Math.round(IB.twos(t) * 12), w = ROWS.find((v) => v.hero); return { hero: walkerPose(w, k).p }; };

MG.scene({
  title: 'market / street-rush-hour',
  duration: 7, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t), k = Math.round(IB.twos(t) * 12);
    IB.financeStreet(ctx, { flap: IB.alternate(f, 3) });   // drawn once per frame, never moving: only the flag flips, on threes
    if (t >= 1) IB.cab(ctx, [-260 + 520 * (t - 1), ROAD], { spin: (t - 1) * 520 / 34 });
    // the pavement: one chalk line per row, its crisp edge 11 px above the farther walkers' soles; its dust thins out by the nearer walkers' soles, 14 px lower
    IB.smear(ctx, 960, 919, 1900, { h: 20, seed: 8, alpha: 0.4 });
    IB.smear(ctx, 960, 974, 1900, { h: 20, seed: 9, alpha: 0.7 });
    let hero = null;
    for (const w of ROWS) { const r = walker(ctx, w, k); if (w.hero) hero = r; }
    if (hero) {
      const w = ROWS.find((r) => r.hero), s = k - (STOP + 1), [hx, hy] = hero.j.hands[1];
      if (s >= 0 && s < 4) { IB.shake(ctx, hx + 26, hy - 16, 16, { a: -0.3, n: 2, seed: 900 + s, w: 2.4 }); IB.shake(ctx, hx - 14, hy - 22, 14, { a: Math.PI + 0.3, n: 2, seed: 910 + s, w: 2.4 }); }
      IB.bubble(ctx, ['올랐다!'], t, IB.T(42), { tip: [hero.x + 40, w.floor - 1.0 * w.h], x: hero.x + 170, y: w.floor - 1.34 * w.h, until: IB.T(57), seed: 500 });
    }
  },
});
</script>
