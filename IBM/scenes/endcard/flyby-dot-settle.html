<!doctype html>
<meta charset="utf-8">
<title>endcard / flyby-dot-settle</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script>
/* 하드 컷으로 들어온 파란 분필 스미어가 살짝 밀려와 멈추는 사이 큰 날벌레가 화면 앞을 가로질러 멀어지고, 작은 날벌레가 다시 날아와 화면 가운데 위쪽에 내려앉아 멈춘 뒤 빈 무대로 컷한다. 원본에서는 스미어 위에 태그라인 한 줄이 있고 날벌레가 그 글자 위에 앉으며 마지막 컷은 로고인데, 여기서는 문구와 로고를 그리지 않았다. 전달하는 생각: 여섯 편이 모두 같은 서명으로 끝난다.
   Motion notes: frame 0 is the bare #f0f0f0 stage, the smear cuts in on frame 1 already at full opacity, 39 px left of rest, and settles exponentially (tau 0.15 s, ~24% of the remaining distance per frame, still 0.5 s after it appears, i.e. at 0.54 s); the reference's tagline (royal blue, centred, top y 508) rides the same slide. Foreground flyby on ones, frames 3-10: enters top right 330 px long and shrinks to 44 px as it crosses to bottom left, ~230 px per frame. Small flyer on ones, frames 20-35 (0.83-1.46 s): in from the left, dips, rises and hovers down to (667, 500), where the reference has a glyph for it to sit on; wings alternate every frame in flight and freeze on landing. Hold 0.4 s, hard cut at 1.875 s to an empty stage for 1.58 s (the reference's logo hold). The insect is a neutral stand-in. */
// measured from the reference, one entry per 24 fps frame after the cut: [frame, x, y, body length]
const FLYBY = [[3, 1455, 135, 330], [4, 1305, 330, 210], [5, 1080, 540, 150], [6, 936, 714, 90], [7, 750, 825, 80], [8, 594, 870, 60], [9, 430, 905, 50], [10, 250, 935, 44]];
const LAND = [[20, 414, 433], [21, 461, 468], [22, 501, 502], [23, 535, 531], [24, 569, 544], [25, 604, 548], [26, 631, 535], [27, 634, 516], [28, 637, 502], [29, 645, 493], [30, 645, 492], [31, 648, 490], [32, 653, 485], [33, 658, 485], [34, 662, 493], [35, 667, 500]];
const CUT_IN = 1 / 24, LOGO = 45 / 24;

MG.scene({
  title: 'endcard / flyby-dot-settle',
  duration: 3.458, ref: [26.625, 30.083], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t);
    if (f < 1) return;
    if (t >= LOGO) return;   // the reference cuts to its logo here and holds it; nothing is drawn in its place
    const dx = -39 * (1 - IB.settle(t - CUT_IN, 0.152, 0.5));   // the reference's tagline arrives on this same slide; only the smear is drawn
    IB.smear(ctx, 935 + dx, 910, 1000, { h: 34, seed: 9 });

    const fly = FLYBY.find((k) => k[0] === f);
    if (fly) IB.flyer(ctx, fly[1], fly[2], fly[3], { rot: 2.2, flap: f % 2 });
    if (f >= LAND[0][0]) {
      const k = LAND[Math.min(f - LAND[0][0], LAND.length - 1)];
      const landed = f >= LAND[LAND.length - 1][0];
      IB.flyer(ctx, k[1] + (landed ? dx : 0), k[2], 22, { rot: landed ? -0.5 : 0.3, flap: landed ? 1 : f % 2 });
    }
  },
});
</script>
