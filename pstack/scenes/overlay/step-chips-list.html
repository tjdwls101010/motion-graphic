<!doctype html>
<meta charset="utf-8">
<title>overlay / step-chips-list</title>
<link rel="stylesheet" href="../../../core/base.css">
<link rel="stylesheet" href="../../kit/overlay.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/overlay.js"></script>
<script>
/* 번호 붙은 카드 넷이 재현, 범위 좁히기, 수정, 확인으로 도는 반복 고리를 보여 준다. Motion notes: the cards slide up in 0.25 s at 0.48 s intervals; at 2.2 s the fourth turns lavender with a check and the previous three dim, then the stack holds until its 4.9 s exit. */
const BEATS = { first: .35, stagger: .48, active: 2.2, exit: 4.9 };
const POS = { top: 110, gap: 135 };
const CAMERA = [[0, [1, 0, 0]], [5.6, [1, 0, 0]]];
const TITLES = ['① 재현', '② 좁히기', '③ 고치기', '④ 다시 확인'];
const CAPTIONS = ['증상부터 직접 본다', '가능한 원인을 좁힌다', '그 자리 한 줄씩', '같은 절차로 통과'];

MG.scene({
  title: 'overlay / step-chips-list',
  duration: 5.6,
  ref: [765.3, 770.9],
  setup(stage) {
    const world = OV.root(stage);
    OV.badge(world, '4단계 · 버그 수정', 4);
    const chips = TITLES.map((title, i) => OV.chip(world, title, CAPTIONS[i], POS.top + i * POS.gap));
    return { world, chips };
  },
  render(t, r) {
    OV.camera(r.world, t, CAMERA);
    // Cards rise one after another; the final card claims the current state.
    const active = MG.prog(t, BEATS.active, .2);
    r.chips.forEach((chip, i) => {
      const q = MG.prog(t, BEATS.first + i * BEATS.stagger, .25, 'outBack');
      const exit = 1 - MG.prog(t, BEATS.exit, .3);
      chip.el.style.opacity = String(MG.clamp(q * 2) * exit * (i < 3 ? 1 - .5 * active : 1));
      chip.el.style.transform = `translateY(${(1 - q) * 22}px) scale(${.96 + .04 * q})`;
      chip.el.style.background = i === 3 ? `rgb(${255 - 70 * active}, ${255 - 76 * active}, ${255 - 6 * active})` : '#fff';
      chip.check.style.display = i === 3 && active > 0 ? 'block' : 'none';
    });
  },
});
</script>
