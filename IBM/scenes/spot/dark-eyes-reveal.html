<!doctype html>
<meta charset="utf-8">
<title>spot / dark-eyes-reveal</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script>
/* 검은 화면에 흰 카피와 초록 눈 한 쌍이 떠서 좌우를 살피고 깜빡이다가, 눈이 작아지는 순간 밝은 화면으로 컷하면 그 눈은 건물 창가에서 쌍안경을 든 사람이었다. 카피는 셋째 줄이 붙고 한 번 바뀌며, 끝에 쌍안경을 내린다. 전달하는 생각: 누군가는 이미 지켜보고 있다.
   Motion notes: the only black (#000) shot in the set, 3.33 s, white copy. Eyes are 283 x 124 almonds 468 px apart; only the irises move, on twos, and a look is a jump held 0.5-0.6 s: centre, 85 px left, up 27 px, down-right (46, 26). A blink is one 2-frame hold of total black, with one half-open 2-frame pose after the first. The reveal is a match cut on a zoom: over the last 5 drawings the pair shrinks to 0.9, 0.8, 0.65, 0.46 toward (1193, 438), hard cut, and the lit scene continues the pull-back on ones from 1.98x, settling exponentially (tau 0.16 s) so the eyes land on the binocular lenses. At the cut the two existing copy lines slide up 59 px to make room and the third arrives from below. Copy swap at 6.33 s arrives a line every 4 frames. In the window only small things move, on twos: head and binoculars shift 8 px to scan, the cat's ears flick, binoculars come down at 9.5 s and the pose holds to the end. */
const { prog, kf, lerp, rng, clamp } = MG;
const C = IB.C, GREEN = '#4ca757', SKIRT = '#7cc47a';
const DARK = ['어둠 속에서 먼저', '두 줄이 뜬다.'], LIT = ['어둠 속에서 먼저', '두 줄이 뜬다.', '셋째 줄이 붙고'], SWAP = ['컷 없이', '문구만', '바뀐다.'];
const CUT = 3.333, FOCUS = [1193, 438];

// irises: [from time, dx, dy, lid] held until the next entry; lid 0 = shut, 0.8 = half, 1 = open
const LOOK = [[0, 0, 0, 1], [0.33, -5, 0, 1], [0.42, -75, 0, 1], [0.5, -85, 0, 1], [1.0, 0, 0, 0], [1.08, -85, 4, 0.8], [1.17, -85, 0, 1], [1.58, 0, 0, 0], [1.67, 4, -11, 1], [1.75, 9, -27, 1], [2.25, 15, -18, 1], [2.33, 41, 19, 1], [2.42, 46, 26, 1]];
const ZOOM = [[2.92, 0.98], [3.0, 0.9], [3.08, 0.8], [3.17, 0.65], [3.25, 0.46]];
const held = (table, t, first) => { let v = first; for (const k of table) if (t >= k[0] - 1e-6) v = k; return v; };

function eye(ctx, cx, cy, s, dx, dy, lid) {
  ctx.save();
  ctx.translate(cx, cy + dy * 0.3 * s);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(-142, 6);
  ctx.quadraticCurveTo(-20, -134 * (2.5 * lid - 1.5), 142, 10);
  ctx.quadraticCurveTo(10, 118, -142, 6);
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(dx - 2, dy, 58, 0, 7); ctx.fill();
  ctx.strokeStyle = GREEN; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.arc(dx - 2, dy, 44, 0, 7); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(dx + 16, dy - 14, 7, 0, 7); ctx.fill();
  ctx.restore();
}

function windowFrame(ctx, x, seed) {
  IB.box(ctx, x, 283, 280, 507, { fill: C.paper, w: 3, seed });
  IB.box(ctx, x + 15, 297, 250, 478, { fill: C.paper, w: 2.5, seed: seed + 1 });
  IB.seg(ctx, x + 15, 368, x + 265, 368, { w: 2.5, seed: seed + 2 });
}
function sashAndSill(ctx, x, seed) {
  IB.box(ctx, x + 15, 520, 250, 15, { fill: C.paper, w: 2.5, seed: seed + 3 });      // the lower sash rail passes in front of whoever is inside
  IB.box(ctx, x + 15, 750, 250, 25, { fill: C.paper, w: 2.5, seed: seed + 4 });
  IB.box(ctx, x - 6, 793, 294, 52, { fill: C.paper, w: 3, seed: seed + 5 });
  IB.smear(ctx, x + 140, 847, 270, { h: 5, seed: seed + 6 });
}

function watcher(ctx, t) {
  const down = t >= 9.5;
  const scan = down ? 0 : held([[4.6, -8], [5.6, 7], [7.5, -8], [8.3, 0]], t, [0, 0])[1];
  IB.box(ctx, 1147, 686, 121, 64, { fill: SKIRT, w: 3, seed: 300 });
  IB.box(ctx, 1140, 538, 136, 150, { fill: C.mint, w: 3, seed: 301 });
  // curly hair, face, collar
  const hair = []; for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2, r = (i % 2 ? 78 : 69) * (Math.sin(a) > 0.3 ? 0.95 : 1); hair.push([1206 + scan * 0.5 + Math.cos(a) * r * 0.95, 448 + Math.sin(a) * r]); }
  IB.ink(ctx, hair, { closed: true, fill: C.ink, w: 3, seed: 302 });
  IB.oval(ctx, 1198 + scan, 462, 33, 42, { fill: C.skin[1], w: 3, seed: 303, n: 12 });
  IB.box(ctx, 1176, 498, 58, 44, { fill: C.mint, w: 3, seed: 304 });
  const arm = (pts, seed) => IB.tube(ctx, pts, { w: 44, edge: 3, fill: C.mint, seed });
  const lens = (x, y, r, seed) => { IB.oval(ctx, x, y, r, r, { fill: C.ink, w: 3, seed, n: 14 }); IB.oval(ctx, x, y, r * 0.74, r * 0.74, { w: 2.6, color: C.paper, seed: seed + 50, n: 14 }); IB.oval(ctx, x - r * 0.25 + scan * 0.6, y - r * 0.2, r * 0.22, r * 0.16, { fill: C.paper, w: 0, n: 8 }); };
  if (!down) {
    arm([[1150, 566], [1104, 524], [1132 + scan, 478]], 310);
    arm([[1266, 566], [1306, 524], [1236 + scan, 478]], 311);
    IB.oval(ctx, 1130 + scan, 468, 15, 20, { fill: C.skin[1], w: 3, seed: 312, n: 8 });
    IB.oval(ctx, 1240 + scan, 468, 15, 20, { fill: C.skin[1], w: 3, seed: 313, n: 8 });
    lens(1154 + scan, 447, 27, 314);
    lens(1203 + scan, 447, 27, 315);
  } else {
    ctx.fillStyle = C.ink;
    for (const x of [1186, 1211]) { ctx.beginPath(); ctx.arc(x, 456, 4, 0, 7); ctx.fill(); }
    IB.ink(ctx, [[1190, 480], [1199, 484], [1208, 480]], { w: 2.5, seed: 320 });
    arm([[1150, 566], [1118, 640], [1176, 628]], 321);
    arm([[1266, 566], [1296, 640], [1236, 628]], 322);
    lens(1184, 618, 23, 323);
    lens(1228, 618, 23, 324);
    IB.oval(ctx, 1160, 628, 14, 17, { fill: C.skin[1], w: 3, seed: 325, n: 8 });
    IB.oval(ctx, 1252, 628, 14, 17, { fill: C.skin[1], w: 3, seed: 326, n: 8 });
  }
}

function room(ctx, t) {
  // lamp, picture, the room's far corner
  IB.seg(ctx, 1562, 300, 1562, 396, { w: 2.5, seed: 400 });
  IB.oval(ctx, 1565, 418, 56, 24, { fill: C.paper, w: 3, seed: 401, n: 12 });
  IB.ink(ctx, [[1660, 372], [1735, 330]], { w: 2.5, seed: 402 });
  IB.seg(ctx, 1660, 372, 1660, 640, { w: 2.5, seed: 403 });
  IB.box(ctx, 1694, 420, 44, 240, { w: 2.5, seed: 404 });
  IB.box(ctx, 1486, 470, 82, 160, { w: 2.5, seed: 405 });
  // cat on the sill: ears flick at 8.75 s, then it settles a step to the left
  const tw = IB.twos(t), cx = 1556 - 46 * prog(tw, 9.75, 1.0), ear = tw >= 8.75 && tw < 9.25 ? 5 : 0;
  IB.ink(ctx, [[cx - 28, 748], [cx - 34, 700], [cx - 24, 670], [cx - 27, 654 - ear], [cx - 14, 664], [cx, 654 - ear], [cx + 4, 674], [cx + 2, 700], [cx + 26, 720], [cx + 30, 748]], { closed: true, fill: C.paper, w: 2.8, seed: 410 });
  ctx.fillStyle = C.ink;
  for (const x of [cx - 19, cx - 6]) { ctx.beginPath(); ctx.arc(x, 682, 2.2, 0, 7); ctx.fill(); }
}
function plant(ctx) {
  const r = rng(31);
  IB.box(ctx, 1632, 738, 44, 40, { fill: C.paper, w: 2.5, seed: 500 });
  const vine = [[1650, 700], [1690, 720], [1712, 800], [1700, 880], [1722, 960], [1730, 1040]];
  IB.ink(ctx, vine, { w: 2, seed: 501 });
  for (let i = 0; i < 34; i++) {
    const u = r(), k = Math.min(vine.length - 2, Math.floor(u * (vine.length - 1))), v = u * (vine.length - 1) - k;
    const x = lerp(vine[k][0], vine[k + 1][0], v) + (r() - 0.5) * 70 * (1 - u * 0.6), y = lerp(vine[k][1], vine[k + 1][1], v) + (r() - 0.5) * 30;
    ctx.save(); ctx.translate(x, y); ctx.rotate(r() * 6.3);
    IB.oval(ctx, 0, 0, 13, 8, { fill: r() < 0.22 ? '#b9a2ee' : C.paper, w: 2, seed: 510 + i, n: 7 });
    ctx.restore();
  }
}
function building(ctx, t) {
  // sky side: stretched clouds and a scalloped bush; wall side: a few brick marks stand for the whole wall
  const cloud = (x0, x1, y, seed) => IB.ink(ctx, [[x0, y + 12], [lerp(x0, x1, 0.3), y - 8], [lerp(x0, x1, 0.6), y - 2], [x1, y - 30], [x1, y + 34], [lerp(x0, x1, 0.55), y + 28], [lerp(x0, x1, 0.2), y + 30]], { closed: true, fill: C.paper, w: 3, seed });
  cloud(-80, 150, 82, 600);
  cloud(540, 975, 68, 601);
  IB.seg(ctx, 970, -10, 970, 940, { w: 3.5, seed: 602 });
  const bush = [];
  for (let i = 0; i <= 26; i++) { const a = Math.PI * (1 - i / 26), bump = i % 2 ? 1.0 : 0.93; bush.push([765 + Math.cos(a) * 330 * bump, 1095 - Math.sin(a) * 245 * bump]); }
  IB.ink(ctx, bush, { w: 3, seed: 603, fill: C.bg, closed: true });
  const bricks = (x, y, seed) => { IB.seg(ctx, x, y, x + 175, y, { w: 2.5, seed }); IB.seg(ctx, x - 10, y + 38, x + 230, y + 38, { w: 2.5, seed: seed + 1 }); for (const [dx, y0] of [[48, -36], [140, -36], [0, 4], [96, 4], [150, 42]]) IB.seg(ctx, x + dx, y + y0, x + dx, y + y0 + 30, { w: 2.5, seed: seed + 2 + dx }); };
  bricks(1686, 160, 610);
  bricks(1090, 955, 630);
  for (const x of [1068, 1470]) { IB.box(ctx, x - 6, -40, 294, 66, { fill: C.paper, w: 3, seed: 650 + x }); IB.smear(ctx, x + 140, 28, 270, { h: 5, seed: 660 + x }); }
  windowFrame(ctx, 1068, 700);
  watcher(ctx, t);
  sashAndSill(ctx, 1068, 700);
  windowFrame(ctx, 1470, 720);
  room(ctx, t);
  sashAndSill(ctx, 1470, 720);
  plant(ctx);
}

MG.scene({
  title: 'spot / dark-eyes-reveal',
  duration: 11.625, ref: [120.083, 131.708], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    if (t < CUT) {
      IB.bg(ctx, '#000000');
      const tw = IB.twos(t), [, dx, dy, lid] = held(LOOK, tw, LOOK[0]), s = held(ZOOM, tw, [0, 1])[1];
      if (lid > 0) for (const [ex, ey] of [[1100, 541], [1568, 543]]) eye(ctx, FOCUS[0] + (ex - FOCUS[0]) * s, FOCUS[1] + (ey - FOCUS[1]) * s, s, dx, dy, lid);
      IB.copy(ctx, DARK, t, 2 / 24, { top: 446, from: 41, color: '#ffffff' });
      return;
    }
    IB.bg(ctx);
    const z = 1 + 0.98 * (1 - IB.settle(t - CUT, 0.158));
    ctx.setTransform(z, 0, 0, z, FOCUS[0] * (1 - z), FOCUS[1] * (1 - z));
    building(ctx, t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (t < 6.333) {
      const up = 59 * (1 - IB.settle(t - CUT, 0.12));
      IB.copy(ctx, LIT.slice(0, 2), t, 0, { top: 387 + up, from: 0 });
      ctx.save(); ctx.translate(0, up * 0.7); IB.copy(ctx, ['', '', LIT[2]], t, CUT - 2 / 24, { top: 387, from: 0 }); ctx.restore();
    } else IB.copy(ctx, SWAP, t, 6.333, { top: 387, stagger: 4 });
  },
});
</script>
