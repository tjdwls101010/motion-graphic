<!doctype html>
<meta charset="utf-8">
<title>vignette / parcel-rings-doorbell</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/parcel.js"></script>
<script src="../../kit/props/nature.js"></script>
<script src="../../kit/props/home.js"></script>
<script src="../../kit/camera.js"></script>
<script>
/* 택배 상자가 다리로 걸어 와 문 옆에 서서 초인종을 올려다보고, 뛰어올라 보지만 한 뼘이 모자라 쿵 떨어지고, 발을 동동 구른 뒤 더 깊이 웅크렸다 뛰어 머리(테이프 붙은 윗면)로 버튼을 누른다. 버튼에 불이 들어오면 "배달 왔어요!" 하고 기다린다. 원본에 없는 창작 장면이자 부품 시트의 조립 시험(계획 5단계)으로, 다섯 장면에서 온 부품만으로 지었다: 걷고 뛰는 상자(metaphor/parcels-board-conveyor), 문·액자·화분(acting/walk-cycle-bag), 호출 버튼(variation/hall-whip-button, opts.s 0.22로 줄여 벽에 붙임: 선은 와이드 굵기 3 px를 지킨다), 쿵(acting/lift-heavy-box), 말풍선. 전달하는 생각: 한 번 실패한 뒤의 준비는 더 깊다.
   Motion notes: 7 s in three shots (IB.shot, on ones): 0-2.5 s the hallway (1500 px window) pushing toward the door (1160) as the parcel walks in; 2.67 s, as it looks up, a cut to a low angle (840) with the parcel at the foot of the frame and the button high over it, for the first hop and the stamping; 3.83 s a push in on the button (660, 14 frames) through the deep crouch, with a 20 px jolt at 4.5 s when its head hits the button; 4.83 s a cut out to the door, the button and the plant (1000) for the bubble and the tapping foot. Actors are staged once in stage px, all on twos except the last second's foot tap on threes. The parcel (170 x 140, legs 74 px) walks in at 190 px/s, swapping its two foot sets and tilting +-0.035 every 6 frames, the parcels' own walk, the planted foot staying put in stage x while the body walks over it; it stops at 2.5 s rocking back 0.05 rad for one drawing, and at 2.67 s tips its top back 0.08 rad for one drawing to look up at the button. Hop 1 at 3.0 s: one crouched drawing (16 px down, tilted back 0.09), two drawings in the air with the legs hanging (40 then 60 px up: its top stops 15 px short of the button's plate), a landing crouch with a thud on the floor for 2 drawings, standing. Then three stamping drawings (tilt +-0.04, one foot up). Hop 2 at 4.5 s: a deeper crouch held 2 drawings (24 px, 0.12 rad), up 125 px in one drawing so the middle of its top (the tape) presses the cap: the button sinks and lights on that drawing with a burst for 2 drawings, down through 70 px, landing crouch, thud, standing. Bubble at 5.0 s. From 6.0 s the only thing that moves is one foot tapping on threes. The button keeps its light. Three colours: the yellow door, the lit button's blue and the indicator's mint; the parcel is paper white. */
const FLOOR = 900, LEG = 74, Y0 = FLOOR - 12 - LEG, W = 170, H = 140, X0 = 980, XS = 1450, BTN = [1450, 520], BS = 0.22;
const WALK_END = (XS - X0) / 190;   // 2.47 s

/* the parcel on the drawing at tt: { x, y (its bottom edge), tilt, legs, feet, air } */
function parcelAt(t) {
  const tt = IB.twos(t);
  const f = Math.round(tt * 12) * 2;   // the frame its drawing starts on
  const stand = { x: XS, y: Y0, tilt: 0, legs: 1, feet: [[-W * 0.2, 0], [W * 0.2, 0]] };
  const crouch = (down, tilt) => ({ ...stand, y: Y0 + down, tilt, legs: 0.75 });
  const air = (up, tilt) => ({ ...stand, y: Y0 - up, tilt, legs: 0.6, feet: [[-W * 0.2 - 10, 0], [W * 0.2 + 4, -8]], air: true });
  if (tt < WALK_END - 1e-6) {   // the parcels' walk, with the planted foot fixed in stage x for its whole step
    const step = IB.alternate(f, 6), x = X0 + 190 * tt, xs = X0 + 190 * (Math.floor(f / 6) * 6) / 24, planted = (base) => xs + base - 8 + (190 * 6) / 24 / 2 - x;
    return { x, y: Y0, tilt: (step ? 1 : -1) * 0.035, legs: 1, feet: step ? [[planted(-W * 0.2), 0], [W * 0.2 + 22, -12]] : [[-W * 0.2 + 22, -12], [planted(W * 0.2), 0]] };
  }
  const T = [
    [60, { ...stand, tilt: -0.05 }], [62, stand], [64, { ...stand, tilt: -0.08 }], [66, stand],
    [70, crouch(16, -0.09)], [72, air(40, -0.1)], [74, air(60, -0.06)], [76, crouch(10, 0.04)], [78, stand],
    [84, { ...stand, tilt: 0.04, feet: [[-W * 0.2, 0], [W * 0.2, -14]] }], [86, { ...stand, tilt: -0.04 }], [88, { ...stand, tilt: 0.04, feet: [[-W * 0.2, 0], [W * 0.2, -14]] }], [90, stand],
    [104, crouch(24, -0.12)], [108, air(125, -0.04)], [110, air(70, 0.02)], [112, crouch(10, 0.05)], [114, stand],
  ];
  const p = IB.held(T, f);
  if (tt >= 6 - 1e-6) { const tap = Math.round(IB.threes(t) * 8) % 2; return { ...p, feet: [[-W * 0.2, 0], [W * 0.2, tap ? -10 : 0]] }; }   // the foot taps on threes: read the threes grid, not the twos one
  return f < 60 ? stand : p;
}
const pressed = (tt) => tt >= 108 / 24 - 1e-6;

IB.actors = (t) => ({ parcel: parcelAt(t), button: pressed(IB.twos(t)) });

// the camera: the hallway as the parcel walks in, pushing slowly toward the door; on its look up a cut to a low angle (the parcel at the foot of the frame, the button high over it); after the stamping a push in on the button through the deep crouch, a jolt as its head hits the button; a cut out to the door for the bubble and the tapping foot
const SHOTS = [
  [0, { at: [1180, 600], w: 1500 }],
  [0, { at: [1360, 640], w: 1160 }, 'push', 60],
  [64, { at: [1440, 630], w: 840 }, 'cut'],
  [92, { at: [1450, 580], w: 660 }, 'push', 14],
  [116, { at: [1380, 640], w: 1000 }, 'cut'],
];
const HITS = [[108, 20]];

MG.scene({
  title: 'vignette / parcel-rings-doorbell',
  duration: 7, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const tt = IB.twos(t), f = IB.frame(tt), p = parcelAt(t);
    IB.film(ctx, IB.shot(SHOTS, Math.floor(t * 24), { jolt: HITS }), (ctx) => {
      // the wall: a picture, the door, the plant; the call button beside the door, the insert-size part brought down to this shot
      IB.pictureFrame(ctx, [560, 360], { w: 210, h: 160, seed: 700 });
      IB.door(ctx, [1060, FLOOR]);
      IB.pottedPlant(ctx, [1760, FLOOR], IB.PLANTS.bushy);
      IB.callButton(ctx, BTN, { pressed: pressed(tt) }, { s: BS });
      const b = IB.drawn(tt, 108 / 24);
      if (b >= 0 && b < 2) IB.burst(ctx, [BTN[0], BTN[1] - 30], { n: 5, a0: -2.9, da: 0.6, r0: 70 + b * 16, r1: 110 + b * 12, w: 3, seed: 560 + b * 7 });
      // the parcel, its smear and the thuds of its landings
      if (!p.air) IB.smear(ctx, p.x, FLOOR - 9, W * 1.3, { h: 12, seed: 9 });
      IB.parcel(ctx, [p.x, p.y], p, { w: W, h: H, seed: 140, leg: LEG, ground: FLOOR - 12 });
      for (const land of [76, 112]) { const k = IB.drawn(tt, land / 24); if (k >= 0 && k < 2) IB.thud(ctx, [p.x, FLOOR], { half: W / 2, k }); }
      IB.bubble(ctx, ['배달 왔어요!'], t, 5.0, { tip: [XS - 60, Y0 - H - 10], x: XS - 330, y: Y0 - H - 110, seed: 500 });
    });
  },
});
</script>
