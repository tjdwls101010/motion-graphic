<!doctype html>
<meta charset="utf-8">
<title>vignette / trick-candle-relight</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/home.js"></script>
<script src="../../kit/camera.js"></script>
<script>
/* 아이가 케이크의 촛불을 훅 불어 끄고 뿌듯해하는데 불이 하나씩 도로 켜지고, 더 크게 숨을 들이켜 다시 불어 꺼도 이번엔 한꺼번에 켜져서 "어?" 한다. 원본에 없는 창작 장면으로, 원본 3편의 촛불 부는 아이에서 "준비-동작-정지"와 얼굴만 바뀌는 연기를 가져왔다. 전달하는 생각: 껐다고 생각한 문제가 다시 살아난다.
   Motion notes: 7 s in four shots (IB.shot, on ones): 0 s a still medium of her and the cake (1100 px window) for round one; 2.42 s a cut to an insert of the candles (540) as they catch one by one; 2.75 s a cut back to her (1000) as the last one catches and she takes; 3.25 s, round two being bigger, a push in on her and the cake (760, 18 frames) through the inhale, held for the blow and the relight; 5.17 s a cut to her face with the relit flames at the edge (680) for the bubble. Actors are staged once in stage px; figure 440 px tall. Two rounds of the same four beats, the second bigger: inhale (lean back 0.1 rad, then 0.2), a hold (0.33 s, then 0.58 s, after the overshoot drawing), blow (lean forward 0.35, then 0.5; the pose arrives in one drawing), result held. The inhale goes 15% past its hold for one drawing; out of the blow one in-between leads to the smile; when the last flame is back she is thrown back past upright (lean -0.14) for one drawing (the take). Each drawing passes the one before as pose.prev, so her curls trail the blow and the take. The body only tips at the hip, which shifts just enough to keep both hands on the table edge; between poses there are one or two in-betweens on twos and no easing. Blow: three puff lines travel from the mouth for 3 drawings; the flames lie over to the right for one drawing (a smear, 2.2x long) and are gone on the next; a wisp of smoke climbs 14 px per drawing for 6 drawings above each wick. Relight round one: one flame per drawing-pair, left to right, 2 drawings apart (2.5, 2.67, 2.83 s), each with a four-point spark for one drawing. Relight round two: all three on the same drawing at 5.0 s, then the bubble at 5.25 s. A lit flame is two drawings alternating on threes (8 fps) and that is the only thing moving while a pose holds, including the whole last second. The face changes with the beat, not between: eyes shut for the blow, a smile when the flames are out, wide when they return. Three colours: lavender cake, yellow flames, the sky top. */
const F = IB.FIG, FLOOR = 930, TABLE = 690, X0 = 720;
const WHO = { ...IB.PEOPLE.kid, h: 440, dir: 1, seed: 60 };
const H = WHO.h, CANDLES = [1010, 1062, 1114], WICK = TABLE - 8 - 112 - 72;
const kid = (lean, face) => {
  const p = IB.stand(X0, FLOOR, WHO); p.lean = lean; p.hip[0] += -Math.sin(lean) * F.torso * H * 0.6; p.hands = [[X0 + 70, TABLE - 8], [X0 + 54, TABLE - 6]]; p.face = face;
  // shifting the hip over can take it further from a foot than the leg reaches, and the rig would then lift that foot off the floor: sink the hip until both feet are in reach
  const reach = (F.thigh + F.shin) * H - 1, far = Math.max(...p.feet.map(([fx, fy]) => Math.hypot(fx - p.hip[0], fy - p.hip[1])));
  if (far > reach) { const dy = Math.max(...p.feet.map(([fx, fy]) => { const dx = fx - p.hip[0]; return fy - Math.sqrt(Math.max(0, reach * reach - dx * dx)); })) - p.hip[1]; p.hip[1] += dy; p.hands = p.hands.map(([x, y]) => [x, y]); }
  return p;
};
const SMILE = { mouth: 'smile' }, FLAT = { mouth: 'flat' }, PUFF = { eye: 'closed', mouth: 'open' }, WIDE = { eye: 'wide', mouth: 'flat', brow: -1 }, IN = { eye: 'closed', mouth: 'flat', brow: 1 };

// the two rounds: [inhale at, blow at, relight at, lean back, lean forward, relight stagger in drawings]
const ROUNDS = [{ inhale: 0.75, blow: 1.25, back: 0.5 + 18 / 12, relight: 2.5, away: -0.1, into: 0.35, stagger: 2 }, { inhale: 3.25, blow: 4, back: 99, relight: 5, away: -0.2, into: 0.5, stagger: 0 }];
function poseAt(tt) {
  const n = (t0) => IB.drawn(tt, t0), rest = kid(0.06, SMILE);
  let p = kid(0.06, FLAT);
  for (const r of ROUNDS) {
    const lit = (i) => tt >= r.relight + (i * r.stagger) / 12 - 1e-6;
    if (tt < r.inhale - 1e-6) break;
    // the inhale: half-way, one drawing 15% further back than the hold, then the hold
    if (tt < r.blow - 1e-6) { const k = n(r.inhale); p = k === 0 ? IB.poseMix(kid(0.06, FLAT), kid(r.away, IN), 0.6) : k === 1 ? kid(r.away * 1.15, IN) : kid(r.away, IN); continue; }
    // the blow arrives in one drawing; out of it, one in-between to the smile
    const b = n(r.blow);
    p = b < 5 ? kid(r.into, PUFF) : tt >= r.back - 1e-6 ? rest : b === 5 ? kid(r.into * 0.85, SMILE) : kid(r.into * 0.7, SMILE);
    // the take when the last flame is back: thrown back past upright for one drawing, then upright
    const all = (r.stagger * 2) / 12;
    if (lit(0)) p = kid(lit(2) ? (IB.drawn(tt, r.relight + all) === 0 ? -0.14 : 0.02) : p.lean, WIDE);
  }
  return p;
}
// 0 = out, 1 = burning, 2 = blown flat for one drawing, 3 = the drawing it catches again
function flame(i, tt) {
  let s = 1;
  for (const r of ROUNDS) {
    const b = IB.drawn(tt, r.blow), l = IB.drawn(tt, r.relight + (i * r.stagger) / 12);
    if (b === 1) s = 2; else if (b >= 2) s = 0;
    if (l === 0) s = 3; else if (l > 0) s = 1;
  }
  return s;
}

// the kid's drawing with the one before as prev: the curls and the head trail the blow and the take
const drawnAt = (t) => { const tt = IB.twos(t); return { ...poseAt(tt), prev: tt > 0 ? poseAt(IB.twos(tt - 1e-4)) : undefined }; };
IB.actors = (t) => ({ kid: drawnAt(t), flames: CANDLES.map((_, i) => flame(i, IB.twos(t))) });

// the camera: round one in a still medium of her and the cake; a cut to an insert of the candles as they catch one by one, and back to her for the take as the last one catches; round two is bigger, so the camera pushes in through the inhale and holds for the blow and the relight; a cut to her face (the flames at the edge) for "어?"
const SHOTS = [
  [0, { at: [960, 640], w: 1100 }],
  [58, { at: [1062, 500], w: 540 }, 'cut'],
  [66, { at: [920, 640], w: 1000 }, 'cut'],
  [78, { at: [880, 580], w: 760 }, 'push', 18],
  [124, { at: [800, 520], w: 680 }, 'cut'],
];

MG.scene({
  title: 'vignette / trick-candle-relight',
  duration: 7, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const tt = IB.twos(t), f = IB.frame(t), p = poseAt(tt);
    IB.film(ctx, IB.shot(SHOTS, Math.floor(t * 24)), (ctx) => {
      IB.smear(ctx, X0, FLOOR - 9, 290, { h: 13, seed: 8 });
      IB.partyTable(ctx, [1062, FLOOR]);
      CANDLES.forEach((x, i) => IB.candle(ctx, [x, WICK], { lit: flame(i, tt), flicker: IB.alternate(f, 3) }));
      const j = IB.figure(ctx, drawnAt(t), { ...WHO, face: p.face });
      for (const r of ROUNDS) {
        const b = IB.drawn(tt, r.blow), big = r.into > 0.4 ? 1.35 : 1;
        // breath: three lines leave the mouth and travel toward the candles for three drawings
        if (b >= 0 && b < 3) IB.breath(ctx, j.headAt, { k: b, big });
        // smoke: a thin wisp climbing from each wick for six drawings
        if (b >= 2 && b < 8) CANDLES.forEach((x, i) => { if (flame(i, tt) === 0) IB.smoke(ctx, [x, WICK], { k: b - 2, seed: 320 + i + b }); });
      }
      IB.bubble(ctx, ['어?'], t, 63 / 12, { tip: [X0 - 16, FLOOR - 0.98 * H], x: X0 - 150, y: FLOOR - 1.2 * H, seed: 500 });
    });
  },
});
</script>
