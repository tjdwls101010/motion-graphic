<!doctype html>
<meta charset="utf-8">
<title>props / metaphor</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/props/metaphor.js"></script>
<script src="../sample.js"></script>
<script>
/* 소품 견본: 은유, 설명 은유를 짓는 평범한 물건들, 솟는 막대 IB.bar, 깃발 IB.flag, 도미노 IB.domino와 기대어 멈추는 각도 IB.dominoRest(낭떠러지와 널빤지는 props/metaphor-bridge). 모두 한 가지 채움에 붓펜 외곽선이고, 바닥과 닿는 곳에 흑연, 바닥은 분필이다. 막대는 IB.settle(tau 0.1)을 2프레임 단위로 읽어 솟는다: 박자의 첫 장에는 없고 한 장 뒤에 이미 57%다. 깃발 대는 두 장(0.5, 1)에 그려지고 두 장 뒤부터 천이 3프레임마다 두 장을 번갈아 펄럭인다. 도미노는 하나가 다음 것보다 한 장(2프레임) 늦게 넘어지기 시작하고(1488px/s로 퍼지는 물결), 빈 곳에서는 19, 44, 68, 90도로 가지만 이웃에 닿으면 dominoRest가 준 각도에서 멈춘다: 기대는 각도를 손으로 정하면 어느 한 장에서 겹친다. 파란 도미노는 버티고, 물결이 닿는 두 장에 충격선이 튄다. 값은 metaphor/bars-rise-climber, dominoes-chain-stop 그대로다(깃발은 원본처럼 막대 위에). */
const FLOOR = 910, BARS = [90, 185, 290, 405, 530].map((h, k) => ({ x: 560 + k * 240, h, at: 0.5 + k, seed: 200 + k * 10 }));
const DF = 840, N = 12, HELD = 8, GAP = 124, X0 = 278, S = 1.3, DW = 44 * S, DH = 160 * S, FLICK = 1, WAVE = 1 / 12, FREE = [19, 44, 68, 90];
const xOf = (i) => X0 + i * GAP;
function angles(tt) {   // dominoes-chain-stop: worked out from the held one leftward
  const out = new Array(N).fill(0);
  for (let i = HELD - 1; i >= 0; i--) { const k = IB.drawn(tt, FLICK + i * WAVE); out[i] = k < 0 ? 0 : Math.min(FREE[Math.min(FREE.length - 1, k)], IB.dominoRest(out[i + 1], GAP, DW, DH)); }
  return out;
}
MG.scene({
  title: 'props / metaphor',
  duration: 7, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'props/metaphor.js — bars, flag, dominoes');
    const C = IB.C, f = IB.frame(t), tt = IB.twos(t);
    const A = [48, 96, 1200, 560], F = [1276, 96, 596, 560], B = [48, 718, 1824, 304];
    SAMPLE.cell(ctx, A, SAMPLE.fit(A, [1040, FLOOR], 20), () => BARS.forEach((b, k) => IB.bar(ctx, [b.x, FLOOR], { h: b.h, u: IB.settle(tt - b.at + 1e-6, 0.1, 5 / 12), w: 170, fill: k === 4 ? C.blue : C.paper, seed: b.seed })), 'IB.bar(at, { h, u, w }) — one a second, IB.settle tau 0.1');
    SAMPLE.cell(ctx, F, SAMPLE.fit(F, [990, FLOOR], 20), () => {
      const k = IB.drawn(tt, 1);
      IB.bar(ctx, [960, FLOOR], { h: 200, w: 170, seed: 240 });
      if (k >= 0) IB.flag(ctx, [1017, FLOOR - 200], { grown: IB.inbetween([0.5, 1], k), flap: k >= 2 ? IB.alternate(f, 3) : null });
    }, 'IB.flag(at, { grown, flap })');
    SAMPLE.cell(ctx, B, SAMPLE.fit(B, [960, DF], 20), () => {
      const ang = angles(tt), hit = IB.drawn(tt, FLICK + (HELD - 1) * WAVE), top = [xOf(HELD), DF - DH - 2];
      IB.smear(ctx, 960, DF - 4, 1600, { h: 12, seed: 8 });
      for (let i = N - 1; i >= 0; i--) IB.domino(ctx, [xOf(i) + DW / 2, DF], { deg: ang[i], face: i }, { s: S, fill: i === HELD ? C.blue : C.paper, seed: 100 + i * 7 });
      if (hit >= 0 && hit < 2) IB.burst(ctx, [top[0] - DW / 2 - 6, top[1] + 30], { n: 3, a0: -2.0, da: 0.5, r0: 26 + hit * 12, r1: 26 + hit * 12 + 30, seed: 300 + hit * 5 });
    }, 'IB.domino(at, { deg, face }) + IB.dominoRest(next, gap, w, h) — the blue one is held');
  },
});
</script>
