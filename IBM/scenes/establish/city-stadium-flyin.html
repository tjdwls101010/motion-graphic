<script>
/* 화면을 가득 채운 흑백 선화 도시 한가운데 경기장이 있고, 노란 헬리콥터 한 대가 오른쪽 아래에서 렌즈 앞을 스치듯 들어와 꼬리를 치켜들고 돌아선 뒤 경기장 쪽으로 멀어진다. 전달하는 생각: 이제 벌어질 일의 장소를 한 장으로 알린다.
   Motion notes: 1.9 s. The drawing never moves and is far denser than any other family: line widths 1.5-4.5 px mixed, windows and trusses as texture, almost no fills, and every gap between buildings stuffed with cauliflower foliage (IB.clump). Colour only in two places, the yellow craft and the pale blue seating, plus one bright strip at the stadium's foot.
   The city is read off the reference frame on a 100 px grid: the stadium (a drum with a rounded shoulder, a band of nine V trusses over a band of nine crosses between posts, an opening whose far stand shows four ring lines above the dark bowl), 22 towers with their widths, heights and which third of each carries window marks (the reference leaves much of every tower white), the foreground blocks, clouds and birds. Foliage is placed by hand as ellipses and generated inside them (open strings of bumps about 24 px across over a blank fill), so its bumps are not the reference's; two foreground blocks have stepped roofs as in the reference (an L, a notch: IB.roofBlock with more than four points), the rest are four-point boxes.
   The craft is the one moving thing, on twos (IB.heli.MOVE.flyIn, 19 drawings from frame 8): nothing for the first 0.33 s, then three drawings larger than the frame as it crosses in front of the lens (the first stretched 1.3x as a smear, the next two seen three-quarter from the front with the nose to the left and the boom running back up and to the right: IB.heliTurn, yaw 2.8-2.85), two facing the lens with the boom rising behind the cabin, then three-quarter views with the nose to the right and the boom rising behind to the left, turning toward the side view as it goes (yaw 0.95 to 0.58), and from then on it never hovers: every drawing is smaller and more level than the last as it flies off toward the stadium, drifting 136 px left then 76 px back right. The rotor is a fan of straight strokes re-rolled on every drawing; it stays near level while the body tips. The craft's painted eye and lettering are left out. */
const FLY = IB.play(IB.heli.MOVE.flyIn, 8);   // the craft's drawings, on twos from frame 8

MG.scene({
  title: 'establish / city-stadium-flyin',
  duration: 1.917, ref: [0, 1.917], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    IB.stadiumCity(ctx);
    // the one moving thing, on twos from frame 8
    const f = IB.frame(t), d = Math.floor((f - 8) / 2);
    if (d >= 0) IB.heliDrawing(ctx, IB.held(FLY, f), d);   // d keeps counting after the last drawing: it re-rolls the rotor
  },
});
</script>
