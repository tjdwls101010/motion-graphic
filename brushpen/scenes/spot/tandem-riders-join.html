<!doctype html>
<meta charset="utf-8">
<title>spot / tandem-riders-join</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/props/nature.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../../kit/cast/riders.js"></script>
<script>
/* 혼자 달리던 자전거에 한 명씩 끼어들 때마다 자전거가 한 칸씩 길어져 5인승 탠덤이 되고, 마지막에 다 같이 손을 놓고 몸을 젖히며 모자 하나가 뒤로 날아간다. 원본은 왼쪽에 카피가 있는 화면이고, 여기서는 문구를 빼고 그림 영역만 잘라 화면에 채웠다. 끼어드는 순간마다 뒤에 탄 사람은 안장에서 붕 뜨고 머리카락이 솟았다 가라앉으며, 앞에 탄 사람은 앞으로 쏠렸다 일어선다. 전달하는 생각: 따로 있던 것들이 한 대에 올라 같은 방향으로 간다.
   Motion notes: a travelling shot, so two clocks run at once. On ones: the ground props scroll left at a constant 332 px/s (13.8 px per frame), clouds drift 3 px/s and the bike creeps right 34.6 px/s. On twos: everything drawn, i.e. the riders, the pedals (12 drawings per turn, one turn per second, every crank in the same phase because a tandem's cranks are chained), hair and the bike's own length.
   Shows the reference frame's region x 640-1920, y 150-870 (CROP) enlarged 1.5x; coordinates in the code are the reference's. Wheelbase 170 px + 120 per extra rider, wheel radius 50.
   A join is four drawings, not a slide (JOINS, poseOf()): 0 the frame is 30% longer, the tail kicks up (the rear axle rises 50 px as the bike tips about its front tyre, 27 px on the next drawing, then dips 9; each later join lifts it by 1 / (1 + 0.7 j) of that) and the newcomer hangs above the gap as a tucked ball, its seat and crank not yet drawn; 1 80% longer, the newcomer lands squashed with the head down, everyone behind is thrown 20 px off the saddle with arms pulled straight and hair straight up, everyone ahead is jolted forward; 2 the frame overshoots to 106%, the newcomer sits up with both hands off the bar, those behind come down with the hair still puffed and one open hand, those ahead stand 10 px tall; 3 everyone back in their own acting, a few px off the saddle with the hair still up. The ground ripples under the wheels stay on the ground while the bike tips. Joins at frames 32, 92, 136, 160 (1.33, 3.83, 5.67, 6.67 s).
   Riders are rigs with a pose each drawing: torso lean and rise off the saddle, two-bone arms to a hand target (the bar, or free), head tilt, eye and mouth, hair lift. The spine (74 px) turns about the hip by (22 + lean) / 60 rad: 0.37 rad forward while riding, and each unit of `lean` moves the shoulder about 1.2 px, so leaning back also brings the shoulders down. Joints relative to the crank a rider pedals: hip 24 px behind and 112 above (read off the reference), which puts the riding shoulder 181 above and the head centre 218 above; grip 56 ahead and 118 above; thigh 74, shin 70, arm 50 + 50. Between joins they act a little (the first passenger calls forward with a hand by the mouth and the front rider looks round; the one in overalls sings with the head back). Finale, in the reference's order: the front rider sits up at frame 222 and throws an arm up; at 226 the rear rider flings both arms wide and the one in overalls reaches both hands forward; at 232 the one in the blue helmet throws an arm up; the one in the cap holds the bar until the cap goes. Leaning back is `lean` -30 to -66 (shoulders 40-80 px behind where they ride); the front rider coasts with both legs out while the rest keep pedalling, and each raised hand flicks between two drawings every 8 frames. The cap lifts off at frame 240 and tumbles up and back over 1.5 s; its owner grabs at the air, claps a hand to the bare head, looks after it, and at frame 262 gives up and throws the arm up with the rest.
   Loops that keep a held pose alive: streaming hair, beard and hood string cycle through three drawings, a new one every 2 frames, as the reference redraws them; pedal and wheel marks alternate every 2; a puff of dust leaves the rear wheel for three drawings out of every six. Lines are 1.9 px in reference pixels (2.9 on screen) because the figures are small (head radius 22). */
const { lerp, rng } = MG;
const PI = Math.PI, AXLE = 750, R = IB.TANDEM.r;
const CROP = [640, 150, 1280, 720];   // the region of the reference frame this scene shows, enlarged 1.5x: the copy on the left is left out

/* Riders rear to front, with the frame each one joins at (the front rider is there from the start). */
const RIDERS = [
  { join: 32, ...IB.RIDERS.curls },
  { join: 136, ...IB.RIDERS.visor },
  { join: 160, ...IB.RIDERS.cap },
  { join: 92, ...IB.RIDERS.bun },
  { join: -1, ...IB.RIDERS.vents },
];
const JOINS = RIDERS.map((r, i) => [r.join, i]).filter(([j]) => j >= 0).sort((a, b) => a[0] - b[0]);
const GROW = [0.3, 0.8, 1.06, 1];   // how much of its 120 px the frame has gained on each drawing of a join

/* What a join does to each rider, by the join's drawing number k (0-3): the newcomer, those behind it, those ahead (cast/riders.js). */
const M = IB.rider.MOVE, RIDE = IB.rider.POSE.ride, NEW = M.joinNew.map((r) => r[1]), BEHIND = M.joinBehind.map((r) => r[1]), AHEAD = M.joinAhead.map((r) => r[1]);   // by the join's drawing number
/* What each rider does when no join is throwing them about: the rider's own moves, placed at the frames the reference starts them on. Between joins only one or two riders act at a time. */
const ACT = {
  vents: [[0, RIDE], ...IB.play(M.lookBack, 58), ...IB.play(M.handsOff.vents, 222)],
  bun: [[0, RIDE], ...IB.play(M.sing, 104), ...IB.play(M.singOn, 172), ...IB.play(M.handsOff.bun, 224)],
  cap: [[0, RIDE], ...IB.play(M.loseCap, 232)],
  visor: [[0, RIDE], ...IB.play(M.handsOff.visor, 230)],
  curls: [[0, RIDE], ...IB.play(M.call, 62), ...IB.play(M.handsOff.curls, 224)],
};

/* The pose of rider i at frame f: a join overrides whatever the rider was doing for its first three drawings and leaves a trace on the fourth. */
function poseOf(i, f) {
  for (const [J, who] of JOINS) {
    const k = Math.floor((f - J) / 2);
    if (f >= J && k < 4 && RIDERS[i].join <= J) {
      const jolt = (who === i ? NEW : i < who ? BEHIND : AHEAD)[k];
      return k < 3 ? jolt : { ...IB.held(ACT[RIDERS[i].who], f), rise: jolt.rise, hair: jolt.hair };   // the last drawing is the rider's own acting again, still a little off the saddle
    }
  }
  return IB.held(ACT[RIDERS[i].who], f);
}
/* How much of its place rider i has taken at frame f: 0 before it joins, GROW through its four drawings, 1 after. */
const presence = (i, f) => { const J = RIDERS[i].join; return J < 0 ? 1 : f < J ? 0 : GROW[Math.min(3, Math.floor((f - J) / 2))]; };

const PROPS = (() => { const r = rng(7), out = []; let x = 300; while (x < 332 * 12 + 2200) { out.push({ x, y: 812 + r() * 70, kind: r() < 0.5 ? 'tuft' : 'stones', seed: Math.floor(r() * 900) }); x += 260 + r() * 420; } return out; })();

MG.scene({
  title: 'spot / tandem-riders-join',
  duration: 11.75, ref: [105.083, 116.833], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    IB.crop(ctx, CROP);
    const f = IB.frame(t), d2 = Math.floor(f / 2), alt2 = IB.alternate(f, 2), flow = IB.loop(f, [0, 1, -0.6]);
    // clouds drift, ground props scroll (ones)
    IB.wispCloud(ctx, [1372 - t * 3, 185], { w: 150, seed: 60 });
    IB.wispCloud(ctx, [866 - t * 3, 306], { w: 62, seed: 61 });
    for (const q of PROPS) {
      const x = q.x + 900 - t * 332;
      if (x < -80 || x > 2000) continue;
      (q.kind === 'tuft' ? IB.tuft : IB.stones)(ctx, [x, q.y], { seed: q.seed });
    }

    // the bike creeps right on ones and gains its length on twos, about its own centre
    const pres = RIDERS.map((r, i) => presence(i, f)), n = pres.reduce((a, b) => a + b, 0);
    const wb = 170 + 120 * (n - 1), cx = 1006 + 34.6 * t, rx = cx - wb / 2, fx = cx + wb / 2;
    const bbs = []; let acc = 0;
    RIDERS.forEach((r, i) => { bbs.push([rx + 62 + 120 * acc + 60 * (pres[i] - 1), AXLE - 4]); acc += pres[i]; });
    // a join kicks the tail up: the rear axle rises 50, then 27 px and dips 9 as the whole bike tips about its front tyre, by less each time as the bike gets heavier (the reference's first join lifts it about 50 px)
    let pitch = 0;
    JOINS.forEach(([J], j) => { const k = Math.floor((f - J) / 2); if (f >= J && k < 3) pitch = Math.asin([50, 27, -9][k] / (1 + j * 0.7) / wb); });
    IB.ripples(ctx, [rx, AXLE + R], { alt: alt2, seed: 70 });
    IB.ripples(ctx, [fx, AXLE + R], { alt: alt2, seed: 80 });
    ctx.save();
    ctx.translate(fx, AXLE + R); ctx.rotate(pitch); ctx.translate(-fx, -(AXLE + R));
    const on = RIDERS.map((r, i) => pres[i] > 0), crank = (d2 / 12) * PI * 2 - PI / 2;
    const built = RIDERS.map((r, i) => pres[i] >= 0.5);   // a newcomer's seat and crank are not there on the first drawing of a join: at 30% they would sit inside the rear wheel
    const bike = { rx, fx, bbs, built, crank, alt: alt2 };
    IB.tandem(ctx, bike, { axle: AXLE, layer: 'wheels' });
    IB.wheelDust(ctx, [rx, AXLE], { d: d2 });   // a puff of dust off the rear wheel: three drawings drifting back, then three without
    IB.tandem(ctx, bike, { axle: AXLE, layer: 'frame' });
    // riders, rear first so the one in front overlaps
    const capOff = f >= 240;
    RIDERS.forEach((r, i) => { if (on[i]) IB.rider(ctx, bbs[i], poseOf(i, f), { look: r, crank, alt: flow, seed: 200 + i * 150, bare: r.who === 'cap' && capOff }); });
    // the cap that blows off: up and back on twos, turning as it goes
    if (capOff) {
      const u = Math.min(1, (d2 * 2 - 240) / 36), x0 = bbs[2][0] - 20, x = lerp(x0, x0 - 330, u), y = AXLE - 262 - 150 * Math.sin(u * 2.2) + 30 * u;
      IB.flyingCap(ctx, [x, y], { rot: -u * 6.5 });
    }
    ctx.restore();
  },
});
</script>
