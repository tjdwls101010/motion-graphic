<!doctype html>
<meta charset="utf-8">
<title>ui / model-config-braces</title>
<link rel="stylesheet" href="../../kit/base.css">
<link rel="stylesheet" href="../../kit/ui.css">
<script src="../../kit/motion.js"></script>
<script src="../../kit/stage.js"></script>
<script src="../../kit/ui.js"></script>
<style>
  .cfg { padding: 26px 0 0 96px; font: 600 39px/64px 'JetBrains Mono', monospace; color: #2f2f2f; white-space: pre; }
  .cfg div { height: 64px; }
  .model { display: flex; align-items: center; gap: 26px; padding: 34px 38px; }
  .model .logo { width: 86px; height: 86px; border-radius: 20px; background: #2a2a2a; color: #fff; display: grid; place-items: center; font: 800 44px 'JetBrains Mono', monospace; flex: none; }
  .model .logo.warm { background: #fff; color: #d9663c; border: 3px solid #2a2a2a; border-radius: 50%; }
  .model b { display: block; font: 800 46px/1.15 Pretendard; }
  .model code { display: block; font: 500 20px 'JetBrains Mono', monospace; color: #a8a8a8; margin: 4px 0 10px; }
  .model small { display: block; font: 600 22px Pretendard; color: #666; }
</style>
<script>
/* A config file is read aloud. The browser window snaps in close on the text, the lines that belong together get a lavender highlighter, a brace gathers them and a chip names the group ("Grok"); a second group gets its own brace and chip ("Claude Opus 5.5"). Then the document steps aside (the window narrows) and the two chips become full cards with an arrow carrying a "hard work" token from one to the other. Idea carried: turn a wall of config into "these go to A, these go to B, and the hard ones are handed over".
   Motion notes: highlighter bars sweep left to right, one line after another (0.14 s apart, 0.35 s each); the brace is drawn top to bottom in 0.3 s only after the last bar lands, and the chip pops (outBack, 0.3 s) from the brace's point 0.15 s later, so the eye goes lines -> brace -> name; the second group waits ~3 s while the first is discussed; when the window narrows its text keeps its size and is simply cropped; the token on the arrow travels with inOutCubic and the arrow line draws first. */
const { prog, lerp, el } = MG;
const LINES = [
  '---',
  '# pstack model configuration. One line per role. Delete a line to fall back to the',
  '# `inherit-parent` or `auto` as a value: the role runs on the parent chat model',
  '# budget: large (xhigh)',
  'feature, refactoring: grok-4.7-xhigh-fast',
  'bug-fix: grok-4.7-xhigh-fast',
  'perf-issue: grok-4.7-xhigh-fast',
  'hillclimb: grok-4.7-xhigh-fast',
  'judgment and prose: claude-opus-5-5-xhigh',
  'hardest tasks: claude-opus-5-5-xhigh',
  'how explorer: grok-4.7-xhigh-fast',
  'how explainer: claude-opus-5-5-xhigh',
  'why investigators: grok-4.7-xhigh-fast',
];
const GROUPS = [
  { rows: [4, 5, 6, 7], hl: 1.3, brace: 2.3, x: 1165, name: 'Grok', dark: true },
  { rows: [8, 9], hl: 5.4, brace: 7.7, x: 1165, name: 'Claude Opus 5.5', dark: false },
];
const TOP = 60 + 54 + 26;          // window top + title bar + padding = y of line 0
const rowY = (i) => TOP + i * 64;
const bracePath = (x, y1, y2) => { const m = (y1 + y2) / 2; return `M${x} ${y1}q16 0 16 16V${m - 16}q0 16 16 16q-16 0-16 16V${y2 - 16}q0 16-16 16`; };
MG.scene({
  title: 'ui / model-config-braces',
  duration: 16, ref: [380.4, 396.4],
  setup(stage) {
    const root = UI.root(stage);
    const win = UI.window(root, 75, 60, 1770, 810, 'github.com/…/plugins/…/setup-pstack/SKILL.md');
    const spans = LINES.map((txt) => el('span', { class: 'hl', text: txt }));
    win.body.append(el('div', { class: 'cfg' }, ...spans.map((s) => el('div', {}, s))));
    const svg = MG.svg('svg', { width: 1920, height: 1080, style: { position: 'absolute', left: 0, top: 0 } });
    root.append(svg);
    const groups = GROUPS.map((g) => {
      const y1 = rowY(g.rows[0]) + 6, y2 = rowY(g.rows[g.rows.length - 1]) + 58;
      const brace = MG.svg('path', { d: bracePath(g.x, y1, y2), pathLength: 1, fill: 'none', stroke: '#2a2a2a', 'stroke-width': 4, 'stroke-linecap': 'round' });
      svg.append(brace);
      const chip = el('span', { class: 'chip ' + (g.dark ? 'dark' : ''), style: { position: 'absolute', left: g.x + 50 + 'px', top: (y1 + y2) / 2 - 36 + 'px', height: '72px', fontSize: '36px', transformOrigin: '0 50%' } }, g.dark ? null : UI.icon('spark', 28), g.name);
      root.append(chip);
      return { brace, chip };
    });
    const card = (y, logo, warm, name, id, roles) => UI.card(root, 1165, y, 685, 200, el('div', { class: 'model' }, el('div', { class: 'logo' + (warm ? ' warm' : '') }, logo), el('div', {}, el('b', { text: name }), el('code', { text: id }), el('small', { text: roles }))));
    const cardA = card(155, 'G', false, 'Grok', 'grok-4.7-xhigh-fast', 'feature · bug-fix · perf · hillclimb');
    const cardB = card(545, UI.icon('spark', 46), true, 'Claude Opus 5.5', 'claude-opus-5-5-xhigh', 'judgment · prose · hardest tasks');
    [cardA, cardB].forEach((c) => { c.style.padding = '0'; });
    const link = MG.svg('path', { d: 'M1507 360V530', pathLength: 1, fill: 'none', stroke: '#2a2a2a', 'stroke-width': 4 });
    const tip = MG.svg('path', { d: 'M1493 512l14 20 14-20z', fill: '#2a2a2a' });
    svg.append(link, tip);
    const token = el('span', { class: 'chip lav sm', style: { position: 'absolute', left: '1540px', top: '0', height: '50px', fontSize: '25px' }, text: '어려운 일' });
    root.append(token);
    return { win, spans, groups, cardA, cardB, link, tip, token };
  },
  render(t, r) {
    // window arrives out of a blur, as if the camera cut in from a wider page
    const inP = prog(t, 0, 0.5, 'outCubic');
    const narrow = prog(t, 9.4, 0.7, 'inOutCubic');
    r.win.el.style.opacity = inP;
    r.win.el.style.filter = `blur(${(1 - inP) * 10}px)`;
    r.win.el.style.transform = `scale(${lerp(0.86, 1, inP)})`;
    r.win.el.style.width = lerp(1770, 1040, narrow) + 'px';
    r.win.el.style.top = lerp(60, 120, narrow) + 'px';
    r.win.el.style.height = lerp(810, 690, narrow) + 'px';
    GROUPS.forEach((g, gi) => {
      g.rows.forEach((row, k) => UI.hl(r.spans[row], prog(t, g.hl + k * 0.14, 0.35, 'outCubic')));
      const out = 1 - prog(t, 9.3, 0.3);
      MG.draw(r.groups[gi].brace, prog(t, g.brace, 0.3));
      r.groups[gi].brace.style.opacity = out;
      MG.show(r.groups[gi].chip, prog(t, g.brace + 0.2, 0.3, 'outBack') * out, { scale: 0.5 });
    });
    // chips grow up into cards on the right
    MG.show(r.cardA, prog(t, 9.9, 0.45, 'outBack'), { scale: 0.9 });
    MG.show(r.cardB, prog(t, 10.1, 0.45, 'outBack'), { scale: 0.9 });
    // hand-over: line first, then the token rides it
    MG.draw(r.link, prog(t, 12.5, 0.35));
    r.tip.style.opacity = prog(t, 12.8, 0.1);
    const ride = prog(t, 13.0, 0.9, 'inOutCubic');
    r.token.style.top = lerp(385, 462, ride) + 'px';
    MG.show(r.token, prog(t, 12.8, 0.3, 'outBack'), { scale: 0.5 });
  },
});
</script>
