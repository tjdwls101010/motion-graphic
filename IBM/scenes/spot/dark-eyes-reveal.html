<script>
/* 검은 화면에 초록 눈 한 쌍이 떠서 좌우를 살피고 깜빡이다가, 눈이 작아지는 순간 밝은 화면으로 컷하면 그 눈은 건물 창가에서 쌍안경을 든 사람이었다. 옆 창의 고양이는 그 사람을 지켜보다 창턱 아래로 사라지더니 자기 쌍안경을 들고 올라와 같이 내다보고, 둘이 동시에 쌍안경을 내린다. 원본은 왼쪽에 카피가 있는 화면이고, 여기서는 문구를 빼고 그림 영역만 잘라 화면에 채웠다. 전달하는 생각: 누군가는 이미 지켜보고 있다.
   Motion notes: shows the reference frame's region x 700-1920, y 180-866 (CROP) enlarged 1.57x; coordinates in the code are the reference's. The only black (#000) shot in the set, 3.29 s (79 frames). Eyes are 283 x 124 almonds 468 px apart; only the irises move, two frames a drawing, and a look is a jump held 0.4-0.5 s: centre, 85 px left, up 27 px, down-right (46, 26). A blink is one 2-frame hold of total black, with one half-open 2-frame pose after the first.
   The reveal is a match cut on a zoom, and both halves of the zoom are drawings, not a camera move: over the last five black drawings the pair shrinks to 0.98, 0.9, 0.8, 0.65, 0.46 toward (1193, 438); hard cut; the first lit drawing is a 3.79x close-up with her two lenses exactly where the eyes were, and the pull-back steps every two frames through 1.92, 1.32, 1.15, 1.06, 1.016 and 0.992 (it passes its rest by 1%) to 1 at frame 93 (CAM, measured on the reference). This is the exception to "camera on ones": the reference redraws this pull-back on twos. The reference's copy (white on the black, gaining a third line at the cut, swapped at 6.33 s) is not drawn here.
   After the cut two small actors share the frame; both are tables of [frame, drawing] at 24 fps held until the next key (WATCH, CAT), nothing interpolated. Shapes are traced from 4x crops of the reference with a 20 px grid, and the key frames are the frames where the reference changes its drawing.
   Watcher: through each lens we see her eye (a white almond with a green iris), so a look is the eye shifting 3-6 px inside the lens while hands and binoculars swing 25-30 px over 3-4 drawings and the head follows at 0.55 of that. She scans right at 4.1 s; left and 14 px up at 5.1 s, where the binoculars turn enough to show the right barrel's side; adjusts for three drawings at 6.25 s; swings back blind (black lenses, one drawing) at 7.6 s and finds it with the binoculars low; then at 7.8 s lifts them 17 px and her eyes are wide and green, the eyes of the black opening, held 1.5 s with one four-frame blink. The binoculars come down from 9.4 s in five drawings: a dip back to rest height, half-way with the barrels foreshortened, 6 px past, 2 px back, rest; then one slow blink and half-lidded eyes to the end.
   Cat: sits side-on and turns its head one beat BEFORE she turns hers (4.9 s over its shoulder, she swings at 5.1 s; 6.0 s nose up, she adjusts at 6.25 s), ears flicking in between; crouches and slinks off the sill in four drawings from 6.8 s (crouch, stretched body, rump and tail, tail tip) and is gone for 1.4 s. At 8.5 s two ear tips rise over the sill, then the head with binoculars resting on the sill, then the binoculars at its eyes: black lenses for one drawing, yellow slit eyes after. Its tail swishes through four drawings while it watches (the reference redraws the tail on almost every second frame to the end; here it steps every 2 frames while it watches and every 4 after). It lowers them one drawing behind her, each of its drawings landing on the same frame as one of hers, and sits with them at its paws.
   The plant is the one thing that never holds: every leaf tips a little on each drawing, through three drawings on twos. Last second: a flyer (the neutral stand-in for the reference's mascot insect) hovers at the plant's bud, leaves the window to the right, turns over the wall and comes back toward the lens, growing from 7 to 44 px over eight drawings, wings flipping with each drawing; the reference cuts from that to the end card, where the same insect crosses the frame. The cat looks up at it once, at 10.8 s, and follows it out. */
const { lerp, rng } = MG;
const C = IB.C, GREEN = '#4ca757', SKIRT = '#7cc47a';
const CROP = [700, 180, 1220, 686];   // the region of the reference frame this scene shows, enlarged 1.57x: the copy on the left is left out
const CUT = 79, FOCUS = [1193, 438];   // the first lit frame of the reference is frame 79 of this scene (3.29 s), read off its decoded frames
/* The pull-back after the cut, one drawing every two frames: [frame, zoom, x, y] where (x, y) is where the point between her lenses lands in the frame. Measured on the reference from the width of her sleeves across the window; the first drawing puts the lenses on the eyes of the last black one (1150 and 1366, y 485). */
const CAM = [[79, 3.79, 1257, 488], [81, 1.92, 1223, 486], [83, 1.32, 1213, 474], [85, 1.15, 1206, 467], [87, 1.06, 1206, 464], [89, 1.016, 1206, 463], [91, 0.992, 1205, 463], [93, 1, 1206, 462]];

// irises: [from frame (24 fps; two frames a drawing, on the frames where the reference changes its drawing), dx, dy, lid] held until the next entry; lid 0 = shut, 0.8 = half, 1 = open
const LOOK = [[0, 0, 0, 1], [8, -5, 0, 1], [10, -75, 0, 1], [12, -85, 0, 1], [24, 0, 0, 0], [26, -85, 4, 0.8], [28, -85, 0, 1], [37, 0, 0, 0], [39, 4, -11, 1], [41, 9, -27, 1], [53, 15, -18, 1], [55, 41, 19, 1], [57, 46, 26, 1]];
const ZOOM = [[69, 0.98], [71, 0.9], [73, 0.8], [75, 0.65], [77, 0.46]];
/* IB.held(keys, f) — the [frame, drawing] key on screen at frame f: the last one at or before it. */

function eye(ctx, cx, cy, s, dx, dy, lid) {
  ctx.save();
  ctx.translate(cx, cy + dy * 0.3 * s);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(-142, 6);
  ctx.quadraticCurveTo(-20, -134 * (2.5 * lid - 1.5), 142, 10);
  ctx.quadraticCurveTo(10, 118, -142, 6);
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(dx - 2, dy, 58, 0, 7); ctx.fill();
  ctx.strokeStyle = GREEN; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.arc(dx - 2, dy, 44, 0, 7); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(dx + 16, dy - 14, 7, 0, 7); ctx.fill();
  ctx.restore();
}

function windowFrame(ctx, x, seed) {
  IB.box(ctx, x, 283, 280, 507, { fill: C.paper, w: 2.8, seed });
  IB.box(ctx, x + 15, 297, 250, 478, { fill: C.paper, w: 2.5, seed: seed + 1 });
  IB.box(ctx, x + 15, 297, 250, 71, { fill: '#e9e9e9', w: 2.5, seed: seed + 2 });      // the upper pane is a drawn blind: flat grey
}
function sashAndSill(ctx, x, seed) {
  IB.box(ctx, x + 15, 520, 250, 15, { fill: C.paper, w: 2.5, seed: seed + 3 });        // the lower sash rail passes in front of whoever is inside
  IB.box(ctx, x + 15, 750, 250, 25, { fill: C.paper, w: 2.5, seed: seed + 4 });
  IB.box(ctx, x - 6, 791, 294, 55, { fill: C.paper, w: 2.8, seed: seed + 5 });
  IB.smear(ctx, x + 140, 848, 270, { h: 5, seed: seed + 6 });
}

/* ---------- the watcher ---------- */
/* Her drawings. arms 'up': hx, hy shift hands and binoculars and carry the head with them at 0.55 of that; a large negative hx also turns the binoculars, so the right barrel shows its side; big enlarges the lenses; eye is where her eye sits inside each lens (px off its centre); lens is what shows in the glass: 'eye' (white almond, green iris), 'dark' (a blink), 'squint' (an arc), 'wide' (round, the green ring of the opening). arms 'down': drop lowers hands and binoculars (px), fore 0..1 foreshortens the barrels (1 = full length), face is 'wide' | 'half' | 'closed'. */
const UP = { arms: 'up', hx: 0, hy: 0, eye: [0, 3], lens: 'eye', big: 1 };
const up = (o) => ({ ...UP, ...o });
const WATCH = [
  [0, UP],
  // scans right: the head leads, the eye arrives last
  [99, up({ hx: 8, eye: [2, 2] })], [101, up({ hx: 17, eye: [4, 1] })], [103, up({ hx: 24, eye: [5, 0] })], [105, up({ hx: 25, eye: [6, 0] })],
  // swings left and up, through a blink
  [122, up({ hx: 12, eye: [2, 0] })], [124, up({ hx: -4, hy: -5, lens: 'dark' })], [126, up({ hx: -18, hy: -10, eye: [-4, 0] })], [128, up({ hx: -29, hy: -15, eye: [-6, -1] })], [130, up({ hx: -27, hy: -14, eye: [-5, 0] })],
  [140, up({ hx: -27, hy: -14, eye: [-3, 1] })], [144, up({ hx: -27, hy: -14, lens: 'dark' })], [146, up({ hx: -27, hy: -14, eye: [-6, 1] })],
  [150, up({ hx: -27, hy: -14, eye: [-5, 1] })], [152, up({ hx: -28, hy: -12, eye: [-6, 1] })], [154, up({ hx: -30, hy: -10, eye: [-6, 1] })],
  // swings back blind, finds it low, then lifts the binoculars and her eyes are wide and green: the eyes of the opening
  [182, up({ hx: -6, hy: 2, lens: 'dark' })], [184, up({ hy: 2, eye: [-1, 3] })], [186, up({ hy: 1, eye: [1, 3] })],
  [188, up({ hy: -15, lens: 'wide', big: 1.1 })],
  [215, up({ hy: -15, lens: 'dark', big: 1.1 })], [219, up({ hy: -15, lens: 'wide', big: 1.1 })],
  // down they come: a dip first, then half-way, past, back, rest
  [225, up({ hy: 1, lens: 'wide' })],
  [227, { arms: 'down', drop: -40, fore: 0.45, face: 'wide' }], [229, { arms: 'down', drop: 6, fore: 1, face: 'wide' }], [231, { arms: 'down', drop: -2, fore: 1, face: 'wide' }], [233, { arms: 'down', drop: 0, fore: 1, face: 'wide' }],
  [242, { arms: 'down', drop: 0, fore: 1, face: 'half' }], [244, { arms: 'down', drop: 0, fore: 1, face: 'closed' }], [248, { arms: 'down', drop: 0, fore: 1, face: 'half' }],
];
const SKIN = C.skin[0], HX = 1206;   // the axis her face is symmetric about

/* One barrel of her binoculars seen head-on: black rim, white ring, dark glass, and in the glass whatever `kind` says. */
function lens(ctx, x, y, r, kind, eye, seed) {
  IB.oval(ctx, x, y, r, r, { fill: C.ink, w: 2.2, seed, n: 16 });
  IB.oval(ctx, x, y, r * 0.86, r * 0.86, { fill: C.paper, w: 0, n: 16 });
  IB.oval(ctx, x, y, r * 0.74, r * 0.74, { fill: C.ink, w: 0, n: 14 });
  const ex = x + eye[0], ey = y + eye[1];
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r * 0.74, 0, 7); ctx.clip();   // her eye is behind the glass: it cannot spill onto the rim
  if (kind === 'eye') {
    IB.ink(ctx, [[ex - 9, ey + 1], [ex - 3, ey - 4], [ex + 4, ey - 4], [ex + 9, ey + 1], [ex + 3, ey + 3.5], [ex - 4, ey + 3.5]], { closed: true, fill: C.paper, w: 0, wob: 0 });
    IB.oval(ctx, ex + eye[0] * 0.3, ey + 2.5, 3.6, 3.6, { fill: GREEN, w: 0, n: 8 });
    IB.oval(ctx, ex + eye[0] * 0.3, ey + 2.5, 1.7, 1.7, { fill: C.ink, w: 0, n: 6 });
  } else if (kind === 'squint') IB.ink(ctx, [[ex - 8, ey + 1], [ex, ey - 4], [ex + 8, ey + 1]], { w: 3, color: C.paper, seed: seed + 1, grain: 0 });
  else if (kind === 'wide') {
    IB.ink(ctx, [[ex - 10, ey], [ex - 4, ey - 6], [ex + 4, ey - 6], [ex + 10, ey], [ex + 4, ey + 6], [ex - 4, ey + 6]], { closed: true, fill: C.paper, w: 0, wob: 0 });
    IB.oval(ctx, ex, ey, 5.4, 5.4, { fill: GREEN, w: 0, n: 10 });
    IB.oval(ctx, ex, ey, 3.6, 3.6, { fill: C.paper, w: 0, n: 8 });
    IB.oval(ctx, ex, ey, 2.2, 2.2, { fill: C.ink, w: 0, n: 8 });
  }
  ctx.restore();
}

function watcher(ctx, f) {
  const p = IB.held(WATCH, f), isUp = p.arms === 'up', hx = isUp ? p.hx : 0, hy = isUp ? p.hy : 0;
  const mir = (pts) => pts.map(([x, y]) => [2 * HX - x, y]), H = (pts, k = 0.55) => pts.map(([x, y]) => [x + hx * k, y + hy * k]);
  ctx.save();
  ctx.beginPath(); ctx.rect(1083, 368, 250, 407); ctx.clip();   // she is inside the window: sleeves that reach its edges end there

  // ---- below the rail: skirt, sweater, and when the arms are down the arms, hands and binoculars
  IB.box(ctx, 1146, 683, 120, 68, { fill: SKIRT, w: 2.5, seed: 300 });
  if (isUp) {
    // sleeves run straight out to the window's edges while the arms are up
    IB.ink(ctx, [[1080, 534], [1334, 534], [1334, 575], [1300, 568], [1268, 560], [1274, 684], [1136, 684], [1143, 560], [1112, 568], [1080, 575]], { closed: true, smooth: false, fill: C.mint, w: 2.5, seed: 301 });
    IB.seg(ctx, 1120, 553, 1139, 536, { w: 2.2, seed: 302 });
    IB.seg(ctx, 1273, 536, 1293, 550, { w: 2.2, seed: 303 });
  } else {
    const d = p.drop, k = p.fore;
    IB.ink(ctx, [[1128, 534], [1282, 534], [1274, 684], [1134, 684]], { closed: true, smooth: false, fill: C.mint, w: 2.5, seed: 301 });
    // each arm: shoulder, out past the window's edge at the elbow, forearm back in to the cuff
    const armL = [[1128, 532], [1104, 572], [1088, 610 + d * 0.4], [1078, 640 + d * 0.7], [1080, 662 + d * 0.8], [1150, 642 + d], [1142, 616 + d], [1140, 560]];
    for (const [arm, sd] of [[armL, 330], [mir(armL).map(([x, y]) => [x + 6, y + 2]), 340]]) {
      IB.ink(ctx, arm, { closed: true, fill: C.mint, w: 0, seed: sd });
      IB.ink(ctx, arm.slice(0, 7), { w: 2.5, seed: sd });
      IB.ink(ctx, [arm[7], [arm[7][0], arm[7][1] + 52 + d * 0.6]], { w: 2.3, smooth: false, seed: sd + 1 });          // where the arm lies against the body
      const s = arm === armL ? 1 : -1;
      IB.ink(ctx, [[arm[6][0] - 42 * s, arm[6][1] + 12], arm[6]], { w: 2.3, smooth: false, seed: sd + 2 });            // top of the forearm
      IB.seg(ctx, arm[6][0] - 20 * s, arm[6][1] + 16, arm[6][0] - 12 * s, arm[6][1] + 31, { w: 2, seed: sd + 3 });     // a fold above the cuff
    }
    // binoculars held low, lenses toward the floor: two white barrels and the black of the glass seen from below
    const by = 640 + d, top = by - 72 * k;
    for (const [s, sd] of [[-1, 350], [1, 355]]) {
      const cx = 1201 + s * 20;
      IB.ink(ctx, [[cx - s * 2 - 12, top + 9], [cx - s * 2 - 6, top], [cx - s * 2 + 6, top], [cx - s * 2 + 12, top + 9], [cx + 18, by - 2], [cx - 18, by - 2]], { closed: true, fill: C.paper, w: 2.2, seed: sd });
      if (k > 0.8) IB.ink(ctx, [[cx - 15, by - 28], [cx, by - 24], [cx + 15, by - 28]], { w: 1.7, seed: sd + 1 });
      IB.oval(ctx, cx, by, 20, 12 + 3 * (1 - k), { fill: C.paper, w: 2.2, seed: sd + 2, n: 14 });
      IB.oval(ctx, cx, by, 14.5, 8 + 3 * (1 - k), { fill: C.ink, w: 0, n: 12 });
    }
    // hands: each a mitt gripping a barrel from the side, two finger lines across it
    const handL = [[1142, 617 + d], [1157, 597 + d], [1174, 594 + d], [1181, 607 + d], [1168, 617 + d], [1165, 629 + d], [1151, 641 + d]];
    for (const [hand, s, sd] of [[handL, 1, 360], [mir(handL).map(([x, y]) => [x + 6, y + 2]), -1, 365]]) {
      IB.ink(ctx, hand, { closed: true, fill: SKIN, w: 2.2, seed: sd });
      const o = hand[3];
      IB.seg(ctx, o[0] - 16 * s, o[1] + 1, o[0] - 2 * s, o[1] - 2, { w: 1.5, seed: sd + 1 });
      IB.seg(ctx, o[0] - 15 * s, o[1] + 8, o[0] - 6 * s, o[1] + 6, { w: 1.5, seed: sd + 2 });
    }
  }

  // ---- above the rail: hair, face, neck and shoulders, and when the arms are up the hands and binoculars
  const hair = []; for (let i = 0; i < 32; i++) { const a = (i / 32) * Math.PI * 2; hair.push([HX - 1 + hx * 0.3 + Math.cos(a) * 87 * (i % 2 ? 1 : 0.92), 447 + hy * 0.3 + Math.sin(a) * (isUp ? 59 : 61) * (i % 2 ? 1 : 0.92)]); }
  IB.ink(ctx, hair, { closed: true, fill: C.ink, w: 2, seed: 304 });
  // turtleneck and shoulders go on before the face: her chin sits in front of the collar
  IB.ink(ctx, isUp ? [[1150, 520], [1163, 508], [1187, 503], [1189, 486], [1222, 486], [1224, 503], [1248, 508], [1260, 520]] : [[1146, 520], [1160, 510], [1187, 506], [1189, 484], [1222, 484], [1224, 506], [1250, 510], [1264, 520]], { closed: true, fill: C.mint, w: 2.4, seed: 318 });
  IB.seg(ctx, 1188, 502, 1223, 502, { w: 1.8, seed: 319 });
  IB.ink(ctx, H([[1177, 442], [1181, 424], [1191, 414], [1198, 412], [1204, 418], [1213, 412], [1225, 416], [1233, 428], [1235, 446], [1231, 469], [1219, 486], [1205, 491], [1191, 486], [1181, 469]]), { closed: true, fill: SKIN, w: 2.2, seed: 305 });
  for (const s of [-1, 1]) IB.ink(ctx, H([[HX + s * 25, 434], [HX + s * 18, 430], [HX + s * 12, 432]]), { w: 2, seed: 306 + s });                     // brows
  IB.seg(ctx, 1200 + hx * 0.7, 475 + hy * 0.55, 1209 + hx * 0.7, 475 + hy * 0.55, { w: 2, seed: 309 });                                                              // mouth
  if (!isUp) {
    for (const [x, y, r] of [[1175, 466, 7], [1237, 462, 8]]) IB.oval(ctx, x, y, r, r + 3, { fill: C.ink, w: 0, n: 8 });                             // curls lying on the cheeks
    IB.ink(ctx, [[1199, 444], [1200, 460], [1207, 461]], { w: 2, seed: 310 });                                                                        // nose
    for (const s of [-1, 1]) {
      const x = HX + s * 14, y = 443;
      if (p.face === 'wide') { IB.oval(ctx, x, y, 6.2, 3.8, { fill: C.paper, w: 1.6, seed: 311 + s, n: 10 }); IB.oval(ctx, x, y, 2, 2, { fill: C.ink, w: 0, n: 6 }); }
      else if (p.face === 'half') { IB.seg(ctx, x - 6, y, x + 6, y, { w: 2.6, seed: 311 + s }); IB.ink(ctx, [[x - 4, y + 3], [x, y + 4], [x + 4, y + 3]], { w: 1.2, seed: 313 + s }); }
      else IB.ink(ctx, [[x - 6, y], [x, y + 2], [x + 6, y]], { w: 1.8, seed: 311 + s });
    }
  }
  // with the arms up: a forearm and hand each side of the face, rising from the cuffs to the barrels
  if (isUp) {
    const handL = [[1140 + hx * 0.3, 502], [1149 + hx * 0.6, 470 + hy], [1158 + hx, 450 + hy], [1166 + hx, 441 + hy], [1178 + hx, 442 + hy], [1183 + hx, 474 + hy], [1172 + hx * 0.4, 502]];
    const handR = mir([[1140 - hx * 0.3, 502], [1149 - hx * 0.6, 470 + hy], [1158 - hx, 450 + hy], [1166 - hx, 441 + hy], [1178 - hx, 442 + hy], [1183 - hx, 474 + hy], [1172 - hx * 0.4, 502]]);
    IB.ink(ctx, handL, { closed: true, fill: SKIN, w: 2.2, seed: 316 });
    IB.ink(ctx, handR, { closed: true, fill: SKIN, w: 2.2, seed: 317 });
  }
  for (const s of [-1, 1]) for (let i = 0; i < 4; i++) IB.oval(ctx, HX + s * (26 - i * 3.2), 501 + i * 5, 3.1, 3.1, { fill: C.paper, w: 1.5, seed: 320 + i + s, n: 6 });   // necklace, a strand each side of the collar
  if (isUp) {
    for (const s of [-1, 1]) { IB.ink(ctx, [[HX + s * 108, 520], [HX + s * 69, 494], [HX + s * 46, 520]], { closed: true, smooth: false, fill: C.mint, w: 2.4, seed: 326 + s }); IB.seg(ctx, HX + s * 82, 509, HX + s * 74, 519, { w: 2, seed: 328 + s }); }
    // the cuffs of both sleeves stand above the rail as two peaks; then the binoculars: the barrel on the side she turns toward is nearer and so larger
    const turn = hx / 27, gap = 29 - Math.abs(hx) * 0.18, y = 462 + hy, cx = HX + hx, R = 21 * p.big, away = -Math.sign(hx);
    if (turn < -0.5) {   // turned left: the right barrel shows its length, two rings round it (turned right, the reference shows no more than a wider rim)
      const bx = cx + away * gap, len = 15 * Math.abs(turn);
      IB.ink(ctx, [[bx, y - R * 0.95], [bx + away * (len + R * 0.5), y - R * 0.8], [bx + away * (len + R * 0.75), y], [bx + away * (len + R * 0.5), y + R * 0.8], [bx, y + R * 0.95]], { closed: true, fill: C.paper, w: 2, seed: 330 });
      for (const k of [0.45, 0.8]) IB.ink(ctx, [[bx + away * (R * 0.6 + len * k), y - R * 0.82], [bx + away * (R * 0.78 + len * k), y], [bx + away * (R * 0.6 + len * k), y + R * 0.82]], { w: 1.6, seed: 338 + k * 10 });
    }
    IB.tube(ctx, [[cx - 14, y - 12], [cx, y - 19], [cx + 14, y - 12]], { w: 7, edge: 1.8, fill: C.paper, smooth: true, seed: 331 });
    IB.ink(ctx, [[cx - 4 - hx * 0.3, y - 14], [cx - 4 - hx * 0.3, y + 2 - hy * 0.4], [cx + 4 - hx * 0.3, y + 2 - hy * 0.4], [cx + 4 - hx * 0.3, y - 14]], { w: 1.8, smooth: false, seed: 332 });   // her nose between the barrels
    lens(ctx, cx - gap, y, R * (1 - turn * 0.06), p.lens, p.eye, 333);
    lens(ctx, cx + gap, y, R * (1 + turn * 0.06), p.lens, p.eye, 334);
    IB.oval(ctx, cx, y - 19, 4.6, 4.6, { fill: C.paper, w: 1.7, seed: 335, n: 8 });
    for (const s of [-1, 1]) for (const dy of [-4, 4]) IB.seg(ctx, cx + s * (gap + R * 0.86), y + dy, cx + s * (gap + R * 0.43), y + dy + 2, { w: 1.5, seed: 336 + s + dy });   // fingertips over the rims
  }
  ctx.restore();
}

function room(ctx, f) {
  // the far corner, a shelf unit on the right wall, a framed picture on the left
  IB.seg(ctx, 1485, 368, 1662, 368, { w: 2.4, seed: 400 });
  IB.seg(ctx, 1662, 368, 1734, 330, { w: 2.4, seed: 401 });
  IB.seg(ctx, 1661, 368, 1661, 666, { w: 1.8, seed: 402 });

  IB.ink(ctx, [[1514, 540], [1546, 590], [1532, 612], [1518, 590]], { closed: true, fill: C.paper, w: 2.2, seed: 414 });
  for (let i = 0; i < 5; i++) IB.seg(ctx, 1490, 560 + i * 10, 1506, 562 + i * 10, { w: 1.8, seed: 415 + i });
  // pendant lamp: ceiling rose, cord, a lens-shaped shade with a line across its widest point
  IB.oval(ctx, 1564, 322, 21, 7, { fill: '#e9e9e9', w: 2.4, seed: 420, n: 12 });
  IB.seg(ctx, 1564, 329, 1564, 392, { w: 2.2, seed: 421 });
  IB.ink(ctx, [[1506, 424], [1530, 400], [1564, 392], [1598, 400], [1622, 424], [1598, 448], [1564, 456], [1530, 448]], { closed: true, fill: C.paper, w: 2.6, seed: 422 });
  IB.seg(ctx, 1508, 424, 1620, 424, { w: 2.2, seed: 423 });
  IB.shade(ctx, 1532, 400, 44, 12, { from: 'top', seed: 424, alpha: 0.16 });

/* ---------- the cat ---------- */
/* Its drawings. kind 'sit': side-on on the sill, head turned by `turn` (-1 profile left ... 1 back over its shoulder) and tipped by `tilt` (rad, - = nose up), ears [left, right] px lowered. 'crouch', 'slink', 'rump', 'tip': leaving. 'none': gone. 'ears', 'peek', 'watch', 'lower', 'rest': front-on behind the sill with its own binoculars; glass 'black' | 'slit' is what shows in them, dip lowers them (px), tail 0-3 is which swish drawing, face 'dot' | 'happy' | 'up' | 'side'. */
const sit = (o) => ({ kind: 'sit', turn: -0.3, tilt: -0.15, ears: [0, 0], ...o });
const watch = (o) => ({ kind: 'watch', glass: 'slit', tail: 0, dip: 0, ...o });
const rest = (o) => ({ kind: 'rest', face: 'dot', tail: 0, ...o });
const CAT = [
  [0, sit({})],
  [108, sit({ ears: [5, 0] })], [110, sit({})],
  // it looks back over its shoulder a beat before she swings left: in the reference the cat moves first
  [117, sit({ turn: 0.2, tilt: 0 })], [119, sit({ turn: 0.8, tilt: 0.05 })],
  [135, sit({ turn: 0.8, tilt: 0.05, ears: [0, 5] })], [137, sit({ turn: 0.8, tilt: 0.05 })],
  [145, sit({ turn: 0, tilt: 0 })], [147, sit({ turn: -1, tilt: -0.3 })],
  [156, sit({ turn: -1, tilt: -0.38, ears: [4, 4] })], [158, sit({ turn: -1, tilt: -0.3 })],
  // off the sill and away, a drawing every two frames
  [163, { kind: 'crouch' }], [165, { kind: 'slink' }], [167, { kind: 'rump' }], [169, { kind: 'tip' }], [171, { kind: 'none' }],
  // back, with binoculars
  [204, { kind: 'ears' }], [206, { kind: 'peek', tail: 1 }], [208, watch({ glass: 'black', tail: 2 })],
  ...[210, 218].flatMap((f) => [[f, watch({ tail: 1 })], [f + 2, watch({ tail: 2 })], [f + 4, watch({ tail: 3 })], [f + 6, watch({ tail: 2 })]]),
  [226, watch({ tail: 1 })],
  // lowers them one drawing behind her
  [227, watch({ tail: 2, dip: 5 })], [229, { kind: 'lower', tail: 3 }], [231, rest({ face: 'happy', tail: 2, sat: false })], [233, rest({ face: 'happy', tail: 1 })],
  [236, rest({ tail: 2 })], [240, rest({ tail: 3 })], [244, rest({ tail: 2 })], [248, rest({ tail: 1 })], [252, rest({ tail: 2 })], [256, rest({ tail: 3 })],
  // something is at the flowers: one look up, then it follows it out
  [259, rest({ face: 'up', tail: 2 })], [261, rest({ face: 'side', tail: 1 })], [265, rest({ face: 'side', tail: 2 })], [269, rest({ face: 'side', tail: 3 })], [273, rest({ face: 'side', tail: 2 })],
];
const CX = 1539;   // the cat's centre line once it faces us

/* Head, in px about its centre. turn slides the face across the skull; a head in profile gets a muzzle bump on that side. */
function catHead(ctx, x, y, o) {
  const { turn = 0, tilt = 0, ears = [0, 0], face = 'dot', seed = 430 } = o;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  const m = Math.abs(turn) > 0.6 ? Math.sign(turn) : 0;
  IB.ink(ctx, [[-17, -1], [-18.5, -16 + ears[0]], [-10, -9], [0, -10.5], [10, -9], [18.5, -16 + ears[1]], [17, -1], [16 + m * 2.5, 7], [8 + m * 4, 13], [-8 + m * 4, 13], [-16 + m * 2.5, 7]], { closed: true, fill: C.paper, w: 2.2, seed });
  const fx = turn * 7, dot = (dx, dy) => IB.oval(ctx, fx + dx, dy, 1.9, 1.9, { fill: C.ink, w: 0, n: 6 });
  if (face === 'happy') for (const s of [-1, 1]) IB.ink(ctx, [[fx + s * 9, -2], [fx + s * 5, 0.5], [fx + s * 9, 3]], { w: 1.6, smooth: false, seed: seed + 3 + s });
  else if (face === 'up') { for (const s of [-1, 1]) IB.seg(ctx, fx + s * 6 - 2.5, -3 - s, fx + s * 6 + 2.5, -1 - s, { w: 1.8, seed: seed + 3 + s }); }
  else if (m) dot(m * 3, -1);
  else { dot(-6, 0); dot(6, 0); }
  IB.ink(ctx, [[fx - 5 + m * 6, 5.5], [fx - 2.5 + m * 6, 8.5], [fx + m * 6, 5.5], [fx + 2.5 + m * 6, 8.5], [fx + 5 + m * 6, 5.5]], { w: 1.5, seed: seed + 6 });
  ctx.restore();
}
/* One barrel of the cat's binoculars: white rim, then black glass, or its own eye in it (yellow with a slit pupil). */
function catLens(ctx, x, y, r, glass, seed) {
  IB.oval(ctx, x, y, r, r, { fill: C.paper, w: 2, seed, n: 14 });
  IB.oval(ctx, x, y, r * 0.74, r * 0.74, { fill: glass === 'black' ? C.ink : C.yellow, w: 1.6, seed: seed + 1, n: 12 });
  if (glass === 'slit') IB.seg(ctx, x, y - r * 0.45, x, y + r * 0.45, { w: 2, seed: seed + 2, grain: 0 });
}
const TAIL = [null, [[1572, 750], [1576, 736], [1586, 726], [1596, 722]], [[1572, 750], [1574, 734], [1578, 722], [1586, 716]], [[1572, 750], [1572, 734], [1568, 722], [1574, 714]]];
function catTail(ctx, which) {
  if (which) IB.tube(ctx, TAIL[which], { w: 13, edge: 2.1, fill: C.paper, smooth: true, seed: 450 });
}

function cat(ctx, f) {
  const p = IB.held(CAT, f), SILL = 749;
  if (p.kind === 'none') return;
  if (p.kind === 'sit' || p.kind === 'crouch') {
    const low = p.kind === 'crouch' ? 7 : 0;
    IB.ink(ctx, [[1525, 697 + low], [1522, 711 + low], [1527, 726 + low * 0.5], [1530, 736], [1524, 747], [1538, 748], [1545, 740], [1550, 736], [1544, 748], [1583, 748], [1585, 737], [1583, 722 + low * 0.4], [1574, 705 + low], [1560, 697 + low], [1548, 688 + low]], { closed: true, fill: C.paper, w: 2.2, seed: 431 });
    IB.shade(ctx, 1528, 724, 20, 24, { from: 'bottom', seed: 432, alpha: 0.22 });
    if (low) catHead(ctx, 1522, 690, { turn: -1, tilt: 0.25, ears: [3, 3] });
    else catHead(ctx, 1533 + p.turn * 2, 680, p);   // low enough to sit on the neck: 6 px higher it floats off the body
    return;
  }
  if (p.kind === 'slink') {   // stretched from the sill down into the room, tail hooked over its back
    IB.ink(ctx, [[1486, 716], [1500, 700], [1524, 692], [1548, 688], [1560, 692], [1564, 720], [1562, 748], [1548, 748], [1546, 728], [1530, 716], [1508, 722], [1494, 740], [1484, 742]], { closed: true, fill: C.paper, w: 2.2, seed: 440 });
    IB.tube(ctx, [[1558, 694], [1566, 676], [1578, 674], [1582, 686], [1576, 694]], { w: 8, edge: 2, fill: C.paper, smooth: true, seed: 441 });
    return;
  }
  if (p.kind === 'rump') {
    IB.ink(ctx, [[1486, 752], [1492, 734], [1508, 728], [1522, 736], [1526, 752]], { closed: true, fill: C.paper, w: 2.2, seed: 442 });
    IB.tube(ctx, [[1510, 732], [1512, 700], [1518, 676], [1530, 668], [1536, 676]], { w: 8, edge: 2, fill: C.paper, smooth: true, seed: 443 });
    return;
  }
  if (p.kind === 'tip') { IB.tube(ctx, [[1494, 756], [1492, 742], [1498, 734]], { w: 8, edge: 2, fill: C.paper, smooth: true, seed: 444 }); return; }
  if (p.kind === 'ears') { for (const s of [-1, 1]) IB.ink(ctx, [[CX + s * 17, SILL + 6], [CX + s * 18, SILL - 8], [CX + s * 9, SILL + 2]], { closed: true, smooth: false, fill: C.paper, w: 2.2, seed: 445 + s }); return; }
  // front-on behind the sill
  catTail(ctx, p.tail);
  if (p.kind === 'peek') {
    catHead(ctx, CX, 716, { ears: [0, 0] });
    for (const s of [-1, 1]) catLens(ctx, CX + s * 13.5, 741, 10.5, 'black', 460 + s);
    return;
  }
  const body = [[1520, 752], [1523, 724], [1528, 711], [1550, 711], [1555, 724], [1558, 752]];
  if (p.kind === 'watch' || p.kind === 'lower') {
    const ly = p.kind === 'watch' ? 702 + p.dip : 722, hy = p.kind === 'watch' ? 688 : 694;
    IB.ink(ctx, body, { closed: true, fill: C.paper, w: 2.2, seed: 446 });
    for (const s of [-1, 1]) IB.ink(ctx, [[CX + s * 14, 724], [CX + s * 32, 722 + (ly - 702) * 0.6], [CX + s * 35, ly - 2], [CX + s * 28, ly - 11], [CX + s * 22, ly - 8], [CX + s * 24, ly + 10], [CX + s * 12, 714]], { closed: true, fill: C.paper, w: 2.2, seed: 447 + s });   // arms up to the barrels
    catHead(ctx, CX, hy, { face: 'dot' });
    for (const s of [-1, 1]) catLens(ctx, CX + s * 14, ly, 12, p.kind === 'watch' ? p.glass : 'black', 462 + s);
    return;
  }
  // 'rest': sitting, binoculars lying at its paws with their glass toward us, the lower half behind the sill
  IB.ink(ctx, [[1518, 752], [1522, 730], [1529, 712], [1549, 712], [1556, 730], [1560, 752]], { closed: true, fill: C.paper, w: 2.2, seed: 448 });
  catHead(ctx, CX + (p.face === 'side' ? 3 : 0), 698, { face: p.face === 'side' ? 'dot' : p.face, turn: p.face === 'side' ? 1 : 0, tilt: p.face === 'up' ? -0.22 : p.face === 'side' ? -0.12 : 0 });
  for (const s of [-1, 1]) catLens(ctx, CX + s * 12.5, p.sat === false ? 740 : 749, 11, 'black', 464 + s);
}

/* ---------- the flyer ---------- */
/* [frame, x, y, body length, heading]: hovers at the bud, leaves the window to the right, turns over the wall and comes back toward the lens, growing from 7 to 44 px over eight drawings (positions and sizes read off the reference). Placed on twos, wings flipping with each drawing. */
const FLY = [[250, 1634, 650, 9, -0.5], [252, 1640, 641, 9, -0.3], [254, 1644, 638, 9, 0.2], [256, 1640, 641, 9, -0.4], [258, 1650, 646, 9, 0], [260, 1670, 650, 9, 0.1], [262, 1712, 645, 8, 0], [264, 1784, 646, 7, -0.2], [266, 1791, 636, 8, -0.6], [268, 1805, 634, 10, -1.2], [270, 1805, 623, 13, 2.9], [272, 1805, 633, 17, 2.7], [274, 1796, 633, 21, 2.6], [276, 1770, 682, 32, 2.4], [278, 1701, 738, 44, 2.3]];
function flyer(ctx, f) {
  if (f < FLY[0][0]) return;
  const [, x, y, size, rot] = IB.heldRow(FLY, f, FLY[0]);
  IB.flyer(ctx, x, y, size, { rot, flap: IB.alternate(f, 2), seed: 470 });   // wings on twos here: the reference redraws this insect every second frame in this shot
}

function plant(ctx, f) {
  // a pot under a mound of pointed leaves that spills over the sill and trails down the wall, with a few purple blooms
  const r = rng(31), leaves = [], sway = IB.loop(f, [0, 0.07, -0.05]);   // the one thing in the window that never holds: every leaf tips a little on each drawing, as in the reference
  IB.box(ctx, 1640, 726, 42, 54, { fill: C.paper, w: 2.4, seed: 500 });
  IB.shade(ctx, 1640, 726, 42, 26, { from: 'top', seed: 501, alpha: 0.4 });
  IB.shade(ctx, 1640, 682, 70, 44, { from: 'bottom', seed: 502, alpha: 0.3 });   // the dark inside the mound
  for (let i = 0; i < 46; i++) { const a = r() * Math.PI * 2, d = Math.sqrt(r()); leaves.push([1672 + Math.cos(a) * 62 * d, 708 + Math.sin(a) * 52 * d, a + (r() - 0.5), i]); }
  const trail = [[1700, 766], [1716, 800], [1732, 836], [1722, 870], [1740, 900], [1734, 934]];
  for (let i = 0; i < 26; i++) { const u = r() * (trail.length - 1), k = Math.min(trail.length - 2, Math.floor(u)), v = u - k; leaves.push([lerp(trail[k][0], trail[k + 1][0], v) + (r() - 0.5) * 44, lerp(trail[k][1], trail[k + 1][1], v) + (r() - 0.5) * 16, Math.PI * (0.2 + r() * 0.6), 100 + i]); }
  leaves.sort((p, q) => p[1] - q[1]);
  for (const [x, y, a, i] of leaves) {
    const bloom = i % 4 === 0;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a + sway * ((i % 3) - 1));
    if (bloom) IB.ink(ctx, [[-7, -3], [-9, -12], [-3, -8], [0, -14], [3, -8], [9, -12], [7, -3], [0, 6]], { closed: true, smooth: false, fill: '#a08ae8', w: 2, seed: 520 + i });
    else { IB.ink(ctx, [[0, -15], [8, -3], [5, 9], [0, 13], [-5, 9], [-8, -3]], { closed: true, fill: C.paper, w: 2, seed: 520 + i }); IB.seg(ctx, 0, -9, 0, 9, { w: 1.3, seed: 620 + i }); }
    ctx.restore();
  }
  IB.ink(ctx, [[1641, 654], [1643, 645], [1648, 644], [1650, 651], [1646, 656]], { closed: true, fill: C.yellow, w: 1.7, seed: 504 });   // the bud the flyer comes for
}
function building(ctx, f) {
  // sky side: stretched clouds and a scalloped bush; wall side: a few brick marks stand for the whole wall
  const cloud = (x0, x1, y, seed) => IB.ink(ctx, [[x0, y + 12], [lerp(x0, x1, 0.3), y - 8], [lerp(x0, x1, 0.6), y - 2], [x1, y - 30], [x1, y + 34], [lerp(x0, x1, 0.55), y + 28], [lerp(x0, x1, 0.2), y + 30]], { closed: true, fill: C.paper, w: 3, seed });
  cloud(-80, 150, 82, 600);
  cloud(540, 975, 68, 601);
  IB.seg(ctx, 970, -10, 970, 940, { w: 3.5, seed: 602 });
  const bush = [];
  for (let i = 0; i <= 26; i++) { const a = Math.PI * (1 - i / 26), bump = i % 2 ? 1.0 : 0.93; bush.push([765 + Math.cos(a) * 330 * bump, 1095 - Math.sin(a) * 245 * bump]); }
  IB.ink(ctx, bush, { w: 3, seed: 603, fill: C.bg, closed: true });
  const bricks = (x, y, seed) => { IB.seg(ctx, x, y, x + 175, y, { w: 2.5, seed }); IB.seg(ctx, x - 10, y + 38, x + 230, y + 38, { w: 2.5, seed: seed + 1 }); for (const [dx, y0] of [[48, -36], [140, -36], [0, 4], [96, 4], [150, 42]]) IB.seg(ctx, x + dx, y + y0, x + dx, y + y0 + 30, { w: 2.5, seed: seed + 2 + dx }); };
  bricks(1686, 160, 610);
  bricks(1090, 955, 630);
  for (const x of [1068, 1470]) { IB.box(ctx, x - 6, -40, 294, 66, { fill: C.paper, w: 3, seed: 650 + x }); IB.smear(ctx, x + 140, 28, 270, { h: 5, seed: 660 + x }); }
  windowFrame(ctx, 1068, 700);
  watcher(ctx, f);
  sashAndSill(ctx, 1068, 700);
  windowFrame(ctx, 1470, 720);
  room(ctx, f);
  sashAndSill(ctx, 1470, 720);
  plant(ctx, f);
  flyer(ctx, f);
}

MG.scene({
  title: 'spot / dark-eyes-reveal',
  duration: 11.625, ref: [120.083, 131.708], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    const f = IB.frame(t);
    if (f < CUT) {
      IB.bg(ctx, '#000000');
      IB.crop(ctx, CROP);
      const [, dx, dy, lid] = IB.heldRow(LOOK, f, LOOK[0]), s = IB.heldRow(ZOOM, f, [0, 1])[1];
      if (lid > 0) for (const [ex, ey] of [[1100, 541], [1568, 543]]) eye(ctx, FOCUS[0] + (ex - FOCUS[0]) * s, FOCUS[1] + (ey - FOCUS[1]) * s, s, dx, dy, lid);
      return;
    }
    IB.bg(ctx);
    const [, z, lx, ly] = IB.heldRow(CAM, f, CAM[0]);
    IB.crop(ctx, CROP);
    ctx.translate(lx - z * HX, ly - z * 462);
    ctx.scale(z, z);
    building(ctx, f);
  },
});
</script>
