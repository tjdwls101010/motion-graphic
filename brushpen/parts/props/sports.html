<!doctype html>
<meta charset="utf-8">
<title>props / sports</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/props/sports.js"></script>
<script src="../sample.js"></script>
<script>
/* 소품 견본: 공 경기의 부품 IB.soccerBall, IB.basketball, IB.ballTrail, IB.flight, IB.aim, IB.soccerGoal, IB.hoop, IB.stands, IB.adBoards, IB.scoreboard, IB.segDigits. 공은 중력으로 난다: IB.aim이 도착 지점과 시간에서 발사 속도를 내고, IB.flight가 그 뒤의 포물선, 바운드(세로 속도 e배, 가로 속도 mu배), 구르다 멈추기를 시각 t 하나로 계산한다(키 1.8 m 선수가 360 px인 와이드에서 1 m = 200 px, 중력 1962 px/s²). 공은 그린 물건이라 2프레임 단위로 놓고, 빠를 때만 뒤에 속도선 세 줄이 붙는다. 골대는 터치라인에서 본 옆모습에 깊이를 조금 주어 가까운 기둥이 바닥선 아래, 먼 기둥이 위에 서고, 공이 그물에 박히면 뒷그물이 그 점을 중심으로 불룩해졌다 돌아온다. 농구 골대는 백보드를 거의 옆에서 보고 림을 아래에서 본 납작한 타원으로 그려, 'back' 층과 'front' 층 사이에 공을 넣으면 림을 통과한다. 그물은 공이 빠지면 여섯 장에 늘어났다 채찍처럼 돌아온다. 관중은 두 그림(1, 2)을 2프레임마다 바꾸면 환호하고 'up'이면 모두 일어선다. 점수판 숫자는 활자가 아니라 붓펜으로 그은 7획 숫자다(백보드 위 경기 시계 IB.gameClock도). 페널티 마크는 IB.penaltySpot이다. */
const C = IB.C, G = 1962;
MG.scene({
  title: 'props / sports',
  duration: 4, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'balls, flight, goal, hoop, stands, scoreboard (props/sports.js)');
    const c = SAMPLE.grid(6, 3), tt = IB.twos(t), k = Math.round(tt * 12);
    const win = (i, at, dy = 30) => SAMPLE.window(at, c[i][2], c[i][3], dy);

    // the two balls, turning as they roll (rot = distance / r)
    SAMPLE.cell(ctx, c[0], win(0, [960, 700]), () => {
      for (let i = 0; i < 4; i++) IB.soccerBall(ctx, [760 + i * 70, 560], { rot: i * 0.6 + tt * 3, seed: 10 + i });
      for (let i = 0; i < 4; i++) IB.basketball(ctx, [760 + i * 70, 650], { rot: i * 0.6 + tt * 3, seed: 20 + i });
    }, 'IB.soccerBall / IB.basketball({ rot })');

    // a kick aimed to land 600 px away in 0.8 s, then its bounces and roll, one drawing every 2 frames; the fast ball gets its trail
    SAMPLE.cell(ctx, c[1], win(1, [960, 700]), () => {
      const floor = 680, shot = { p: [700, floor - 22], v: IB.aim([700, floor - 22], [1050, floor - 22], 0.5, G), g: G, floor: floor - 22, e: 0.55, mu: 0.85, roll: 300 };
      IB.smear(ctx, 960, floor - 6, 560, { h: 12, seed: 9 });
      for (let i = 0; i <= 24; i += 2) { const q = IB.flight(shot, i / 12); IB.oval(ctx, q.p[0], q.p[1], 3, 3, { fill: C.ink, w: 0, n: 6 }); }
      const q = IB.flight(shot, (k % 30) / 12);
      IB.ballTrail(ctx, q.p, q.v, { r: 22, seed: 30 + k });
      IB.soccerBall(ctx, q.p, { rot: (q.p[0] - 700) / 22, seed: 31 });
    }, 'IB.aim → IB.flight({ g, floor, e, mu, roll }), IB.ballTrail');

    // the goal at half size; a ball hits the back net and the net bulges out and back
    const kk = k % 18, hit = [1080, 620];
    SAMPLE.cell(ctx, c[2], win(2, [960, 700]), () => {
      IB.smear(ctx, 960, 694, 560, { h: 12, seed: 10 });
      const bulge = { at: hit, k: kk < 6 ? [0, 1, 1.15, 0.7, 0.35, 0.1][kk] : 0 };
      IB.soccerGoal(ctx, [900, 700], { s: 0.5, layer: 'back', bulge });
      IB.soccerBall(ctx, kk < 6 ? [hit[0] + bulge.k * 14, hit[1]] : [hit[0] - 6, 689], { r: 11, lw: 2.2, rot: kk * 0.3, seed: 40 });
      IB.soccerGoal(ctx, [900, 700], { s: 0.5, layer: 'front' });
    }, "IB.soccerGoal({ s, bulge: { at, k }, layer })");

    // the hoop at half size: a swish, then a rattle
    SAMPLE.cell(ctx, c[3], win(3, [960, 700]), () => {
      IB.smear(ctx, 900, 694, 560, { h: 12, seed: 11 });
      const ks = k % 20, net = ks < 8 ? { swish: ks - 1 } : ks < 14 ? { shake: ks - 8 } : {}, hp = IB.hoop(ctx, [1060, 700], { s: 0.5, layer: 'back', net });
      if (ks < 2) IB.basketball(ctx, [hp.rim[0], hp.rim[1] - 20 + ks * 26], { r: 12, lw: 2.2, seed: 50 });
      IB.hoop(ctx, [1060, 700], { s: 0.5, layer: 'front', net });
      if (ks >= 2 && ks < 6) IB.basketball(ctx, [hp.rim[0] - ks * 4, hp.netBottom[1] + 10 + (ks - 2) * 40], { r: 12, lw: 2.2, seed: 51 });
    }, "IB.hoop({ s, net: { swish | shake }, layer })");

    // the crowd: seated, cheering on twos, then standing
    SAMPLE.cell(ctx, c[4], win(4, [960, 700]), () => {
      const cheer = k % 24 < 8 ? 0 : k % 24 < 18 ? 1 + (k % 2) : 'up';
      IB.stands(ctx, [700, 1220], 470, { colors: [C.navy, C.yellow], cheer, s: 0.8, seed: 60 });
      IB.adBoards(ctx, [680, 1240], 800, { back: 0, ht: 50 });
    }, "IB.stands({ cheer: 0 | 1 | 2 | 'up', colors }), IB.adBoards");

    // the scoreboard counting down on ones, as a game clock does
    SAMPLE.cell(ctx, c[5], win(5, [960, 700]), () => {
      const left = Math.max(0, 5 - t * 1.6), clock = '0:0' + Math.floor(left) + '.' + Math.floor((left % 1) * 10);
      IB.scoreboard(ctx, [960, 520], { home: 98, away: left > 0 ? 99 : 101, clock }, { colors: [C.yellow, C.lavender] });
      IB.segDigits(ctx, [820, 700], '24', { size: 30, seed: 70 });
      IB.gameClock(ctx, [1120, 720], '0' + Math.floor(left) + '.' + Math.floor((left % 1) * 10), { out: left <= 0 });
      IB.penaltySpot(ctx, [1000, 760]);
    }, 'IB.scoreboard, IB.segDigits, IB.gameClock, IB.penaltySpot');
  },
});
</script>
