<!doctype html>
<meta charset="utf-8">
<title>props / nature</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/props/nature.js"></script>
<script src="../sample.js"></script>
<script>
/* 소품 견본: 화분 두 가지(IB.pottedPlant와 IB.PLANTS.tall·bushy), 창턱 화분 IB.sillPlant(잎이 2프레임마다 흔들림), 구름 셋(IB.cloud, IB.bandCloud, IB.wispCloud), 나무 덩어리 IB.clump, 새 IB.bird, 풀과 돌 IB.tuft·IB.stones. 모두 흰 채움에 붓펜 외곽선이고 색이 없다: 무대를 알리는 배경 소품이라 배우의 색을 뺏지 않는다. 구름 셋은 쓰임이 다르다: cloud는 설정 샷의 굵은 덩어리(안에 흑연 한 줄), bandCloud는 벽 너머 하늘의 길게 늘어난 구름, wispCloud는 지평선 위로 천천히 흐르는 작은 구름. */
MG.scene({
  title: 'props / nature',
  duration: 4, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'props/nature.js — plants, clouds, foliage, ground');
    const f = IB.frame(t), c = SAMPLE.grid(9, 3);
    SAMPLE.cell(ctx, c[0], [1640 - 300, 930 - 430, 600, 450], () => IB.pottedPlant(ctx, [1640, 930], IB.PLANTS.tall), 'IB.pottedPlant(PLANTS.tall)');
    SAMPLE.cell(ctx, c[1], [1640 - 300, 930 - 430, 600, 450], () => IB.pottedPlant(ctx, [1640, 930], IB.PLANTS.bushy), 'IB.pottedPlant(PLANTS.bushy)');
    SAMPLE.cell(ctx, c[2], [1560, 620, 260, 330], () => IB.sillPlant(ctx, { sway: IB.loop(f, [0, 0.07, -0.05]) }), 'IB.sillPlant — sway on twos');
    SAMPLE.cell(ctx, c[3], [280, 70, 360, 150], () => IB.cloud(ctx, [300, 618, 145, 58]), 'IB.cloud([x0, x1, y, h])');
    SAMPLE.cell(ctx, c[4], [520, 0, 480, 140], () => IB.bandCloud(ctx, [540, 975, 68]), 'IB.bandCloud([x0, x1, y])');
    SAMPLE.cell(ctx, c[5], [860, 150, 600, 270], () => { IB.wispCloud(ctx, [1100 - (t % 4) * 30, 300], { w: 150 }); IB.wispCloud(ctx, [1260 - (t % 4) * 30, 360], { w: 62, seed: 61 }); }, 'IB.wispCloud — drifting on ones');
    SAMPLE.cell(ctx, c[6], [700, 640, 500, 300], () => { IB.clump(ctx, [950, 800], [150, 60], { seed: 501 }); IB.clump(ctx, [830, 760], [70, 30], { seed: 502 }); }, 'IB.clump(at, [rx, ry])');
    SAMPLE.cell(ctx, c[7], [100, 300, 400, 200], () => [[230, 415], [262, 466], [330, 380], [380, 430]].forEach((b) => IB.bird(ctx, b)), 'IB.bird');
    SAMPLE.cell(ctx, c[8], [700, 760, 520, 200], () => { IB.tuft(ctx, [820, 860], { seed: 3 }); IB.stones(ctx, [960, 870], { seed: 5 }); IB.tuft(ctx, [1100, 850], { seed: 7 }); }, 'IB.tuft, IB.stones');
  },
});
</script>
