<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../core/base.css">
<link rel="stylesheet" href="../../kit/terminal.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/terminal.js"></script>
<script>
/* Two terminal sessions run side by side under labels identifying the version with and without poteto-mode. Their different streams show the extra steps in the longer workflow. Motion notes: arrows draw at 0.2 s, the right prompt types immediately, the left types from 2.5 s, and output rows stagger from 6 s on the left and 9 s on the right. */
const BEATS = { arrows: 0.2, rightType: 0, leftType: 2.5, leftOutput: 6, rightOutput: 9 };
const FRAME = { leftArrowX: 420, rightArrowX: 1225, arrowY: 55 };
const CAMERA = [[0, [1, 0, 0]], [16, [1, 0, 0]]];
const PROMPTS = ['완료 체크하고 새로고침하면 풀려. 고쳐줘', '/pstack:poteto-mode 완료 체크하고 새로고침하면 풀려. 고쳐줘'];
const OUTPUT = [
  ['● Read 1 file', '● 체크가 새로고침 뒤에 풀리는 원인을 살펴봅니다.', '● Update(app.js)', '  - todos = JSON.parse(localStorage.getItem(KEY)) || []', '  + todos = (JSON.parse(localStorage.getItem(KEY)) || []).map(normalize)', '● Bash(node --check app.js)', '✓ 수정했습니다.'],
  ['● 진행 상황 (Prototype 플레이북)', '● Update Todos', '  □ 문제를 재현하고 원인을 확인하기', '  □ 관련 파일 읽기', '  □ 수정 계획 세우기', '  □ 상태 저장 로직 수정하기', '  □ 테스트와 검증', '  □ 결과 요약'],
];
MG.scene({
  title: 'terminal / split-compare',
  duration: 16,
  ref: [1025, 1041],
  setup(stage) {
    const root = Terminal.root(stage);
    const win = Terminal.window(root);
    win.body.style.display = 'flex';
    const sides = [0, 1].map((i) => {
      const body = MG.el('div', { style: { width: '50%', paddingRight: '20px', borderRight: i ? 'none' : '1px solid #40504d', overflow: 'hidden' } });
      win.body.append(body);
      Terminal.header(body);
      body.append(MG.el('div', { class: 'term-rule' }));
      const prompt = Terminal.line(body, '', 'term-prompt');
      body.append(MG.el('div', { class: 'term-rule' }));
      const lines = OUTPUT[i].map(() => Terminal.line(body, ''));
      Terminal.status(body);
      return { prompt, lines };
    });
    Terminal.webcam(root);
    const arrows = [Terminal.arrow(root, 'poteto-mode 없이', FRAME.leftArrowX, FRAME.arrowY), Terminal.arrow(root, 'poteto-mode', FRAME.rightArrowX, FRAME.arrowY)];
    return { root, sides, arrows };
  },
  render(t, refs) {
    Terminal.camera(refs.root, t, CAMERA);
    // Labels identify the two sessions.
    refs.arrows.forEach((arrow) => Terminal.arrowShow(arrow, t, BEATS.arrows, 16.1));
    refs.sides.forEach((side, i) => {
      // Prompts type at different times, with a blinking block cursor.
      const start = i ? BEATS.rightType : BEATS.leftType;
      side.prompt.textContent = '❯ ' + MG.typed(PROMPTS[i], MG.prog(t, start, 3)) + (MG.blink(t) ? ' ▌' : '');
      // The left proceeds to a diff; the right exposes a longer checklist.
      const outputStart = i ? BEATS.rightOutput : BEATS.leftOutput;
      side.lines.forEach((line, j) => {
        line.textContent = t > outputStart + j * (i ? 0.65 : 0.9) ? OUTPUT[i][j] : '';
        line.style.background = line.textContent && !i && j === 3 ? '#6d3636' : line.textContent && !i && j === 4 ? '#285d2a' : '';
      });
    });
  },
});
</script>
