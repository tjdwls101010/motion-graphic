<!doctype html>
<meta charset="utf-8">
<title>cast / folder</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/solid.js"></script>
<script src="../../kit/cast/paper.js"></script>
<script src="../sample.js"></script>
<script>
/* 출연진 견본: 파란 폴더 IB.folder의 이름 붙은 포즈 넷(IB.folder.POSE: 원본 무대에서 서는 자리)과 동작 셋(IB.folder.MOVE.kick, aboutFace, groove), 그리고 다른 자리에 놓기(opts.at·s·flip, IB.place). 동작은 원본 스팟의 그림 목록 그대로이고, 칸마다 반복 재생한다(마지막 그림을 0.75초 붙잡고 다시). 나머지 동작은 cast/folder-moves에 있다. */
const F = IB.folder, FLOOR = IB.PAPER.floor;
MG.scene({
  title: 'cast / folder',
  duration: 6, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'IB.folder — POSE, MOVE, placing (cast/paper.js)');
    const f = IB.frame(t), c = SAMPLE.grid(8, 4);
    // the four poses are the same standing drawing on the four spots it stands on in the reference
    Object.entries(F.POSE).forEach(([name, p], i) => SAMPLE.cell(ctx, c[i], SAMPLE.fit(c[i], [p.x, FLOOR]), () => F(ctx, p), `POSE.${name} (x ${Math.round(p.x)})`));
    ['kick', 'aboutFace', 'groove'].forEach((name, i) => SAMPLE.cell(ctx, c[4 + i], SAMPLE.fit(c[4 + i], [1093, FLOOR]), () => F(ctx, SAMPLE.cycle(f, F.MOVE[name])), 'MOVE.' + name));
    SAMPLE.cell(ctx, c[7], SAMPLE.fit(c[7], [1093, FLOOR]), () => {
      F(ctx, SAMPLE.cycle(f, F.MOVE.groove), { at: [990, FLOOR], s: 0.6 });
      F(ctx, SAMPLE.cycle(f, F.MOVE.groove), { at: [1170, FLOOR], s: 0.6, flip: true });
    }, 'opts { at, s: 0.6, flip }');
  },
});
</script>
