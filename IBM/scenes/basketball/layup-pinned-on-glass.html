<!doctype html>
<meta charset="utf-8">
<title>basketball / layup-pinned-on-glass</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/athletes.js"></script>
<script src="../../kit/props/sports.js"></script>
<script>
/* 블록슛: 공을 튀기며 골밑으로 파고든 선수가 두 걸음을 밟고 올라가 백보드를 겨냥해 공을 올려놓는데, 골대 아래에서 기다리던 수비수가 한 박자 늦게 솟구쳐 공을 백보드에 그대로 찍어 누른다. 공은 유리판에 붙은 채 한 장 멈췄다가 수비수의 손으로 떨어지고, 수비수는 공을 쥐고 내려와 포효한다. 원본에 없는 창작 장면이다. 전달하는 생각: 블록은 먼저 뛰는 쪽이 아니라 공이 닿을 곳에 먼저 손을 두는 쪽이 이긴다.
   Motion notes: seen from the sideline, 6.5 s, one camera framing (IB.crop of a 1250 px window, 1.54x). On the stage 140 px are a metre (gravity 1373 px/s²), the rim 3.05 m up, the players 1.95 m (273 px). The driver runs in on IB.run (IB.runLen / 8 a drawing) dribbling: the ball goes from his hand to the floor and back every 4 drawings. He gathers (1.17 s), takes the two steps of the layup (each a drawing on the floor), and rises on a gravity arc 0.6 m up with the ball carried up in the near hand; at the top (1.92 s) he lays it toward the glass above the rim (0.33 s away, arriving at 2.25 s). The defender, waiting under the rim, crouches as the driver gathers (the read), takes off a drawing after him and peaks with his hand flat on the glass on the drawing the ball arrives: the ball stops dead against the board for one drawing (a burst on the glass), then drops into his hand. He comes down with it in both hands (2.83 s, a thud) and roars with the ball held up from 3.17 s; the driver lands and stands with his hands on his hips. The crowd cheers on twos from the block to 4.75 s and stands; from 4.75 s nothing moves. Colours: the two kits' yellow and lavender, the ball's mustard, the floor's mustard smear. */
const F = IB.FIG, FLOOR = 900, M = 140, G = 9.81 * M, R = 0.12 * M, PI = Math.PI;
const BOARD = 1760, HS = 0.7, RC = [BOARD - 0.375 * M, FLOOR - 3.05 * M], CAM = [820, 260, 1250];
const DR = IB.athlete('basketball', 'home', 7, { h: 1.95 * M, dir: 1, seed: 30 }), DF = IB.athlete('basketball', 'away', 5, { h: 1.95 * M, dir: -1, seed: 40 });
const H = DR.h, HY = IB.stand(0, FLOOR, DR).hip[1], AY = FLOOR - F.ankle * H;
const hipForSh = (look, sh, lean) => { const o = IB.joints({ hip: [0, 0], lean, feet: [[0, 0], [0, 0]], hands: [[0, 0], [0, 0]] }, look).sh; return [sh[0] - o[0], sh[1] - o[1]]; };
const reachTo = (look, p, i, t, max = 0.28) => { const j = IB.joints(p, look), a = Math.atan2(t[1] - j.sh[1], t[0] - j.sh[0]); p.hands[i] = IB.polar(j.sh, a, Math.min(max * look.h, Math.hypot(t[0] - j.sh[0], t[1] - j.sh[1]))); return p.hands[i]; };

/* ---------- the driver ---------- */
const FR = 46, UP = 0.6 * M, TUP = Math.sqrt((2 * UP) / G);       // the release at the top of the jump
const GLASS = [BOARD - R - 2, FLOOR - 3.4 * M], TB = 0.3;          // where the lay-up would kiss the board
const RP_SH = [GLASS[0] - 1.1 * M, GLASS[1] + 0.3 * M];           // his shoulder at the release
const HIP_R = hipForSh(DR, RP_SH, 0.1), VX = 110;
const airHip = (f) => { const dt = (f - FR) / 24; return [HIP_R[0] + VX * dt, HIP_R[1] + (G / 2) * dt * dt]; };
const TAKE = FR - Math.round((TUP * 24) / 2) * 2, XT = airHip(TAKE)[0], RL = IB.runLen(DR) / 8;
const X0 = XT - 0.5 * H - 13 * RL;
const dr = (hip, lean, feet, hands, more = {}) => IB.posed(DR, { hip, lean, feet, hands, ...more });
const DACT = [], BALL = [];
for (let k = 0; k < 14; k++) {
  const p = IB.run(X0 + k * RL, FLOOR, DR, (k / 8) % 1), hand = reachTo(DR, p, 1, [X0 + k * RL + 0.2 * H, HY + 0.05 * H]), u = [0, 0.55, 1, 0.45][k % 4];
  DACT.push([k * 2, p]); BALL.push([k * 2, [hand[0] + 0.04 * H, MG.lerp(hand[1] + R, FLOOR - R, u)]]);
}
const two = (x, f, lean, planted, up) => { const p = dr([x, HY + 0.06 * H], lean, planted, [[0, 0], [0, 0]], { face: { eye: 'dot', mouth: 'flat', brow: 1 } }), j = IB.joints(p, DR), b = IB.polar(j.sh, up, 0.22 * H); reachTo(DR, p, 0, [b[0] - 0.02 * H, b[1] + 3]); reachTo(DR, p, 1, [b[0], b[1] + R * 0.7]); DACT.push([f, p]); BALL.push([f, b]); };
const XG = X0 + 14 * RL;
two(XG, 28, 0.2, [[XG + 0.12 * H, AY, -0.2], { a: PI - 0.7, l: 0.44, pitch: 0.8 }], 0.5);                 // the gather: step one
two(XT, TAKE - 2, 0.1, [[XT + 0.05 * H, AY, 0.1], { a: PI - 0.4, l: 0.46, pitch: 0.6 }], -0.2);         // step two, the plant
for (let f = TAKE; f <= FR; f += 2) {
  const u = (f - TAKE) / (FR - TAKE), p = dr(airHip(f), 0.1, [{ a: PI / 2 + 0.4, l: 0.48, pitch: 0.6 }, { a: 0.35, l: 0.36, pitch: 0.5 }], [[0, 0], [0, 0]], { hand: ['relax', 'open'], face: { eye: 'dot', mouth: 'flat' } }), j = IB.joints(p, DR);
  const b = IB.polar(j.sh, MG.lerp(-0.3, -1.0, u), MG.lerp(0.24, 0.27, u) * H);
  reachTo(DR, p, 1, [b[0] - 2, b[1] + R * 0.8]); p.hands[0] = IB.polar(j.sh, MG.lerp(0.2, -0.4, u), 0.24 * H);
  DACT.push([f, p]); BALL.push([f, b]);
}
const RELP = IB.held(BALL, FR), LAY = { p: RELP, v: IB.aim(RELP, GLASS, TB, G), g: G };
let DLAND = FR + 2; while (airHip(DLAND)[1] < HY + 0.03 * H) DLAND += 2;
for (let f = FR + 2; f < DLAND; f += 2) DACT.push([f, dr(airHip(f), 0.05, [{ a: PI / 2 + 0.2, l: 0.5, pitch: 0.5 }, { a: PI / 2 - 0.1, l: 0.5, pitch: 0.5 }], [{ a: -0.9, l: 0.27 }, { a: -1.2, l: 0.28 }], { hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } })]);
const XL = airHip(DLAND)[0];
DACT.push([DLAND, dr([XL, HY + 0.09 * H], 0.2, [[XL - 0.1 * H, AY, 0], [XL + 0.12 * H, AY, 0]], [{ a: 0.6, l: 0.25 }, { a: 0.3, l: 0.25 }], { face: { eye: 'wide', mouth: 'open' } })]);
DACT.push([DLAND + 12, dr([XL, HY + 0.01 * H], -0.05, [[XL - 0.08 * H, AY, 0], [XL + 0.08 * H, AY, 0]], [{ a: PI / 2 + 0.25, l: 0.2 }, { a: PI / 2 - 0.1, l: 0.2 }], { elbow: [-1, -1], nod: 0.2, face: { eye: 'closed', mouth: 'frown' } })]);

/* ---------- the block ---------- */
const PIN = FR + Math.round((TB * 24) / 2) * 2;                    // the drawing the ball reaches the glass
const PINP = IB.flight(LAY, (PIN - FR) / 24).p;
const BSH = [PINP[0] + 0.05 * M, PINP[1] + 0.27 * H];              // the blocker's shoulder under his hand on the glass
const BHIP = hipForSh(DF, BSH, 0.05), BX = BHIP[0];
const bHip = (f) => { const dt = (f - PIN) / 24; return [BX, BHIP[1] + (G / 2) * dt * dt]; };
let BT = PIN - 2; while (bHip(BT - 2)[1] < HY) BT -= 2;
let BLAND = PIN + 2; while (bHip(BLAND)[1] < HY + 0.03 * H) BLAND += 2;
const bf = (hip, lean, feet, hands, more = {}) => IB.posed(DF, { hip, lean, feet, hands, ...more });
const wait = (down, eye) => bf([BX, HY + down], 0.15, [[BX - 0.1 * H, AY, 0], [BX + 0.1 * H, AY, 0]], [{ a: -0.2, l: 0.26 }, { a: 0.4, l: 0.26 }], { hand: ['open', 'open'], face: { eye, mouth: 'flat', brow: 1 } });
const BACT = [[0, wait(0.06 * H, 'dot')], [28, wait(0.13 * H, 'wide')]];
const legL = (hip) => Math.min(0.5, (AY - hip[1]) / H);
for (let f = BT; f < BLAND; f += 2) {
  const hip = bHip(f), p = bf(hip, 0.05, [{ a: PI / 2 + 0.1, l: legL(hip), pitch: 0.5 }, { a: PI / 2 - 0.05, l: legL(hip), pitch: 0.5 }], [{ a: 0.8, l: 0.24 }, { a: -1.4, l: 0.285 }], { hand: ['relax', 'open'], nod: -0.3, face: { eye: 'wide', mouth: 'open' } });
  if (f === PIN || f === PIN + 2) reachTo(DF, p, 1, [PINP[0] + 4, PINP[1] + R * 0.6], 0.285);
  if (f > PIN + 2) { const j = IB.joints(p, DF), b = IB.polar(j.sh, -0.6, 0.2 * H); reachTo(DF, p, 0, [b[0], b[1] + R * 0.7]); reachTo(DF, p, 1, [b[0] + 0.02 * H, b[1]]); p.hand = ['grip', 'grip']; }
  BACT.push([f, p]);
}
const holdUp = (lean, nod, a) => { const p = bf([BX, HY + 0.08 * H], lean, [[BX - 0.12 * H, AY, 0], [BX + 0.1 * H, AY, 0]], [[0, 0], [0, 0]], { hand: ['grip', 'grip'], nod, face: { eye: 'closed', mouth: 'open' } }), j = IB.joints(p, DF), b = IB.polar(j.sh, a, 0.26 * H); reachTo(DF, p, 0, [b[0], b[1] + R * 0.7]); reachTo(DF, p, 1, [b[0] + 0.02 * H, b[1] + 2]); return [p, b]; };
const LANDB = holdUp(0.3, 0.1, 0.6), ROAR1 = holdUp(-0.1, -0.35, -1.2), ROAR2 = holdUp(-0.05, -0.3, -1.25);
BACT.push([BLAND, LANDB[0]], [BLAND + 8, ROAR1[0]], [BLAND + 12, ROAR2[0]]);

function ballAt(f) {
  if (f <= FR) return IB.held(BALL, f);
  if (f < PIN) return IB.flight(LAY, (f - FR) / 24).p;
  if (f <= PIN + 2) return PINP;
  if (f < BLAND) { const p = IB.held(BACT, f), j = IB.joints(p, DF); return IB.polar(j.sh, -0.6, 0.2 * H); }
  return (f < BLAND + 8 ? LANDB : f < BLAND + 12 ? ROAR1 : ROAR2)[1];
}

const withPrev = (table) => (f) => ({ ...IB.held(table, f), prev: f >= 28 ? IB.held(table, f - 2) : undefined });
const driver = withPrev(DACT), blocker = withPrev(BACT);
const cheerAt = (f) => (f < PIN ? 0 : f < 114 ? 1 + (f / 2) % 2 : 'up');

IB.actors = (t) => { const f = IB.frame(IB.twos(t)); return { driver: driver(f), blocker: blocker(f), ball: ballAt(f), crowd: cheerAt(f) }; };

MG.scene({
  title: 'basketball / layup-pinned-on-glass',
  duration: 6.5, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const tt = IB.twos(t), f = IB.frame(tt), b = blocker(f);
    IB.crop(ctx, CAM);
    IB.courtside(ctx, [600, 2200], FLOOR, { cheer: cheerAt(f) });
    IB.hoop(ctx, [BOARD, FLOOR], { s: HS, layer: 'back' });
    IB.figure(ctx, driver(f), DR);
    IB.figure(ctx, b, DF, 'far');
    IB.basketball(ctx, ballAt(f), { r: R, rot: f * 0.2, lw: 2.6, seed: 91 });
    IB.figure(ctx, b, DF, 'near');
    IB.hoop(ctx, [BOARD, FLOOR], { s: HS, layer: 'front' });
    const pin = IB.drawn(tt, PIN / 24), ld = IB.drawn(tt, BLAND / 24);
    if (pin >= 0 && pin < 2) IB.burst(ctx, [PINP[0] + R, PINP[1]], { n: 5, a0: 1.8, da: 0.6, r0: 30 + pin * 8, r1: 60 + pin * 8, w: 3.2, seed: 70 + pin });
    if (ld >= 0 && ld < 2) IB.thud(ctx, [BX, FLOOR], { half: 0.2 * H, k: ld });
  },
});
</script>
