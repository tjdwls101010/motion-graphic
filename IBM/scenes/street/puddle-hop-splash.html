<!doctype html>
<meta charset="utf-8">
<title>street / puddle-hop-splash</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../../kit/props/weather.js"></script>
<script>
/* 비 그친 거리에서 걷던 사람이 앞의 물웅덩이를 보고 웅크렸다가 크게 뛰어 건너 착지하고 두 팔을 들어 "성공!" 하는 순간, 뒤로 지나가던 택시 바퀴가 다른 웅덩이를 밟아 물벽이 솟아 덮치고, 흠뻑 젖은 채 물방울을 떨구며 굳는다. 원본에 없는 창작 장면으로, 새 부품 물웅덩이·바퀴 물벽(props/weather.js: IB.waterPuddle, IB.wheelSplash)에 매달린 물방울(IB.drop)과 흔들림선(IB.shake), 출연진 designer, 택시(IB.cab, market/street-rush-hour)와 바퀴 밑 물결(IB.ripples), 착지의 쿵(IB.thud)과 말풍선을 조립했다. 전달하는 생각: 뿌듯함이 가장 클 때 정지한 한 박자가 반전을 크게 만든다.
   Motion notes: one locked shot, 7 s, figure 480 px (line 3.5 px), the cab at 1.15x (446 px, line 3.9 px) on a road 85 px behind her floor. The person acts on twos; the cab is a machine on ones (1100 px/s) and the water on twos. Walk-in 0-1.33 s: 16 drawings from off the left edge at IB.walkLen / 12 = 33.6 px a drawing, stopping on phase 1/3 a step short of a 340 px puddle, thrown forward one drawing; she looks down at it (nod 0.3) and holds 0.5 s. The hop: 1.92 s an in-between down, 2.0 s the crouch (hips 0.11 h down, lean 0.38, arms swung back) held 0.25 s; 2.25 s take-off on the back toe with both arms thrown forward and up; four drawings in the air (2.33-2.58 s) on an arc 0.3 h high, front leg reaching, back leg trailing, travelling 1.35 h (648 px) in all; the fourth drawing reaches the front foot to the floor; 2.67 s the landing crouch (thud marks for two drawings), 2.75 s up through an in-between and one drawing 5% past, 2.92 s arms up in a V, eyes shut, smiling. The bubble "성공!" 3.0-3.92 s over the dead-still pose. The cab comes in from the left behind her at 2.85 s; at 4.17 s its front wheel reaches the road puddle 200 px ahead of her and the water comes up in five drawings on twos (IB.wheelSplash: a low fan, a 580 px wall behind her leaning 200 px toward her, its crest breaking over her in front, then drops, then the last few); she is hit on the third drawing (4.33 s: hunched, eyes shut, mouth open) and from that drawing her clothes are soaked dark: the yellow tee goes mustard and the charcoal trousers black (the white shoes stay). 4.42 s one drawing 8% past the soaked pose, 4.5 s soaked and frozen: knees giving a little, head sunk (nod 0.35, the rig has no drooping hair, so the head and arms carry it), both arms held stiffly out off her sides, eyes shut, frown; a 380 px puddle round her feet. IB.drop hangs off both elbows, both fingertips, the chin and the hem (six drops): they fall off on two drawings (4.42 and 4.5 s, 36 then 96 px below), then from 4.58 s a fresh one hangs still at each; one shiver of shake marks either side of her shoulders for 2 drawings (4.58-4.67 s). Still from 4.75 s (the cab has gone at 5.2 s). Every drawing of her passes the one before as pose.prev. Colours: yellow (her tee and the cab; mustard once soaked), the blue water on pale sky puddles, charcoal trousers. */
const { lerp } = MG;
const F = IB.FIG, FLOOR = 990, ROAD = 905, H = 480, WHO = { ...IB.PEOPLE.designer, h: H, dir: 1, seed: 70 };
const PACE = IB.walkLen(WHO) / 12, X0 = -100, IN = 16, XS = X0 + IN * PACE, PH = (IN / 12) % 1;   // 16 drawings in, stopping on phase 1/3
const XL = XS + 1.35 * H, POOL = [XS + 0.55 * H, FLOOR], POOL_W = 340, ROADPOOL = [XL + 200, ROAD];   // where she lands; the puddle she hops; the one on the road behind her
const CAB_S = 1.15, CAB_V = 1100, HIT = 100, CAB_X = (t) => ROADPOOL[0] - 116 * CAB_S + CAB_V * (t - HIT / 24);   // the cab's front wheel reaches the road puddle at frame 100

/* ---------- her drawings ---------- */
const S = { ...IB.stand(XS, FLOOR, WHO), feet: IB.walk(XS, FLOOR, WHO, PH).feet.map((f) => [f[0], FLOOR - F.ankle * H, 0]) };
const HY = S.hip[1], ANK = FLOOR - F.ankle * H, bk = S.feet[0][0] < S.feet[1][0] ? 0 : 1;
const two = (back, front) => (bk === 0 ? [back, front] : [front, back]);
const BACKX = S.feet[bk][0], FRONTX = S.feet[1 - bk][0];
const look = { ...S, nod: 0.3, face: { eye: 'dot', mouth: 'flat' } };
const crouch = { ...S, hip: [XS - 0.02 * H, HY + 0.11 * H], lean: 0.38, nod: 0.1, hands: [[XS - 0.14 * H, HY + 0.02 * H], [XS - 0.16 * H, HY]], face: { eye: 'dot', mouth: 'flat', brow: 1 } };
const takeoff = { ...S, hip: [XS + 0.12 * H, HY - 0.03 * H], lean: 0.25, nod: -0.05, feet: two([BACKX, ANK - IB.footLift(0.9, H), 0.9], [FRONTX + 0.15 * H, ANK - 0.12 * H, -0.2]), hands: [[XS + 0.32 * H, HY - 0.42 * H], [XS + 0.3 * H, HY - 0.4 * H]], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } };
const air = (u) => {
  const hip = [lerp(XS + 0.12 * H, XL, u), HY - 0.03 * H - Math.sin(Math.PI * u) * 0.3 * H];
  return { ...S, hip, lean: 0.15, nod: -0.1, feet: two([hip[0] - 0.3 * H, hip[1] + 0.25 * H, 0.8], [hip[0] + 0.3 * H, hip[1] + 0.38 * H, -0.3]), hands: [[hip[0] + 0.2 * H, hip[1] - 0.42 * H], [hip[0] + 0.08 * H, hip[1] - 0.45 * H]], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } };
};
const reach = (() => { const hip = [lerp(XS + 0.12 * H, XL, 0.95), HY - 0.02 * H]; return { ...air(0.95), hip, feet: two([hip[0] - 0.25 * H, hip[1] + 0.32 * H, 0.7], [XL + 0.12 * H, ANK - IB.footLift(-0.3, H), -0.3]) }; })();
const LAND_FEET = two([XL - 0.12 * H, ANK, 0], [XL + 0.12 * H, ANK, 0]);
const land = { ...S, hip: [XL, HY + 0.1 * H], lean: 0.3, nod: 0.1, feet: LAND_FEET, hands: [[XL + 0.2 * H, HY - 0.1 * H], [XL + 0.22 * H, HY - 0.08 * H]], hand: ['open', 'open'], face: { eye: 'closed', mouth: 'flat' } };
const proud = { ...S, hip: [XL, HY - 0.005 * H], lean: -0.1, nod: -0.15, feet: LAND_FEET, hands: [[XL - 0.05 * H, HY - 0.5 * H], [XL + 0.08 * H, HY - 0.47 * H]], hand: ['open', 'open'], face: { eye: 'closed', mouth: 'smile' } };
const hit = { ...proud, hip: [XL, HY + 0.02 * H], lean: 0.12, nod: 0.25, hands: [[XL + 0.02 * H, HY + 0.08 * H], [XL + 0.05 * H, HY + 0.07 * H]], hand: ['open', 'open'], face: { eye: 'closed', mouth: 'open' } };
// soaked and frozen: knees giving a little, head sunk between the shoulders, both arms held stiffly out off her sides, eyes shut
const soaked = { ...proud, hip: [XL, HY + 0.03 * H], lean: 0.1, nod: 0.35, hands: [[XL - 0.17 * H, HY], [XL + 0.2 * H, HY - 0.01 * H]], hand: ['open', 'open'], face: { eye: 'closed', mouth: 'frown', brow: 1 } };
const WET = 104, WET_LOOK = { top: IB.C.mustard, bottom: IB.C.ink };   // from the drawing the water hits her: the yellow tee soaked to mustard, the charcoal trousers to black; the white shoes stay
const W0 = IN * 2;
const ACT = [
  [W0, { ...S, lean: 0.12, hip: [XS + 6, HY + 2] }], [W0 + 2, IB.poseMix(S, look, 0.5)], [W0 + 4, look],
  [46, { ...IB.poseMix(look, crouch, 0.5), face: crouch.face }], [48, crouch],
  [54, takeoff], [56, air(0.25)], [58, air(0.5)], [60, air(0.75)], [62, reach],
  [64, land], [66, { ...IB.poseMix(land, proud, 0.5), face: proud.face }], [68, IB.poseMix(land, proud, 1.05)], [70, proud],
  [104, hit], [106, IB.poseMix(hit, soaked, 1.08)], [108, soaked],
];
const poseOn = (f) => (f < W0 ? (() => { const k = f >> 1; return IB.walk(X0 + k * PACE, FLOOR, WHO, (k / 12) % 1); })() : IB.held(ACT, f));
const poseAt = (t) => { const f = IB.frame(IB.twos(t)), p = poseOn(f); return { ...p, prev: f > 0 ? poseOn(f - 2) : undefined }; };
const airborne = (f) => f >= 56 && f < 64;
// drops on her elbows, fingertips, chin and hem: two drawings falling off (106, 108), then from 110 a fresh one hangs at each, still
const dripsOn = (f) => (f < 106 ? null : f < 110 ? (f - 106) >> 1 : 'hang');
const DROP_FALL = [36, 96];   // px below its point on the two falling drawings

IB.actors = (t) => { const f = IB.frame(IB.twos(t)); return { person: poseAt(t), splash: f >= HIT && f < HIT + 10 ? (f - HIT) >> 1 : null, drips: dripsOn(f) }; };

MG.scene({
  title: 'street / puddle-hop-splash',
  duration: 7, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const tt = IB.twos(t), f = IB.frame(tt), p = poseAt(t), k = f >= HIT && f < HIT + 10 ? (f - HIT) >> 1 : -1;
    // the road behind: its puddle, the cab on ones with the scribbles under its wheels, the water wall behind her
    IB.waterPuddle(ctx, ROADPOOL, {}, { w: 230, seed: 961 });
    const cx = CAB_X(t);
    if (cx > -300 && cx < 2300) {
      for (const wx of [cx - 118 * CAB_S, cx + 116 * CAB_S]) IB.ripples(ctx, [wx, ROAD], { alt: IB.frame(t) % 2 });
      ctx.save(); IB.place(ctx, [cx, ROAD], { s: CAB_S }); IB.cab(ctx, [cx, ROAD], { spin: (cx - 1000) / 34 }); ctx.restore();
    }
    if (k === 0 || k === 1) IB.wheelSplash(ctx, ROADPOOL, { k }, { h: 580, w: 340, lean: -200 });
    // the pavement: the puddle she hops, her smear (none while she is in the air), the puddle the splash leaves round her feet
    IB.waterPuddle(ctx, POOL, {}, { w: POOL_W });
    const fx = Math.max(p.feet[0][0], p.feet[1][0]), bx = Math.min(p.feet[0][0], p.feet[1][0]);
    if (!airborne(f)) IB.smear(ctx, (fx + bx) / 2, FLOOR - 9, Math.min(fx - bx, 0.4 * H) + 200, { h: 14, seed: 9 });
    if (f >= 106) IB.waterPuddle(ctx, [XL, FLOOR + 4], {}, { w: 380, seed: 962 });
    const j = IB.figure(ctx, p, { ...WHO, ...(f >= WET ? WET_LOOK : {}), face: p.face });
    const th = IB.drawn(tt, 64 / 24);
    if (th >= 0 && th < 2) IB.thud(ctx, [XL, FLOOR], { half: 0.16 * H, k: th });
    // the crest breaks over her, then drops
    if (k >= 2) IB.wheelSplash(ctx, ROADPOOL, { k }, { h: 580, w: 340, lean: -200 });
    // the drops, from the joints the rig solved: each drop's tip hangs at its point (IB.drop's tip is 34 px above its `at`)
    const dr = dripsOn(f);
    if (dr != null) {
      const pts = [...j.elbows.map(([x, y]) => [x, y + 0.03 * H]), ...j.hands.map(([x, y]) => [x, y + 0.035 * H]), [j.headAt[0] + 0.075 * H, j.headAt[1] + 0.085 * H], [j.hip[0] + 0.07 * H, j.hip[1] + 0.06 * H]];
      pts.forEach(([x, y], i) => IB.drop(ctx, [x, y + 34 + (dr === 'hang' ? 0 : DROP_FALL[dr])], { seed: 980 + i * 3 }));
    }
    // one shiver of shake marks either side of her shoulders as she freezes
    const sh = IB.drawn(tt, 110 / 24);
    if (sh >= 0 && sh < 2) { IB.shake(ctx, j.sh[0] + 0.12 * H, j.sh[1], 0.1 * H, { a: 0, n: 2, seed: 990 + sh }); IB.shake(ctx, j.sh[0] - 0.1 * H, j.sh[1], 0.1 * H, { a: Math.PI, n: 2, seed: 995 + sh }); }
    IB.bubble(ctx, ['성공!'], t, 3.0, { until: 94 / 24, tip: [j.headAt[0] + 40, j.headAt[1] - 40], x: j.headAt[0] + 170, y: j.headAt[1] - 150, seed: 500 });
  },
});
</script>
