<!doctype html>
<meta charset="utf-8">
<title>props / racing-pitlane</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/solid.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/props/sports.js"></script>
<script src="../../kit/props/racing.js"></script>
<script src="../../kit/props/pitlane.js"></script>
<script src="../sample.js"></script>
<script>
/* 소품 견본: 피트 레인과 시상대. 피트 박스를 높은 와이드로 본 차(잭에 들려 바퀴 하나가 빠진)와 휠건을 든 크루, 타이어를 든 크루, 잭과 출발 신호등, 바퀴 높이의 휠건 인서트, 시상대와 드라이버와 트로피, 샴페인 병과 코르크, 스프레이와 종이 꽃가루.
   Motion notes: 2 s loop. The wheel gun's spin marks turn on ones (a machine); the crew are drawn on twos. */
const C = IB.C, R = { c: null };
const HW = { at: [960, 760], yaw: 0, look: 0.42, f: 1500, s: 1.15 };   // the high wide of a pit box
const crewAt = (V, x, z, look) => { const sp = IB.space({ ...V, at: V.at }), U = 140 * V.s, p = sp([x * U, 0, z * U]); return { floor: p[1], x: p[0], h: 1.8 * U * (V.f / (V.f + p[2])) }; };
const boxCell = (k, f) => {
  const ctx = R.c, lift = 0.07;
  IB.pitLane(ctx, HW, { from: -9, to: 9, wall: false, teams: [7] });
  IB.pitJack(ctx, (() => { const p = crewAt(HW, 2.6, 0); return [p.x, p.floor]; })(), (() => { const p = crewAt(HW, 3.7, 0); return [p.x - 40, p.floor - 150]; })(), { s: 1, h: 46, color: IB.TEAMS[7].accent });
  const r = IB.racer(ctx, { ...HW, lift, off: [0], color: C.navy, accent: C.yellow, seed: 1670 });
  const hub = r.hubs[0], g = crewAt(HW, 2.45, -1.45), gl = IB.crewLook(7, 0, { h: g.h, dir: -1 });
  IB.crewman(ctx, IB.kneelPose(g.x, g.floor, gl, { lean: 0.5 }), gl, { gun: { tip: [hub[0] + 16, hub[1]], ang: Math.PI - 0.25, spin: f, s: 0.5 } });
  const o = crewAt(HW, 0.7, -2.1), ol = IB.crewLook(7, 1, { h: o.h, dir: 1 });
  const t = IB.tyre(ctx, HW, [1.3, -0.5, -1.7], { side: -1, width: 0.38 });
  const op = IB.kneelPose(o.x, o.floor, ol, { lean: 0.3 });
  op.hands = [[t.at[0] - t.r * 0.2, t.at[1] - t.r * 0.9], [t.at[0] - t.r * 0.9, t.at[1] + t.r * 0.1]];
  IB.crewman(ctx, op, ol);
  const j = crewAt(HW, 3.9, 0), jl = IB.crewLook(7, 2, { h: j.h, dir: -1 });
  IB.crewman(ctx, IB.posed(jl, { hip: [j.x, j.floor - 0.5 * j.h], lean: 0.5, feet: [{ a: Math.PI / 2 + 0.3, l: 0.5 }, { a: Math.PI / 2 - 0.25, l: 0.5 }], hands: [[j.x - 40, j.floor - 150], [j.x - 30, j.floor - 140]], hand: ['grip', 'grip'] }), jl);
  IB.releaseLight(ctx, [1480, 150], { state: Math.floor(k / 6) % 2 ? 'go' : 'hold' });
};
const CELLS = [
  ['pit box, high wide (lift, off)', (k, f) => boxCell(k, f), [0, 1], [180, 100, 1660, 934]],
  ['wheel gun insert (hands, nuts)', (k, f) => {
    const V = { at: [960, 900], yaw: 0, look: 0.02, f: 600, s: 2.6 }, r = IB.racer(R.c, { ...V, x: -1.75, z: 0.2, nuts: true, color: C.navy, accent: C.yellow, seed: 1670 });
    IB.wheelGun(R.c, [r.hubs[0][0] + 20, r.hubs[0][1]], Math.PI + 0.12, { s: 1.6, spin: f, band: C.yellow, hands: C.charcoal, sleeve: C.navy, from: [1900, 1300] });
  }, [2, 3], [0, 0, 1920, 1080]],
  ['carrying a tyre (#16)', (k) => {
    const V = { at: [960, 980], yaw: 0, look: 0.3, f: 1500, s: 1.2 }, p = crewAt(V, 0, -0.3), lk = IB.crewLook(16, 3, { h: p.h, dir: 1 });
    const t = IB.tyre(R.c, V, [0.75, -0.62, -0.55], { side: -1, band: C.paper, width: 0.42 });
    const pose = IB.posed(lk, { hip: [p.x, p.floor - 0.53 * p.h], lean: 0.15, feet: [{ a: Math.PI / 2 - 0.2, l: 0.5 }, { a: Math.PI / 2 + 0.15, l: 0.5 }], hands: [[0, 0], [0, 0]] });
    pose.hands = [[t.at[0] - t.r * 0.1, t.at[1] - t.r * 0.95], [t.at[0] - t.r * 0.7, t.at[1] + t.r * 0.5]]; pose.hand = ['grip', 'grip'];
    IB.crewman(R.c, pose, lk);
  }, [4], [560, 380, 800, 700]],
];
MG.scene({
  title: 'props / racing-pitlane',
  duration: 2, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx); R.c = ctx;
    SAMPLE.title(ctx, 'pit lane (props/pitlane.js)');
    const c = SAMPLE.grid(5, 5), k = Math.round(IB.twos(t) * 12), f = Math.floor(t * 24);
    CELLS.forEach(([label, draw, cells, view]) => SAMPLE.cell(ctx, cells.length > 1 ? SAMPLE.span(c, cells[0], cells[cells.length - 1]) : c[cells[0]], view, () => draw(k, f), label));
  },
});
</script>
