<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../kit/base.css">
<script src="../../kit/motion.js"></script>
<script src="../../kit/stage.js"></script>
<script src="../../kit/sketch.js"></script>
<script>
/* A driver sits in a cart behind a horse. Red hatched harness straps are drawn on one by one, the horse rears with action ticks and settles, a pink eraser rubs the harness away, and the free horse leaps off and hovers with a "?" while the cart tips onto its shaft; the horse comes back, the harness is drawn on again, and a "하네스" label points at it as the horse trots. The horse is jointed: a body outline moved by one transform, and four legs solved by two-bone IK so knees bend in every pose.
Motion notes: on twos (15 fps). Straps draw on 0.1 to 2.0 s (back strap, saddle, girth, collar, bridle, reins), the rear rises 2.5 to 2.8 s, holds to 3.3 s, settles by 3.8 s; the eraser arrives at 3.2 s and the straps are rubbed out 3.7 to 4.5 s; the horse leaps 4.6 to 5.3 s and hovers (the "AI 모델" tag pops at 6.4 s) until 7.0 s; it comes back 7.0 to 7.7 s, pencil outlines at 7.6 s are redrawn red 7.9 to 8.8 s; the label pops at 9.2 s and the horse trots in place from 9.5 s with dust puffs and an arrow. Camera: 1.0 wide, 1.3 for the rear, 1.4 for the harness redraw, 1.15 for the trot. */

const P = MG.prog;
const LW = 4.5;                       // main ink line
const GY = 800;                       // ground line
const HX = 1160, HY = 560;            // horse body centre when standing
const HIP = { fn: [140, 28], ff: [172, 32], hn: [-200, 22], hf: [-168, 28] };
const LEG = 112;                      // upper and lower leg length
const STAND = { fn: [HX + 150, GY], ff: [HX + 195, GY], hn: [HX - 215, GY], hf: [HX - 165, GY] };

const BEATS = {
  straps: { back: [0.1, 0.5], saddle: [0.5, 0.4], girth: [0.9, 0.3], collar: [1.1, 0.5], bridle: [1.5, 0.5], reins: [1.7, 0.4] },
  erase: { reins: 3.7, bridle: 3.8, collar: 3.95, saddle: 4.05, girth: 4.15, back: 4.25 },
  redraw: { back: 7.9, saddle: 8.1, girth: 8.3, collar: 8.4, bridle: 8.6, reins: 8.7 },
  pencil: 7.6, labelAt: 9.2, trotAt: 9.5, tagAt: 6.4,
  camera: [
    [0, [1.0, 1000, 540]], [2.3, [1.0, 1000, 540]], [2.8, [1.3, 1020, 470]], [3.8, [1.3, 1020, 470]],
    [4.4, [1.3, 1030, 560]], [4.9, [1.0, 1000, 540]], [7.0, [1.0, 1000, 540]], [7.7, [1.4, 1050, 520]],
    [9.2, [1.4, 1050, 520]], [10, [1.15, 1030, 560]],
  ],
};

// Harness pieces as polygons in horse-body coordinates (x forward, y down, origin at the body centre).
const PIECES = {
  back: [[-252, -22], [-30, -50], [-30, -12], [-250, 6]],
  saddle: [[-34, -82], [70, -88], [82, -46], [-26, -40]],
  girth: [[24, -50], [56, -50], [60, 64], [28, 62]],
  collar: [[104, -96], [150, -122], [236, -40], [222, -2], [190, 14], [132, -42]],
  bridle: [[338, -186], [368, -182], [374, -134], [342, -138]],
};
const ORDER = ['back', 'saddle', 'girth', 'collar', 'bridle', 'reins'];

function mixPt(a, b, u) { return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; }

/* Two-bone IK: the knee position for a leg from `hip` to `foot` with segments of LEG; bend +1 puts the knee forward (+x), -1 backward. */
function knee(hip, foot, bend) {
  let dx = foot[0] - hip[0], dy = foot[1] - hip[1];
  const d = Math.min(Math.max(Math.hypot(dx, dy), 30), LEG * 2 - 0.5);
  const ux = dx / (Math.hypot(dx, dy) || 1), uy = dy / (Math.hypot(dx, dy) || 1);
  const a = d / 2, h = Math.sqrt(Math.max(0, LEG * LEG - a * a));
  return [hip[0] + ux * a + uy * h * bend, hip[1] + uy * a - ux * h * bend];
}

/* limb(p, hip, foot, bend, seed, tone) — a tapered leg outline with a knee, a hatched lower leg and a hoof. */
function limb(p, hip, foot, bend, seed, tone) {
  const reach = Math.hypot(foot[0] - hip[0], foot[1] - hip[1]);
  const f = reach > LEG * 2 - 1 ? [hip[0] + (foot[0] - hip[0]) * (LEG * 2 - 1) / reach, hip[1] + (foot[1] - hip[1]) * (LEG * 2 - 1) / reach] : foot;
  const k = knee(hip, f, bend);
  const pts = [hip, k, f], wd = [26, 16, 11];
  const left = [], right = [];
  pts.forEach((q, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(2, i + 1)];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
    left.push([q[0] + nx * wd[i], q[1] + ny * wd[i]]);
    right.push([q[0] - nx * wd[i], q[1] - ny * wd[i]]);
  });
  const outline = [...left, ...right.reverse()];
  outline.push(outline[0]);
  p.poly(outline, { closed: true, fill: SK.WHITE, w: LW, seed, color: SK.INK });
  const lower = [left[1], left[2], right[0], right[1]];
  p.hatch(lower, { color: tone, gap: 7, w: 2.2, seed: seed + 1, angle: -55 });
  p.line(f[0] - 10, f[1] + 1, f[0] + 20, f[1] + 1, { w: 9, seed: seed + 2 });
}

/* band(p, pts, prog, seed) — one harness strap: dark outline, dense red hatching and an orange fill once drawn. */
function band(p, pts, prog, seed, ghost) {
  if (prog <= 0) return;
  const poly = pts.concat([pts[0]]);
  if (ghost) {
    p.poly(poly, { closed: true, color: SK.GREY, w: 2.5, p: prog, seed, wob: 1.2 });
    return;
  }
  p.poly(poly, { closed: true, fill: '#e26f4f', color: SK.INK, w: LW, p: prog, seed, fillAt: 0.9 });
  p.hatch(pts, { color: SK.RED_LINE, gap: 6, w: 2.6, p: prog, seed: seed + 1, angle: -50 });
}

function eraser(p, x, y, rot) {
  p.with(x, y, { rot }, () => {
    p.rect(-62, -32, 124, 64, { r: 10, fill: '#f0a9b5', w: LW, seed: 910 });
    p.rect(-18, -32, 36, 64, { fill: '#6aa0d8', w: 3, seed: 911 });
    p.line(-20, -32, -20, 32, { w: 3, seed: 912 });
    p.line(20, -32, 20, 32, { w: 3, seed: 913 });
  });
}

MG.scene({
  title: 'sketch / harness-horse-cart',
  duration: 12,
  ref: [123, 135],
  setup: (stage) => MG.canvas(stage),
  render(time, ctx) {
    const t = MG.onTwos(time);
    SK.paper(ctx, { spiral: true });
    // camera over the whole illustrated world
    const [zoom, cx, cy] = MG.kf(t, BEATS.camera);
    ctx.setTransform(zoom, 0, 0, zoom, 960 - cx * zoom, 540 - cy * zoom);
    const p = SK.pen(ctx, t);

    // ----- phases -----
    const tilt = MG.kf(t, [[2.5, 0], [2.8, 24, 'outCubic'], [3.3, 20, 'inOutQuad'], [3.8, 0, 'inOutCubic']]);
    const rearK = tilt / 24;
    const air = P(t, 4.6, 0.35) - P(t, 7.2, 0.4);               // 1 while the horse is away in the sky
    const lift = P(t, 4.6, 0.7, 'outCubic') * (1 - P(t, 7.0, 0.7, 'inOutCubic')) * 0.77;
    const gait = Math.max(P(t, BEATS.trotAt, 0.3) , P(t, 4.2, 0.2) * (1 - P(t, 4.6, 0.1)));
    const phase = t * 2.1 * Math.PI * 2;
    const bob = gait * 6 * Math.abs(Math.sin(phase)) + (air > 0.5 ? Math.sin(t * 5) * 9 : 0);
    const offX = lift * 210, offY = -lift * 300 - bob;
    const pivotGround = [HX - 215, GY];
    const pivotBody = [HX + offX, HY + offY];
    const pivot = mixPt(pivotGround, pivotBody, air);
    const rotDeg = tilt + air * 6;
    const ang = (-rotDeg * Math.PI) / 180, ca = Math.cos(ang), sa = Math.sin(ang);
    // body-frame point -> world: shift, then rotate about the pivot
    const T = (l) => {
      const wx = HX + offX + l[0] - pivot[0], wy = HY + offY + l[1] - pivot[1];
      return [pivot[0] + wx * ca - wy * sa, pivot[1] + wx * sa + wy * ca];
    };
    const trot = (base, ph) => [base[0] + gait * 42 * Math.cos(phase + ph), base[1] - gait * 52 * Math.max(0, -Math.sin(phase + ph))];
    const airFeet = { fn: T([120, 150]), ff: T([160, 120]), hn: T([-330, 90 + Math.sin(t * 6) * 15]), hf: T([-290, 140 - Math.sin(t * 6) * 15]) };
    const rearFeet = { fn: T([232, 112]), ff: T([268, 80]) };
    const feet = {
      fn: mixPt(mixPt(trot(STAND.fn, 0), rearFeet.fn, rearK), airFeet.fn, air),
      ff: mixPt(mixPt(trot(STAND.ff, Math.PI), rearFeet.ff, rearK), airFeet.ff, air),
      hn: mixPt(trot(STAND.hn, Math.PI), airFeet.hn, air),
      hf: mixPt(trot(STAND.hf, 0), airFeet.hf, air),
    };

    // ----- backdrop -----
    for (const [sx, sy, r] of [[300, 330, 20], [1620, 260, 22], [1840, 470, 18], [160, 600, 16]]) p.star(sx, sy, r, { seed: 100 + r });
    p.curve([[210, 262], [222, 270], [234, 258]], { w: 3, seed: 120, color: SK.GREY });
    SK.ground(p, GY, { w: 3, x1: -600, x2: 2500 });
    p.line(-600, GY + 52, 2500, GY + 46, { color: SK.GREY, w: 2.5, dash: [16, 12], seed: 121, step: 90 });
    for (let i = 0; i < 12; i++) p.line(-400 + i * 230, GY + 20, -394 + i * 230, GY + 4, { color: SK.GREY, w: 2.5, seed: 130 + i, wob: 0.6 });
    // title tape
    p.rect(112, 118, 470, 92, { fill: '#e7dbad', color: null, seed: 140 });
    p.text('하네스 (Harness)', 347, 160, { size: 60, align: 'center' });
    p.line(130, 200, 420, 200, { color: SK.RED, w: 6, seed: 141 });
    // flag
    p.line(1760, GY, 1760, 570, { w: LW, seed: 142 });
    p.poly([[1760, 575], [1872, 600], [1760, 640], [1760, 575]], { closed: true, fill: SK.WHITE, w: LW, seed: 143 });
    p.circle(1790, 603, 9, { w: 3, seed: 144 });

    // ----- driver -----
    const scared = t > 4.9;
    p.rect(622, 320, 90, 180, { r: 40, fill: SK.WHITE, w: LW, seed: 150 });
    p.hatch([[626, 340], [708, 340], [708, 490], [626, 490]], { color: 'rgba(90,84,74,0.5)', gap: 9, w: 1.8, seed: 151, angle: -55 });
    p.poly([[694, 352], [752, 420], [815, 403]], { w: LW, seed: 152, step: 50 });
    p.circle(818, 402, 9, { fill: SK.WHITE, w: 4, seed: 153 });
    for (let i = 0; i < 6; i++) p.line(640 + i * 12, 224, 636 + i * 12 + (i - 2.5) * 2, 206, { w: LW, seed: 160 + i, wob: 0.8 });
    p.circle(668, 266, 42, { fill: SK.WHITE, w: LW, seed: 154 });
    p.circle(682, 262, 4, { fill: SK.INK, w: 3, seed: 155 });
    p.circle(702, 262, 4, { fill: SK.INK, w: 3, seed: 156 });
    if (scared) p.circle(694, 288, 7, { w: 3, seed: 157 });
    else p.curve([[680, 282], [692, 292], [706, 282]], { w: 3.5, seed: 157 });
    if (scared) {
      const pop = P(t, 4.9, 0.3, 'outBack');
      p.with(742, 196, { scale: pop }, () => p.text('!', 0, 0, { size: 80, align: 'center' }));
      p.poly([[640, 258], [632, 276], [646, 272], [640, 258]], { color: SK.GREY, w: 2.2, seed: 158, step: 99 });
    }

    // ----- cart: box, wheel, shaft -----
    p.rect(560, 484, 340, 140, { fill: '#e6cc9f', w: LW, seed: 4 });
    p.hatch([[560, 484], [900, 484], [900, 624], [560, 624]], { color: '#b29a72', gap: 11, w: 2.2, seed: 5 });
    p.line(586, 484, 586, 624, { w: 2.5, color: SK.GREY, seed: 6 });
    const spin = t > BEATS.trotAt ? (t - BEATS.trotAt) * 1.6 : 0;
    p.circle(740, 704, 104, { w: LW, seed: 7, fill: SK.WHITE });
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + spin;
      p.line(740, 704, 740 + 100 * Math.cos(a), 704 + 100 * Math.sin(a), { w: 3, seed: 10 + i, wob: 0.8 });
    }
    p.circle(740, 704, 9, { fill: SK.INK, w: 3, seed: 20 });
    const attach = Math.max(P(t, 8.3, 0.5), 1 - P(t, 4.2, 0.4));
    const shaftEnd = mixPt([1235, 786], [1330, 610], attach);
    p.line(895, 596, shaftEnd[0], shaftEnd[1], { w: 12, color: '#d6ae78', seed: 21, step: 120 });
    p.line(895, 596, shaftEnd[0], shaftEnd[1], { w: 3, color: SK.INK, seed: 22, step: 120 });

    // dashed leap trail
    const trail = P(t, 4.7, 0.6) * (1 - P(t, 7.1, 0.5));
    if (trail > 0) p.curve([[1290, 790], [1590, 760], [1700, 540], [1620, 330]], { color: SK.GREY, w: 2.5, dash: [12, 12], p: trail, seed: 23, wob: 0.8 });

    // ----- horse -----
    const hips = {
      fn: T(HIP.fn), ff: T(HIP.ff), hn: T(HIP.hn), hf: T(HIP.hf),
    };
    const faintLeg = 'rgba(90,84,74,0.55)';
    limb(p, hips.ff, feet.ff, 1, 300, faintLeg);
    limb(p, hips.hf, feet.hf, -1, 310, faintLeg);
    limb(p, hips.hn, feet.hn, -1, 320, faintLeg);
    limb(p, hips.fn, feet.fn, 1, 330, faintLeg);
    // tail
    const sway = (gait * 18 + 8) * Math.sin(t * 4.2) + air * 30;
    for (let i = 0; i < 4; i++) {
      p.curve([T([-248, -34 + i * 5]), T([-290 + i * 6, -8 + sway * 0.3]), T([-306 + i * 9, 56 + sway * 0.6 - air * 30]), T([-300 + i * 10 + sway, 128 - air * 60])], { w: LW, seed: 340 + i });
    }
    // body
    const bodyLocal = [[-255, -30], [-235, -75], [-150, -85], [0, -78], [100, -88], [165, -150], [210, -235], [250, -262], [285, -248], [335, -205], [395, -178], [408, -150], [385, -128], [330, -140], [290, -150], [262, -108], [242, -52], [196, 4], [130, 40], [40, 58], [-60, 52], [-150, 48], [-215, 35], [-255, -30]];
    p.curve(bodyLocal.map(T), { closed: true, fill: SK.WHITE, w: 5, seed: 350 });
    p.hatch([[-210, 14], [150, 14], [130, 40], [40, 58], [-60, 52], [-215, 38]].map(T), { color: 'rgba(90,84,74,0.35)', gap: 9, w: 1.8, seed: 351, angle: -50 });
    // ear, eye, nostril, mane
    p.poly([T([232, -252]), T([240, -302]), T([266, -262]), T([232, -252])], { closed: true, fill: SK.WHITE, w: LW, seed: 352 });
    p.circle(...T([282, -212]), 6, { fill: SK.INK, w: 3, seed: 353 });
    p.circle(...T([394, -156]), 5, { fill: SK.INK, w: 3, seed: 354 });
    p.line(...T([336, -140]), ...T([372, -134]), { w: 3, seed: 355 });
    for (let i = 0; i < 8; i++) {
      const u = i / 7;
      const base = [lerpN(112, 250, u), lerpN(-94, -262, Math.pow(u, 0.9))];
      p.line(...T(base), ...T([base[0] - 26 - (i % 2) * 8, base[1] - 20 - (i % 3) * 6]), { w: LW, seed: 360 + i, wob: 0.8 });
    }

    // ----- harness: drawn on, rubbed out, drawn on again -----
    const pieceP = (name) => {
      const [s, d] = BEATS.straps[name];
      const first = P(t, s, d, 'outCubic') * (1 - P(t, BEATS.erase[name], 0.25));
      return t < 6 ? first : P(t, BEATS.redraw[name], 0.4, 'outCubic');
    };
    const ghostP = (name) => (t >= BEATS.pencil && t < 8.9 ? P(t, BEATS.pencil, 0.3) : 0);
    for (const name of ORDER.slice(0, 5)) {
      const pts = PIECES[name].map(T);
      if (t >= BEATS.pencil && pieceP(name) < 1) band(p, pts, ghostP(name), 400 + ORDER.indexOf(name) * 3, true);
      band(p, pts, pieceP(name), 400 + ORDER.indexOf(name) * 3 + 100, false);
    }
    // bridle: noseband, cheek strap and browband share one progress
    const bp = pieceP('bridle');
    band(p, [[262, -222], [284, -236], [346, -184], [334, -168]].map(T), bp, 480, false);
    band(p, [[236, -248], [262, -262], [274, -226], [250, -218]].map(T), bp, 484, false);
    // AI model tag hanging from the neck
    if (t > BEATS.tagAt) {
      const pop = P(t, BEATS.tagAt, 0.35, 'outBack');
      const tagAt = T([285, -20]);
      p.line(...T([262, -104]), tagAt[0], tagAt[1] - 20, { w: 2.5, color: SK.GREY, seed: 490 });
      p.with(tagAt[0], tagAt[1] + 14, { scale: pop, rot: Math.sin(t * 3) * 3 - rotDeg * 0.3 }, () => {
        p.rect(-62, -24, 124, 48, { r: 8, fill: SK.WHITE, w: 4, seed: 491 });
        p.text('AI 모델', 0, 2, { size: 30, align: 'center' });
      });
    }
    // reins from the driver's hand to the bridle
    const rp = pieceP('reins');
    if (rp > 0) {
      const mouth = T([350, -168]);
      p.curve([[818, 402], [1000, 440 + (mouth[1] - 440) * 0.3], [1250, mouth[1] + 40], [mouth[0], mouth[1]]], { color: SK.RED_LINE, w: 4, p: rp, seed: 495 });
    }

    // ----- rear action: ticks and nostril puffs -----
    if (rearK > 0.35) {
      const tk = Math.floor(t * 7.5) % 2;
      for (let i = 0; i < 3; i++) p.line(HX + 120 + i * 4 + tk * 5, GY - 100 + i * 20 - 4 * tk, HX + 156 + i * 4 + tk * 5, GY - 118 + i * 24, { w: 4, seed: 500 + i });
      const nose = T([410, -170]);
      p.circle(nose[0] + 22, nose[1] - 16, 12, { w: 3, seed: 505 });
      p.circle(nose[0] + 46, nose[1] - 24, 14, { w: 3, seed: 506 });
    }

    // ----- the eraser -----
    if (t > 3.1 && t < 5.1) {
      const [ex, ey, er] = MG.kf(t, [
        [3.1, [1250, 120, -40], 'outCubic'], [3.6, [1590, 360, -18], 'inOutCubic'], [3.9, [1520, 420, 6], 'inOutCubic'],
        [4.2, [1380, 400, -8], 'inOutCubic'], [4.5, [1260, 430, 8], 'inOutCubic'], [4.7, [1250, 450, 0], 'inOutCubic'], [5.0, [1450, 900, 70], 'inQuad'],
      ]);
      eraser(p, ex, ey, er);
    }

    // ----- sky marks and dust -----
    if (air > 0.8) {
      const q = P(t, 5.6, 0.3, 'outBack');
      const head = T([330, -300]);
      p.with(head[0] + 40, head[1] - 40, { scale: q, rot: 10 }, () => p.text('?', 0, 0, { size: 70, align: 'center' }));
    }
    if (t > BEATS.labelAt) {
      const pop = P(t, BEATS.labelAt, 0.35, 'outBack');
      p.with(1090, 340, { scale: pop }, () => {
        p.rect(-95, -30, 190, 60, { fill: SK.WHITE, w: 4, seed: 520 });
        p.text('하네스', 0, 2, { size: 40, align: 'center', hl: P(t, BEATS.labelAt + 0.3, 0.4) });
      });
      p.line(1090, 372, 1190, 470, { w: 2.5, color: SK.GREY, seed: 521, p: P(t, BEATS.labelAt + 0.4, 0.3) });
    }
    if (t > BEATS.trotAt) {
      const k = Math.floor(t * 7.5) % 3;
      for (let i = 0; i < 3; i++) p.ellipse(HX - 300 - i * 70 + k * 6, GY - 8 - (i % 2) * 6, 14 + i * 3, 7 + i * 2, { w: 3, color: SK.GREY, seed: 530 + i, wob: 0.8 });
      p.arrow([[1560, 690], [1640, 668], [1730, 676]], { w: 3.5, color: SK.GREY, seed: 540, p: P(t, BEATS.trotAt + 0.2, 0.4), head: 18 });
    }
  },
});
function lerpN(a, b, u) { return a + (b - a) * u; }
</script>
