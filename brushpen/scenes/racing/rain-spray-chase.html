<!doctype html>
<meta charset="utf-8">
<title>racing / rain-spray-chase</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/solid.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/props/sports.js"></script>
<script src="../../kit/props/racing.js"></script>
<script src="../../kit/props/racing-weather.js"></script>
<script src="../../kit/props/weather.js"></script>
<script src="../../kit/camera.js"></script>
<script>
/* 비 오는 레이스: 앞차가 일으킨 물보라 속을 낮은 뒤 카메라와 온보드로 달리며 깜빡이는 빨간 비 신호등만 보고 따라가다가, 물보라 밖으로 빠져나온 추격 차가 웅덩이에서 뒤가 미끄러지고 잡히는 순간을 중계 화면처럼 여섯 샷으로 잇는다. 원본에 없는 창작 장면이다. 전달하는 생각: 비 오는 날의 추격은 보이지 않는 차를 불빛 하나로 따라가는 일이다.
   Motion notes: 9 s, six shots joined by hard cuts, the broadcast over every shot (lap 23 / 58, #16 leading #7 by 0.4 s, the rain banner), rain on the frame re-rolled every drawing (IB.rain on twos) and drops on the lens in the low and onboard shots (IB.lensDrops, on ones). Both cars run 65 m/s (234 km/h, the wet pace); the rain lights blink 3 frames on, 3 off (4 a second, on ones). 0-1.42 s a long lens side on (yaw 0, f 3000), the trackside streaking past, the chaser a car length behind inside the leader's spray (IB.wetSpray); 1.42 s a camera low behind the leader (yaw PI/2, f 1400, s 2.2) riding in its spray, pushing in, the red light the brightest thing in the frame; 3.33 s the chaser's onboard (IB.cockpit over IB.trackStrip, f 700): the leader 13 m ahead is a blinking light in grey, then the wheel turns right at 4.17 s and the leader slides left out of the screen's middle as the chaser pulls out; 5.08 s head-on, long lens (f 3000): the chaser's nose comes out of the spray beside the leader, gaining 4 m; 6.0 s low 3/4 front (yaw -0.6, f 1800): it hits standing water at 6.25 s, the rear steps out 0.3 rad in 4 frames (on ones, a snap in and a 22 px jolt), counter-steer, caught by 7.3 s with a 0.06 rad overshoot; 7.5 s low behind both cars side by side in the spray, both lights blinking, held to the end. Cars, wheels, lights and lens drops on ones; spray and rain on twos. */
const C = IB.C, V = 65;   // m/s
const LEAD = { num: 16, color: C.yellow, accent: C.navy }, CHASE = { num: 7, color: C.navy, accent: C.yellow };
const SLIP = 150;
const SHOT = [[0, 'side'], [34, 'behind'], [80, 'onboard'], [122, 'emerge'], [144, 'slide'], [180, 'pair']];
const SHOTS = [
  [0, { at: [960, 830], w: 1300 }],
  [34, { at: [960, 560], w: 1920 }, 'cut'], [34, { at: [960, 600], w: 1600 }, 'push', 46],
  [80, { at: [960, 540], w: 1920 }, 'cut'],
  [122, { at: [960, 720], w: 1300 }, 'cut'],
  [144, { at: [960, 600], w: 1800 }, 'cut'], [SLIP, { at: [960, 620], w: 1450 }, 'snap'],
  [180, { at: [960, 560], w: 1920 }, 'cut'], [180, { at: [960, 590], w: 1700 }, 'push', 36],
];
const lit = (f, ph = 0) => (f + ph) % 6 < 3;
// the aquaplane: the chaser's heading (rad, + the rear stepping out to the left of its way) keyed on ones, and the counter-steer that catches it
const YAW = [[0, 0], [SLIP, 0], [SLIP + 1, 0.1], [SLIP + 2, 0.2], [SLIP + 3, 0.36], [SLIP + 4, 0.42], [SLIP + 7, 0.42], [SLIP + 11, 0.26], [SLIP + 16, 0.06], [SLIP + 20, -0.07], [SLIP + 24, -0.02], [SLIP + 27, 0]];
const key = (keys, f) => { let i = 1; while (i < keys.length - 1 && keys[i][0] < f) i++; const [f0, a] = keys[i - 1], [f1, b] = keys[i]; return f >= f1 ? b : a + (b - a) * Math.max(0, (f - f0) / (f1 - f0)); };
const slip = (f) => key(YAW, f), steerOf = (f) => -1.3 * key(YAW, f - 2);
const tower = (f) => [{ num: 16, color: C.yellow, gap: '선두' }, { num: 7, color: C.navy, gap: '+0.4', hi: f >= 122 }, { num: 3, color: C.mint, gap: '+6.1' }, { num: 22, color: C.lavender, gap: '+9.8' }];

IB.actors = (t) => { const f = Math.floor(t * 24); return { shot: IB.held(SHOT, f), slip: Math.round(slip(f) * 100) / 100, light: lit(f) }; };

MG.scene({
  title: 'racing / rain-spray-chase',
  duration: 9, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = Math.floor(t * 24), d = IB.frame(IB.twos(t)), shot = IB.held(SHOT, f), cam = IB.shot(SHOTS, f, { jolt: [[SLIP, 22]] }), run = V * t, spin = run / 0.36;
    IB.film(ctx, cam, (ctx) => {
      if (shot === 'side') {
        const W = { at: [960, 900], yaw: 0, look: 0.04, f: 3000, s: 0.7 }, map = IB.trackSpace(W), lead = { x: 1.5, z: -1.2 }, chase = { x: -5.4 + f * 0.02, z: -1.2 };
        IB.trackside(ctx, [-400, 2400], 900, { run, blur: 1, colors: [C.navy, C.yellow] });
        IB.wetSpray(ctx, map, chase, { d, len: 12, seed: 3150 });
        IB.racer(ctx, { ...W, ...CHASE, ...chase, spin, blur: true, lit: lit(f, 2), seed: 1670 });
        IB.wetSpray(ctx, map, lead, { d, len: 12 });
        IB.racer(ctx, { ...W, ...LEAD, ...lead, spin, blur: true, lit: lit(f), seed: 1760 });
      }
      if (shot === 'behind') {
        const B = { at: [960, 960], yaw: Math.PI / 2, look: 0.05, f: 1400, s: 2.2 }, map = IB.trackSpace(B), lead = { x: 2.6, z: -0.4 };
        IB.trackStrip(ctx, { ...B, from: -2, to: 220, half: 6, run });
        IB.trackPuddles(ctx, map, { from: 0, to: 140, run, half: 5 });
        IB.racer(ctx, { ...B, ...LEAD, ...lead, spin, blur: true, lit: lit(f), seed: 1760 });
        IB.wetSpray(ctx, map, lead, { d, len: 14, high: 2.4, maxR: 200 });
        IB.rainLight(ctx, IB.carAt(map, lead, [-2.62, -0.42, 0]), { on: lit(f), s: 1.6 });
      }
      if (shot === 'onboard') {
        const k = Math.max(0, Math.min(1, (f - 100) / 14)), u = k * k * (3 - 2 * k);   // pulling out: the wheel turns right, the leader slides left
        const O = { at: [960, 640], yaw: Math.PI / 2, look: 0.05, f: 900, s: 1.5 }, map = IB.trackSpace(O), lead = { x: 4.5, z: -1.1 + 3.2 * u };
        IB.trackStrip(ctx, { ...O, z: 0, from: 1, to: 160, half: 6, run });
        IB.trackPuddles(ctx, map, { from: 2, to: 120, run, half: 5, seed: 3520 });
        IB.racer(ctx, { ...O, ...LEAD, ...lead, spin, blur: true, lit: lit(f), seed: 1760 });
        IB.wetSpray(ctx, map, lead, { d, len: 9, high: 2.2, mist: 6, maxR: 200 });
        IB.rainLight(ctx, IB.carAt(map, lead, [-2.62, -0.42, 0]), { on: lit(f), s: 1.2 });
        IB.cockpit(ctx, { color: C.navy, steer: 0.22 * Math.sin(Math.PI * Math.min(1, Math.max(0, (f - 98) / 20))), shake: 3, d: f });
      }
      if (shot === 'emerge') {
        const A = { at: [960, 900], yaw: -Math.PI / 2, look: 0.04, f: 3000, s: 1.6 }, map = IB.trackSpace(A), k = Math.min(1, (f - 122) / 18), u = k * k * (3 - 2 * k);
        const lead = { x: 0, z: -0.9 }, chase = { x: -12 + 4 * Math.min(1, (f - 122) / 22), z: -0.9 + 2.9 * u, heading: 0.06 * Math.sin(Math.PI * k) };
        IB.trackStrip(ctx, { ...A, from: -140, to: 8, half: 6, run });
        IB.wetSpray(ctx, map, chase, { d, len: 12, seed: 3150 });
        IB.racer(ctx, { ...A, ...CHASE, ...chase, steer: 0.12 * Math.sin(Math.PI * k), spin, blur: true, seed: 1670 });
        IB.wetSpray(ctx, map, lead, { d, len: 16, high: 3, mist: 26 });
        IB.racer(ctx, { ...A, ...LEAD, ...lead, spin, blur: true, seed: 1760 });
      }
      if (shot === 'slide') {
        const Q = { at: [960, 860], yaw: -1.0, look: 0.08, f: 1800, s: 1.3 }, map = IB.trackSpace(Q), car = { x: 0, z: 0, heading: slip(f) };
        IB.trackStrip(ctx, { ...Q, from: -60, to: 60, half: 6, run });
        IB.trackPuddles(ctx, map, { from: -40, to: 50, run, half: 4, every: 11, seed: 3540 });
        IB.wetSpray(ctx, map, car, { d, len: 12, high: f >= SLIP && f < SLIP + 16 ? 3.4 : 2.4, mist: f >= SLIP && f < SLIP + 16 ? 26 : 18, seed: 3150 });
        const r = IB.racer(ctx, { ...Q, ...CHASE, ...car, steer: steerOf(f), spin, blur: true, bodyRoll: slip(f) * 0.12, seed: 1670 }), k = Math.floor((f - SLIP) / 2);
        if (k >= 0 && k <= 4) IB.wheelSplash(ctx, r.wheels[2], { k }, { h: 230, w: 220, lean: -150, seed: 975 });   // the near rear tyre throws the puddle out as it steps
      }
      if (shot === 'pair') {
        const B = { at: [960, 960], yaw: Math.PI / 2, look: 0.05, f: 1400, s: 2 }, map = IB.trackSpace(B), lead = { x: 4.6, z: 1.6 }, chase = { x: 4.0 + (f - 180) * 0.02, z: -1.6 };
        IB.trackStrip(ctx, { ...B, from: -2, to: 260, half: 6, run });
        IB.trackPuddles(ctx, map, { from: 0, to: 160, run, half: 5, seed: 3560 });
        [[lead, LEAD, 1760, 0, 3100], [chase, CHASE, 1670, 2, 3150]].sort((a, b) => b[0].x - a[0].x).forEach(([car, team, seed, ph, ss]) => {
          IB.racer(ctx, { ...B, ...team, ...car, spin, blur: true, lit: lit(f, ph), seed });
          IB.wetSpray(ctx, map, car, { d, len: 12, high: 2.2, mist: 12, seed: ss, maxR: 160 });
          IB.rainLight(ctx, IB.carAt(map, car, [-2.62, -0.42, 0]), { on: lit(f, ph), s: 1.1 });
        });
      }
      IB.rain(ctx, [-200, -100, 2120, 1180], { d }, { n: 80, len: 44, slant: 0.22, w: 2, seed: 960 });
    });
    if (shot === 'behind' || shot === 'onboard' || shot === 'pair') IB.lensDrops(ctx, { f, n: shot === 'onboard' ? 14 : 18, seed: shot === 'onboard' ? 3410 : 3400 });
    IB.broadcast(ctx, { lap: [23, 58], rows: tower(f), banner: f < 80 ? '비 · 젖은 노면' : f >= SLIP + 6 ? '#7 아쿠아플레이닝 · 수습' : '' });
  },
});
</script>
