<!doctype html>
<meta charset="utf-8">
<title>street / bike-bell-sidestep</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/nature.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../../kit/props/traffic.js"></script>
<script>
/* 화분이 놓인 인도를 걷던 사람이 등 뒤에서 울린 자전거 벨에 멈칫하고, 웅크렸다 펄쩍 뛰어 옆으로 비켜서자 자전거가 바로 그 자리를 스쳐 지나가고, 남은 사람이 가슴을 쓸어내리며 숨을 내쉰다. 원본에 없는 창작 장면으로, 한 사람 자전거(IB.bicycle, IB.ride)와 벨 소리 표시(IB.bellRing), 화분(IB.pottedPlant), 걷기(IB.walk), 흔들림선(IB.shake), 입김(IB.breath)을 썼다. 전달하는 생각: 놀람은 준비 한 장과 지나친 한 장 사이에서 읽힌다.
   Motion notes: one locked shot, 6 s, two rows of pavement 60 px apart (floor 950 far, 1010 near), each with its own smear; the walker (h 450, line 3.4 px: the reaction carries the scene, so the standing size) and the rider (h 450) on twos, every walker drawing passing the one before as pose.prev. The walker walks in on the near row from x 420 at IB.walkLen / 12 = 31.5 px a drawing. The bicycle (IB.bicycle at s 1.7: wheels of radius 85, a 290 px wheelbase, with its rider dressed by IB.ride, lean 0.5) comes in behind on the same row at 64 px a drawing (768 px/s, 2.03 times the walk), pedals one turn in twelve drawings, wheels and spin marks alternating every drawing, ripples under both wheels. 1.17 s the bell rings: four drawings of IB.bellRing (a small bell tipping the other way each drawing and rising 6 px, shake arcs at the real bell). 1.33 s the walker stops on a stride (phase 1/3, the lifted foot put down where it is) and freezes, the spine tipped back 0.1 and the hands up open at the chest (the hip stays, so both feet stay planted), eyes wide, held two drawings; 1.5 s anticipation, down before up (hip 0.09 h lower, lean 0.22, arms back, eyes shut); 1.58 s in the air past where the hop needs (hip 0.11 h above the middle of the two rows, both feet tucked up off the floor within 0.5 h of the hip, arms flung out to both sides, not up, so the near arm does not cover the face); 1.67 s lands on the far row crouched (hip 0.07 h low); 1.75 s stands, hands up in front, and holds; shake arcs either side of the head for three drawings from the landing. The bicycle reaches the spot the walker left at about 1.75 s and passes in front (it is on the near row), gone off the right edge at 3.83 s. Held 2.5 s from 1.83 s; 4.33 s the breath in (lean -0.09, nod -0.12, the near hand to the chest; the hip stays); 4.42 s the sigh past where it settles (lean 0.16, nod 0.22, hip 9 px down, eyes shut) with three breath lines leaving the mouth over three drawings (IB.breath, big 0.6); 4.5 s settles with a small smile, the head a drawing later; the last breath line goes at 4.67 s and from then nothing moves. Two potted plants (IB.pottedPlant) on the far row stand for the pavement. Colours: the bicycle's blue frame and the walker's lavender; the rider is in white and charcoal. */
const C = IB.C, F = IB.FIG, H = 450, NEAR = 1010, FAR = 950;
const WHO = { ...IB.PASSERSBY[0], h: H, dir: 1, seed: 40 }, RIDER = { ...IB.PASSERSBY[4], h: H, dir: 1, seed: 70 };
const BS = 1.25 * H / 330;   // the bicycle sized to its rider (1.25 for h 330)

/* ---------- the walker: walks in on the near row, stops on a stride (phase 1/3), hops to the far row ---------- */
const PACE = IB.walkLen(WHO) / 12, WX0 = 420, WK = 16, XS = WX0 + WK * PACE, PH = (WK / 12) % 1;   // stops on drawing 16 (1.33 s)
const strideOn = (floor) => { const p = IB.walk(XS, NEAR, WHO, PH); return { ...IB.stand(XS, floor, WHO), feet: p.feet.map((ft) => [ft[0], floor - F.ankle * H, 0]) }; };
const S1 = strideOn(NEAR), S2 = strideOn(FAR), hy = (S) => S.hip[1], sh = (S) => S.hip[1] - F.torso * H;
const near = (S, dx, dy) => [XS + dx * H, sh(S) + dy * H];
const DRAW = {
  startle: { ...S1, lean: -0.1, nod: -0.08, hands: [near(S1, 0.13, 0.05), near(S1, 0.09, 0.08)], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open', brow: 1 } },   // freezes mid-stride, shoulders up: the spine tips back and the hands come up, the hip stays (lifting it would lift both planted feet)
  crouch: { ...S1, hip: [XS - 6, hy(S1) + 0.09 * H], lean: 0.22, nod: 0.1, hands: [near(S1, -0.1, 0.24), near(S1, -0.14, 0.22)], hand: ['relax', 'relax'], face: { eye: 'closed', mouth: 'flat', brow: 1 } },   // the anticipation: down before up
  air: { ...S1, hip: [XS + 4, (hy(S1) + hy(S2)) / 2 - 0.11 * H], lean: -0.1, nod: -0.1, feet: [[XS + 0.08 * H, (NEAR + FAR) / 2 - 0.25 * H, 0.4], [XS - 0.05 * H, (NEAR + FAR) / 2 - 0.21 * H, 0.6]], hands: [[XS + 0.18 * H, sh(S1) - 0.12 * H], [XS - 0.17 * H, sh(S1) + 0.01 * H]], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open', brow: 1 } },   // past where it lands: higher than the hop needs, knees tucked (both feet within 0.5 h of the hip, inside the leg's 0.52 h), arms flung out to both sides (not up: the near arm would cover the face)
  land: { ...S2, hip: [XS, hy(S2) + 0.07 * H], lean: 0.12, nod: 0.04, hands: [near(S2, 0.16, 0.08), near(S2, 0.12, 0.1)], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open', brow: 1 } },
  guard: { ...S2, lean: -0.04, nod: -0.02, hands: [near(S2, 0.14, 0.04), near(S2, 0.1, 0.07)], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'flat', brow: 1 } },   // stands, hands up in front, watching it go
  breathIn: { ...S2, lean: -0.09, nod: -0.12, hands: [near(S2, 0.04, 0.15), near(S2, 0.07, 0.1)], hand: ['relax', 'open'], face: { eye: 'dot', mouth: 'flat', brow: 1 } },   // the near hand to the chest; the hip stays, so the feet stay down
  sighPast: { ...S2, hip: [XS + 2, hy(S2) + 9], lean: 0.16, nod: 0.22, hands: [near(S2, 0.05, 0.27), near(S2, 0.09, 0.13)], hand: ['relax', 'open'], face: { eye: 'closed', mouth: 'open', brow: 1 } },
  sigh: { ...S2, hip: [XS + 1, hy(S2) + 6], lean: 0.12, nod: 0.16, hands: [near(S2, 0.04, 0.26), near(S2, 0.08, 0.14)], hand: ['relax', 'open'], face: { eye: 'closed', mouth: 'smile', brow: 1 } },
};
const STOP = WK * 2, BREATH = 104;
const ACT = [[STOP, DRAW.startle], [STOP + 4, DRAW.crouch], [STOP + 6, DRAW.air], [STOP + 8, DRAW.land], [STOP + 10, DRAW.guard], [BREATH, DRAW.breathIn], [BREATH + 2, DRAW.sighPast], [BREATH + 4, DRAW.sigh]];
const walkerOn = (f) => (f < STOP ? { ...IB.walk(WX0 + (f >> 1) * PACE, NEAR, WHO, ((f >> 1) / 12) % 1), face: { mouth: 'flat' } } : IB.held(ACT, f));
const walkerAt = (t) => { const f = IB.frame(IB.twos(t)); return f > 0 ? { ...walkerOn(f), prev: walkerOn(f - 2) } : walkerOn(f); };

/* ---------- the bicycle: a rider on twos, 64 px a drawing, pedals one turn in twelve drawings ---------- */
const BX0 = -680, BV = 64, RING = 28;   // the bell rings over frames 28-35
const bikeAt = (f) => { const k = f >> 1, x = BX0 + k * BV; return x - 140 * BS > 1990 ? null : { x, crank: (k / 12) * Math.PI * 2, alt: k % 2 }; };
const riderOf = (fit) => IB.ride(fit, RIDER, { lean: 0.5 });
IB.actors = (t) => { const f = IB.frame(IB.twos(t)), b = bikeAt(f); return { walker: walkerAt(t), bike: b, ring: f >= RING && f < RING + 8 ? (f - RING) >> 1 : null }; };

MG.scene({
  title: 'street / bike-bell-sidestep',
  duration: 6, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(IB.twos(t)), b = bikeAt(f), p = walkerAt(t);
    IB.pottedPlant(ctx, [1560, FAR - 30], IB.PLANTS.tall);
    IB.pottedPlant(ctx, [250, FAR - 30], { ...IB.PLANTS.bushy, seed: 530 });
    IB.smear(ctx, 960, FAR - 11, 1900, { h: 16, seed: 8, alpha: 0.45 });
    IB.smear(ctx, 960, NEAR - 11, 1900, { h: 18, seed: 9, alpha: 0.75 });
    const j = IB.figure(ctx, p, { ...WHO, face: p.face });
    if (f >= STOP + 8 && f < STOP + 14) { const k = (f - STOP - 8) >> 1; IB.shake(ctx, j.headAt[0] - 40, j.headAt[1] + 10, 44, { a: Math.PI + 0.2, n: 2, seed: 600 + k * 5, w: 2.6 }); IB.shake(ctx, j.headAt[0] + 30, j.headAt[1] + 10, 44, { a: -0.2, n: 2, seed: 620 + k * 5, w: 2.6 }); }   // the landing trembles for three drawings
    if (f >= BREATH + 2 && f < BREATH + 8) IB.breath(ctx, j.headAt, { k: (f - BREATH - 2) >> 1, big: 0.6, seed: 700 });
    if (b) {
      const fit = IB.bikeFit([b.x, NEAR], b.crank, { s: BS });
      for (const [ax] of fit.axles) IB.ripples(ctx, [ax, NEAR], { alt: b.alt, seed: 70 + Math.round(ax) % 7 });
      IB.bicycle(ctx, [b.x, NEAR], b, { s: BS });
      IB.figure(ctx, riderOf(fit), { ...RIDER, face: { mouth: 'smile' } });
      if (f >= RING && f < RING + 8) IB.bellRing(ctx, fit.bell, { k: (f - RING) >> 1 });
    }
  },
});
</script>
