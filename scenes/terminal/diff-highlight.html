<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../kit/base.css">
<link rel="stylesheet" href="../../kit/terminal.css">
<script src="../../kit/motion.js"></script>
<script src="../../kit/stage.js"></script>
<script src="../../kit/terminal.js"></script>
<script>
/* Terminal output writes a model configuration as a green diff and stickers explain who handles the work. The highlighted phrases connect the file to the next session's behaviour. Motion notes: the diff arrives at 1.3 s, highlights sweep over 0.4 s at 1.8 and 5.5 s, and navy stickers stamp with overshoot at 8 and 11 s. */
const BEATS = { diff: 1.3, filename: 1.8, result: 3.6, phrase: 5.5, sticker1: 8, sticker2: 11 };
const FRAME = { stickerRight: 80, stickerY: 260, stickerGap: 90 };
const CAMERA = [[0, [1, 0, 0]], [13.5, [1, 0, 0]]];
const INTRO = [
  '✓ Successfully installed plugin: pstack@cursor-plugins',
  '❯ /pstack:setup-pstack',
  '  Searched for 2 patterns, read 1 file',
  '● pstack 모델 설정을 시작합니다. 기존 규칙 파일을 읽어서 스킬 기본값을 결정합니다.',
  '  감지한 모델: opus, sonnet, haiku, fable · inherit-parent, auto',
  '  Grok은 Claude Code에서 쓸 수 없어서 세션 모델로 실행됩니다.',
  '',
  '● feature, refactoring · bug-fix · perf-issue · inherit-parent',
  '',
  '● judgment and prose · hardest tasks · opus xhigh',
  '',
  '● arena · architect runners · interrogate reviewers · opus xhigh',
];
MG.scene({
  title: 'terminal / diff-highlight',
  duration: 13.5,
  ref: [424, 437.5],
  setup(stage) {
    const root = Terminal.root(stage);
    const win = Terminal.window(root);
    INTRO.forEach((text) => Terminal.line(win.body, text));
    const filename = Terminal.line(win.body, '', 'term-green');
    const diff = MG.el('div', { class: 'term-diff', html: '+ 84 lines to ~/.claude/rules/pstack-models.md<br>+ budget: large (xhigh)<br>+ feature, refactoring: inherit-parent<br>+ bug-fix: inherit-parent<br>+ judgment and prose: opus xhigh<br>+ hardest tasks: opus xhigh<br>+ architect runners: opus xhigh, inherit-parent' });
    win.body.append(diff);
    const result = Terminal.line(win.body, '');
    Terminal.line(win.body, '✻ Thinking… (esc to interrupt)', 'term-red');
    win.body.append(MG.el('div', { class: 'term-rule' }));
    Terminal.status(win.body);
    Terminal.webcam(root);
    const stickers = ['※ Grok 담당 역할', '→ 세션 모델이 대신!'].map((text, i) => {
      const node = MG.el('div', { class: 'term-sticker', text, style: { right: FRAME.stickerRight + 'px', top: FRAME.stickerY + i * FRAME.stickerGap + 'px' } });
      root.append(node);
      return node;
    });
    return { root, filename, diff, result, stickers };
  },
  render(t, refs) {
    Terminal.camera(refs.root, t, CAMERA);
    // The write operation reveals the green diff block.
    refs.diff.style.visibility = t >= BEATS.diff ? 'visible' : 'hidden';
    // The Write line arrives with its diff, and the result line only after the write has been shown.
    refs.filename.style.visibility = t >= BEATS.diff - 0.3 ? 'visible' : 'hidden';
    refs.result.style.visibility = t >= BEATS.result ? 'visible' : 'hidden';
    refs.filename.innerHTML = '● Write(~/.claude/rules/<span class="term-hl">pstack-models.md</span>)';
    refs.filename.querySelector('.term-hl').style.setProperty('--p', MG.prog(t, BEATS.filename, 0.4));
    refs.filename.querySelector('.term-hl').style.color = t < BEATS.filename ? 'inherit' : '#17251c';
    // Sweep the second highlighter across the session phrase.
    refs.result.innerHTML = '● 규칙 파일을 썼습니다. <span class="term-hl">새 세션부터</span> 적용됩니다.';
    refs.result.querySelector('.term-hl').style.setProperty('--p', MG.prog(t, BEATS.phrase, 0.4));
    refs.result.querySelector('.term-hl').style.color = t < BEATS.phrase ? 'inherit' : '#17251c';
    // Handwritten stickers stamp onto the right with a small overshoot.
    refs.stickers.forEach((node, i) => {
      const p = MG.prog(t, i ? BEATS.sticker2 : BEATS.sticker1, 0.3, 'outBack');
      node.style.opacity = MG.clamp(p);
      node.style.transform = `rotate(${i ? 2 : -2}deg) scale(${p})`;
    });
  },
});
</script>
