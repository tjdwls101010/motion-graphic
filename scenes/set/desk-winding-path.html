<!doctype html>
<meta charset="utf-8">
<title>set / desk-winding-path</title>
<link rel="stylesheet" href="../../kit/base.css">
<script src="../../kit/motion.js"></script>
<script src="../../kit/stage.js"></script>
<script src="../../kit/sketch.js"></script>
<script src="../../kit/set.js"></script>
<script>
/* Two checklist phones are connected by a winding route, which becomes numbered stepping stones for a small blue-topped walker. The walker steps onto the first stones, then takes one long hop over stones 2 and 3 that leaves a dashed arc, and two grey arcs underneath show that whole stretches can be skipped. Motion notes: stones pop in from 0.8 s at 0.18 s gaps, the camera pushes in from 1.4 to 2.4 s, the walker hops onto stone 0 at 1.9 s and stone 1 at 2.5 s with a crouch before each takeoff and a 0.2 s squash on landing, then flies to stone 4 from 3.2 to 4.15 s along a dashed arc, and the skip arcs draw at 4.6 s and 5 s as the camera backs out; movement is on twos. */
const BEATS = { stones: 0.8, push: 1.4, hopOne: 1.9, hopTwo: 2.5, hopLong: 3.2, arcs: 4.6 };
const PATH = [[380, 620], [580, 740], [760, 760], [970, 650], [1160, 570], [1350, 670], [1510, 620]];
const STONES = [[430, 655], [570, 725], [735, 750], [900, 690], [1060, 610], [1200, 590], [1340, 665], [1450, 655]];
const LABELS = ['설치', '아이디어', '검증 스킬', '기능 추가', '버그 수정', '구조 정리', '스킬 정리', '다음 작업'];
const START = [370, 690];
const HOPS = [
  { from: START, to: STONES[0], start: BEATS.hopOne, dur: 0.45, lift: 45 },
  { from: STONES[0], to: STONES[1], start: BEATS.hopTwo, dur: 0.5, lift: 55 },
  { from: STONES[1], to: STONES[4], start: BEATS.hopLong, dur: 0.95, lift: 190 },
];
const GREY = '#8f897e';
/** Where the walker is at time t: standing, crouching before a takeoff, flying along a hop arc or squashed after landing. */
function walkerPose(t) {
  let pose = { x: START[0], y: START[1], air: 0, squash: 1, flying: null };
  for (const hop of HOPS) {
    const u = (t - hop.start) / hop.dur;
    if (t < hop.start) {
      const crouch = t > hop.start - 0.15 ? Math.sin(MG.prog(t, hop.start - 0.15, 0.15) * Math.PI / 2) : 0;
      return { ...pose, squash: Math.min(pose.squash, 1 - 0.1 * crouch) };   // keep the landing squash from the previous hop until the crouch is deeper
    }
    if (u < 1) {
      const arc = Math.sin(u * Math.PI);
      return { x: MG.lerp(hop.from[0], hop.to[0], u), y: MG.lerp(hop.from[1], hop.to[1], u) - arc * hop.lift, air: arc, squash: 1, flying: hop };
    }
    const since = t - (hop.start + hop.dur);
    pose = { x: hop.to[0], y: hop.to[1], air: 0, squash: since < 0.2 ? 1 - 0.14 * Math.sin((since / 0.2) * Math.PI) : 1, flying: null };
  }
  return pose;
}
MG.scene({
  title: 'set / desk-winding-path',
  duration: 5.8,
  ref: [902, 907.8],
  setup: stage => MG.canvas(stage),
  render(time, ctx) {
    const t = MG.onTwos(time);
    const p = SK.pen(ctx, t);
    // Push into the stepping stones and track the walker, then back out for the skip arcs.
    const camera = MG.kf(t, [[0, [1.2, 960, 540]], [BEATS.push, [1.2, 960, 540]], [2.4, [1.7, 780, 640]], [3.2, [1.7, 800, 620]], [3.7, [1.7, 930, 540]], [4.2, [1.7, 1050, 600]], [5.2, [1.3, 1050, 600]], [5.8, [1.2, 1050, 590]]]);
    SET.camera(ctx, ...camera);
    SET.desk(ctx, p);
    SET.phone(p, 300, 470, false, 0.65);
    SET.phone(p, 1590, 470, true, 0.65);
    SET.fountain(p, 1770, 690, 0.85);
    p.curve(PATH, { w: 6, color: '#3a2a22', seed: 200 });
    // Skip arcs under stones 4 to 7 show that a stretch may be jumped over.
    const [x4, y4] = STONES[4];
    const [x7, y7] = STONES[7];
    p.curve([[x4 - 10, y4 + 34], [(x4 + x7) / 2 - 20, y4 + 210], [x7 + 10, y7 + 34]], { color: '#6b655b', w: 4, p: MG.prog(t, BEATS.arcs, 0.7), seed: 205 });
    p.curve([[x4 + 40, y4 + 38], [(x4 + x7) / 2, y4 + 170], [x7 - 30, y7 + 38]], { color: '#6b655b', w: 3.5, p: MG.prog(t, BEATS.arcs + 0.4, 0.6), seed: 206 });
    // Stones pop in one after another, with handwritten step names.
    STONES.forEach(([x, y], i) => {
      const progress = MG.prog(t, BEATS.stones + i * 0.18, 0.3, 'outBack');
      if (progress <= 0) return;
      p.with(x, y, { scale: progress }, () => {
        p.ellipse(8, 14, 72, 28, { fill: 'rgba(76,67,54,.28)', color: null, seed: 210 + i });
        const stone = p.ellipse(0, 0, 72, 28, { fill: '#b9b5a6', w: 4, seed: 220 + i });
        p.hatch(stone, { color: 'rgba(60,54,44,.35)', gap: 5, w: 1.1, angle: 20, seed: 240 + i });
        p.text(String(i), 0, 0, { size: 30, align: 'center' });
        p.text(LABELS[i], 0, i % 2 ? -50 : 52, { size: 32, align: 'center' });
      });
    });
    // The walker hops stone to stone: crouch, arc through the air, squash on landing.
    const pose = walkerPose(t);
    if (t >= BEATS.hopLong) {
      const trail = [];
      for (let k = 0; k <= 10; k++) {
        const u = k / 10;
        trail.push([MG.lerp(STONES[1][0], STONES[4][0], u), MG.lerp(STONES[1][1], STONES[4][1], u) - Math.sin(u * Math.PI) * 190 - 100]);
      }
      p.curve(trail, { color: GREY, w: 3.5, dash: [12, 10], p: MG.prog(t, BEATS.hopLong, 0.95), seed: 207 });
    }
    SET.walker(p, pose.x, pose.y - 8, 0.62, { air: pose.air, squash: pose.squash, stride: pose.flying ? 0 : 0.1, seed: 330 });
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  },
});
</script>
