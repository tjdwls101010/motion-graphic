<!doctype html>
<meta charset="utf-8">
<title>soccer / slide-tackle-hurdle</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/athletes.js"></script>
<script src="../../kit/props/sports.js"></script>
<script src="../../kit/camera.js"></script>
<script>
/* 슬라이딩 태클: 공을 몰고 전력으로 달리는 공격수에게 수비수가 마주 달려와 발부터 미끄러져 들어가 공만 정확히 걷어 낸다. 공격수는 뻗은 다리를 뛰어넘어 비틀거리며 착지하고 돌아서 두 팔을 벌려 항의하고, 수비수는 잔디에 긴 자국을 남긴 채 일어나 주먹을 쥔다. 원본에 없는 창작 장면이다. 전달하는 생각: 깨끗한 태클은 공만 데려간다.
   Motion notes: seen from the touchline, 7 s, filmed in four shots (IB.shot, on ones): 0-1.0 s a 1750 px wide of the two running at each other pushing in to 1200; 1.0 s a cut to a 560 px close-up down on the grass as the defender slides into the frame, shaking 20 px when his boot meets the ball (1.25 s); 1.42 s a cut to a 900 px medium of the hurdle, shaking 16 px on the landing (1.75 s); 2.5 s an ease in (14 frames) to a 640 px two-shot of the protest and the fist; 4.17 s an ease out to a 1350 px wide (20 frames). On the stage the players are 252 px (1.8 m, 140 px a metre, gravity 1373 px/s²). The attacker runs on IB.run at IB.runLen / 8 a drawing with the ball rolling just ahead; the defender runs at him (dir -1) and at 1.0 s drops into the slide: on his hip, the spine laid back 1.15 rad, the lead leg out along the ground, sliding from 6 m/s to a stop over 1.5 m (uniform deceleration, so the gaps between drawings shrink), a green smear left behind him. 1.25 s his boot meets the ball (a burst) and sends it back past the attacker (3.6 m/s, 2.1 up, bouncing e 0.5). The attacker takes off the drawing after, clears the legs on a gravity arc (0.35 m up) with his knees tucked, lands pitched forward with his arms out (1.75 s), catches himself, and at 2.5 s turns (a drawing with no prev) and spreads his arms at the referee off screen. The defender sits up (1.83 s), comes up on one knee (2.17 s), stands (2.67 s) and clenches a fist (3.0 s). From 3.5 s nothing moves but the crowd, which stands at 4.5 s. Colours: the two kits' navy and yellow; the pitch is a green chalk smear. */
const F = IB.FIG, FLOOR = 900, M = 140, H = 1.8 * M, G = 9.81 * M, R = 0.11 * M, PI = Math.PI;
const ATT = IB.athlete('soccer', 'away', 1, { h: H, dir: 1, seed: 30 });
const DEF = IB.athlete('soccer', 'home', 3, { h: H, dir: -1, seed: 40 });
const HY = IB.stand(0, FLOOR, ATT).hip[1], AY = FLOOR - F.ankle * H;
const RL = IB.runLen(ATT) / 8;

/* ---------- the meeting ---------- */
const FS = 24, FC = 30, MEET = 1000;                       // slide starts, contact, where the ball is met
const A0 = MEET - 0.36 * H - (FC / 2) * RL;                // the attacker's run is laid so the ball reaches MEET on the contact drawing
const ax = (f) => A0 + (f / 2) * RL;
const ballX = (f) => ax(f) + 0.3 * H + 0.06 * H * (1 - (((f / 2) / 8) % 1));
const KICK = { p: [ballX(FC), FLOOR - R], v: [-3.6 * M, -2.1 * M], g: G, floor: FLOOR - R, e: 0.5, mu: 0.8, roll: 2 * M };
function ballAt(f) {
  if (f < FC) return { p: [ballX(f), FLOOR - R], rot: (ballX(f) - A0) / R };
  const q = IB.flight(KICK, (f - FC) / 24); return { p: q.p, rot: (ballX(FC) - A0) / R + (q.p[0] - ballX(FC)) / R };
}

/* ---------- the defender's slide: from 6 m/s to rest over 1.5 m ---------- */
const V0 = 6 * M, SL = 1.5 * M, DEC = (V0 * V0) / (2 * SL), TS = V0 / DEC;   // 0.5 s
const slideX = (f) => { const t = MG.clamp((f - FS) / 24, 0, TS); return X_START - (V0 * t - (DEC * t * t) / 2); };
// the lead boot reaches the ball on the contact drawing: solve the slide's start from it
const bootReach = 0.53 * H;
const X_START = (() => { const t = (FC - FS) / 24; return ballX(FC) + bootReach + (V0 * t - (DEC * t * t) / 2); })();
const DR0 = X_START + 0.15 * H + (FS / 2) * RL;
const dRunX = (f) => DR0 - (f / 2) * RL;
const dp = (hip, lean, feet, hands, more = {}) => IB.posed(DEF, { hip, lean, feet, hands, ...more });
const slidePose = (x, f) => dp([x, FLOOR - 0.17 * H], -1.15, [{ a: PI / 2 + 0.35, l: 0.2, pitch: 1.2 }, { a: 0.3, l: 0.51, pitch: -0.4 }], [{ a: PI - 0.2, l: 0.27 }, { a: -1.0, l: 0.26 }], { nod: 0.35, face: { eye: f >= FC ? 'closed' : 'dot', mouth: 'flat', brow: 1 } });
const DACT = [];
for (let f = 0; f < FS; f += 2) DACT.push([f, IB.run(dRunX(f), FLOOR, DEF, ((f / 2) / 8 + 0.5) % 1)]);
DACT.push([FS, dp([X_START + 0.08 * H, HY + 0.12 * H], -0.4, [[X_START + 0.1 * H, AY, 0.2], { a: 0.9, l: 0.48, pitch: -0.3 }], [{ a: PI - 0.6, l: 0.26 }, { a: -0.6, l: 0.26 }], { face: { eye: 'dot', mouth: 'flat', brow: 1 } })]);
for (let f = FS + 2; f <= FS + 12; f += 2) DACT.push([f, slidePose(slideX(f), f)]);
const XD = slideX(FS + 12);
DACT.push([44, dp([XD, FLOOR - 0.2 * H], -0.3, [{ a: 0.42, l: 0.46, pitch: -0.5 }, { a: 0.36, l: 0.5, pitch: -0.5 }], [{ a: PI / 2 + 0.6, l: 0.26 }, { a: PI / 2 + 0.3, l: 0.26 }], { nod: 0.2, face: { eye: 'dot', mouth: 'flat' } })]);   // sits up
DACT.push([52, dp([XD - 0.05 * H, FLOOR - 0.3 * H], 0.3, [[XD + 0.22 * H, FLOOR - 0.035 * H, 1.45], [XD - 0.2 * H, AY, 0]], [{ a: 1.4, l: 0.27 }, { a: 1.0, l: 0.26 }], { face: { eye: 'dot', mouth: 'flat' } })]);   // up on one knee
DACT.push([64, dp([XD - 0.05 * H, HY + 0.01 * H], 0.0, [[XD - 0.12 * H, AY, 0], [XD + 0.04 * H, AY, 0]], [{ a: 1.3, l: 0.26 }, { a: 1.8, l: 0.26 }], { face: { eye: 'dot', mouth: 'smile' } })]);   // stands
DACT.push([72, dp([XD - 0.05 * H, HY + 0.02 * H], 0.06, [[XD - 0.12 * H, AY, 0], [XD + 0.04 * H, AY, 0]], [{ a: -0.4, l: 0.2 }, { a: 1.8, l: 0.26 }], { hand: ['grip', 'relax'], elbow: [-1, 1], nod: 0.1, face: { eye: 'closed', mouth: 'open' } })]);   // a fist

/* ---------- the attacker's hurdle ---------- */
const TO = FC + 2, AP = TO + 4, ap = (hip, lean, feet, hands, more = {}) => IB.posed(ATT, { hip, lean, feet, hands, ...more });
const aHip = (f) => { const dt = (f - AP) / 24, rise = (G / 2) * ((AP - TO) / 24) ** 2; return [ax(TO) + ((f - TO) / 2) * RL * 0.85, HY + 0.04 * H - rise + (G / 2) * dt * dt]; };
let LAND = AP + 2; while (aHip(LAND)[1] < HY + 0.05 * H) LAND += 2;
const AACT = [];
for (let f = 0; f < TO; f += 2) AACT.push([f, IB.run(ax(f), FLOOR, ATT, ((f / 2) / 8) % 1)]);
for (let f = TO; f < LAND; f += 2) AACT.push([f, ap(aHip(f), 0.15, [{ a: PI / 2 + 0.9, l: 0.36, pitch: 0.9 }, { a: PI / 2 + 0.5, l: 0.34, pitch: 0.8 }], [{ a: -0.3, l: 0.27 }, { a: PI + 0.4, l: 0.26 }], { face: { eye: 'wide', mouth: 'open' } })]);
const LX = aHip(LAND)[0];
AACT.push([LAND, ap([LX, HY + 0.1 * H], 0.55, [[LX - 0.16 * H, AY - IB.footLift(0.5, H), 0.5], [LX + 0.12 * H, AY, 0]], [{ a: 0.4, l: 0.27 }, { a: -0.3, l: 0.27 }], { hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } })]);
AACT.push([LAND + 2, ap([LX + 0.16 * H, HY + 0.08 * H], 0.62, [[LX + 0.3 * H, AY, 0], [LX + 0.12 * H, AY, 0]], [{ a: 0.6, l: 0.27 }, { a: 0.1, l: 0.27 }], { hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } })]);
const SX2 = LX + 0.42 * H;
AACT.push([LAND + 4, ap([LX + 0.3 * H, HY + 0.06 * H], 0.4, [[LX + 0.3 * H, AY, 0], [LX + 0.48 * H, AY, 0]], [{ a: 0.7, l: 0.26 }, { a: 0.3, l: 0.26 }], { hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } })]);
AACT.push([LAND + 8, ap([SX2, HY + 0.03 * H], 0.2, [[SX2 - 0.06 * H, AY, 0], [SX2 + 0.06 * H, AY, 0]], [{ a: 1.1, l: 0.26 }, { a: 1.5, l: 0.26 }], { face: { eye: 'dot', mouth: 'flat' } })]);
const BACK = { ...ATT, dir: -1 };
AACT.push([60, { ...IB.posed(BACK, { hip: [SX2, HY + 0.02 * H], lean: -0.05, feet: [[SX2 + 0.06 * H, AY, 0], [SX2 - 0.1 * H, AY, 0]], hands: [{ a: 0.3, l: 0.27 }, { a: PI - 0.3, l: 0.27 }], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open', brow: -1 } }), dir: -1 }]);
AACT.push([64, { ...IB.posed(BACK, { hip: [SX2, HY + 0.01 * H], lean: -0.12, nod: -0.15, feet: [[SX2 + 0.06 * H, AY, 0], [SX2 - 0.1 * H, AY, 0]], hands: [{ a: 0.1, l: 0.28 }, { a: PI - 0.1, l: 0.28 }], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open', brow: -1 } }), dir: -1 }]);

const withPrev = (table) => (f) => { const p = IB.held(table, f), q = IB.held(table, f - 2); return { ...p, prev: f > 0 && (p.dir || 0) === (q.dir || 0) ? q : undefined }; };
const attacker = withPrev(AACT), defender = withPrev(DACT);
const cheerAt = (f) => (f < FC ? 0 : f < 108 ? 1 + (f / 2) % 2 : 'up');
const lookOf = (p, look) => (p.dir ? { ...look, dir: p.dir } : look);
// the camera (IB.shot, on ones): a wide of the two running at each other pushing in, a close-up down on the grass for the boot meeting the ball, a low medium of the hurdle and the landing, an ease in to the two of them for the protest and the fist, and the wide
const SHOTS = [
  [0, { at: [1040, 640], w: 1750 }],
  [0, { at: [1000, 700], w: 1200 }, 'push', FS],
  [FS, { at: [1010, 830], w: 560 }, 'cut'],
  [TO + 2, { at: [1100, 690], w: 900 }, 'cut'],
  [60, { at: [1165, 680], w: 640 }, 'ease', 14],
  [100, { at: [1000, 660], w: 1350 }, 'ease', 20],
];
const HITS = [[FC, 20], [LAND, 16]];

IB.actors = (t) => { const f = IB.frame(IB.twos(t)); return { attacker: attacker(f), defender: defender(f), ball: ballAt(f).p, crowd: cheerAt(f) }; };

MG.scene({
  title: 'soccer / slide-tackle-hurdle',
  duration: 7, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const tt = IB.twos(t), f = IB.frame(tt), b = ballAt(f), a = attacker(f), d = defender(f);
    IB.film(ctx, IB.shot(SHOTS, Math.floor(t * 24), { jolt: HITS }), (ctx) => {
      IB.pitchside(ctx, [-100, 2200], FLOOR, { cheer: cheerAt(f) });
      if (f > FS) { const x1 = Math.min(X_START, slideX(f) + 0.1 * H); IB.smear(ctx, (X_START + x1) / 2 + 0.1 * H, FLOOR - 4, Math.max(20, X_START - x1 + 0.2 * H), { h: 13, color: IB.C.green, seed: 21 }); }   // the slide's mark on the grass
      IB.figure(ctx, d, lookOf(d, DEF));
      IB.soccerBall(ctx, b.p, { r: R, rot: b.rot, lw: 2.6, seed: 91 });
      IB.figure(ctx, a, lookOf(a, ATT));
      const hit = IB.drawn(tt, FC / 24), ld = IB.drawn(tt, LAND / 24);
      if (hit >= 0 && hit < 2) IB.burst(ctx, [ballX(FC), FLOOR - R], { n: 5, a0: -3.0, da: 0.5, r0: 20 + hit * 8, r1: 40 + hit * 6, w: 3, seed: 70 + hit });
      if (ld >= 0 && ld < 2) IB.thud(ctx, [LX + 0.05 * H, FLOOR], { half: 0.2 * H, k: ld });
    });
  },
});
</script>
