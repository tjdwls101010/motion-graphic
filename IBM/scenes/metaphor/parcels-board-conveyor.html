<!doctype html>
<meta charset="utf-8">
<title>metaphor / parcels-board-conveyor</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/parcel.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script>
/* 다리 달린 상자들이 줄지어 걸어와 하나씩 컨베이어에 뛰어오르면 다리를 접고 실려 가고, 검사대를 지날 때마다 도장이 내려와 초록 체크가 찍힌다. 늦은 꼬마 상자가 "잠깐만요!" 하며 뛰어와 마지막에 올라탄다. 원본에 없는 창작 장면으로, 원본 4편의 다리 달린 폴더·서류를 파이프라인 은유로 옮겼다. 전달하는 생각: 제각각 들어온 것들이 한 줄에 올라 같은 검사를 거친다.
   Motion notes: one locked shot, 8 s. Two frame rates side by side and that is the point: the characters walk, hop and fold their legs on twos, the machine (belt marks, rollers, parcels riding it) runs on ones at 230 px/s. A parcel is a rigid box: it never squashes, it tilts (walk +-0.035 rad every 6 frames, hop -0.22 rad) and its legs exist only while it needs them (gone 2 drawings after landing). Queue spacing 237 px = walk speed 190 px/s x 1.25 s between hops. Hop = one anticipation drawing (stopped where the drawing before left it, 16 px lower on shortened legs, tilted back 0.09 rad, both feet on the floor where they were) and 4 drawings over 0.33 s, peak 250 px above the floor one drawing before the landing; on the belt it rocks back 0.03 rad for one drawing (lifted by the half-width times the tilt so no corner sinks into the belt) and sits square. Stamp: the pad lifts for one drawing (the anticipation; 7-12 px, a fraction of its travel to that box's top), one drawing of the pad as a stretched smear, one drawing in contact, back up in 2 drawings; the tick is there from the contact drawing and a four-line burst lasts 2 drawings. The latecomer runs at 336 px/s with a step every 4 frames and its bubble travels with it on twos. Colour: three in the shot. Lavender (tubing and one parcel), yellow (one parcel), and the tick, which is the only green; the other parcels are white. */
const C = IB.C, FLOOR = 900, BELT = 690, BX0 = 880, V = 230, SCAN = 1500, LEG = 74;
const BOXES = [
  { w: 190, h: 150, fill: C.paper, hop: 1.25, seed: 100 },
  { w: 150, h: 200, fill: C.yellow, hop: 2.5, seed: 140 },
  { w: 230, h: 130, fill: C.lavender, hop: 3.75, seed: 180 },
  { w: 96, h: 88, fill: C.paper, hop: 83 / 12, seed: 220, late: true },
];
const LAND = 960, HOP = 4 / 12;

// where a parcel is at time t: { x, y (its bottom edge), tilt, legs: 0..1 (0 = folded away), feet offsets, riding }
function at(b, t) {
  const tt = IB.twos(t), f = IB.frame(t);
  if (tt < b.hop - 1e-6 && tt >= b.hop - 1 / 12 - 1e-6) {   // the anticipation: one drawing crouched on bent legs, leaning back, before the hop
    // it stops where the drawing before left it and crouches over feet that stay where they were (both now on the floor)
    const speed = b.late ? 336 : 190, before = at(b, tt - 1 / 12), dx = before.x - (760 - speed * 2 / 12);
    return { x: before.x, y: FLOOR - 12 - LEG + 16, tilt: -0.09, legs: 0.75, feet: before.feet.map(([fx]) => [fx + dx * 0, 0]) };
  }
  if (tt < b.hop) {
    const speed = b.late ? 336 : 190, x = 760 - speed * (b.hop - tt), step = IB.alternate(f, b.late ? 4 : 6);
    return { x, y: FLOOR - 12 - LEG, tilt: (step ? 1 : -1) * (b.late ? 0.07 : 0.035), legs: 1, feet: step ? [[-b.w * 0.2 - 8, 0], [b.w * 0.2 + 22, -12]] : [[-b.w * 0.2 + 22, -12], [b.w * 0.2 - 8, 0]] };
  }
  if (tt < b.hop + HOP) {
    const k = IB.drawn(tt, b.hop), P = [[790, FLOOR - 12 - LEG - 130, -0.22], [850, FLOOR - 12 - LEG - 235, -0.16], [920, BELT - 110, -0.06], [LAND, BELT - 22, 0.05]][Math.min(3, k)];
    return { x: P[0], y: P[1], tilt: P[2], legs: 0.6, feet: [[-b.w * 0.2 - 10, 0], [b.w * 0.2 + 4, -8]], air: true };
  }
  const since = tt - (b.hop + HOP), x = LAND + V * (t - (b.hop + HOP));   // riding: the belt carries it on ones
  const rock = since < 1 / 12 - 1e-6;
  return { x, y: BELT - (rock ? (b.w / 2) * 0.03 : 0), tilt: rock ? -0.03 : 0, legs: since < 0.083 ? 0.3 : 0, feet: [[-b.w * 0.2, 0], [b.w * 0.2, 0]], riding: true };   // it rocks back one drawing as it lands, then sits square
}
const scanAt = (b) => b.hop + HOP + (SCAN - LAND) / V;
// which drawing of its stamp a parcel is on: 0 the pad on its way down, 1 contact (the tick is there from this drawing on), 2-3 the pad going back up
const stampStep = (b, tt) => IB.drawn(tt, scanAt(b) - 1 / 12);

// which parcel is under the pad, and how far the pad is down (0 up, 1 touching)
function stamp(tt) {
  let down = 0, top = BELT - 150, hit = -1;
  BOXES.forEach((b) => {
    const k = stampStep(b, tt);
    if (k >= -1 && k < 4) { down = [-0.08, 0.6, 1, 0.55, 0.2][k + 1]; top = BELT - b.h; hit = k; }   // the pad lifts a little one drawing before it comes down
  });
  return { down, top, hit };
}

// the parcels' drawings for tools/drawings.py: their pose, not where the belt has carried them (the belt runs on ones)
IB.actors = (t) => Object.fromEntries(BOXES.map((b, i) => { const a = at(b, t); return ['parcel' + i, a.x < -200 ? null : a.riding ? { ...a, x: undefined } : a]; }));   // off-screen counts as absent

MG.scene({
  title: 'metaphor / parcels-board-conveyor',
  duration: 8, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const tt = IB.twos(t);
    IB.conveyor(ctx, [BX0, BELT], { travel: t * V }, { floor: FLOOR });
    const states = BOXES.map((b) => at(b, t));
    BOXES.forEach((b, i) => { const s = states[i]; if (!s.riding && !s.air && s.x > -200) IB.smear(ctx, s.x + 6, FLOOR - 11, b.w * 0.9, { h: 12, seed: b.seed + 30 }); });
    BOXES.forEach((b, i) => { const s = states[i]; if (s.x > -200 && s.x < 2150) IB.parcel(ctx, [s.x, s.y], { ...s, stamped: stampStep(b, tt) >= 1 }, { w: b.w, h: b.h, fill: b.fill, seed: b.seed, leg: LEG, ground: FLOOR - 12 }); });
    IB.stamper(ctx, [SCAN, BELT], stamp(tt));
    const late = BOXES[3], s = states[3];
    IB.bubble(ctx, ['잠깐만요!'], t, 4.917, { tip: [s.x + 56, s.y - late.h - 22], x: s.x + 190, y: s.y - late.h - 120, until: 6.75, seed: 500 });
  },
});
</script>
