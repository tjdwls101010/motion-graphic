<!doctype html>
<meta charset="utf-8">
<title>establish / city-stadium-flyin</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script>
/* 화면을 가득 채운 흑백 선화 도시 한가운데 경기장이 있고, 노란 헬리콥터 한 대가 왼쪽에서 크게 휘어 들어와 경기장 옆에 멈춰 뜬다. 전달하는 생각: 이제 벌어질 일의 장소를 한 장으로 알린다.
   Motion notes: 1.9 s, the drawing never moves and is far denser than any other family: line widths 1.5-5 px mixed, windows and trusses as texture, almost no fills. Colour only in two places, the yellow craft and the blue seating band (plus one blue strip at the stadium's foot). The craft is the one moving thing, on twos: nothing for the first 0.33 s, then it crosses right in front of the lens 4x too large (the first drawing stretched 1.4x as a smear), shrinks away, stands on its nose for one drawing as it turns, and is hovering by 0.83 s; after that only the rotor line flips each drawing and the body drifts 1 px per drawing. Buildings are generated from a seed, so the skyline is a stand-in for the reference's hand-drawn city, not a copy of it. */
const { lerp, rng, kf } = MG;
const C = IB.C;

const TOWERS = (() => {
  const r = rng(23), out = [];
  for (let i = 0; i < 34; i++) {
    const x = 300 + r() * 1480, w = 56 + r() * 110, far = r();
    out.push({ x, w, top: 80 + far * 380 + Math.abs(x - 1000) * 0.08, style: Math.floor(r() * 4), seed: 100 + i * 7, side: 10 + r() * 26 });
  }
  return out.sort((a, b) => a.top - b.top);   // tall ones first, so nearer and lower ones overlap them
})();

function tower(ctx, b) {
  const base = 760;
  IB.ink(ctx, [[b.x + b.w, b.top + 6], [b.x + b.w + b.side, b.top + 18], [b.x + b.w + b.side, base], [b.x + b.w, base]], { closed: true, smooth: false, fill: C.bg, w: 2.5, seed: b.seed + 1 });
  IB.box(ctx, b.x, b.top, b.w, base - b.top, { fill: C.bg, w: 3.2, seed: b.seed });
  const lw = { w: 1.5, wob: 0.4, taper: false };
  if (b.style === 0) for (let x = b.x + 9; x < b.x + b.w - 4; x += 9) IB.seg(ctx, x, b.top + 10, x, base, { ...lw, seed: b.seed + x });
  else if (b.style === 1) for (let y = b.top + 14; y < base; y += 13) IB.seg(ctx, b.x + 6, y, b.x + b.w - 6, y, { ...lw, seed: b.seed + y });
  else if (b.style === 2) { for (let x = b.x + 12; x < b.x + b.w - 6; x += 15) for (let y = b.top + 16; y < base; y += 20) IB.seg(ctx, x, y, x, y + 8, { w: 2.4, wob: 0, seed: b.seed + x + y }); }
  else { for (let x = b.x + 14; x < b.x + b.w - 4; x += 20) IB.seg(ctx, x, b.top + 8, x, base, { ...lw, seed: b.seed + x }); for (let y = b.top + 22; y < base; y += 24) IB.seg(ctx, b.x + 4, y, b.x + b.w - 4, y, { ...lw, seed: b.seed + y }); }
  for (let y = b.top + 24; y < base; y += 16) IB.seg(ctx, b.x + b.w + 3, y + 3, b.x + b.w + b.side - 3, y + 8, { w: 1.5, wob: 0, seed: b.seed + y });
}

function stadium(ctx) {
  const cx = 955, top = 610, bot = 770, rx = 420, ry = 128;
  const arc = (y, a0, a1, n = 26) => IB.ellipse(cx, y, rx, ry, n, a0, a1);
  // wall: the lower halves of the roof ellipse and the foot ellipse, joined
  IB.ink(ctx, arc(top, 0, Math.PI).concat(arc(bot, Math.PI, 0)), { closed: true, fill: C.paper, w: 4, seed: 300 });
  const up = arc(top, 0.08, Math.PI - 0.08, 22), lo = arc(bot + 4, 0.08, Math.PI - 0.08, 22);
  for (let i = 0; i < up.length - 1; i++) { IB.ink(ctx, [up[i], lo[i + 1]], { w: 2.4, seed: 310 + i, smooth: false }); IB.ink(ctx, [up[i + 1], lo[i]], { w: 2.4, seed: 340 + i, smooth: false }); }
  IB.ink(ctx, arc(bot + 30, 0.5, 1.15, 8), { w: 26, color: C.royal, seed: 301, taper: false });          // blue strip at the foot
  IB.ink(ctx, arc(bot + 4, 0.02, Math.PI - 0.02), { w: 4, seed: 302 });
  // roof ring, seating band, the dark bowl
  IB.oval(ctx, cx, top, rx, ry, { fill: C.paper, w: 5, seed: 303, n: 30 });
  IB.oval(ctx, cx, top - 6, 338, 86, { fill: C.blue, w: 3.5, seed: 304, n: 26 });
  for (const k of [0.9, 0.8]) IB.oval(ctx, cx, top - 6 + (1 - k) * 60, 338 * k, 86 * k, { w: 2, color: C.paper, seed: 305 + k, n: 24 });
  IB.oval(ctx, cx, top + 6, 268, 54, { fill: C.ink, w: 0, n: 24 });
  for (let i = 0; i < 20; i++) { const a = Math.PI + (i / 19) * Math.PI, p = [cx + Math.cos(a) * rx, top + Math.sin(a) * ry], q = [cx + Math.cos(a) * 344, top - 6 + Math.sin(a) * 90]; IB.ink(ctx, [p, q], { w: 2, seed: 370 + i, smooth: false }); }
}

function foreground(ctx) {
  const roof = (x, y, w, h, d, seed) => {
    IB.ink(ctx, [[x, y], [x + w, y - d], [x + w + d * 1.6, y + d * 0.4], [x + d * 1.6, y + d * 1.4]], { closed: true, smooth: false, fill: C.paper, w: 3.5, seed });
    IB.ink(ctx, [[x, y], [x + d * 1.6, y + d * 1.4], [x + d * 1.6, y + d * 1.4 + h], [x, y + h]], { closed: true, smooth: false, fill: C.bg, w: 3.5, seed: seed + 1 });
    IB.ink(ctx, [[x + d * 1.6, y + d * 1.4], [x + w + d * 1.6, y + d * 0.4], [x + w + d * 1.6, y + d * 0.4 + h], [x + d * 1.6, y + d * 1.4 + h]], { closed: true, smooth: false, fill: C.bg, w: 3.5, seed: seed + 2 });
    for (let k = 14; k < w; k += 16) IB.seg(ctx, x + d * 1.6 + k, y + d * 1.4 - k * (d / w) + 12, x + d * 1.6 + k, y + d * 1.4 - k * (d / w) + h - 6, { w: 1.6, wob: 0.3, seed: seed + k });
  };
  const trees = (x0, x1, y, seed) => { const pts = []; for (let x = x0, i = 0; x <= x1; x += 26, i++) pts.push([x, y + (i % 2 ? -16 : 0) + Math.sin(x * 0.02) * 10]); IB.ink(ctx, pts, { w: 2.6, seed }); };
  trees(40, 560, 800, 500); trees(1300, 1900, 790, 501); trees(60, 1900, 1010, 502);
  roof(1420, 690, 300, 150, 60, 520);
  roof(1380, 880, 260, 130, 50, 530);
  roof(200, 920, 440, 140, 70, 540);
  roof(1060, 990, 480, 120, 60, 550);
  roof(60, 860, 170, 90, 30, 560);
}

function heli(ctx, x, y, s, rot, facing, flip) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s * facing, s);
  IB.ink(ctx, [[-60, 46], [70, 46]], { w: 4, seed: 600 });
  for (const lx of [-34, 40]) IB.seg(ctx, lx, 30, lx, 46, { w: 3, seed: 601 + lx });
  IB.ink(ctx, [[-70, -18], [-150, -30], [-168, -58], [-150, -62], [-136, -34], [-66, -2]], { closed: true, smooth: false, fill: C.yellow, w: 3.5, seed: 602 });   // tail boom and fin
  IB.oval(ctx, 0, 0, 78, 34, { fill: C.yellow, w: 3.5, seed: 603, n: 12 });
  IB.ink(ctx, [[30, -24], [66, -6], [60, 16], [26, 18]], { closed: true, fill: C.paper, w: 3, seed: 604 });   // windscreen
  IB.seg(ctx, 0, -34, 0, -48, { w: 4, seed: 605 });
  IB.ink(ctx, [[-150 * (flip ? 1 : 0.35), -50], [150 * (flip ? 0.4 : 1), -48]], { w: 2.6, seed: 606 + flip });
  ctx.restore();
}

MG.scene({
  title: 'establish / city-stadium-flyin',
  duration: 1.917, ref: [0, 1.917], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const cloud = (x, y, w, seed) => IB.ink(ctx, IB.ellipse(x, y, w / 2, 14, 10), { closed: true, fill: C.bg, w: 3.5, seed });
    cloud(920, 46, 340, 700); cloud(330, 136, 300, 701); cloud(1780, 190, 160, 702); cloud(230, 286, 150, 703); cloud(1160, 76, 150, 704);
    TOWERS.forEach((b) => tower(ctx, b));
    stadium(ctx);
    foreground(ctx);
    // the one moving thing, on twos: [x, y, scale, rotation, stretch] per drawing from 0.33 s
    const f = IB.frame(t), d = Math.floor((f - 8) / 2);
    if (d >= 0) {
      // it passes right in front of the lens heading left, shrinks away, and has turned to face right by the time it hovers
      const IN = [[1500, 520, 4.2, 0.3, -1.4], [1150, 640, 3.6, 0.2, -1], [760, 640, 2.4, 0.1, -1], [400, 560, 1.7, -1.4, -1], [360, 590, 1.3, -0.5, 1], [310, 588, 1.1, 0.1, 1], [300, 584, 1.0, 0.04, 1]];
      const k = IN[Math.min(d, IN.length - 1)];
      heli(ctx, k[0] + Math.max(0, d - 6), k[1], k[2], k[3], k[4], d % 2);
    }
  },
});
</script>
