<!doctype html>
<meta charset="utf-8">
<title>sets / schoolhall-yard</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/office.js"></script>
<script src="../../kit/sets/schoolhall.js"></script>
<script src="../sample.js"></script>
<script>
/* 배경 세트 견본: 식당과 교문 — 칸 나뉜 식판 IB.lunchTray(밥, 국그릇, 반찬 둘은 자리 표시 도형)와 그것을 든 두 손목 자리 IB.trayGrips(먼 손은 식판 뒤 왼쪽 모서리 밑, 가까운 손은 앞 테 위), 끝에서 본 급식 탁자 IB.lunchTable(앉는 키 h에 맞춰 상판 0.43 h, 양쪽 긴 의자의 윗면이 IB.sit의 좌석 높이; layer 'bench'와 'table' 사이에 앉은 사람의 먼 쪽을 그린다), 빗각으로 본 미닫이 교문 IB.schoolGate(깊이 z px가 화면에서 (0.8 z, -0.3 z)로 놓여 길이 왼쪽에서 오른쪽으로 문을 지난다; 노란 문살 판이 레일 위를 1프레임 단위로 미끄러져 닫히고, IB.gateLane(at, z)가 그 깊이의 바닥 점이다), 아이의 책가방 IB.backpack(척추를 따라 돌고, pose.prev가 있으면 엉덩이가 오른 만큼의 1.4배를 한 장 늦게 내려가 뛸 때마다 들썩인다). 식판을 든 아이는 키 290 px, 뛰는 아이는 260 px(IB.PEOPLE.pupil, pupil2, pupil3). 쓰는 장면은 school/lunch-tray-seat, school/late-gate-run. */
const FLOOR = 930, F = IB.FIG;
const CARRY = { ...IB.PEOPLE.pupil, h: 290, dir: 1, seed: 40 }, FRIEND = { ...IB.PEOPLE.pupil2, h: 290, dir: -1, seed: 60 }, RUNNER = { ...IB.PEOPLE.pupil3, h: 260, dir: 1, seed: 80 };
MG.scene({
  title: 'sets / schoolhall-yard',
  duration: 4, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'sets/schoolhall.js — lunch tray, table, gate, backpack');
    const f = IB.frame(t), k = Math.floor(f / 2), c = SAMPLE.grid(4, 2);
    // a child carrying a tray: far pass, the tray, near pass
    SAMPLE.cell(ctx, c[0], SAMPLE.fit(c[0], [520, FLOOR], 30), () => {
      IB.smear(ctx, 420, FLOOR - 9, 240, { h: 13, seed: 9 });
      const p = IB.stand(400, FLOOR, CARRY), tray = [400 + 0.25 * CARRY.h, p.hip[1] - 0.05 * CARRY.h];
      p.hands = IB.trayGrips(tray); p.hand = ['grip', 'grip'];
      IB.figure(ctx, p, CARRY, 'far');
      IB.lunchTray(ctx, tray);
      IB.figure(ctx, p, CARRY, 'near');
      IB.lunchTray(ctx, [700, 820], { w: 170, seed: 1010 });
    }, 'IB.lunchTray(centre, { w }), IB.trayGrips(centre)');
    // the table end-on, a sitter on each bench, a tray put down
    SAMPLE.cell(ctx, c[1], SAMPLE.fit(c[1], [1400, FLOOR], 30), () => {
      IB.smear(ctx, 1400, FLOOR - 6, 640, { h: 12, seed: 10 });
      const tb = IB.lunchTable(ctx, [1400, FLOOR], { h: 290, layer: 'bench' });
      const a = IB.sit(tb.seats[0], FLOOR, CARRY), b = IB.sit(tb.seats[1], FLOOR, FRIEND);
      a.hands = IB.trayGrips([tb.seats[0] + 0.3 * 290, tb.top - 8]); a.hand = ['grip', 'grip'];
      IB.figure(ctx, a, CARRY, 'far'); IB.figure(ctx, b, FRIEND, 'far');
      IB.lunchTable(ctx, [1400, FLOOR], { h: 290, layer: 'table' });
      IB.lunchTray(ctx, [tb.seats[0] + 0.3 * 290, tb.top - 8]);
      IB.lunchTray(ctx, [tb.seats[1] - 0.24 * 290, tb.top - 8], { seed: 1020 });
      IB.figure(ctx, a, CARRY, 'near'); IB.figure(ctx, b, FRIEND, 'near');
    }, 'IB.lunchTable([centre, floor], { h, layer }) → { top, seats }');
    // the gate closing on ones while a child runs through it, backpack bobbing a drawing late
    const wide = SAMPLE.span(c, 2, 3);
    SAMPLE.cell(ctx, wide, [160, 300, 1600, 720], () => {
      const open = Math.max(0, 1 - ((f % 96) / 96) * 1.3), G = [860, 1000], Z = 110;
      const lane = IB.gateLane(G, Z);
      IB.smear(ctx, 960, lane[1] - 9, 1100, { h: 13, seed: 11 });
      IB.schoolGate(ctx, G, { open, layer: 'back' });
      const L = IB.runLen(RUNNER) / 8, x = 380 + ((k * L) % 1200), run = (n) => IB.run(380 + ((n * L) % 1200), lane[1], RUNNER, (n / 8) % 1);
      const p = { ...run(k), prev: run(k - 1) };
      IB.backpack(ctx, p, RUNNER, { part: 'bag' });
      IB.figure(ctx, p, RUNNER, 'far');
      IB.backpack(ctx, p, RUNNER, { part: 'strap' });
      IB.figure(ctx, p, RUNNER, 'near');
      IB.schoolGate(ctx, G, { open, layer: 'front' });
    }, 'IB.schoolGate([post foot], { open, layer }), IB.gateLane(at, z);  IB.backpack(ctx, pose, look, { part })');
  },
});
</script>
