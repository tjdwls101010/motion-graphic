<!doctype html>
<meta charset="utf-8">
<title>work / meeting-nod-off</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/office.js"></script>
<script src="../../kit/sets/officefloor.js"></script>
<script>
/* 회의 탁자에 앉아 화이트보드 앞 사장의 발표를 듣던 사람의 고개가 꾸벅, 또 꾸벅 하다 세 번째에 툭 떨어지고, 번쩍 깨어 꼿꼿이 앉자 앞자리 사람이 의자를 돌려 쳐다본다. 원본에 없는 창작 장면으로, 회의 탁자(IB.meetingTable, 화면 왼쪽 밖으로 잘림)와 화이트보드(IB.whiteboard, s 1.5), 앉은 포즈와 의자(IB.sit, IB.chair), 일상 인물(IB.PEOPLE.clerk, designer, boss), 흔들림선(IB.shake)으로 지었다. 전달하는 생각: 졸음은 두 번 봐주고 세 번째에 들킨다.
   Motion notes: one locked shot framed close on the two sitters and the presenter (the table runs off the left edge, the action spans x 390-1820, 75% of the width), 7 s, sitters 500 px tall (line 3.6 px) behind a table whose far edge is 205 px up (0.41 h, their elbow height, slab 24 px, top face 32 px deep), the presenter 520 px (3.7 px) beside a board 450 x 330 whose lines grow with it (s 1.5); all on twos as lists of drawings, every drawing passing the one before as pose.prev, so the nodder's head (and her bun) trails her body by one drawing on every dip and every snap. The presenter gestures through three drawings (an open hand at the board, both hands out explaining, a pointing finger at a note), each reached through one in-between and held 12-16 frames, his near hand within 0.29 h of the shoulder. The nodder: eyes shut at 1.0 s, nod 1 at 1.17 s (spine 0.08, head 0.3 over two drawings, held 0.42 s, back up through one drawing 0.04 past upright); nod 2 at 2.42 s a little deeper (0.12 / 0.4, held 0.42 s); nod 3 at 3.67 s sinks over two drawings (0.16 / 0.45) and at 3.92 s drops in one drawing to spine 0.42, head 0.7, one drawing past (0.46 / 0.78), and holds dead still to 4.33 s. 4.33 s the snap: one drawing bolt upright past the mark (hips 12 px up, spine -0.14, head -0.18, eyes wide, both hands off the table) with three shake arcs (50 px out, 13 px apart) by her head for two drawings, then stiff upright (spine -0.06, hips 6 px up) and held. The presenter stops mid-gesture on that drawing and goes wide-eyed two drawings later. 4.5 s the neighbour in front leans back (the anticipation), 4.67 s swivels his chair round to face her (the chair and figure flip, dir -1, there is no front view) and one drawing later settles with his head tipped toward her. 5.17 s the nodder's sheepish smile. From 5.25 s nothing moves. Colours: the nodder's yellow (and the board's yellow notes), the neighbour's sky, the board's blue bar; the presenter is in charcoal. */
const F = IB.FIG, FLOOR = 990, H = 500, TABLE = [480, FLOOR], TOP = Math.round(0.41 * H), DEPTH = 32;
const B = { ...IB.PEOPLE.designer, h: H, dir: 1, seed: 40, tuck: true }, C = { ...IB.PEOPLE.clerk, h: H, dir: 1, seed: 60 };
const BOSS = { ...IB.PEOPLE.boss, h: 520, dir: -1, seed: 80 };
const XB = 470, XC = 940, XP = 1780, BOARD = [1460, FLOOR];
const HAND_Y = FLOOR - TOP + 13;   // a hand resting on the table top

/* a sitter at the table: the near hand on the top, the far hand in the lap (under the slab) */
const seated = (x, look, more = {}) => { const p = IB.sit(x, FLOOR, look), d = look.dir, hy = p.hip[1]; return { ...p, hands: [[x + 0.12 * H * d, hy + 0.02 * H], [x + 0.2 * H * d, HAND_Y]], ...more }; };

/* ---------- the nodder (B) ---------- */
const PB = seated(XB, B), BY = PB.hip[1];
const dip = (lean, nod, eye = 'closed') => ({ ...PB, lean, nod, hands: [PB.hands[0], [XB + 0.2 * H + lean * 60, HAND_Y]], face: { eye, mouth: 'flat' } });
const NB = {
  awake: { ...PB, face: { eye: 'dot', mouth: 'flat' } },
  shut: { ...PB, face: { eye: 'closed', mouth: 'flat' } },
  upPast: { ...PB, lean: 0, nod: -0.04, face: { eye: 'dot', mouth: 'flat' } },
  drop: dip(0.42, 0.7), dropPast: dip(0.46, 0.78),
  snap: { ...PB, hip: [XB, BY - 12], lean: -0.14, nod: -0.18, hands: [[XB + 0.1 * H, BY - 0.12 * H], [XB + 0.16 * H, BY - 0.16 * H]], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } },
  stiff: { ...PB, hip: [XB, BY - 6], lean: -0.06, nod: -0.05, face: { eye: 'wide', mouth: 'flat' } },
  sheepish: { ...PB, hip: [XB, BY - 6], lean: -0.03, nod: 0.06, face: { eye: 'dot', mouth: 'smile', brow: -1 } },
};
const NODDER = [[0, NB.awake], [24, NB.shut],
  [28, dip(0.04, 0.14)], [30, dip(0.08, 0.3)], [40, NB.upPast], [42, NB.awake],
  [54, NB.shut], [58, dip(0.06, 0.2)], [60, dip(0.12, 0.4)], [70, NB.upPast], [72, NB.awake],
  [84, NB.shut], [88, dip(0.1, 0.3)], [90, dip(0.16, 0.45)], [94, NB.drop], [96, NB.dropPast],
  [104, NB.snap], [106, NB.stiff], [124, NB.sheepish]];

/* ---------- the neighbour in front ---------- */
const C2 = { ...C, dir: -1 }, PC = seated(XC, C, { face: { eye: 'dot', mouth: 'flat' } }), PC2 = seated(XC, C2, { lean: 0.1, nod: 0.12, face: { eye: 'dot', mouth: 'flat', brow: -1 } });
const NEIGHBOUR = [[0, PC], [108, { ...PC, lean: -0.08, nod: -0.06, face: { eye: 'wide', mouth: 'flat' } }],
  [112, { ...PC2, lean: 0.16, nod: 0.16, swung: true }], [114, { ...PC2, swung: true }]];

/* ---------- the presenter ---------- */
const PP = IB.stand(XP, FLOOR, BOSS), PY = PP.hip[1], PSH = PY - (F.torso - 0.012) * BOSS.h;
const gesture = (near, far, more = {}) => ({ ...PP, hands: [far || PP.hands[0], near], ...more });
const G = {
  board: gesture([XP - 0.26 * BOSS.h, PSH - 0.02 * BOSS.h], null, { hand: ['relax', 'open'], lean: 0.04, face: { mouth: 'open' } }),
  explain: gesture([XP - 0.22 * BOSS.h, PSH + 0.12 * BOSS.h], [XP - 0.18 * BOSS.h, PSH + 0.14 * BOSS.h], { hand: ['open', 'open'], face: { mouth: 'flat' } }),
  point: gesture([XP - 0.27 * BOSS.h, PSH - 0.1 * BOSS.h], null, { hand: ['relax', 'point'], lean: 0.05, nod: -0.05, face: { mouth: 'open' } }),
};
const mid = (a, b) => ({ ...IB.poseMix(a, b, 0.5), hand: b.hand, face: a.face });
const PRESENTER = [[0, G.explain], [12, mid(G.explain, G.board)], [14, G.board], [30, mid(G.board, G.explain)], [32, G.explain], [46, mid(G.explain, G.point)], [48, G.point],
  [62, mid(G.point, G.explain)], [64, G.explain], [76, mid(G.explain, G.board)], [78, G.board], [94, mid(G.board, G.point)], [96, G.point],
  [104, { ...G.point, face: { mouth: 'flat' } }], [108, { ...G.point, nod: 0.02, face: { eye: 'wide', mouth: 'flat' } }]];

const at = (table) => (t) => { const f = IB.frame(IB.twos(t)); return { ...IB.held(table, f), prev: f > 0 ? IB.held(table, f - 2) : undefined }; };
const nodderAt = at(NODDER), presenterAt = at(PRESENTER);
const neighbourAt = (t) => { const c = at(NEIGHBOUR)(t); return c.prev && !c.prev.swung !== !c.swung ? { ...c, prev: undefined } : c; };   // no trail across the swivel: the figure flips
IB.actors = (t) => ({ nodder: nodderAt(t), neighbour: neighbourAt(t), presenter: presenterAt(t) });

MG.scene({
  title: 'work / meeting-nod-off',
  duration: 7, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const tt = IB.twos(t), f = IB.frame(tt);
    const c = neighbourAt(t), sitters = [[nodderAt(t), B, XB], [c, c.swung ? C2 : C, XC]];
    IB.smear(ctx, TABLE[0] + 160, FLOOR - 8, 1300, { h: 16, seed: 9 });
    IB.smear(ctx, XP - 120, FLOOR - 10, 560, { h: 15, seed: 10 });
    sitters.forEach(([p, look, x], i) => IB.chair(ctx, x, FLOOR, H, look.dir, { seed: 700 + i * 10 }));
    sitters.forEach(([p, look]) => IB.figure(ctx, p, { ...look, face: p.face }, 'far'));
    IB.meetingTable(ctx, TABLE, { w: 1460, top: TOP, depth: DEPTH, thick: 24, lw: IB.figLine(H), sheets: [-420, 260] });
    const heads = sitters.map(([p, look]) => IB.figure(ctx, p, { ...look, face: p.face }, 'near'));
    // shake arcs behind the nodder's head on the snap
    const k = IB.drawn(tt, 104 / 24);
    if (k >= 0 && k < 2) IB.shake(ctx, heads[0].headAt[0] - 14, heads[0].headAt[1] - 8, 50, { a: Math.PI * 1.15, n: 3, gap: 13, w: 3.4, seed: 600 + k * 9 });
    IB.whiteboard(ctx, BOARD, { s: 1.5, lw: IB.figLine(BOSS.h) / 1.5, notes: 3 });
    const p = presenterAt(t);
    IB.figure(ctx, p, { ...BOSS, face: p.face });
  },
});
</script>
