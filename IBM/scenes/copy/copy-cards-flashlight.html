<!doctype html>
<meta charset="utf-8">
<title>copy / copy-cards-flashlight</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script>
/* 연기 샷을 끊고 들어오는 카피 카드 두 장이다. 첫 장은 큰 질문 두 줄 옆에서 샌드위치를 든 손이 올리브를 떨어뜨리고, 둘째 장은 작은 본문 두 줄 쪽으로 손전등을 든 선수가 뛰어들어 빛을 깜빡이며 비춘다. 전달하는 생각: 엉뚱한 도구로는 원하는 결과가 안 나온다.
   Motion notes: cards are joined by hard cuts and each new card restarts the copy slide: 71 px from the left, tau 0.2 s, still after 0.79 s, second line one frame late, no fade. Card 1 (0-2.04 s): head type (glyph height 116, pitch 128, x 200, top 412); the hand only bobs a few px on threes while two olives fall (from 0.25 s and 1.58 s), each drawn at only three heights and held 2-4 frames at each. Card 2 (2.04-4.33 s): body type (78, pitch 108, top 447); the figure waits cropped at the right edge for 0.75 s, lunges in over two drawings, then holds. The light cone is a flat #f6f6f6 wedge from the lens to the left edge, drawn under the copy; it stutters on for 3 frames, off, on for 2, off, then stays on 0.54 s: on/off by frame, never faded. The hand and the fencer are rigs of closed shapes traced from a 1.2x crop of the reference (one loaf with filling showing between its crusts, a gauntlet cuff, a fitted jacket, a masked head with a bib); the reference draws them by hand, with more poses. */
const { lerp, clamp } = MG;
const C = IB.C, CUT = 49 / 24;
const HEAD = ['큰 질문 두 줄이', '먼저 화면을 채운다?'], BODY = ['다음 장은 작은 글씨로', '설명을 잇는다'];
// light cone lit during these 24 fps frames after the scene start
const LIT = [[69, 72], [75, 77], [85, 98]];
// each olive: the frames it is visible and its y in each
const OLIVES = [[[6, 680], [8, 680], [10, 774], [12, 976], [14, 976]], [[38, 676], [40, 789], [42, 789], [44, 937]]];

function sandwichHand(ctx, t) {
  // one long loaf held out from the right edge, 32 degrees down: top crust, bottom crust, filling showing between, a gauntlet glove and a narrow sleeve
  const bob = [0, 3, 5, 2][Math.floor(IB.frame(t) / 3) % 4];
  IB.tube(ctx, [[1740, 618 + bob], [1960, 664 + bob]], { w: 84, edge: 3.2, fill: C.paper, seed: 20 });      // sleeve: flatter than the loaf, the wrist is bent
  ctx.save();
  ctx.translate(1650, 560 + bob);
  ctx.rotate(0.55);
  IB.ink(ctx, [[-505, 2], [-420, -6], [-200, -2], [10, 8], [32, 24], [2, 36], [-200, 28], [-420, 22]], { closed: true, fill: C.paper, w: 3.2, seed: 23 });   // bottom crust
  for (const x of [-436, -262]) IB.ink(ctx, [[x, -12], [x + 62, -8], [x + 14, 28]], { closed: true, smooth: false, fill: C.mustard, w: 2.6, seed: 30 + x });
  IB.ink(ctx, [[-524, -16], [-470, -44], [-300, -50], [-120, -48], [14, -38], [38, -14], [2, -2], [-200, -8], [-430, -4]], { closed: true, fill: C.paper, w: 3.2, seed: 22 });   // top crust
  for (const x of [-420, -330, -230, -130]) { IB.seg(ctx, x, -34, x + 16, -32, { w: 2, seed: 60 + x }); IB.seg(ctx, x + 6, -27, x + 20, -25, { w: 2, seed: 61 + x }); }   // slashes
  IB.oval(ctx, -486, 10, 9, 16, { fill: C.paper, w: 2.6, seed: 24, n: 8 });                                     // an olive at the open end
  for (let i = 0; i < 4; i++) IB.oval(ctx, -84 + i * 30, 40 - i * 2, 16, 13, { fill: C.paper, w: 2.8, seed: 40 + i, n: 8 });   // fingers under the loaf
  IB.ink(ctx, [[-70, -40], [-36, -58], [16, -52], [60, -34], [78, 0], [70, 34], [36, 44], [20, 16], [-20, -30]], { closed: true, fill: C.paper, w: 3.2, seed: 21 });   // thumb and back of the glove
  IB.ink(ctx, [[62, -40], [118, -52], [124, 60], [66, 44]], { closed: true, smooth: false, fill: C.paper, w: 3.2, seed: 25 });   // gauntlet cuff
  IB.seg(ctx, 84, -30, 86, 34, { w: 2, seed: 26 }); IB.seg(ctx, 98, -32, 100, 38, { w: 2, seed: 27 });
  ctx.restore();
}

function fencer(ctx, t) {
  // waits cropped at the right edge (only a knee and an elbow in frame), then lunges in over two drawings
  const f = IB.frame(t), inPose = f >= 70, mid = f >= 67 && f < 70;
  const dx = inPose ? 0 : mid ? 70 : 200 + [0, 25, 31, 32, 35, 29][clamp(Math.floor((f - 49) / 3), 0, 5)];
  ctx.save();
  ctx.translate(dx, inPose ? 0 : mid ? 30 : 150);
  const limb = (pts, w, seed) => IB.tube(ctx, pts, { w, edge: 3.2, fill: C.paper, seed });   // straight segments: a wide band folds over itself on a tight curve
  limb([[1806, 800], [2000, 1010]], 100, 60);                                               // back leg, off frame
  IB.ink(ctx, [[1846, 852], [1924, 938]], { w: 13, color: C.yellow, seed: 61, grain: 0 });    // the suit's one stripe
  limb([[1672, 1100], [1630, 890]], 62, 62);                                               // front shin
  limb([[1760, 796], [1624, 866]], 92, 63);                                                // front thigh, knee forward
  IB.ink(ctx, [[1596, 900], [1630, 914], [1660, 902]], { w: 2.6, seed: 69 });                 // breeches cuff
  limb([[1812, 604], [1890, 556], [1904, 470]], 46, 64);                                   // back arm, raised
  // fitted jacket: wide at the shoulders, in at the waist
  IB.ink(ctx, [[1688, 570], [1736, 546], [1802, 560], [1834, 640], [1820, 736], [1796, 806], [1712, 796], [1728, 700], [1700, 640]], { closed: true, fill: C.paper, w: 3.2, seed: 65 });
  IB.ink(ctx, [[1724, 572], [1736, 640], [1752, 700]], { w: 2, seed: 66 }); IB.ink(ctx, [[1736, 568], [1748, 640], [1764, 700]], { w: 2, seed: 67 });   // zip
  IB.oval(ctx, 1818, 506, 50, 46, { fill: C.lavender, w: 3, seed: 71, n: 10 });              // hair, two overlapping puffs behind the mask
  IB.oval(ctx, 1804, 432, 48, 44, { fill: C.lavender, w: 3, seed: 70, n: 10 });
  // mask: mesh front with a face behind it, padded bib wrapping the back and throat
  IB.oval(ctx, 1708, 452, 58, 66, { fill: C.paper, w: 3.2, seed: 72, n: 14 });
  IB.ink(ctx, [[1676, 430], [1700, 420], [1712, 470], [1700, 512], [1680, 498], [1670, 464]], { closed: true, fill: C.skin[3], w: 0 });
  for (let i = 0; i < 6; i++) { IB.seg(ctx, 1662 + i * 10, 414 - i * 4, 1662 + i * 10, 500 + i * 4, { w: 1.5, seed: 73 + i }); IB.seg(ctx, 1654, 418 + i * 16, 1716, 418 + i * 16, { w: 1.5, seed: 80 + i }); }
  IB.ink(ctx, [[1716, 386], [1764, 400], [1776, 470], [1752, 524], [1716, 552], [1698, 512], [1718, 470]], { closed: true, fill: C.paper, w: 3.2, seed: 86 });
  IB.oval(ctx, 1742, 466, 3, 3, { fill: C.ink, w: 0, n: 6 }); IB.oval(ctx, 1754, 466, 3, 3, { fill: C.ink, w: 0, n: 6 });
  if (!inPose && !mid) { ctx.restore(); return; }
  // the arm that points the torch: sleeve, gauntlet cuff, torch, fingers
  limb([[1716, 592], [1528, 600]], 50, 87);
  IB.ink(ctx, [[1496, 572], [1530, 566], [1532, 634], [1498, 628]], { closed: true, smooth: false, fill: C.paper, w: 3, seed: 88 });
  IB.box(ctx, 1372, 584, 122, 34, { fill: '#cfcfcf', w: 3, seed: 89 });
  IB.box(ctx, 1466, 584, 14, 34, { fill: '#8a8a8a', w: 2, seed: 90 });
  IB.ink(ctx, [[1338, 576], [1372, 584], [1372, 618], [1338, 628]], { closed: true, smooth: false, fill: '#cfcfcf', w: 3, seed: 91 });
  for (let i = 0; i < 3; i++) IB.seg(ctx, 1346 + i * 8, 580 + i, 1346 + i * 8, 624 - i, { w: 1.8, seed: 92 + i });
  for (let i = 0; i < 4; i++) IB.oval(ctx, 1400 + i * 19, 624, 10, 12, { fill: C.paper, w: 2.8, seed: 95 + i, n: 8 });
  ctx.restore();
}

MG.scene({
  title: 'copy / copy-cards-flashlight',
  duration: 4.333, ref: [13.708, 18.042], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t);
    if (t < CUT) {
      sandwichHand(ctx, t);
      for (const drops of OLIVES) { const k = drops.filter((d) => d[0] <= f).pop(); if (k && f < drops[drops.length - 1][0] + 2) IB.oval(ctx, 1300, k[1] - 22, 11, 20, { fill: C.bg, w: 3, seed: 50, n: 8 }); }
      IB.copy(ctx, HEAD, t, 0, { size: 'head' });
      return;
    }
    if (LIT.some(([a, b]) => f >= a && f < b)) {
      ctx.fillStyle = '#f6f6f6';
      ctx.beginPath(); ctx.moveTo(1338, 602); ctx.lineTo(0, 50); ctx.lineTo(0, 1080); ctx.lineTo(220, 1080); ctx.closePath(); ctx.fill();
    }
    fencer(ctx, t);
    IB.copy(ctx, BODY, t, CUT, { size: 'body' });
  },
});
</script>
