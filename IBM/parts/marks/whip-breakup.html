<!doctype html>
<meta charset="utf-8">
<title>marks / whip-breakup</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/props/metaphor.js"></script>
<script src="../sample.js"></script>
<script>
/* 효과 표시 견본: 컷이 속도선 휩(IB.whip)으로 넘어갈 때 샷이 부서지는 IB.whipBreakup, 두 장면의 두 방식을 차례로 보인다. 첫째(variation/hall-whip-button)는 낱장(1프레임) 단위다: 떠나는 샷을 1150, 1500px 왼쪽으로 밀어 두 프레임, 휩만 네 프레임, 들어오는 샷이 1500, 1100, 600, 180px 오른쪽에서 네 프레임 동안 open을 1에서 0.25로 줄이며 자리를 잡는다. 둘째(insert/mesh-eyes-whip)는 2프레임 단위 세 장이다: 떠나는 샷 1150px 왼쪽 + wipe(열린 쪽 절반을 통째로 지움) + streaks(샷 자신의 두 색 띠 30개), 휩만 한 장, 들어오는 샷 1150px 오른쪽. 순서는 언제나 샷을 밀어 그리고, 그 위에 whipBreakup, 맨 위에 IB.whip이다. 막대는 frame마다 새로 굴리므로 같은 frame이면 같은 그림이다. 샷 둘은 이 견본의 자리 표시(막대와 도미노)다. */
const FLOOR = 840, A_WHIP = 30, B_WHIP = 69;   // frames: the hall-style whip from shot A to B, the insert-style whip from B back to A
function shotA(ctx, C, dx) {   // five bars, the last one blue (metaphor/bars-rise-climber)
  ctx.save(); ctx.translate(dx, 0);
  [90, 185, 290, 405, 530].forEach((h, k) => IB.bar(ctx, [480 + k * 240, FLOOR], { h, w: 170, fill: k === 4 ? C.blue : C.paper, seed: 200 + k * 10 }));
  ctx.restore();
}
function shotB(ctx, C, dx) {   // a row of standing dominoes, one blue (metaphor/dominoes-chain-stop)
  ctx.save(); ctx.translate(dx, 0);
  IB.smear(ctx, 960, FLOOR - 4, 1500, { h: 12, seed: 7 });
  for (let i = 0; i < 12; i++) IB.domino(ctx, [278 + i * 124 + 28, FLOOR], { face: i }, { s: 1.3, fill: i === 8 ? C.blue : C.paper, seed: 100 + i * 7 });
  ctx.restore();
}
MG.scene({
  title: 'marks / whip-breakup',
  duration: 4, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const C = IB.C, f = IB.frame(t);
    let note;
    if (f < A_WHIP || f >= B_WHIP + 6) { shotA(ctx, C, 0); note = 'shot A'; }
    else if (f >= A_WHIP + 10 && f < B_WHIP) { shotB(ctx, C, 0); note = 'shot B'; }
    else if (f < A_WHIP + 10) {
      // hall-whip-button: on ones; leaving for two frames, the whip alone for four, arriving for four
      const k = f - A_WHIP, leaving = k < 2, arriving = k >= 6;
      if (leaving || arriving) {
        if (leaving) shotA(ctx, C, [-1150, -1500][k]); else shotB(ctx, C, [1500, 1100, 600, 180][k - 6]);
        IB.whipBreakup(ctx, f, { leaving, open: leaving ? 1 : 0.25 + 0.75 * (1 - (k - 6) / 4) });
      }
      IB.whip(ctx, f, { seed: 9, tint: leaving ? [C.blue] : arriving ? [C.blue] : [] });
      note = `IB.whipBreakup(frame, { leaving: ${leaving}${arriving ? ', open' : ''} }) — on ones`;
    } else {
      // mesh-eyes-whip: three drawings on twos; leaving with wipe and streaks of the shot's own colours, the whip alone, arriving
      const k = Math.floor((f - B_WHIP) / 2), drawn = B_WHIP + k * 2;
      if (k !== 1) {
        const leaving = k === 0;
        if (leaving) shotB(ctx, C, -1150); else shotA(ctx, C, 1150);
        IB.whipBreakup(ctx, drawn, { leaving, wipe: true, streaks: [C.paper, C.blue] });
      }
      IB.whip(ctx, drawn, { seed: 4, tint: k !== 1 ? [C.blue] : [] });
      note = 'IB.whipBreakup(frame, { leaving, wipe: true, streaks }) — on twos';
    }
    SAMPLE.caption(ctx, note);
  },
});
</script>
