<!doctype html>
<meta charset="utf-8">
<title>ui / handoff-checklist</title>
<link rel="stylesheet" href="../../../core/base.css">
<link rel="stylesheet" href="../../kit/ui.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ui.js"></script>
<style>
  .tester { text-align: center; }
  .tester .face { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #2a2a2a; display: grid; place-items: center; margin: 4px auto 24px; }
  .tester .q { position: absolute; right: -16px; top: -16px; width: 58px; height: 58px; border-radius: 50%; border: 3px solid #2a2a2a; background: #fff; display: grid; place-items: center; font: 800 30px 'JetBrains Mono', monospace; }
  .doc-h { display: flex; align-items: baseline; gap: 22px; padding: 26px 44px 14px; }
  .doc-h b { font: 800 42px Pretendard; }
  .doc-h span { font: 600 24px Pretendard; color: #9b9b9b; }
  .doc-h code { margin-left: auto; font: 500 22px 'JetBrains Mono', monospace; color: #b5b5b5; }
  .lines { margin: 8px 44px; padding: 14px 0; border: 2px solid #ececec; border-radius: 16px; }
  .item { position: relative; height: 98px; display: flex; align-items: center; gap: 22px; padding: 0 30px; }
  .item .skel { position: absolute; left: 30px; right: 30px; top: 42px; }
  .item .box { width: 38px; height: 38px; border: 3px solid #2a2a2a; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
  .item .ic { width: 58px; height: 58px; border: 3px solid #2a2a2a; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .item .name { font: 800 36px 'JetBrains Mono', monospace; width: 270px; }
  .item .ko { font: 600 24px Pretendard; color: #9b9b9b; width: 190px; }
  .item .cmd { flex: 1; height: 62px; border-radius: 10px; background: #f3f3f3; display: flex; align-items: center; padding: 0 22px; font: 700 24px 'JetBrains Mono', monospace; white-space: pre; overflow: hidden; }
  .item .cmd em { font-style: normal; color: #a8a8a8; font-weight: 500; }
  .item .file { border: 2.5px solid #2a2a2a; border-radius: 8px; padding: 2px 12px; margin-right: 12px; background: #fff; font-size: 20px; }
</style>
<script>
/* "새 테스터에게 건네는 인수인계 메모라고 생각하면 된다." 물음표 배지가 달린 인물 카드가 나타나고, 옆으로 문서가 미끄러져 들어와 제목 표시줄에 경로가 타이핑되고, 점선 화살표가 문서를 인물에게 건넨 뒤, 카메라가 문서로 들어간다: 문서가 화면을 채울 만큼 커지고 회색 뼈대 줄이 실제 체크리스트 다섯 줄로 바뀌며 한 줄씩 타이핑되고 체크된다. 전달하는 생각: 스킬 파일은 인수인계 문서다. 읽는 사람을 먼저 보여 주고, 그 사람을 위해 페이지를 채운다.
   Motion notes: skeleton first, content second (grey bars hold the layout so nothing jumps when rows arrive); each row follows the same 4-step micro-sequence over ~1.4 s, a new row every ~1.5 s: bar fades to row (0.25 s) -> name and caption appear -> command types at ~30 chars/s with a caret -> result text fades in and the checkbox fills lavender with a 0.2 s pop; the row being written carries a grey tint that moves down the list; the hand-off arrow is dashed and draws right-to-left (toward the receiver) in 0.45 s; the document then widens leftwards over the fading person card in one 0.7 s inOutCubic move (width changes, scale does not, so text size is constant). */
const { prog, lerp, el } = MG;
const ROWS = [
  { name: 'Launch', ko: '켜기', icon: 'play', cmd: '$ serve.sh 4317', res: ' → READY http://127.0.0.1:4317/', at: 3.0 },
  { name: 'Doctor', ko: '켜졌나 확인', icon: 'eye', cmd: '$ doctor.sh', res: ' → DOCTOR OK', at: 4.5 },
  { name: 'Drive', ko: '누르기', icon: 'arrow', cmd: '$ drive.mjs add', res: ' → RESULT add: PASS', at: 6.4 },
  { name: 'Evidence', ko: '찍어서 보고', icon: 'doc', files: ['<이름>.png', '<이름>.aria.txt', '<이름>.localStorage.json'], at: 7.9 },
  { name: 'Cleanup', ko: '끝나면 정리', icon: 'check', cmd: '$ cleanup.sh', res: ' → 증거 보존: …', at: 9.4 },
];
MG.scene({
  title: 'ui / handoff-checklist',
  duration: 12, ref: [1171.3, 1183.3],
  setup(stage) {
    const root = UI.root(stage);
    const tester = UI.card(root, 105, 240, 470, 450, el('div', { class: 'tester' }, el('div', { class: 'face' }, UI.icon('user', 96)), el('div', { style: { font: '800 50px Pretendard' }, text: '새 테스터' }), el('span', { class: 'chip sm ghost', style: { marginTop: '18px' }, text: '이 앱은 처음' })), el('div', { class: 'q', text: '?' }));
    tester.classList.add('tester');
    const svg = MG.svg('svg', { width: 1920, height: 1080, style: { position: 'absolute', left: 0, top: 0 } });
    const arrow = MG.svg('path', { d: 'M770 470 H600', fill: 'none', stroke: '#2a2a2a', 'stroke-width': 4, 'stroke-dasharray': '14 10' });
    const head = MG.svg('path', { d: 'M622 450 L598 470 L622 490', fill: 'none', stroke: '#2a2a2a', 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    svg.append(arrow, head);
    root.append(svg);
    const win = UI.window(root, 150, 150, 1620, 720, '');
    const path = win.bar.querySelector('span');
    const who = el('span', { class: 'chip dark sm', style: { marginLeft: 'auto', height: '34px', fontSize: '17px' } }, UI.icon('user', 18), '받는 사람 · 새 테스터');
    win.bar.append(who);
    const rows = ROWS.map((d) => {
      const box = el('span', { class: 'box' }, UI.icon('check', 26));
      const cmdText = el('span'), res = el('em', { text: d.res || '' });
      const files = (d.files || []).map((f) => el('span', { class: 'file', text: f }));
      const cmd = el('div', { class: 'cmd' }, cmdText, res, ...files);
      const body = el('div', { style: { display: 'flex', alignItems: 'center', gap: '22px', width: '100%' } }, box, el('span', { class: 'ic' }, UI.icon(d.icon, 30)), el('span', { class: 'name', text: d.name }), el('span', { class: 'ko', text: d.ko }), cmd);
      const skel = el('div', { class: 'skel' });
      return { el: el('div', { class: 'item' }, skel, body), skel, body, box, cmdText, res, files };
    });
    win.body.append(el('div', { class: 'doc-h' }, el('b', { text: '인수인계' }), el('span', { text: '새 테스터에게' }), el('code', { text: '# verify-todo' })), el('div', { class: 'lines' }, ...rows.map((r) => r.el)));
    return { tester, arrow, head, win, path, who, rows };
  },
  render(t, r) {
    const focus = prog(t, 2.6, 0.7, 'inOutCubic');    // the document takes over the frame
    MG.show(r.tester, prog(t, 0.2, 0.45, 'outBack') * (1 - focus), { scale: 0.9 });
    // the document: slides in as a narrow sheet on the right, then widens leftwards to full width (same height, no scaling, so the text never changes size)
    const inP = prog(t, 0.9, 0.5, 'outCubic');
    r.win.el.style.opacity = prog(t, 0.9, 0.25);
    r.win.el.style.left = lerp(790, 150, focus) + (1 - inP) * 60 + 'px';
    r.win.el.style.width = lerp(1032, 1620, focus) + 'px';
    UI.type(r.path, '.claude/skills/verify-todo/SKILL.md', prog(t, 1.3, 1.0), true);
    MG.show(r.who, prog(t, 3.2, 0.3, 'outBack'), { scale: 0.6 });
    // the hand-off arrow draws toward the tester, then leaves with it
    const a = prog(t, 2.1, 0.45, 'outCubic'), gone = 1 - prog(t, 2.6, 0.25);
    r.arrow.style.opacity = gone;
        r.arrow.setAttribute('d', `M770 470 H${lerp(770, 600, a)}`);
    r.head.style.opacity = (a >= 1 ? 1 : 0) * gone;
    // rows: skeleton -> typed -> ticked
    r.rows.forEach((row, i) => {
      const d = ROWS[i], on = prog(t, d.at, 0.25);
      row.skel.style.opacity = 1 - on;
      row.body.style.opacity = on;
      const typing = prog(t, d.at + 0.3, (d.cmd || '').length / 30);
      UI.type(row.cmdText, d.cmd || '', typing, true);
      row.res.style.opacity = prog(t, d.at + 0.8, 0.25);
      row.files.forEach((f, j) => MG.show(f, prog(t, d.at + 0.4 + j * 0.25, 0.25, 'outBack'), { scale: 0.7 }));
      const tick = prog(t, d.at + 1.15, 0.2, 'outBack');
      row.box.style.background = tick > 0 ? '#bcb8f8' : '#fff';
      row.box.style.transform = `scale(${tick > 0 ? lerp(1.3, 1, tick) : 1})`;
      row.box.style.color = tick > 0 ? '#2a2a2a' : 'transparent';
      const next = ROWS[i + 1] ? ROWS[i + 1].at : 99;
      row.el.style.background = t >= d.at && t < next ? '#f6f6f6' : 'transparent';
      row.el.style.borderRadius = '12px';
    });
  },
});
</script>
