<script>
/* 혼자 달리던 자전거에 한 명씩 끼어들 때마다 자전거가 한 칸씩 길어져 5인승 탠덤이 되고, 마지막에 다 같이 손을 놓고 몸을 젖히며 모자 하나가 뒤로 날아간다. 원본은 왼쪽에 카피가 있는 화면이고, 여기서는 문구를 빼고 그림 영역만 잘라 화면에 채웠다. 끼어드는 순간마다 뒤에 탄 사람은 안장에서 붕 뜨고 머리카락이 솟았다 가라앉으며, 앞에 탄 사람은 앞으로 쏠렸다 일어선다. 전달하는 생각: 따로 있던 것들이 한 대에 올라 같은 방향으로 간다.
   Motion notes: a travelling shot, so two clocks run at once. On ones: the ground props scroll left at a constant 332 px/s (13.8 px per frame), clouds drift 3 px/s and the bike creeps right 34.6 px/s. On twos: everything drawn, i.e. the riders, the pedals (12 drawings per turn, one turn per second, every crank in the same phase because a tandem's cranks are chained), hair and the bike's own length.
   Shows the reference frame's region x 640-1920, y 150-870 (CROP) enlarged 1.5x; coordinates in the code are the reference's. Wheelbase 170 px + 120 per extra rider, wheel radius 50.
   A join is four drawings, not a slide (JOINS, react()): 0 the frame is 30% longer, the tail kicks up (the rear axle rises 50 px as the bike tips about its front tyre, 27 px on the next drawing, then dips 9; each later join lifts it by 1 / (1 + 0.7 j) of that) and the newcomer hangs above the gap as a tucked ball, its seat and crank not yet drawn; 1 80% longer, the newcomer lands squashed with the head down, everyone behind is thrown 20 px off the saddle with arms pulled straight and hair straight up, everyone ahead is jolted forward; 2 the frame overshoots to 106%, the newcomer sits up with both hands off the bar, those behind come down with the hair still puffed and one open hand, those ahead stand 10 px tall; 3 everyone back in their own acting, a few px off the saddle with the hair still up. The ground ripples under the wheels stay on the ground while the bike tips. Joins at frames 32, 92, 136, 160 (1.33, 3.83, 5.67, 6.67 s).
   Riders are rigs with a pose each drawing: torso lean and rise off the saddle, two-bone arms to a hand target (the bar, or free), head tilt, eye and mouth, hair lift. The spine (74 px) turns about the hip by (22 + lean) / 60 rad: 0.37 rad forward while riding, and each unit of `lean` moves the shoulder about 1.2 px, so leaning back also brings the shoulders down. Joints relative to the crank a rider pedals: hip 24 px behind and 112 above (read off the reference), which puts the riding shoulder 181 above and the head centre 218 above; grip 56 ahead and 118 above; thigh 74, shin 70, arm 50 + 50. Between joins they act a little (the first passenger calls forward with a hand by the mouth and the front rider looks round; the one in overalls sings with the head back). Finale, in the reference's order: the front rider sits up at frame 222 and throws an arm up; at 226 the rear rider flings both arms wide and the one in overalls reaches both hands forward; at 232 the one in the blue helmet throws an arm up; the one in the cap holds the bar until the cap goes. Leaning back is `lean` -30 to -66 (shoulders 40-80 px behind where they ride); the front rider coasts with both legs out while the rest keep pedalling, and each raised hand flicks between two drawings every 8 frames. The cap lifts off at frame 240 and tumbles up and back over 1.5 s; its owner grabs at the air, claps a hand to the bare head, looks after it, and at frame 262 gives up and throws the arm up with the rest.
   Loops that keep a held pose alive: streaming hair, beard and hood string cycle through three drawings, a new one every 2 frames, as the reference redraws them; pedal and wheel marks alternate every 2; a puff of dust leaves the rear wheel for three drawings out of every six. Lines are 1.9 px in reference pixels (2.9 on screen) because the figures are small (head radius 22). */
const { lerp, rng } = MG;
const C = IB.C, PI = Math.PI, AXLE = 750, R = 50, CRANK = 21;
const CROP = [640, 150, 1280, 720];   // the region of the reference frame this scene shows, enlarged 1.5x: the copy on the left is left out
const LW = 1.9;

/* Riders rear to front, with the frame each one joins at (the front rider is there from the start). */
const RIDERS = [
  { join: 32, who: 'curls', skin: C.skin[4], top: C.paper, arm: C.paper, leg: C.navy, shoe: C.paper },
  { join: 136, who: 'visor', skin: C.skin[1], top: C.paper, arm: C.paper, leg: C.paper, shoe: C.navy, stripes: true },
  { join: 160, who: 'cap', skin: C.skin[1], top: C.paper, arm: C.paper, leg: C.navy, shoe: C.skin[2], shorts: true },
  { join: 92, who: 'bun', skin: C.skin[2], top: C.paper, arm: null, leg: C.sky, shoe: C.paper, bib: true },
  { join: -1, who: 'vents', skin: C.skin[4], top: C.navy, arm: C.navy, leg: C.paper, shoe: C.paper, watch: true },
];
const JOINS = RIDERS.map((r, i) => [r.join, i]).filter(([j]) => j >= 0).sort((a, b) => a[0] - b[0]);
const GROW = [0.3, 0.8, 1.06, 1];   // how much of its 120 px the frame has gained on each drawing of a join

/* held(keys, f) — the drawing on screen at frame f: the last key at or before it. */
const held = (keys, f) => { let v = keys[0][1]; for (const [k, p] of keys) { if (f < k) break; v = p; } return v; };

/* A rider's pose. lean: how far the spine is tipped from the riding pose, + forward, in units of about 1.2 px at the shoulder; rise: px off the saddle; tuck 0..1 pulls the knees up and the head down (the newcomer in the air); arms [near, far]: 'bar', 'reach' (the bar, with the arm pulled straight), or a hand position relative to the shoulder; open: free hands are open (fanned fingers, or with flat: a flat palm) instead of fists; legs: 'pedal' | 'out'. */
const RIDE = { lean: 0, rise: 0, tuck: 0, nod: 0, arms: ['bar', 'bar'], legs: 'pedal', eye: 'dot', mouth: 'smile', hair: 0, sc: 1 };
const po = (o) => ({ ...RIDE, ...o });

/* What a join does to each rider, by the join's drawing number k (0-3): the newcomer, those behind it, those ahead. */
const NEW = [
  po({ rise: 44, tuck: 1, nod: 0.5, arms: [[16, 34], [10, 36]], eye: 'closed', mouth: 'flat', sc: 0.86 }),
  po({ rise: -5, tuck: 0.75, nod: 0.6, lean: 6, arms: [[20, 30], [14, 34]], eye: 'closed', mouth: 'flat' }),
  po({ rise: 7, nod: -0.12, lean: -6, arms: [[30, 18], [24, 24]], eye: 'wide', mouth: 'o', hair: 0.8 }),
  po({ rise: 2, nod: -0.05, hair: 0.4 }),
];
const BEHIND = [
  po({ rise: 5, lean: 8, nod: 0.1, hair: 0.4, eye: 'wide' }),
  po({ rise: 21, lean: -8, nod: -0.15, hair: 1, eye: 'wide', mouth: 'o', arms: ['reach', 'reach'] }),
  po({ rise: 8, lean: -4, nod: -0.08, hair: 1.25, eye: 'wide', mouth: 'o', arms: [[44, 14], 'bar'], open: true }),
  po({ rise: 1, hair: 0.55 }),
];
const AHEAD = [
  po({ lean: 9, nod: 0.22, eye: 'closed' }),
  po({ lean: 13, rise: -2, nod: 0.3, eye: 'closed', mouth: 'flat' }),
  po({ lean: -5, rise: 10, nod: -0.1, eye: 'wide', mouth: 'o' }),
  po({ rise: 3 }),
];

/* What each rider does when no join is throwing them about: [frame, pose] keys, as in folder-meets-document. */
const ACT = {
  vents: [
    [0, RIDE],
    [58, po({ nod: -0.2, eye: 'closed' })], [60, po({ nod: -0.42, lean: -4, eye: 'closed', mouth: 'open', look: -1 })], [70, po({ nod: -0.36, lean: -3, eye: 'closed', mouth: 'open', look: -1 })], [78, po({ nod: -0.1 })], [80, RIDE],
    // finale: sits up, throws an arm up, then leans right back and coasts with both legs out; the raised hand keeps flicking
    [222, po({ lean: -14, rise: 3, nod: -0.1, arms: [[34, -10], 'bar'], eye: 'wide' })],
    [224, po({ lean: -26, rise: 4, nod: -0.15, arms: [[26, -58], [40, 8]], open: true, mouth: 'open' })],
    [226, po({ lean: -40, nod: -0.22, arms: [[6, -90], [44, 10]], open: true, mouth: 'open', eye: 'closed' })],
    [228, po({ lean: -56, nod: -0.3, arms: [[-22, -84], [34, 24]], open: true, mouth: 'open', eye: 'closed', legs: 'out' })],
    [230, po({ lean: -66, nod: -0.36, arms: [[-36, -76], [34, 26]], open: true, mouth: 'open', eye: 'closed', legs: 'out' })],
    ...[232, 248, 264].flatMap((f) => [
      [f, po({ lean: -58, nod: -0.32, arms: [[-26, -82], [34, 26]], open: true, mouth: 'open', eye: 'closed', legs: 'out' })],
      [f + 8, po({ lean: -60, nod: -0.33, arms: [[-36, -76], [34, 26]], open: true, mouth: 'open', eye: 'closed', legs: 'out' })],
    ]),
  ],
  bun: [
    [0, RIDE],
    [104, po({ nod: -0.25, mouth: 'open', eye: 'closed' })], [110, po({ nod: -0.3, mouth: 'o', eye: 'closed' })], [116, po({ nod: -0.25, mouth: 'open', eye: 'closed' })], [122, po({ nod: -0.3, mouth: 'o', eye: 'closed' })], [128, po({ nod: -0.2, mouth: 'smile', eye: 'closed' })],
    [172, po({ nod: -0.25, mouth: 'open', eye: 'closed' })], [180, po({ nod: -0.3, mouth: 'o', eye: 'closed' })], [188, po({ nod: -0.25, mouth: 'open', eye: 'closed' })], [196, po({ nod: -0.3, mouth: 'o', eye: 'closed' })], [204, po({ nod: -0.25, mouth: 'open', eye: 'closed' })], [212, po({ nod: -0.3, mouth: 'o', eye: 'closed' })],
    [224, po({ lean: -8, nod: -0.2, eye: 'wide' })],
    [226, po({ lean: -18, nod: -0.28, mouth: 'open', eye: 'closed', arms: [[66, 24], 'bar'], open: true, flat: true })],
    [228, po({ lean: -28, nod: -0.34, mouth: 'open', eye: 'closed', arms: [[72, 28], [68, 36]], open: true, flat: true })],
    [230, po({ lean: -38, nod: -0.42, mouth: 'open', eye: 'closed', arms: [[74, 30], [70, 38]], open: true, flat: true })],
    ...[232, 248, 264].flatMap((f) => [
      [f, po({ lean: -32, nod: -0.38, mouth: 'open', eye: 'closed', arms: [[78, 34], [72, 42]], open: true, flat: true })],
      [f + 8, po({ lean: -33, nod: -0.4, mouth: 'o', eye: 'closed', arms: [[76, 30], [72, 40]], open: true, flat: true })],
    ]),
  ],
  cap: [
    [0, RIDE],
    [232, po({ lean: -6, nod: -0.1, mouth: 'open' })],
    // holds the bar until the cap goes: a start, a grab at the air, a hand clapped on the bare head, a look after it, and then the arm goes up with everyone else's
    [240, po({ lean: -20, nod: -0.32, eye: 'wide', mouth: 'o' })],
    [242, po({ lean: -22, nod: -0.36, eye: 'wide', mouth: 'o', arms: [[-10, -70], [38, 28]], open: true })],
    [246, po({ lean: -16, nod: 0.08, eye: 'closed', mouth: 'flat', arms: [[16, -54], [38, 28]] })],
    [256, po({ lean: -22, nod: -0.3, eye: 'wide', mouth: 'open', arms: [[14, -56], [38, 28]] })],
    [262, po({ lean: -30, nod: -0.24, mouth: 'open', arms: [[-6, -84], [38, 28]], open: true })],
    [264, po({ lean: -42, nod: -0.28, mouth: 'open', eye: 'closed', arms: [[-28, -80], [38, 28]], open: true })],
    [272, po({ lean: -40, nod: -0.27, mouth: 'open', eye: 'closed', arms: [[-20, -84], [38, 28]], open: true })],
  ],
  visor: [
    [0, RIDE],
    [230, po({ lean: -8, nod: -0.1, arms: [[34, -4], 'bar'] })],
    [232, po({ lean: -20, nod: -0.18, arms: [[12, -70], 'bar'], open: true, mouth: 'open' })],
    [234, po({ lean: -44, nod: -0.26, arms: [[-24, -84], [36, 32]], open: true, mouth: 'open' })],
    ...[236, 252, 268].flatMap((f) => [
      [f, po({ lean: -38, nod: -0.22, arms: [[-14, -90], [36, 32]], open: true, mouth: 'open' })],
      [f + 8, po({ lean: -40, nod: -0.23, arms: [[-26, -84], [36, 32]], open: true, mouth: 'open' })],
    ]),
  ],
  curls: [
    [0, RIDE],
    // calls forward with a hand by the mouth; the front rider looks round
    [62, po({ lean: 4, arms: [[40, -6], 'bar'], mouth: 'open' })], [64, po({ lean: 8, nod: -0.08, arms: [[46, -26], 'bar'], mouth: 'open', open: true })], [70, po({ lean: 10, nod: -0.1, arms: [[48, -32], 'bar'], mouth: 'o', open: true })], [76, po({ lean: 8, nod: -0.08, arms: [[46, -26], 'bar'], mouth: 'open', open: true })], [82, po({ lean: 2, arms: [[40, 2], 'bar'] })], [84, RIDE],
    // finale: second to let go, arms flung wide
    [224, po({ lean: -8, nod: -0.1, eye: 'wide' })],
    [226, po({ lean: -26, nod: -0.2, arms: [[52, -10], [-40, 6]], open: true, flat: true, mouth: 'open' })],
    [228, po({ lean: -48, nod: -0.3, arms: [[90, -10], [-84, -2]], open: true, flat: true, mouth: 'open', eye: 'closed', hair: 0.3 })],
    ...[230, 246, 262].flatMap((f) => [
      [f, po({ lean: -42, nod: -0.27, arms: [[86, -2], [-80, 8]], open: true, flat: true, mouth: 'open', eye: 'closed' })],
      [f + 8, po({ lean: -44, nod: -0.28, arms: [[88, -8], [-82, 2]], open: true, flat: true, mouth: 'open', eye: 'closed' })],
    ]),
  ],
};

/* The pose of rider i at frame f: a join overrides whatever the rider was doing for its first three drawings and leaves a trace on the fourth. */
function poseOf(i, f) {
  for (const [J, who] of JOINS) {
    const k = Math.floor((f - J) / 2);
    if (f >= J && k < 4 && RIDERS[i].join <= J) {
      const jolt = (who === i ? NEW : i < who ? BEHIND : AHEAD)[k];
      return k < 3 ? jolt : { ...held(ACT[RIDERS[i].who], f), rise: jolt.rise, hair: jolt.hair };   // the last drawing is the rider's own acting again, still a little off the saddle
    }
  }
  return held(ACT[RIDERS[i].who], f);
}
/* How much of its place rider i has taken at frame f: 0 before it joins, GROW through its four drawings, 1 after. */
const presence = (i, f) => { const J = RIDERS[i].join; return J < 0 ? 1 : f < J ? 0 : GROW[Math.min(3, Math.floor((f - J) / 2))]; };

const PROPS = (() => { const r = rng(7), out = []; let x = 300; while (x < 332 * 12 + 2200) { out.push({ x, y: 812 + r() * 70, kind: r() < 0.5 ? 'tuft' : 'stones', seed: Math.floor(r() * 900) }); x += 260 + r() * 420; } return out; })();

/* ---------- heads ---------- */
/* The face every rider shares, in head units (profile radius about 22) facing +x: skull, nose and chin as one shape, an ear, an eye, a mouth. */
function face(ctx, skin, p, seed) {
  IB.ink(ctx, [[-2, -22], [14, -16], [19, -4], [27, 3], [19, 7], [17, 17], [3, 23], [-15, 15], [-21, -4]], { closed: true, fill: skin, w: LW, seed });
  IB.ink(ctx, [[-8, -3], [-12, 2], [-7, 6]], { w: 1.5, seed: seed + 1 });
  ctx.fillStyle = C.ink;
  if (p.eye === 'closed') IB.ink(ctx, [[8, -5], [12, -2.5], [16, -5]], { w: 1.7, seed: seed + 2 });
  else if (p.eye === 'wide') { IB.oval(ctx, 12, -5, 4.4, 4.6, { fill: C.paper, w: 1.4, seed: seed + 2, n: 8 }); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(13, -5, 1.8, 0, 7); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(12, -5, 2, 0, 7); ctx.fill(); }
  if (p.mouth === 'open') IB.ink(ctx, [[9, 9], [19, 8], [16, 15], [11, 15]], { closed: true, fill: C.ink, w: 1.2, seed: seed + 3 });
  else if (p.mouth === 'o') IB.oval(ctx, 15, 12, 3, 3.6, { fill: C.ink, w: 0, n: 8 });
  else IB.ink(ctx, p.mouth === 'flat' ? [[10, 12], [17, 12]] : [[9, 9], [13, 12.5], [18, 9.5]], { w: 1.6, seed: seed + 3 });
}
/* Hair and headgear per rider. `lift` 0..1.25 raises whatever can stream (curls, bun, beard) toward straight up; `alt` (-0.6, 0 or 1) is which of its three drawings a streaming thing is on. Drawn in two passes: what is behind the face, then what is over it. */
const HAIR = {
  curls: {
    back(ctx, lift, alt, seed) {
      // a mass of curls streaming back; lifted, the same mass stands on end
      const a = lift * 0.5, g = 1 + lift * 0.24, c = Math.cos(a) * g, s = Math.sin(a) * g, wob = 3 * alt, pts = [];
      const body = [[2, -22], [-8, -29], [-20, -27 - wob], [-32, -32], [-44, -25 + wob], [-58, -28], [-68, -16 - wob], [-76, -2], [-71, 12 + wob], [-59, 14], [-50, 22 - wob], [-37, 17], [-27, 22], [-17, 13], [-11, 17]];
      for (const [x, y] of body) pts.push([x * c - y * s * 0.9, x * s + y * c - lift * 10]);
      IB.ink(ctx, pts, { closed: true, fill: C.ink, w: 2, seed });
    },
    front(ctx, lift, alt, seed) { IB.ink(ctx, [[13, -17], [-2, -27], [-22, -16], [-22, 10], [-11, 3], [-5, -12]], { closed: true, fill: C.ink, w: 2, seed: seed + 1 }); },
  },
  bun: {
    back(ctx, lift, alt, seed) { IB.oval(ctx, -23 - lift * 3, -25 - lift * 9, 13, 12 + lift * 3, { fill: '#b08a62', w: 2, seed, n: 9 }); },
    front(ctx, lift, alt, seed) { IB.ink(ctx, [[11, -19], [-4, -28], [-23, -17], [-25, 7], [-13, 3], [-8, -11]], { closed: true, fill: '#b08a62', w: 2, seed: seed + 1 }); },
  },
  cap: {
    back(ctx, lift, alt, seed, bare) {
      // long white hair streaming back in separate strands; without the cap a tuft stands up on top
      for (let i = 0; i < 6; i++) { const y = -8 + i * 5.5, k = 3.5 * alt; IB.ink(ctx, [[-16, y], [-30, y + 1 - lift * 10 + k], [-44, y + 1 - lift * 18 - k], [-56 - (i % 3) * 6, y + 3 - lift * 22 + k]], { w: 1.4, seed: seed + i, color: '#6f6f6f' }); }
      if (bare) for (let i = 0; i < 4; i++) IB.ink(ctx, [[-10 + i * 6, -20], [-22 + i * 4 - 4 * alt, -34 - i * 2], [-38 + i * 3, -38 + 3 * alt]], { w: 1.5, seed: seed + 10 + i });
    },
    front(ctx, lift, alt, seed, bare) {
      // beard: a white shape under the jaw with its tail blown back
      IB.ink(ctx, [[4, 17], [19, 17], [17, 28], [5, 34], [-10, 29 - 3 * alt], [-26, 31 + 2.5 * alt], [-15, 21], [-12, 12], [-4, 14]], { closed: true, fill: C.paper, w: 1.6, seed: seed + 20 });
      if (bare) return;
      IB.ink(ctx, IB.ellipse(-3, -6, 24, 22, 9, PI * 0.98, PI * 2.02).concat([[44, -5], [42, -1], [21, -2]]), { closed: true, fill: C.paper, w: LW, seed: seed + 21 });
    },
  },
  visor: {
    back(ctx, lift, alt, seed) {
      IB.ink(ctx, [[-20, 0], [-25, 10], [-16, 16], [-10, 6]], { closed: true, fill: C.charcoal, w: 1.6, seed });                          // hair at the nape
      IB.ink(ctx, [[-10, 24], [-30, 22 - 5 * alt], [-50, 26 + 5 * alt], [-64, 20 - 3 * alt]], { w: 1.5, seed: seed + 1 });   // hood string
      IB.oval(ctx, -66, 20 - 3 * alt, 3, 3, { fill: C.paper, w: 1.4, seed: seed + 2, n: 6 });
    },
    front(ctx, lift, alt, seed) {
      IB.ink(ctx, IB.ellipse(-3, -6, 25, 23, 9, PI * 0.94, PI * 2.02).concat([[32, -9], [31, -6], [20, -5]]), { closed: true, fill: C.sky, w: LW, seed: seed + 3 });
      IB.oval(ctx, -8, -13, 7.5, 7.5, { fill: C.paper, w: 1.5, seed: seed + 4, n: 9 });
      IB.oval(ctx, -8, -13, 3, 3, { w: 1.2, seed: seed + 5, n: 6 });
      IB.ink(ctx, [[-10, -2], [-5, 14], [5, 23]], { w: 1.7, seed: seed + 6 });                                                              // chin strap
      IB.oval(ctx, 12.5, -5, 5, 4.4, { fill: C.charcoal, w: 1.3, seed: seed + 7, n: 8 });                                                    // glasses
      IB.seg(ctx, 8, -6, -8, -4, { w: 1.2, seed: seed + 8 });
    },
  },
  vents: {
    back(ctx, lift, alt, seed) { IB.ink(ctx, [[-21, -2], [-27, 9], [-18, 15], [-9, 6]], { closed: true, fill: '#8f8f8f', w: 1.6, seed }); },
    front(ctx, lift, alt, seed) {
      IB.ink(ctx, IB.ellipse(-3, -7, 25, 23, 9, PI * 0.95, PI * 2.03).concat([[23, -4]]), { closed: true, fill: C.paper, w: LW, seed: seed + 1 });
      ctx.fillStyle = C.ink;
      for (const [x, y, r] of [[-15, -14, 0.5], [-4, -21, 0.2], [8, -18, -0.3], [-9, -9, 0.3], [4, -10, -0.2]]) { ctx.beginPath(); ctx.ellipse(x, y, 4.2, 2.3, r, 0, 7); ctx.fill(); }
      IB.ink(ctx, [[-11, -3], [-6, 13], [4, 23]], { w: 1.7, seed: seed + 2 });
    },
  },
};
function head(ctx, at, r, p, alt, seed, bare) {
  const H = HAIR[r.who];
  ctx.save();
  ctx.translate(at[0], at[1]);
  ctx.rotate(p.nod);
  H.back(ctx, p.hair, alt, seed + 20, bare);
  face(ctx, r.skin, p, seed);
  if (p.look === -1) IB.ink(ctx, [[-4, -8], [-9, -5], [-4, -2]], { w: 1.4, seed: seed + 9 });   // glancing back: a second lid line behind the eye
  H.front(ctx, p.hair, alt, seed + 40, bare);
  ctx.restore();
}

/* ---------- a rider ---------- */
/* Joints relative to the bottom bracket bb they pedal: hip 24 px behind and 112 above it (read off the reference), hands on a grip 56 px ahead and 118 above; the riding pose then has the shoulder 181 above and the head centre 218 above. */
function rider(ctx, r, bb, p, crank, alt, seed, bare) {
  const k = p.sc, hip = [bb[0] - 24, bb[1] - 112 - p.rise], lean = p.lean - p.tuck * 4;
  // the spine turns about the hip: 0.37 rad forward when riding, and `lean` px of shoulder travel either way from there, so leaning back also brings the shoulders down
  const L = (74 - p.tuck * 14) * k, tilt = (22 + lean) / 60, sh = [hip[0] + L * Math.sin(tilt), hip[1] - L * Math.cos(tilt)], headAt = [sh[0] + (18 + p.tuck * 8) * Math.cos(tilt * 0.6) + 37 * k * Math.sin(tilt * 0.6) * 0.5, sh[1] - 37 * k * Math.cos(tilt * 0.5) + p.tuck * 16];
  const grip = [bb[0] + 56, bb[1] - 118];
  const limb = (pts, widths, fill, sd, cap) => IB.limb(ctx, pts, widths.map((w) => w * k), { fill, lw: LW, seed: sd, cap });
  const leg = (a, sd) => {
    const pedal = [bb[0] + CRANK * Math.cos(a), bb[1] + CRANK * Math.sin(a)];
    let ankle = [pedal[0] - 4, pedal[1] - 11], pitch = 0.25 * Math.sin(a);
    if (p.legs === 'out') { ankle = [hip[0] + 112 + 8 * Math.cos(a), hip[1] + 74 + 5 * Math.sin(a)]; pitch = -0.5; }
    if (p.tuck) ankle = [lerp(ankle[0], hip[0] + 34, p.tuck), lerp(ankle[1], hip[1] + 48, p.tuck)];
    const [knee, end] = IB.ik(hip, ankle, 74 * k, 70 * k, -1);
    if (r.shorts) { const cut = [lerp(hip[0], knee[0], 0.8), lerp(hip[1], knee[1], 0.8)]; limb([cut, knee, end], [17, 15, 12], r.skin, sd + 1); limb([hip, cut], [30, 28], r.leg, sd, 'end'); }
    else limb([hip, knee, end], [30, 25, 21], r.leg, sd, 'end');
    ctx.save(); ctx.translate(end[0], end[1]); ctx.rotate(pitch);
    IB.ink(ctx, [[-10, -7], [4, -8], [12, -3], [22, 0], [22, 5], [-10, 5]], { closed: true, fill: r.shoe, w: 1.8, seed: sd + 2 });
    if (r.shorts) IB.seg(ctx, 1, -7, 6, 4, { w: 1.5, seed: sd + 3 }); else IB.seg(ctx, -9, 1.5, 21, 2, { w: 1.2, seed: sd + 3, color: r.shoe === C.navy ? C.paper : C.ink });
    ctx.restore();
  };
  const arm = (i, sd) => {
    const want = p.arms[i], root = [sh[0] + 2, sh[1] + 6];
    let hand = want === 'bar' || want === 'reach' ? [grip[0] + (i ? 5 : 0), grip[1] - (i ? 3 : 0)] : [sh[0] + want[0], sh[1] + want[1]];
    const [elbow, end] = IB.ik(root, hand, 50 * k, 50 * k, want === 'reach' ? 0.02 : hand[1] < sh[1] - 20 ? -1 : 1);
    const sleeveless = r.arm == null;
    if (sleeveless) { const cut = [lerp(root[0], elbow[0], 0.4), lerp(root[1], elbow[1], 0.4)]; limb([cut, elbow, end], [13, 12, 10], r.skin, sd); limb([root, cut], [19, 18], r.top, sd + 5, 'end'); }
    else limb([root, elbow, end], [18, 15, 12], r.arm, sd, 'end');
    if (r.stripes) for (let s = 1; s < 5; s++) { const u = s / 5, x = lerp(elbow[0], end[0], u), y = lerp(elbow[1], end[1], u), d = Math.atan2(end[1] - elbow[1], end[0] - elbow[0]) + PI / 2; IB.seg(ctx, x - Math.cos(d) * 6, y - Math.sin(d) * 6, x + Math.cos(d) * 6, y + Math.sin(d) * 6, { w: 1.4, seed: sd + 10 + s }); }
    if (r.watch && !sleeveless) { const d = Math.atan2(end[1] - elbow[1], end[0] - elbow[0]); ctx.save(); ctx.translate(end[0], end[1]); ctx.rotate(d); IB.box(ctx, -5, -7, 6, 14, { fill: C.paper, w: 1.4, seed: sd + 16 }); ctx.restore(); }
    const ang = Math.atan2(end[1] - elbow[1], end[0] - elbow[0]);
    if (p.open && want !== 'bar' && want !== 'reach') IB.mitt(ctx, end, ang, { kind: p.flat ? 'reach' : 'open', s: 1.45, lw: 1.7, fill: r.skin, flip: i ? -1 : 1, seed: sd + 20 });
    else { const hx = end[0] + 5 * Math.cos(ang), hy = end[1] + 5 * Math.sin(ang) + (want === 'bar' ? 2 : 0); IB.oval(ctx, hx, hy, 8.5, 7.5, { fill: r.skin, w: 1.8, seed: sd + 20, n: 8 }); for (const d of [-3, 1.5]) IB.seg(ctx, hx + d, hy + 1, hx + d + 1, hy + 6, { w: 1.1, seed: sd + 22 + d }); }
  };
  arm(1, seed + 60);
  leg(crank + PI, seed);
  // torso: a pelvis in the trouser colour, a neck, then one boxy garment from the collar to a hem at the waist, all built on the spine so that they lean as one
  const ux = (sh[0] - hip[0]) / L, uy = (sh[1] - hip[1]) / L, T = (along, across) => [hip[0] + (ux * along - uy * across) * k, hip[1] + (uy * along + ux * across) * k];
  IB.ink(ctx, [T(26, -15), T(26, 28), T(-8, 24), T(-12, -12)], { closed: true, fill: r.leg, w: LW, seed: seed + 29 });
  IB.limb(ctx, [T(76, 4), [headAt[0] - 4, headAt[1] + 8]], [14 * k, 13 * k], { fill: r.skin, lw: LW, seed: seed + 28 });
  IB.ink(ctx, [T(86, -10), T(88, 6), T(78, 19), T(54, 27), T(30, 31), T(20, 30), T(19, -16), T(48, -21), T(72, -19)], { closed: true, fill: r.top, w: LW, seed: seed + 30 });
  if (r.bib) {   // overalls: a bib up the front and a strap over the shoulder
    IB.ink(ctx, [T(62, 2), T(58, 26), T(30, 31), T(20, 30), T(19, -16), T(36, -19), T(46, -8)], { closed: true, fill: r.leg, w: 1.7, seed: seed + 31 });
    IB.ink(ctx, [T(60, 6), T(76, 0), T(85, -9)], { w: 5, color: r.leg, seed: seed + 32, taper: false, grain: 0 });
    IB.ink(ctx, [T(60, 3), T(75, -3), T(86, -12)], { w: 1.5, seed: seed + 33 });
    IB.oval(ctx, ...T(56, 9), 2.4, 2.4, { fill: C.paper, w: 1.1, seed: seed + 34, n: 6 });
  } else IB.ink(ctx, [T(84, 6), T(76, 14), T(66, 16)], { w: 1.4, seed: seed + 35 });   // collar
  leg(crank, seed + 10);
  arm(0, seed + 80);
  head(ctx, headAt, r, p, alt, seed + 100, bare);
}

/* ---------- the bike ---------- */
/* The floor under a wheel is a few blue scribbles, not the chalk smear the standing figures get. They belong to the ground: draw them before the bike is tipped. */
function ripples(ctx, x, alt, seed) {
  for (let k = 0; k < 4; k++) { const y = AXLE + R + 2 + k * 5, half = 46 - k * 7, pts = []; for (let i = 0; i <= 6; i++) pts.push([x - half + (i / 6) * half * 2 + ((k + alt) % 2) * 6, y + (i % 2 ? -1.6 : 1.6)]); IB.ink(ctx, pts, { w: 2, color: C.blue, seed: seed + 20 + k, grain: 0 }); }
}
function wheel(ctx, x, alt, seed) {
  IB.oval(ctx, x, AXLE, R - 4, R - 4, { fill: C.paper, w: 8.5, seed, n: 22, wob: 0.4 });
  IB.oval(ctx, x, AXLE, R - 13, R - 13, { w: 1.3, seed: seed + 9, n: 18, grain: 0 });
  for (let i = 0; i < 4; i++) { const a = alt * 0.8 + i * 1.57; IB.ink(ctx, IB.ellipse(x, AXLE, 20 + (i % 2) * 13, 20 + (i % 2) * 13, 5, a, a + 0.9), { w: 1.5, color: '#9a9a9a', seed: seed + i }); }
  IB.oval(ctx, x, AXLE, 4.5, 4.5, { fill: C.ink, w: 0, n: 8 });
}
function crankset(ctx, bb, a, alt, seed) {
  for (const s of [0, PI]) { const q = [bb[0] + CRANK * Math.cos(a + s), bb[1] + CRANK * Math.sin(a + s)]; IB.seg(ctx, bb[0], bb[1], q[0], q[1], { w: 3.2, seed: seed + s }); IB.seg(ctx, q[0] - 10, q[1], q[0] + 12, q[1], { w: 3.2, seed: seed + 1 + s }); }
  IB.oval(ctx, bb[0], bb[1], 13, 13, { fill: C.paper, w: LW, seed, n: 12 });
  for (let i = 0; i < 5; i++) IB.oval(ctx, bb[0] + 7.5 * Math.cos(a + i * 1.257), bb[1] + 7.5 * Math.sin(a + i * 1.257), 2, 2, { w: 1.1, seed: seed + 3 + i, n: 6, grain: 0 });
  for (const s of [-1, 1]) IB.ink(ctx, IB.ellipse(bb[0], bb[1] + 6, 27 + alt * 5, 30 + alt * 5, 4, s > 0 ? 0.25 : 2.35, s > 0 ? 0.8 : 2.9), { w: 1.3, color: '#8a8a8a', seed: seed + 9 + alt + s });   // spin marks
}

MG.scene({
  title: 'spot / tandem-riders-join',
  duration: 11.75, ref: [105.083, 116.833], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    IB.crop(ctx, CROP);
    const f = IB.frame(t), d2 = Math.floor(f / 2), alt2 = d2 % 2, flow = [0, 1, -0.6][d2 % 3];
    // clouds drift, ground props scroll (ones)
    const cl = (x, y, w, seed) => IB.ink(ctx, [[x - w / 2, y], [x - w * 0.2, y - w * 0.12], [x + w * 0.05, y - w * 0.16], [x + w * 0.3, y - w * 0.08], [x + w / 2, y], [x, y + 3]], { closed: true, w: 2, seed, fill: C.bg });
    cl(1372 - t * 3, 185, 150, 60);
    cl(866 - t * 3, 306, 62, 61);
    for (const q of PROPS) {
      const x = q.x + 900 - t * 332;
      if (x < -80 || x > 2000) continue;
      if (q.kind === 'tuft') IB.ink(ctx, [[x - 26, q.y], [x - 20, q.y - 13], [x - 12, q.y], [x - 4, q.y - 18], [x + 4, q.y], [x + 14, q.y - 12], [x + 24, q.y]], { w: 2, smooth: false, seed: q.seed });
      else { IB.oval(ctx, x, q.y, 19, 11, { w: 2, seed: q.seed, n: 8, fill: C.bg }); IB.oval(ctx, x + 32, q.y + 5, 8, 5, { w: 1.8, seed: q.seed + 1, n: 6 }); IB.oval(ctx, x - 24, q.y + 5, 4, 3, { w: 1.8, seed: q.seed + 2, n: 6 }); }
    }

    // the bike creeps right on ones and gains its length on twos, about its own centre
    const pres = RIDERS.map((r, i) => presence(i, f)), n = pres.reduce((a, b) => a + b, 0);
    const wb = 170 + 120 * (n - 1), cx = 1006 + 34.6 * t, rx = cx - wb / 2, fx = cx + wb / 2;
    const bbs = []; let acc = 0;
    RIDERS.forEach((r, i) => { bbs.push([rx + 62 + 120 * acc + 60 * (pres[i] - 1), AXLE - 4]); acc += pres[i]; });
    // a join kicks the tail up: the rear axle rises 50, then 27 px and dips 9 as the whole bike tips about its front tyre, by less each time as the bike gets heavier (the reference's first join lifts it about 50 px)
    let pitch = 0;
    JOINS.forEach(([J], j) => { const k = Math.floor((f - J) / 2); if (f >= J && k < 3) pitch = Math.asin([50, 27, -9][k] / (1 + j * 0.7) / wb); });
    ripples(ctx, rx, alt2, 70);
    ripples(ctx, fx, alt2, 80);
    ctx.save();
    ctx.translate(fx, AXLE + R); ctx.rotate(pitch); ctx.translate(-fx, -(AXLE + R));
    const on = RIDERS.map((r, i) => pres[i] > 0), crank = (d2 / 12) * PI * 2 - PI / 2;
    wheel(ctx, rx, alt2, 70);
    wheel(ctx, fx, alt2, 80);
    if (d2 % 6 < 3) for (let k = 0; k < 2; k++) IB.oval(ctx, rx - 70 - k * 28 - (d2 % 3) * 14, AXLE + 30 + k * 6 - (d2 % 3) * 3, 12 - k * 5 - (d2 % 3) * 2, 7 - k * 3, { w: 1.6, seed: 90 + k, n: 7, fill: C.bg });   // a puff of dust off the rear wheel: three drawings drifting back, then three without
    const tube = (pts, seed) => IB.tube(ctx, pts, { w: 7.5, edge: 1.9, fill: C.blue, seed });
    const built = RIDERS.map((r, i) => pres[i] >= 0.5);   // a newcomer's seat and crank are not there on the first drawing of a join: at 30% they would sit inside the rear wheel
    const topY = AXLE - 76, live = bbs.filter((_, i) => built[i]), first = live[0], last = live[live.length - 1];
    for (const dy of [-13, 13]) IB.seg(ctx, first[0], AXLE - 4 + dy, last[0], AXLE - 4 + dy, { w: 1.3, color: '#9a9a9a', seed: 98 + dy, grain: 0 });   // the chain that keeps every crank in step
    tube([[rx, AXLE], last], 100);                                              // chain stay and bottom tube
    tube([[rx, AXLE], [first[0] - 26, topY]], 101);                             // seat stay
    tube([[first[0] - 26, topY], [fx - 52, topY]], 102);                        // top tube
    tube([last, [fx - 50, topY + 6]], 103);                                     // down tube
    tube([[fx - 56, topY - 22], [fx - 48, topY + 8], [fx, AXLE]], 104);         // head tube and fork
    // front bar: a white stem curving back to a blue grip under the front rider's hands
    IB.tube(ctx, [[fx - 54, topY - 20], [fx - 60, topY - 46], [last[0] + 74, AXLE - 124]], { w: 8, edge: 2, fill: C.paper, smooth: true, seed: 105 });
    IB.ink(ctx, [[last[0] + 74, AXLE - 124], [last[0] + 50, AXLE - 122]], { w: 8.5, color: C.blue, seed: 106, taper: false });
    let prev = null;
    RIDERS.forEach((r, i) => {
      if (!built[i]) return;
      const bb = bbs[i];
      tube([bb, [bb[0] - 24, topY - 8]], 110 + i);                              // seat tube
      IB.ink(ctx, [[bb[0] - 44, topY - 15], [bb[0] - 24, topY - 20], [bb[0] - 6, topY - 15], [bb[0] - 8, topY - 9], [bb[0] - 40, topY - 8]], { closed: true, fill: C.charcoal, w: 2, seed: 120 + i });   // saddle
      if (prev != null) {                                                        // stoker bar for the rider behind, bracketed off this seat tube
        const g = [bbs[prev][0] + 56, AXLE - 122];
        IB.tube(ctx, [[bb[0] - 22, topY - 4], [bb[0] - 34, topY - 30], [g[0] + 18, g[1] + 2]], { w: 7, edge: 1.9, fill: C.paper, smooth: true, seed: 130 + i });
        IB.ink(ctx, [[g[0] + 18, g[1] + 2], [g[0] - 6, g[1] + 2]], { w: 8.5, color: C.blue, seed: 135 + i, taper: false });
      }
      crankset(ctx, bb, crank, alt2, 140 + i * 9);
      prev = i;
    });
    // riders, rear first so the one in front overlaps
    const capOff = f >= 240;
    RIDERS.forEach((r, i) => { if (on[i]) rider(ctx, r, bbs[i], poseOf(i, f), crank, flow, 200 + i * 150, r.who === 'cap' && capOff); });
    // the cap that blows off: up and back on twos, turning as it goes
    if (capOff) {
      const u = Math.min(1, (d2 * 2 - 240) / 36), x0 = bbs[2][0] - 20, x = lerp(x0, x0 - 330, u), y = AXLE - 262 - 150 * Math.sin(u * 2.2) + 30 * u;
      ctx.save(); ctx.translate(x, y); ctx.rotate(-u * 6.5);
      IB.ink(ctx, IB.ellipse(0, 0, 24, 20, 8, PI, PI * 2).concat([[44, 2], [20, 3]]), { closed: true, fill: C.paper, w: LW, seed: 900 });
      ctx.restore();
    }
    ctx.restore();
  },
});
</script>
