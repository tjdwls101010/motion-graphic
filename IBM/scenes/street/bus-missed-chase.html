<!doctype html>
<meta charset="utf-8">
<title>street / bus-missed-chase</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/handheld.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../../kit/props/traffic.js"></script>
<script>
/* 정류장에 선 버스의 문이 닫히고, 서류 가방을 든 사람이 손을 흔들며 뛰어와 거의 따라잡지만 버스는 매연을 한 번 뱉고 멀어지고, 정류장 앞에 멈춰 선 사람의 어깨가 툭 떨어진다. 원본에 없는 창작 장면으로, 버스(IB.bus)와 매연(IB.exhaust), 정류장(IB.busStop), 뛰기(IB.run), 서류 가방(IB.briefcase)을 썼다. 전달하는 생각: 놓친 것은 멀어지는 버스가 아니라 그 뒤의 멈춤이 말한다.
   Motion notes: one locked shot, 6 s. Two clocks: the bus is a machine on ones (door, pull-away, wheels), the runner and the puff are drawings on twos. The bus (1100 x 440 body, green) stands with its door open; the door folds shut over 0.42-0.75 s; the bus holds still, its tail shakes for three drawings (1.17-1.42 s: the engine), and at 1.42 s it pulls away at 1600 px/s² (nose up 0.012 rad for 6 frames, 0.005 for 4), its spokes turning with the distance; it is off the right edge at 2.96 s. The puff is coughed once at 1.42 s, four drawings at the pipe where the bus stood (it does not follow the bus). The runner (h 330, line 3 px) runs in from off-screen left from the first frame at IB.runLen / 8 = 60.5 px a drawing (726 px/s), waving the far hand from the third drawing, two open-hand positions swapping every drawing (the far hand so the face stays clear; no prev while it waves, which would average the wave away). Closest it gets to the door is 84 px at 1.83 s, while the bus is still slower than a run; then the bus outruns it. 2.33 s: the last run drawing lands the far foot ahead (x 1657); 2.42 s brake (leaning back 0.14, the hip 0.12 h behind the landed foot, the other foot put down 0.3 h behind it), 2.5 s the back foot steps up in the air, 2.58 s standing, the far hand still reaching after the bus; every drawing from the stop passes the one before as pose.prev. Holds 0.67 s, the hand comes down in one in-between (3.33, 3.42 s), hold 0.33 s; 3.83 s the shoulders go up (lean -0.08, the hip 5 px up: the anticipation), 3.92 s they drop past where they stop (lean 0.27, nod 0.42, the hip 10 px down, hands hanging forward), 4.0 s settle (lean 0.23, nod 0.36); the head settles a drawing later, and from 4.08 s nothing moves but the bubble, which opens at 4.25 s and holds from 4.42 s. Colours: the bus's green and the runner's sky shirt; the briefcase is charcoal and the shelter (IB.busStop, panel left open so the bus shows through it) white and grey. */
const C = IB.C, F = IB.FIG, H = 330, FLOOR = 930, ROAD = 850;
const WHO = { ...IB.PEOPLE.clerk, h: H, dir: 1, seed: 30 };
const RUN = IB.runLen(WHO) / 8, X0 = -110, STOPK = 28;   // runs from off-screen left; the last run drawing (k 28, phase 0.5) lands the far foot ahead

/* ---------- the bus: a machine, on ones ---------- */
const BX = 720, CLOSE = [10, 18], GO = 34, ACC = 1600;   // door closes over frames 10-17; pulls away at frame 34 at 1600 px/s²
const busAt = (f) => {
  const tau = Math.max(0, (f - GO) / 24), dist = 0.5 * ACC * tau * tau;
  if (BX + dist - IB.BUS.len / 2 > 1990) return null;   // gone off the right edge (2.96 s)
  return { x: BX + dist, spin: dist / IB.BUS.r, door: f < CLOSE[0] ? 1 : f < CLOSE[1] ? 1 - (f - CLOSE[0]) / (CLOSE[1] - CLOSE[0]) : 0, pitch: f >= GO && f < GO + 6 ? 0.012 : f >= GO + 6 && f < GO + 10 ? 0.005 : 0 };
};
const PIPE = [BX - IB.BUS.len / 2 - 12, ROAD - IB.BUS.r + 15];   // where the pipe's mouth is while the bus stands: the puff stays there

/* ---------- the runner: on twos ---------- */
const shoulderOf = (p) => [p.hip[0] + Math.sin(p.lean || 0) * (F.torso - 0.012) * H, p.hip[1] - Math.cos(p.lean || 0) * (F.torso - 0.012) * H];
const WAVE = [[0.13, -0.21], [0.05, -0.25]];   // the far hand up, open, swapping every drawing: the face stays clear (the near arm would cover it)
function running(k) {
  const p = IB.run(X0 + k * RUN, FLOOR, WHO, (k / 8) % 1), sh = shoulderOf(p);
  if (k >= 2) { const w = WAVE[k % 2]; p.hands = [[sh[0] + w[0] * H, sh[1] + w[1] * H], p.hands[1]]; p.hand = ['open', 'grip']; }
  return { ...p, face: { eye: 'wide', mouth: 'open' } };
}
// the stop: the far foot lands ahead on the last run drawing and stays; the near foot comes down behind, then steps up beside it
const LAST = running(STOPK), LAND = LAST.feet[0][0], AY = FLOOR - F.ankle * H;
const XS = LAND - 0.04 * H, S0 = IB.stand(XS, FLOOR, WHO), HY = S0.hip[1];
const STAND = { ...S0, feet: [[LAND, AY, 0], [XS - 0.036 * H, AY, 0]] };
const at = (dx, dy) => [XS + dx * H, HY + dy * H];
const DRAW = {
  brake: { ...STAND, hip: [LAND - 0.12 * H, HY + 0.04 * H], lean: -0.14, feet: [[LAND, AY, -0.2], [LAND - 0.3 * H, AY, 0.3]], hands: [at(0.1, -0.36), at(-0.02, 0.0)], hand: ['open', 'grip'], face: { eye: 'wide', mouth: 'open' } },
  stepIn: { ...STAND, hip: [XS - 0.03 * H, HY + 0.01 * H], lean: 0.04, feet: [[LAND, AY, 0], [XS - 0.12 * H, AY - 0.05 * H, 0.3]], hands: [at(0.2, -0.26), at(0.0, 0.05)], hand: ['open', 'grip'], face: { eye: 'wide', mouth: 'open' } },
  reach: { ...STAND, lean: 0.06, hands: [at(0.24, -0.24), at(0.01, 0.06)], hand: ['open', 'grip'], face: { eye: 'wide', mouth: 'open', brow: 1 } },   // the far hand still out after the bus
  lower: { ...STAND, lean: 0.02, hands: [at(0.12, -0.02), at(0.01, 0.06)], hand: ['relax', 'grip'], face: { eye: 'dot', mouth: 'flat', brow: 1 } },
  breathIn: { ...STAND, hip: [XS, HY - 5], lean: -0.08, nod: -0.08, hands: [at(0.06, 0.0), at(-0.01, 0.02)], hand: ['relax', 'grip'], face: { eye: 'dot', mouth: 'flat', brow: 1 } },   // the shoulders go up first
  slumpPast: { ...STAND, hip: [XS + 3, HY + 10], lean: 0.27, nod: 0.42, hands: [at(0.12, 0.14), at(0.08, 0.15)], hand: ['relax', 'grip'], face: { eye: 'closed', mouth: 'frown', brow: 1 } },
  slump: { ...STAND, hip: [XS + 2, HY + 8], lean: 0.23, nod: 0.36, hands: [at(0.1, 0.13), at(0.07, 0.14)], hand: ['relax', 'grip'], face: { eye: 'closed', mouth: 'frown', brow: 1 } },
};
const ACT = [[STOPK * 2 + 2, DRAW.brake], [STOPK * 2 + 4, DRAW.stepIn], [STOPK * 2 + 6, DRAW.reach], [80, IB.poseMix(DRAW.reach, DRAW.lower, 0.5)], [82, DRAW.lower], [92, DRAW.breathIn], [94, DRAW.slumpPast], [96, DRAW.slump]];
const poseOn = (f) => (f <= STOPK * 2 ? running(f >> 1) : IB.held(ACT, f));
const poseAt = (t) => { const f = IB.frame(IB.twos(t)), p = poseOn(f); return f > STOPK * 2 ? { ...p, prev: poseOn(f - 2) } : p; };   // while it runs and waves no prev: the wave flips every drawing
const puff = (f) => { const k = (f - GO) >> 1; return k >= 0 && k < 4 ? k : null; };   // GO is even: one puff drawing per two frames
IB.actors = (t) => ({ runner: poseAt(t), bus: busAt(IB.frame(t)), puff: puff(IB.frame(t)) });
IB.actors.step = { bus: 1 };

MG.scene({
  title: 'street / bus-missed-chase',
  duration: 6, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t), ft = IB.frame(IB.twos(t)), b = busAt(f), alt = IB.alternate(f, 2);
    if (b) {
      for (const ax of IB.BUS.axles) IB.ripples(ctx, [b.x + ax, ROAD], { alt, seed: 70 + ax });
      IB.bus(ctx, [b.x, ROAD], b);
    }
    if (ft >= GO - 6 && ft < GO) IB.shake(ctx, PIPE[0] + 10, PIPE[1] - 14, 18, { a: Math.PI + 0.3, n: 2, seed: 400 + ft, w: 2.4 });   // the engine revs: shake marks at the tail for three drawings
    const k = puff(f);
    if (k != null) IB.exhaust(ctx, PIPE, { k });
    IB.smear(ctx, 1020, FLOOR - 39, 560, { h: 12, seed: 6 });
    IB.busStop(ctx, [1000, FLOOR - 30], { sign: 1, panel: false });
    IB.smear(ctx, 960, FLOOR - 9, 1900, { h: 16, seed: 8, alpha: 0.7 });
    const p = poseAt(t), j = IB.figure(ctx, p, { ...WHO, face: p.face });
    IB.briefcase(ctx, j.hands[1], { h: H, fill: C.charcoal, lw: IB.figLine(H), seed: 60 });
    IB.bubble(ctx, ['놓쳤다…'], t, IB.T(51), { tip: [XS + 0.1 * H, HY - 0.5 * H], x: XS + 0.42 * H, y: HY - 0.86 * H, seed: 500 });
  },
});
</script>
