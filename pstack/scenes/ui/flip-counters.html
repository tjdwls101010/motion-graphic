<!doctype html>
<meta charset="utf-8">
<title>ui / flip-counters</title>
<link rel="stylesheet" href="../../../core/base.css">
<link rel="stylesheet" href="../../kit/ui.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ui.js"></script>
<script>
/* 숫자 카드 둘이 오도미터 타일로 각자 주장("주 10,000회 사용", "월 2,000개 PR")을 내세우고, 기울어진 스티커가 둘 다 본인 주장이라고 찍은 뒤, 두 카드가 옆으로 줄어들어 세 번째 증거 카드에 자리를 내주는 동안 두 번째 숫자가 스스로 고쳐진다. 전달하는 생각: 큰 숫자를 먼저 보이고, 단서는 그 위에 도장으로 찍는다.
   Motion notes: cards pop empty first (scale 0.9 -> 1, outBack, 0.45 s, second card 0.15 s later) and are filled in afterwards in reading order: header types on, chip pops, then the number; a number never appears already set, its tiles roll from zeros, left tile first with 0.12 stagger over ~1.1 s, and on the first card the grey unit fades in only once the tiles land (on the second card the unit ghosts in at 40% half a second before the roll, as the question the number then answers); the sticker arrives last, oversized (1.5 -> 1) with outBack and a tilt, like a stamp; "make room" is one 0.7 s inOutCubic scale-and-slide of the existing group while the new card slides in from the right. */
const { prog, ease, lerp, el } = MG;
MG.scene({
  title: 'ui / flip-counters',
  duration: 16, ref: [61.4, 77.4],
  setup(stage) {
    const root = UI.root(stage);
    const group = el('div', { class: 'abs', style: { left: 0, top: 0, width: '1920px', height: '1080px', transformOrigin: '100px 476px' } });
    root.append(group);
    const mk = (x, n, icon, label, pattern, unit) => {
      const h = UI.header(n, icon, label), odo = UI.odometer(pattern);
      const unitEl = el('span', { class: 'unit', text: unit, style: { marginLeft: '22px', marginBottom: '14px' } });
      const foot = el('div', { style: { height: '64px', marginTop: '26px', display: 'flex', alignItems: 'center', gap: '18px' } });
      const card = UI.card(group, x, 272, 806, 408, h.el, el('div', { style: { display: 'flex', alignItems: 'flex-end', marginTop: '28px' } }, odo.el, unitEl), foot);
      return { card, h, odo, unitEl, foot };
    };
    const a = mk(122, '1', 'doc', '스킬 사용', '00,000', '번 / 주');
    const b = mk(992, '2', 'pr', 'PR 내보내기', '0,000', '개 / 월');
    a.chip = UI.chip('', UI.icon('cube', 30), 'Cursor 팀 안에서');
    a.foot.append(a.chip);
    // PR ---> 실서비스 : an arrow head travels along a dashed track
    b.arrow = el('span', { class: 'icon', style: { position: 'absolute', top: '-17px', left: 0 }, html: '<svg viewBox="0 0 24 24" width="34" height="34" style="stroke-width:3"><path d="M4 12h15M13 6l6 6-6 6"/></svg>' });
    b.track = el('div', { style: { position: 'relative', width: '230px', borderTop: '3px dashed #9a9a9a', height: 0 } }, b.arrow);
    b.flow = el('div', { style: { display: 'flex', alignItems: 'center', gap: '18px' } }, UI.chip('', UI.icon('pr', 26), 'PR'), b.track, UI.chip('dark', '실서비스'));
    // the later correction row: three candidate values, the last one selected
    b.opts = el('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', position: 'absolute', left: '44px', bottom: '34px' } }, UI.chip('sm ghost', '1,000'), UI.chip('sm ghost', '2,000'), UI.chip('sm', '2,500'));
    b.foot.append(b.flow);
    b.card.append(b.opts);
    const sticker = el('div', { class: 'sticker', style: { left: '668px', top: '176px', fontSize: '46px', padding: '18px 34px' } }, '본인 주장', el('span', { class: 'sub', text: '외부 검증 없음', style: { fontSize: '31px' } }));
    group.append(sticker);
    // third card: evidence (a code-drawn chart placeholder, not the screenshot in the reference)
    const bars = Array.from({ length: 14 }, (_, i) => el('i', { style: { display: 'block', width: '18px', background: i > 9 ? '#3b6fd4' : '#c9d6f2', borderRadius: '3px 3px 0 0', alignSelf: 'flex-end' } }));
    const c = UI.card(root, 1290, 300, 570, 352,
      el('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', fontSize: '26px', fontWeight: 800 } }, UI.chip('dark sm', '발표'), '지난달 1,000개'),
      el('div', { style: { display: 'flex', gap: '10px', height: '150px', marginTop: '22px', paddingBottom: '2px', borderBottom: '3px solid #2a2a2a', alignItems: 'flex-end' } }, ...bars),
      el('div', { class: 'mono', style: { fontSize: '19px', fontWeight: 700, marginTop: '18px' }, text: '"Last month I shipped a thousand PRs"' }));
    c.style.padding = '30px 34px';
    return { group, a, b, sticker, c, bars };
  },
  render(t, r) {
    const { a, b } = r;
    MG.show(a.card, prog(t, 0.2, 0.45, 'outBack'), { scale: 0.9 });
    MG.show(b.card, prog(t, 0.35, 0.45, 'outBack'), { scale: 0.9 });
    // card 1 fills in: header, chip, number, unit
    UI.type(a.h.label, a.h.text, prog(t, 1.6, 0.5));
    a.h.icon.style.opacity = prog(t, 1.5, 0.2);
    MG.show(a.chip, prog(t, 3.2, 0.35, 'outBack'), { scale: 0.7 });
    a.odo.roll('00000', '10000', prog(t, 5.0, 1.15));
    MG.show(a.unitEl, prog(t, 6.0, 0.3, 'outCubic'), { dx: -12 });
    // card 2: unit ghosts in first (the question), then the number answers it
    b.unitEl.style.opacity = lerp(0, 1, prog(t, 7.6, 0.3)) * (t < 8.9 ? 0.4 : 1);
    b.unitEl.style.transform = '';
    const fix = prog(t, 14.3, 0.9);
    if (fix > 0) b.odo.roll('2000', '2500', fix, { spins: 0 });
    else b.odo.roll('0000', '2000', prog(t, 8.1, 1.1));
    UI.type(b.h.label, b.h.text, prog(t, 8.9, 0.5));
    b.h.icon.style.opacity = prog(t, 8.8, 0.2);
    b.flow.style.opacity = prog(t, 9.4, 0.3) * (1 - prog(t, 10.5, 0.3));
    b.arrow.style.left = lerp(-6, 196, (Math.max(0, t - 9.6) % 1.4) / 1.4) + 'px';      // loops while visible
    // the stamp
    const s = prog(t, 11.7, 0.4, 'outBack');
    r.sticker.style.opacity = prog(t, 11.7, 0.12);
    r.sticker.style.transform = `rotate(-5deg) scale(${lerp(1.5, 1, s)})`;
    // make room for evidence
    const m = prog(t, 13.5, 0.7, 'inOutCubic');
    r.group.style.transform = `translate(${lerp(0, -28, m)}px, 0) scale(${lerp(1, 0.68, m)})`;
    MG.show(r.c, prog(t, 13.7, 0.6, 'outCubic'), { dx: 360 });
    r.bars.forEach((bar, i) => { bar.style.height = Math.pow(i / 13, 2.6) * 140 * prog(t, 14.1 + i * 0.03, 0.4, 'outCubic') + 4 + 'px'; });
    b.opts.style.opacity = prog(t, 14.0, 0.3);
  },
});
</script>
