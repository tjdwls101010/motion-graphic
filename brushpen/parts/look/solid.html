<!doctype html>
<meta charset="utf-8">
<title>look / solid</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/solid.js"></script>
<script src="../sample.js"></script>
<script>
/* 선·색·질감 견본: 입체로 도는 사물의 계산 IB.space(작은 지역 공간을 무대 px로 투영), IB.cast(조각 하나의 투영점, 평균 깊이 z, 앞면인지 front), IB.rim(굽힐 수 있게 변마다 점을 찍은 사각형), IB.crease(접힌 자리의 흑연), IB.clip(다각형 클립). WebGL도 z버퍼도 없이 평평한 조각 몇 장을 z가 먼 것부터 그리고 front로 뒷면을 가리므로, 모든 변이 같은 붓펜 선과 먼지를 받는다. 값은 kit의 쓰임에서 가져왔다: 폴더는 look 0.22(뒤 표지가 앞 표지 위로 비쳐 보이게 하는 카메라 높이), 서류는 0.18, 렌즈는 기본 f 1500(200px 물체가 거의 모이지 않는 망원)이고 600 아래는 일부러 넓은 화각일 때만 쓴다(미러볼은 반지름의 3배). 폴더 표지 200×167, 벌어짐 open 0.06~0.82에 따라 틈의 흑연 깊이 18 + 70·open, 서류의 빠른 회전은 도는 그림 대신 pitch 0.9와 -0.8 두 장이다. 그림은 모두 2프레임 단위(입방체는 미러볼처럼 3프레임 단위)로 바뀐다. */
const FW = 200, FH = 167, DW = 173, DH = 238;
// a folder's two covers hinged at the bottom, open by `open` rad, as IB.folder builds them
const covers = (S, open) => {
  const h = open / 2, cs = Math.cos(h), sn = Math.sin(h);
  const cover = (side) => { const P = (x, up) => [x, -up * cs, side * (up * sn + 2)]; return [P(-FW / 2, FH), P(FW / 2, FH), P(FW / 2, 0), P(-FW / 2, 0)]; };
  const a = IB.cast(S, cover(1)), b = IB.cast(S, cover(-1));
  return a.z >= b.z ? [a, b] : [b, a];   // far, near
};
const folder = (ctx, S, open, crease) => {
  const [far, near] = covers(S, open);
  IB.ink(ctx, far.pts, { closed: true, smooth: false, fill: IB.C.blue, w: 3.7, seed: 21 });
  if (crease && open > 0.07) {   // graphite in the gap, along the side edge of the near cover the far one shows beyond
    const cx = (q) => q.reduce((s, v) => s + v[0], 0) / q.length, left = cx(far.pts) < cx(near.pts);
    const e0 = near.pts[0][0] < near.pts[1][0] ? (left ? [3, 0] : [2, 1]) : (left ? [2, 1] : [3, 0]);
    ctx.save();
    IB.clip(ctx, far.pts);
    IB.crease(ctx, near.pts[e0[0]], near.pts[e0[1]], 18 + 70 * open, { side: left ? 1 : -1, seed: 23, alpha: 0.75 });
    ctx.restore();
  }
  IB.ink(ctx, near.pts, { closed: true, smooth: false, fill: IB.C.blue, w: 3.7, seed: 22 });
};
// a cube of side 2r: its six faces, each listed clockwise as seen from outside
const R = 80, CUBE = [
  [[-R, -R, -R], [R, -R, -R], [R, R, -R], [-R, R, -R]], [[R, -R, R], [-R, -R, R], [-R, R, R], [R, R, R]],
  [[-R, -R, R], [-R, -R, -R], [-R, R, -R], [-R, R, R]], [[R, -R, -R], [R, -R, R], [R, R, R], [R, R, -R]],
  [[-R, -R, R], [R, -R, R], [R, -R, -R], [-R, -R, -R]], [[-R, R, -R], [R, R, -R], [R, R, R], [-R, R, R]],
];
const FACE = [IB.C.yellow, IB.C.paper, IB.C.paper, IB.C.paper, IB.C.mint, IB.C.paper];   // near face yellow, top mint
const cube = (ctx, S) => CUBE.map((q, i) => ({ ...IB.cast(S, q), i })).filter((p) => p.front).sort((a, b) => b.z - a.z)
  .forEach((p) => IB.ink(ctx, p.pts, { closed: true, smooth: false, fill: FACE[p.i], w: 3, seed: 40 + p.i }));
MG.scene({
  title: 'look / solid',
  duration: 4, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'solid.js — IB.space, IB.cast, IB.rim, IB.crease, IB.clip');
    const f = IB.frame(t), n = IB.drawn(IB.twos(t), 0), c = SAMPLE.grid(6, 3), win = (i) => [0, 0, c[i][2], c[i][3]];
    // a card turning round on twos: its front is blue, its back paper
    const yaw = n * 0.13, card = IB.cast(IB.space({ at: [295, 330], yaw, look: 0.22 }), [[-FW / 2, -FH, 0], [FW / 2, -FH, 0], [FW / 2, 0, 0], [-FW / 2, 0, 0]]);
    SAMPLE.cell(ctx, c[0], win(0), () => IB.ink(ctx, card.pts, { closed: true, smooth: false, fill: card.front ? IB.C.blue : IB.C.paper, w: 3.7, seed: 11 }), `IB.space({ yaw: ${(yaw % (2 * Math.PI)).toFixed(2)} }) → IB.cast().front ${card.front}`);
    SAMPLE.cell(ctx, c[1], win(1), () => {
      folder(ctx, IB.space({ at: [160, 320], yaw: -0.3, look: 0 }), 0.4);
      folder(ctx, IB.space({ at: [430, 320], yaw: -0.3, look: 0.22 }), 0.4);
    }, 'look: 0 · 0.22 — the back cover peeks over');
    const turn = IB.drawn(IB.threes(t), 0, 8) * 0.12;
    SAMPLE.cell(ctx, c[2], win(2), () => cube(ctx, IB.space({ at: [295, 215], yaw: turn, pitch: -0.35 })), 'IB.cast z: far to near, f 1500 — on threes');
    SAMPLE.cell(ctx, c[3], win(3), () => cube(ctx, IB.space({ at: [295, 215], yaw: turn, pitch: -0.35, f: 420 })), 'f: 420 — a deliberate wide angle');
    const open = IB.loop(f, [0.62, 0.82, 0.62, 0.4, 0.2, 0.06, 0.13, 0.2, 0.31, 0.4], 6);   // held three drawings each, so the tone can be read
    SAMPLE.cell(ctx, c[4], win(4), () => folder(ctx, IB.space({ at: [295, 330], yaw: -0.6, look: 0.22 }), open, true), `IB.clip + IB.crease(…, 18 + 70 · open) — open ${open}`);
    const pitch = IB.loop(f, [0, 0.9, 0, -0.8], 12);
    SAMPLE.cell(ctx, c[5], win(5), () => {
      const S = IB.space({ at: [295, 340], pitch, look: 0.18 }), rim = IB.cast(S, IB.rim(-DW / 2, -DH, DW, DH, 10));
      IB.ink(ctx, rim.pts, { closed: true, smooth: false, fill: IB.C.paper, w: 3.3, seed: 31 });
      rim.pts.forEach(([x, y]) => IB.oval(ctx, x, y, 3.5, 3.5, { fill: IB.C.royal, w: 0, n: 8 }));
    }, `IB.rim(x, y, ${DW}, ${DH}, 10) — pitch ${pitch}`);
  },
});
</script>
