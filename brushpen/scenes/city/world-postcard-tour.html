<!doctype html>
<meta charset="utf-8">
<title>city / world-postcard-tour</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/props/nature.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../../kit/sets/landmarks.js"></script>
<script src="../../kit/camera.js"></script>
<script src="../../kit/props/citylife.js"></script>
<script>
/* 세계 엽서: 종이비행기 하나가 뉴욕, 런던, 파리, 도쿄, 서울, 시드니, 로마, 기자의 랜드마크를 차례로 가로질러 날고, 도시와 도시 사이는 원본의 스피드라인 휩으로 넘어간다. 도시마다 하나씩 작은 움직임이 있다(여객선, 빅벤의 분침과 런던 아이, 에펠탑의 반짝임, 벚꽃잎, 광화문 위의 새, 오페라하우스 앞 배, 콜로세움의 비둘기, 피라미드 위의 새). 원본에 없는 창작 장면이다. 전달하는 생각: 한 줄기 비행이 세계를 한 장씩 넘긴다.
   Motion notes: 12.5 s, eight cards: the first 2.0 s, the six after it 1.5 s, the last 1.5 s with its final 0.75 s still. Each card holds and is joined to the next by the reference's whip (insert/mesh-eyes-whip): the cards stand 4000 px apart on one long stage and IB.shot whips the camera from one to the next (8 frames: out in 2, two bare, in over 4), tinted with the colours leaving and arriving. Each card has its own camera while it holds: New York a 900 px shot on the ferry easing open (24 frames) to the statue at 1300; London a 1100 px view that picks up the plane at Big Ben and follows it to the Eye; Paris a tilt up the tower (ease, 1000 px) from its feet to the plane; Tokyo the reference's pan (16 frames, on twos) from Tokyo Tower to Fuji; Seoul a 700 px close-up of the gate's roof pulling back (push, 20 frames) to 1700 to find Namsan; Sydney the harbour at 1600 easing in (20 frames) on the ferry at 1000; Rome the arena at 1500, then a cut to a 640 px close-up of the pigeons over its rim; Giza the whole desert pushing in (14 frames) low on the pyramids to 1500 and stopping as the card holds still. The paper plane crosses every card left to right on twos (1070 px a second, bobbing 40 px), so the eye follows one thing through the cuts. In each card one thing moves: on ones for machines (the ferries, Big Ben's minute hand), on twos for drawn things (waves, sparkle, petals, wings). The last card holds still from 11.75 s. Colours: each city's own (the ferry's yellow, the Eye's sky capsules, the tower's bronze, Fuji's blue, the hill's mint, the stone of Rome and the sand of Giza). */
const SEG = 36, N = 8;
const plane = (u) => [-200 + u * 1070, 320 + Math.sin(u * 3.2) * 40];
const CARDS = [
  (ctx, u, d, ff) => { IB.river(ctx, [-100, 2100], 800, { d, h: 300 }); IB.skyline(ctx, 800); IB.liberty(ctx, [900, 800], { h: 600 }); IB.ferry(ctx, [260 + ff * 9, 830], { s: 0.7 }); },
  (ctx, u, d, ff) => { IB.skyline(ctx, 860); IB.bigBen(ctx, [700, 860], { h: 640, time: [11, 59 + Math.floor(ff / 18)] }); IB.londonEye(ctx, [1320, 860], { r: 300, rot: ff * 0.002 }); },
  (ctx, u, d) => { IB.skyline(ctx, 880); IB.eiffel(ctx, [960, 880], { h: 720, sparkle: d % 2 }); IB.lamppost(ctx, [480, 880], { h: 380 }); IB.lamppost(ctx, [1440, 880], { h: 380 }); },
  (ctx, u, d) => { IB.fuji(ctx, [1200, 860], { w: 1100, h: 320 }); IB.skyline(ctx, 860); IB.tokyoTower(ctx, [680, 860], { h: 640 }); IB.petals(ctx, [0, 100, 1920, 980], { d, n: 30, seed: 44 }); },
  (ctx, u, d) => { IB.skyline(ctx, 880); IB.namsanTower(ctx, [1450, 880], { h: 330, hill: 200 }); IB.gwanghwamun(ctx, [780, 880], { h: 400 }); [0, 1].forEach((i) => IB.flapper(ctx, [600 + u * 500 + i * 70, 300 - i * 30], { wing: (d + i) % 2, s: 1.2, color: IB.C.ink, seed: 60 + i })); },
  (ctx, u, d, ff) => { IB.river(ctx, [-100, 2100], 780, { d, h: 320 }); IB.skyline(ctx, 780); IB.operaHouse(ctx, [960, 790], { h: 260 }); IB.ferry(ctx, [1700 - ff * 8, 830], { s: 0.55, dir: -1 }); },
  (ctx, u, d) => { IB.skyline(ctx, 860); IB.colosseum(ctx, [960, 860], { h: 340 }); [0, 1, 2].forEach((i) => IB.flapper(ctx, [700 + u * 420 + i * 60, 360 + i * 25 - u * 80], { wing: (d + i) % 2, s: 1.1, seed: 70 + i })); },
  (ctx, u, d) => { IB.skyline(ctx, 880); IB.pyramids(ctx, [560, 880], { h: 340 }); if (u < 1.5) IB.flapper(ctx, [1100 + u * 400, 330 - u * 60], { wing: d % 2, s: 1.3, color: IB.C.ink, seed: 80 }); },
];
const TINT = [[IB.C.yellow], [IB.C.sky], [IB.C.mustard], [IB.C.sky], [IB.C.mint], [IB.C.paper], ['#e6e2d6'], [IB.C.yellow]];
const FIRST = 48, START = (i) => (i === 0 ? 0 : FIRST + (i - 1) * SEG), STILL = 282;   // the first card is 0.5 s longer, so the gallery's poster (0.72 of the length) falls on a held card; the last holds still from 11.75 s
const cardAt = (f) => { let i = 0; while (i < N - 1 && f >= START(i + 1)) i++; return i; };
// the cards stand side by side on one long stage, 4000 px apart, so the camera whips from one to the next; each card is filmed its own way while it holds
const OX = (i) => i * 4000, at = (i, v) => (typeof v === 'function' ? (f) => at(i, v(f)) : { ...v, at: [OX(i) + v.at[0], v.at[1]] });
const planeX = (k) => -200 + (k / 24) * 1070;   // where the plane is k frames into its card, on ones for a camera that follows it
const CAMS = [   // per card: the view it arrives at, then [frames into the card, view, move, over]
  [{ at: [420, 720], w: 900 }, [16, { at: [900, 560], w: 1300 }, 'ease', 24]],                               // New York: close on the ferry, opening up to the statue as it sails toward her
  [(f) => ({ at: [MG.clamp(planeX(f - START(1)) + 80, 550, 1370), 520], w: 1100 })],                          // London: the camera picks up the plane at Big Ben and follows it to the Eye
  [{ at: [960, 720], w: 1000 }, [4, { at: [960, 380], w: 1000 }, 'ease', 24]],                                // Paris: up the tower from its feet to where the plane passes
  [{ at: [700, 560], w: 1200 }, [8, { at: [1220, 560], w: 1200 }, 'pan', 16]],                                // Tokyo: the reference's pan from Tokyo Tower to Fuji
  [{ at: [780, 640], w: 700 }, [6, { at: [960, 560], w: 1700 }, 'push', 20]],                                 // Seoul: close on the gate's roof, pulling back to find Namsan behind
  [{ at: [960, 600], w: 1600 }, [10, { at: [1200, 690], w: 1000 }, 'ease', 20]],                              // Sydney: the harbour, easing in on the ferry under the shells
  [{ at: [960, 640], w: 1500 }, [16, { at: [1060, 420], w: 640 }, 'cut']],                                    // Rome: the arena, then a cut up to the pigeons over its rim
  [{ at: [960, 540], w: 1920 }, [4, { at: [900, 640], w: 1500 }, 'push', 14]],                                // Giza: the desert, pushing in low on the pyramids until the hold
];
const SHOTS = CAMS.flatMap(([v, ...moves], i) => [[i ? START(i) - 4 : 0, at(i, v), ...(i ? ['whip', 8] : [])], ...moves.map(([k, mv, how, over]) => [START(i) + k, at(i, mv), how, over])]);
const tintAt = (f) => { const i = cardAt(f + 4); return i > 0 && f < START(i) + 4 ? [...TINT[i - 1], ...TINT[i]] : TINT[i]; };   // the whip carries the colours leaving and arriving

IB.actors = (t) => { const f = Math.floor(t * 24), i = cardAt(f), k = f - START(i); return { card: i, plane: f < STILL && !IB.shot(SHOTS, f).bare ? plane(Math.floor((k / 24) * 12) / 12).map(Math.round) : null }; };

MG.scene({
  title: 'city / world-postcard-tour',
  duration: 12.5, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = Math.floor(t * 24);
    IB.film(ctx, IB.shot(SHOTS, f), (ctx, cam) => {
      const i = MG.clamp(Math.round((cam.at[0] - 960) / 4000), 0, N - 1), still = f >= STILL, k = (still ? STILL : f) - START(i), u = k / 24, d = Math.floor(u * 12);
      ctx.save(); ctx.translate(OX(i), 0);
      CARDS[i](ctx, u, d, k);
      if (!still) IB.paperPlane(ctx, plane(Math.floor(u * 12) / 12), { s: 1.1, rot: Math.cos(u * 3.2) * 0.12, seed: 400 });
      ctx.restore();
    }, { tint: tintAt(f) });
  },
});
</script>
