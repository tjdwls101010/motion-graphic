<!doctype html>
<meta charset="utf-8">
<title>acting / lift-heavy-box</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/handheld.js"></script>
<script>
/* 큰 상자를 끌어안고 용을 써 보지만 꿈쩍도 않자 한숨 쉬고 다시 자세를 잡아, 한 번에 들어 올려 세 걸음 휘청이며 옮겨 놓고 "휴." 한다. 원본에 없는 창작 장면으로, 원본의 느린 연기(3프레임에 한 장)를 무게를 보여 주는 데 썼다. 전달하는 생각: 무거운 것은 느리게, 끊어서 움직인다.
   Motion notes: one locked shot, 8 s, figure 540 px tall. The rule here is that weight is frame rate: everything light is on twos (12 fps), everything that fights the box is on threes (8 fps). Timeline in seconds: stand 0-1; bend to the box in 3 drawings on twos (poseMix 0.4, 0.8, 1); strain 1.5-2.5 on threes, 8 drawings alternating two poses 16 px apart while the box does not move and shake marks re-roll each drawing; slump held 0.5 s; a deeper grip, one in-between and then dead still 0.42 s (the anticipation); lift at 3.5 in 3 drawings on twos, box up 60, 200, 256 px, body leaning back 0.2 rad; three staggering steps 4.0-5.5 on threes, 4 drawings per step, 110 px per step (0.2 h, half the unloaded walk's 0.42 h), the box sagging 10 px on each passing drawing; set down in 2 drawings with a four-line burst and two dust puffs for 2 drawings; rest on the box 0.83 s; stand and wipe the brow at 6.5, bubble at 6.83. The box is rigid throughout: it tilts 0.02 rad under strain and never squashes. Feet: she stands, lifts and sets down in one wide stance (110 px), the stagger starts and ends on a drawing whose planted foot is where the stance had it, and when she straightens only the free foot steps in, lifted off the floor on the in-between drawing, so no foot ever slides along the floor. The hand targets of every held pose are within the arm's reach of that pose and the near hand grips the same spot on the box through the whole strain, so no hand floats off the box or slides on it. The figure is drawn in two passes with the box between its arms (IB.figure `only`). Follow-through: every drawing passes the drawing before it as pose.prev, so on the lift (frames 84-88) the head stays bowed one drawing after the back has straightened and the bun hangs, then lifts one drawing late; the drawing after a move repeats its own pose as prev, so every hold is dead still. */
const { lerp } = MG;
const F = IB.FIG, FLOOR = 930, X0 = 760, STEPX = 110, BW = 230, BH = 210;
const WHO = { ...IB.PEOPLE.lifter, h: 540, dir: 1, seed: 20 };
const H = WHO.h, HIPY = FLOOR - (F.ankle + F.shin + F.thigh) * H + 2, AY = FLOOR - F.ankle * H, RISE = FLOOR - (HIPY + 50);
const FT0 = [[55], [-55]], FT1 = [[-55], [55]];   // the wide stance before the carry (far foot ahead) and after it (near foot ahead)
const feet = (X, far, near) => [[X + far[0], AY - IB.footLift(far[1] || 0, H) + (far[2] || 0), far[1] || 0], [X + near[0], AY - IB.footLift(near[1] || 0, H) + (near[2] || 0), near[1] || 0]];

// poses, all for a figure whose place on the floor is X; the box stands 225 px ahead of it
const P = {
  stand: (X) => ({ ...IB.stand(X, FLOOR, WHO), feet: feet(X, ...FT0), face: { mouth: 'flat' } }),
  grip: (X, deep = 0, ft = FT0) => ({ hip: [X - 40, HIPY + 110 + deep], lean: 0.68, nod: -0.2, feet: feet(X, ...ft), hands: [[X + 130, FLOOR - BH - 4], [X + 112, FLOOR - BH + 24]], face: { mouth: 'flat', brow: 1 } }),
  strain: (X) => ({ hip: [X - 44, HIPY + 94], lean: 0.58, nod: -0.5, feet: feet(X, ...FT0), hands: [[X + 130, FLOOR - BH - 6], [X + 112, FLOOR - BH + 24]], face: { eye: 'closed', mouth: 'open', brow: 1 } }),
  slump: (X, ft = FT0) => ({ hip: [X - 34, HIPY + 64], lean: 0.9, nod: 0.5, feet: feet(X, ...ft), hands: [[X + 168, FLOOR - BH - 8], [X + 128, FLOOR - BH - 4]], face: { eye: 'closed', mouth: 'frown' } }),
  held: (X, sag = 0, ft = FT0) => ({ hip: [X - 10, HIPY + 14 + sag], lean: -0.2, nod: -0.1, feet: feet(X, ...ft), hands: [[X + 80, HIPY + sag], [X + 46, HIPY + 22 + sag]], face: { eye: 'closed', mouth: 'flat', brow: 1 } }),
  wipe: (X) => { const p = IB.stand(X + 42, FLOOR, WHO); p.feet = feet(X, [30], [55]); p.hands = [[X + 72, HIPY - F.torso * H - 0.1 * H], p.hands[1]]; p.nod = -0.15; p.face = { eye: 'closed', mouth: 'open' }; return p; },   // the near foot stays planted, the free one steps in beside it
};

/* The whole scene as a function of time: the pose, the box (centre x, bottom y, tilt) and what is trembling. */
function state(t) {
  const t2 = IB.twos(t), t3 = IB.threes(t), n2 = (t0) => IB.drawn(t2, t0), n3 = (t0) => IB.drawn(t3, t0, 8);
  const box = (X, up = 0, tilt = 0) => [X + 225, FLOOR - up, tilt], X1 = X0 + 3 * STEPX;
  if (t2 < 1) return { pose: P.stand(X0), box: box(X0) };
  if (t2 < 1.5) return { pose: IB.poseMix(P.stand(X0), P.grip(X0), IB.inbetween([0.4, 0.8, 1], n2(1))), box: box(X0) };
  if (t3 < 2.5) { const k = n3(1.5); return { pose: k % 2 ? P.strain(X0) : P.grip(X0), box: box(X0, 0, k % 2 ? -0.02 : 0), shake: 300 + k }; }
  if (t2 < 3) return { pose: P.slump(X0), box: box(X0) };
  if (t2 < 3.5) return { pose: n2(3) === 0 ? IB.poseMix(P.slump(X0), P.grip(X0, 22), 0.5) : P.grip(X0, 22), box: box(X0) };
  if (t2 < 4) { const k = Math.min(2, n2(3.5)), u = [0.35, 0.8, 1][k]; return { pose: IB.poseMix(P.grip(X0, 22), P.held(X0), u), box: [X0 + lerp(225, 150, u), FLOOR - [60, 200, RISE][k], 0], carried: true }; }
  if (t3 < 5.5) {
    // staggering forward: a small-stride walk on threes, the box sagging on every passing drawing
    const k = n3(4), ph = (k / 8) % 1, X = X0 + STEPX * (k / 4), S = STEPX / 2, sag = k % 4 === 2 ? 10 : 0, p = P.held(X, sag);
    const foot = (u) => (u < 0.5 ? [S * (1 - 4 * u), 0, 0] : [S * (-1 + 4 * (u - 0.5)), 0.25, -0.05 * H * Math.sin((u - 0.5) * 2 * Math.PI)]);
    const far = foot(ph), near = foot((ph + 0.5) % 1);   // starts with the far foot planted ahead, as the stance left it
    p.feet = feet(X, far, near);
    return { pose: p, box: [X + 150, FLOOR - RISE + sag, 0], carried: true };
  }
  if (t2 < 68 / 12 - 1e-6) { const k = n2(5.5); return k === 0 ? { pose: IB.poseMix(P.held(X1, 0, FT1), P.grip(X1, 0, FT1), 0.5), box: [X1 + 190, FLOOR - 110, 0], carried: true } : { pose: P.grip(X1, 0, FT1), box: box(X1), thud: 0 }; }
  if (t2 < 6.5) return { pose: P.slump(X1, FT1), box: box(X1), thud: n2(68 / 12) + 1 };
  if (n2(6.5) === 0) { const p = IB.poseMix(P.slump(X1, FT1), P.wipe(X1), 0.5); p.feet = [[X1 - 12, AY - 0.06 * H, 0.3], p.feet[1]]; return { pose: p, box: box(X1) }; }   // the free foot is in the air on its way in
  return { pose: P.wipe(X1), box: box(X1) };
}

/* The pose of the drawing on screen at t, with the drawing before it as prev (the rig trails the head and the bun by one drawing). The strain and the stagger are on threes, the rest on twos, so the drawing before is the one just before this one's slot on its own grid. */
const onThrees = (t) => (IB.twos(t) >= 1.5 && IB.threes(t) < 2.5) || (IB.twos(t) >= 4 && IB.threes(t) < 5.5);
const poseAt = (t) => { const start = onThrees(t) ? IB.threes(t) : IB.twos(t); return { ...state(t).pose, prev: start > 0 ? state(start - 1e-4).pose : undefined }; };
IB.actors = (t) => ({ lifter: poseAt(t) });   // tools/drawings.py counts it on twos, so the strain and the stagger on threes show as 3-frame drawings

MG.scene({
  title: 'acting / lift-heavy-box',
  duration: 8, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const s = { ...state(t), pose: poseAt(t) }, look = { ...WHO, face: s.pose.face }, [bx, by] = s.box, X = s.pose.feet[1][0];
    IB.smear(ctx, (s.pose.feet[0][0] + s.pose.feet[1][0]) / 2 + 20, FLOOR - 9, 330, { h: 14, seed: 9 });
    if (!s.carried) IB.smear(ctx, bx, FLOOR - 4, BW * 1.2, { h: 11, seed: 10 });
    IB.figure(ctx, s.pose, look, 'far');
    IB.cardboardBox(ctx, s.box, { tilt: s.box[2] }, { w: BW, h: BH });
    IB.figure(ctx, s.pose, look, 'near');
    if (s.shake != null) {   // strain: the box and her back tremble, re-rolled on every drawing
      IB.shake(ctx, bx + BW / 2 + 8, by - BH + 10, 18, { a: -0.7, n: 2, seed: s.shake, w: 2.8 });
      IB.shake(ctx, bx - BW / 2 - 6, by - 20, 16, { a: 2.5, n: 2, seed: s.shake + 50, w: 2.8 });
      IB.shake(ctx, s.pose.hip[0] - 40, s.pose.hip[1] - 70, 22, { a: Math.PI * 1.15, n: 3, seed: s.shake + 90, w: 2.8 });
    }
    if (s.thud != null && s.thud < 2) IB.thud(ctx, [bx, FLOOR], { half: BW / 2, k: s.thud });   // set down: a burst along the floor and two dust puffs, two drawings
    const X1 = X0 + 3 * STEPX;
    IB.bubble(ctx, ['휴.'], t, 82 / 12, { tip: [X1 + 104, HIPY - 196], x: X1 + 250, y: HIPY - 300, seed: 500 });
  },
});
</script>
