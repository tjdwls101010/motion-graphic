<!doctype html>
<meta charset="utf-8">
<title>spot / tandem-riders-join</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script>
/* 혼자 달리던 자전거에 한 명씩 끼어들 때마다 자전거가 한 칸씩 길어져 5인승 탠덤이 되고, 카피가 한 줄로 바뀌는 순간 다 같이 손을 든다. 전달하는 생각: 따로 있던 것들이 한 대에 올라 같은 방향으로 간다.
   Motion notes: the only spot that runs on ones for its whole length, because it is a travelling shot. Nothing pans: the ground props (grass tufts, stones) scroll left at a constant 332 px/s (13.8 px per frame), clouds drift 3 px/s, and the bike itself creeps right 34.6 px/s so it ends a third of a screen further on. Each new rider is inserted between riders already seated and the wheelbase grows by 120 px about its own centre (rear -57, front +60) in 0.25 s; joins at 1.4, 3.9, 5.7, 6.7 s. Wheelbase = 180 + 120 px per extra rider, wheel radius 50. Legs pedal continuously at about 1 rev/s (6.6 rad/s, estimated by eye, not measured) with each rider a third of a turn out of phase. Copy: three lines, the next line 2 frames after the one before; at 9.25 s it cuts to one line on the middle row and every arm goes up; a cap blows off backwards at 10 s. Lines are 2-2.5 px because the figures are small (head radius 20). Riders are rigs, not drawings: joints are placed from the reference (hip 20 px behind and 127 px above the crank, shoulder 186, head 219, hands 66 px ahead), the back stays upright and the arms straight, and each rider is told apart by garment shape and headgear rather than by face. */
const { prog, kf, lerp, rng, clamp } = MG;
const C = IB.C, AXLE = 748, R = 50, CRANK = 16;   // crank arm length: short, so the legs stay nearly straight as in the reference
const COPY_A = ['줄 수가 많아도 한꺼번에', '왼쪽에서 밀려 들어와', '같은 자리에 선다.'], COPY_B = ['한 줄로 줄어든다.'];

// rear to front. `at` = when the rider drops in. top/sleeve/leg are garment colours; `shorts` leaves the shin bare; `fore` colours the forearm.
const RIDERS = [
  { at: 1.4, skin: C.skin[4], top: C.paper, leg: C.navy, shoe: C.paper, head: 'long', lean: 10 },
  { at: 5.7, skin: C.skin[1], top: C.paper, leg: C.paper, shoe: C.navy, head: 'helmet', hat: C.sky, fore: 'stripes' },
  { at: 6.7, skin: C.skin[2], top: C.paper, leg: C.navy, shoe: C.skin[2], shorts: true, fore: 'skin', head: 'cap' },
  { at: 3.9, skin: C.skin[1], top: C.sky, leg: C.sky, shoe: C.paper, fore: 'skin', sleeve: C.paper, head: 'bun' },
  { at: -1, skin: C.skin[4], top: C.navy, leg: C.paper, shoe: C.paper, head: 'helmet', hat: C.paper, dots: true },
];
const here = (r, t) => (r.at < 0 ? 1 : prog(IB.twos(t), r.at, 0.25, 'outQuad'));

const PROPS = (() => { const r = rng(7), out = []; let x = 300; while (x < 332 * 12 + 2200) { out.push({ x, y: 812 + r() * 70, kind: r() < 0.5 ? 'tuft' : 'stones', seed: Math.floor(r() * 900) }); x += 260 + r() * 420; } return out; })();

function ik(H, P, a, b) {
  const dx = P[0] - H[0], dy = P[1] - H[1], d = clamp(Math.hypot(dx, dy), Math.abs(a - b) + 1, a + b - 1);
  const A = Math.acos((a * a + d * d - b * b) / (2 * a * d)), base = Math.atan2(dy, dx);
  return [H[0] + a * Math.cos(base - A), H[1] + a * Math.sin(base - A)];
}

/* One rider, placed from joint positions read off the reference (relative to the bottom bracket bb they pedal): hip 20 px behind and 127 above it, shoulder 186 above, head centre 219 above, hands on a bar 66 px ahead. Upright back, straight arms, wide trousers. */
function rider(ctx, r, sx, drop, crank, wave, seed) {
  const bb = [sx + 34, AXLE - 1], lean = r.lean || 0;
  const hip = [bb[0] - 20, AXLE - 127 - drop], sh = [bb[0] - 9 + lean, AXLE - 184 - drop], head = [bb[0] + 9 + lean * 1.6, AXLE - 219 - drop];
  const pedal = (a) => [bb[0] + CRANK * Math.cos(a), bb[1] + CRANK * Math.sin(a) - drop * 0.4];
  const limb = (pts, fill, w, sd, smooth = false) => IB.tube(ctx, pts, { w, edge: 2.1, fill, seed: sd, smooth });
  const shoe = (P, sd) => IB.ink(ctx, [[P[0] - 13, P[1] - 9], [P[0] + 5, P[1] - 10], [P[0] + 15, P[1] - 4], [P[0] + 25, P[1] - 1], [P[0] + 25, P[1] + 5], [P[0] - 13, P[1] + 5]], { closed: true, fill: r.shoe, w: 2, seed: sd });
  const legAt = (a, sd) => {
    const P = pedal(a), K = ik(hip, [P[0] - 4, P[1] - 10], 70, 67), ankle = [P[0] - 4, P[1] - 10];
    if (r.shorts) { limb([K, ankle], r.skin, 15, sd + 1); limb([hip, [lerp(hip[0], K[0], 0.86), lerp(hip[1], K[1], 0.86)]], r.leg, 31, sd); }
    else limb([hip, K, ankle], r.leg, 27, sd);
    shoe(P, sd + 2);
  };
  legAt(crank + Math.PI, seed);                                                // far leg
  // torso: one garment shape from the shoulders to a hem that sits on the saddle
  IB.ink(ctx, [[sh[0] - 15, sh[1] + 4], [sh[0] + 2, sh[1] - 9], [sh[0] + 17, sh[1] + 2], [hip[0] + 22, hip[1] - 20], [hip[0] + 22, hip[1] + 4], [hip[0] - 18, hip[1] + 6], [hip[0] - 21, hip[1] - 26]], { closed: true, fill: r.top, w: 2.2, seed: seed + 5 });
  legAt(crank, seed + 8);                                                      // near leg
  // arm: sleeve to the elbow, forearm to the grip; straight when riding, up when waving
  const hand = wave ? [sh[0] + wave[0], sh[1] - 66 + wave[1]] : [bb[0] + 66, AXLE - 121 - drop * 0.6];
  const elbow = wave ? [sh[0] + wave[0] * 0.45 + 10, sh[1] - 30] : [lerp(sh[0], hand[0], 0.52) + 2, lerp(sh[1], hand[1], 0.52) + 7];
  const foreFill = r.fore === 'skin' ? r.skin : r.sleeve || r.top;
  limb([elbow, hand], foreFill, 12, seed + 12);
  if (r.fore === 'stripes') for (let k = 1; k < 5; k++) { const u = k / 5, x = lerp(elbow[0], hand[0], u), y = lerp(elbow[1], hand[1], u); IB.seg(ctx, x - 3, y - 5, x + 3, y + 5, { w: 1.6, seed: seed + 13 + k }); }
  limb([[sh[0] + 2, sh[1] + 8], elbow], r.sleeve || r.top, 17, seed + 11);
  IB.oval(ctx, hand[0] + 2, hand[1] - 1, 8, 7, { fill: r.skin, w: 2, seed: seed + 14, n: 8 });
  // head: a profile with a nose, one eye and a smile, then hair or hat
  const hx = head[0], hy = head[1];
  if (r.head === 'long') IB.ink(ctx, [[hx + 2, hy - 24], [hx - 26, hy - 30], [hx - 52, hy - 22], [hx - 82, hy - 26], [hx - 104, hy - 6], [hx - 112, hy + 22], [hx - 90, hy + 34], [hx - 62, hy + 22], [hx - 40, hy + 26], [hx - 14, hy + 14]], { closed: true, fill: C.ink, w: 2, seed: seed + 20 });
  if (r.head === 'cap') for (let i = 0; i < 6; i++) IB.ink(ctx, [[hx - 2, hy - 8 + i * 6], [hx - 30, hy - 4 + i * 7], [hx - 58 - (i % 2) * 10, hy + 4 + i * 5]], { w: 1.7, seed: seed + 30 + i });   // hair streaming back
  IB.ink(ctx, [[hx - 2, hy - 21], [hx + 14, hy - 15], [hx + 19, hy - 3], [hx + 26, hy + 3], [hx + 19, hy + 7], [hx + 16, hy + 17], [hx + 2, hy + 22], [hx - 15, hy + 14], [hx - 20, hy - 4]], { closed: true, fill: r.skin, w: 2.1, seed: seed + 21 });
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(hx + 12, hy - 4, 1.9, 0, 7); ctx.fill();
  IB.ink(ctx, [[hx + 9, hy + 10], [hx + 14, hy + 12], [hx + 18, hy + 9]], { w: 1.6, seed: seed + 22 });
  if (r.head === 'cap') IB.ink(ctx, [[hx + 6, hy + 8], [hx + 20, hy + 12], [hx + 16, hy + 26], [hx + 2, hy + 30], [hx - 8, hy + 20]], { closed: true, fill: C.paper, w: 1.8, seed: seed + 36 });   // beard
  if (r.head === 'helmet' || r.head === 'cap') {
    const dome = IB.ellipse(hx - 3, hy - 5, 23, 22, 9, Math.PI * 0.97, Math.PI * 2.02);
    IB.ink(ctx, dome.concat(r.head === 'cap' ? [[hx + 40, hy - 4], [hx + 20, hy - 2]] : [[hx + 30, hy - 2]]), { closed: true, fill: r.hat || C.paper, w: 2.2, seed: seed + 23 });
    if (r.head === 'helmet') { IB.ink(ctx, [[hx - 12, hy - 4], [hx - 6, hy + 14], [hx + 4, hy + 22]], { w: 1.8, seed: seed + 24 }); IB.ink(ctx, [[hx - 24, hy - 2], [hx - 22, hy + 10], [hx - 12, hy + 6]], { closed: true, fill: C.ink, w: 0 }); }
    if (r.dots) for (const [dx, dy] of [[-12, -16], [0, -20], [10, -14], [-6, -8], [6, -6]]) { ctx.beginPath(); ctx.arc(hx + dx, hy + dy, 2.4, 0, 7); ctx.fill(); }
    else if (r.head === 'helmet') IB.oval(ctx, hx - 8, hy - 12, 7, 7, { w: 1.6, seed: seed + 25, n: 8 });
  } else if (r.head === 'bun') {
    IB.oval(ctx, hx - 22, hy - 24, 13, 12, { fill: C.skin[4], w: 2, seed: seed + 26, n: 8 });
    IB.ink(ctx, [[hx + 10, hy - 18], [hx - 4, hy - 26], [hx - 22, hy - 16], [hx - 24, hy + 6], [hx - 12, hy + 2], [hx - 8, hy - 10]], { closed: true, fill: C.skin[4], w: 2, seed: seed + 27 });
  } else if (r.head === 'long') {
    IB.ink(ctx, [[hx + 12, hy - 17], [hx - 2, hy - 26], [hx - 22, hy - 14], [hx - 22, hy + 10], [hx - 10, hy + 2], [hx - 4, hy - 12]], { closed: true, fill: C.ink, w: 2, seed: seed + 28 });
  }
}

function wheel(ctx, x, spin, seed) {
  // the floor under a wheel is a few blue scribbles, not the chalk smear the standing figures get
  for (let k = 0; k < 4; k++) { const y = AXLE + R + 2 + k * 5, half = 44 - k * 7, pts = []; for (let i = 0; i <= 6; i++) pts.push([x - half + (i / 6) * half * 2 + (k % 2) * 6, y + (i % 2 ? -1.6 : 1.6)]); IB.ink(ctx, pts, { w: 2, color: C.blue, seed: seed + 20 + k, grain: 0 }); }
  IB.oval(ctx, x, AXLE, R - 3, R - 3, { fill: C.paper, w: 8, seed, n: 22, wob: 0.4 });
  for (let i = 0; i < 4; i++) { const a = spin + i * 1.57; IB.ink(ctx, IB.ellipse(x, AXLE, 22 + (i % 2) * 12, 22 + (i % 2) * 12, 5, a, a + 0.8), { w: 1.5, color: '#b0b0b0', seed: seed + i }); }
  IB.oval(ctx, x, AXLE, 5, 5, { fill: C.ink, w: 0, n: 8 });
}

function crankset(ctx, bb, a, seed, f) {
  for (const s of [0, Math.PI]) { const p = [bb[0] + CRANK * Math.cos(a + s), bb[1] + CRANK * Math.sin(a + s)]; IB.seg(ctx, bb[0], bb[1], p[0], p[1], { w: 3, seed: seed + s }); IB.seg(ctx, p[0] - 9, p[1], p[0] + 11, p[1], { w: 3, seed: seed + 1 + s }); }
  IB.oval(ctx, bb[0], bb[1], 13, 13, { fill: C.paper, w: 2.2, seed, n: 12 });
  ctx.fillStyle = C.ink;
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(bb[0] + 7.5 * Math.cos(a + i * 1.257), bb[1] + 7.5 * Math.sin(a + i * 1.257), 1.7, 0, 7); ctx.fill(); }
  // spin marks, re-drawn on twos
  const k = Math.floor(f / 2) % 2;
  for (const s of [-1, 1]) IB.ink(ctx, IB.ellipse(bb[0], bb[1] + 4, 24 + k * 5, 26 + k * 5, 4, s > 0 ? 0.2 : 2.4, s > 0 ? 0.75 : 2.95), { w: 1.4, color: '#8a8a8a', seed: seed + 5 + k + s });
}

MG.scene({
  title: 'spot / tandem-riders-join',
  duration: 11.75, ref: [105.083, 116.833], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    // clouds drift, ground props scroll (ones)
    const cl = (x, y, w, seed) => IB.ink(ctx, [[x - w / 2, y], [x - w * 0.2, y - w * 0.12], [x + w * 0.05, y - w * 0.16], [x + w * 0.3, y - w * 0.08], [x + w / 2, y], [x, y + 3]], { closed: true, w: 2, seed, fill: C.bg });
    cl(1372 - t * 3, 185, 150, 60);
    cl(866 - t * 3, 306, 62, 61);
    for (const p of PROPS) {
      const x = p.x + 900 - t * 332;
      if (x < -80 || x > 2000) continue;
      if (p.kind === 'tuft') IB.ink(ctx, [[x - 26, p.y], [x - 20, p.y - 13], [x - 12, p.y], [x - 4, p.y - 18], [x + 4, p.y], [x + 14, p.y - 12], [x + 24, p.y]], { w: 2, smooth: false, seed: p.seed });
      else { IB.oval(ctx, x, p.y, 19, 11, { w: 2, seed: p.seed, n: 8, fill: C.bg }); IB.oval(ctx, x + 32, p.y + 5, 8, 5, { w: 1.8, seed: p.seed + 1, n: 6 }); IB.oval(ctx, x - 24, p.y + 5, 4, 3, { w: 1.8, seed: p.seed + 2, n: 6 }); }
    }

    // bike: creeps right, grows about its centre as riders drop in
    const pres = RIDERS.map((r) => here(r, t)), n = pres.reduce((a, b) => a + b, 0);
    const wb = 180 + 120 * (n - 1), cx = 1006 + 34.6 * t, rx = cx - wb / 2, fx = cx + wb / 2;
    const seats = []; let acc = 0;
    RIDERS.forEach((r, i) => { seats.push(rx + 48 + 120 * acc + 60 * (pres[i] - 1)); acc += pres[i]; });
    const spin = t * 6.6;
    wheel(ctx, rx, spin, 70);
    wheel(ctx, fx, spin, 80);
    for (let k = 0; k < 2; k++) IB.oval(ctx, rx - 78 - k * 30 - (IB.frame(t) % 3) * 6, AXLE + 26 + k * 8, 13 - k * 6, 8 - k * 4, { w: 1.8, seed: 90 + k, n: 7, fill: C.bg });   // dust
    const f = IB.frame(t), frame = (pts, seed) => IB.tube(ctx, pts, { w: 8, edge: 2, fill: C.blue, seed });
    const bbs = seats.map((sx) => [sx + 34, AXLE - 1]), topY = AXLE - 76, first = bbs[0], last = bbs[bbs.length - 1];
    frame([[rx, AXLE], last], 100);                                             // chain stay and bottom tube
    frame([[rx, AXLE], [first[0] - 26, topY]], 101);                            // seat stay
    frame([[first[0] - 26, topY], [fx - 52, topY]], 102);                       // top tube
    frame([last, [fx - 50, topY + 6]], 103);                                    // down tube
    frame([[fx - 56, topY - 22], [fx - 48, topY + 8], [fx, AXLE]], 104);        // head tube and fork
    // front bar: a white stem curving back to a blue grip under the front rider's hands
    IB.tube(ctx, [[fx - 54, topY - 20], [fx - 62, topY - 52], [fx - 80, topY - 60]], { w: 8, edge: 2, fill: C.paper, smooth: true, seed: 105 });
    IB.ink(ctx, [[fx - 80, topY - 60], [fx - 100, topY - 58]], { w: 8, color: C.blue, seed: 106, taper: false });
    RIDERS.forEach((r, i) => {
      if (pres[i] <= 0) return;
      const bb = bbs[i];
      frame([bb, [bb[0] - 24, topY - 8]], 110 + i);                             // seat tube
      IB.ink(ctx, [[bb[0] - 40, topY - 12], [bb[0] - 10, topY - 14], [bb[0] - 8, topY - 8], [bb[0] - 38, topY - 6]], { closed: true, fill: C.paper, w: 2, seed: 120 + i });   // saddle
      if (i > 0 && pres[i - 1] > 0) {                                            // stoker bar for the rider behind, bracketed off this seat tube
        const g = [bbs[i - 1][0] + 66, AXLE - 121];
        IB.tube(ctx, [[bb[0] - 22, topY - 4], [bb[0] - 36, topY - 30], [g[0] + 12, g[1] + 2]], { w: 7, edge: 1.9, fill: C.paper, smooth: true, seed: 130 + i });
        IB.ink(ctx, [[g[0] + 12, g[1] + 2], [g[0] - 10, g[1] + 2]], { w: 8, color: C.blue, seed: 135 + i, taper: false });
      }
      crankset(ctx, bb, spin + i * 2.09, 140 + i * 9, f);
    });
    // riders, rear first so the one in front overlaps
    const tw = IB.twos(t), waving = t >= 9.25;
    RIDERS.forEach((r, i) => {
      if (pres[i] <= 0) return;
      const sway = waving ? [(i % 2 ? 26 : -14) + 10 * Math.sin(tw * 9 + i), 6 * Math.cos(tw * 9 + i * 2)] : null;
      rider(ctx, r, seats[i], (1 - pres[i]) * 90, spin + i * 2.09, sway, 200 + i * 40);
    });
    // the cap that blows off at 10 s
    if (t >= 10) {
      const u = (t - 10) / 1.75, x = lerp(seats[2] + 40, 700, u), y = AXLE - 250 - 140 * Math.sin(u * 2.4) + 40 * u;
      ctx.save(); ctx.translate(x, y); ctx.rotate(-u * 5);
      IB.ink(ctx, IB.ellipse(0, 0, 20, 16, 8, Math.PI, Math.PI * 2).concat([[32, 2]]), { closed: true, fill: C.paper, w: 2.2, seed: 500 });
      ctx.restore();
    }

    if (t < 9.25) IB.copy(ctx, COPY_A, t, 1 / 24, { top: 387, stagger: 2 });
    else IB.copy(ctx, COPY_B, t, 9.25, { top: 483, from: 45 });
  },
});
</script>
