<!doctype html>
<meta charset="utf-8">
<title>work / elevator-door-dash</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/cast/people.js"></script>
<script src="../../kit/props/home.js"></script>
<script src="../../kit/props/nature.js"></script>
<script src="../../kit/props/office.js"></script>
<script src="../../kit/sets/officefloor.js"></script>
<script>
/* 복도를 걷던 사람이 엘리베이터 문이 닫히기 시작하는 것을 보고 흠칫, 몸을 뒤로 젖혔다가 뛰어와 거의 닫힌 문틈에 손을 쑥 넣는다. 한 박자 멈춘 문이 다시 열리고 안도한 순간, 안쪽 벽 뒤에서 사장이 걸어 나와 문 앞에 서고, 둘은 어색하게 인사를 나눈다. 원본에 없는 창작 장면으로, 엘리베이터(IB.elevator, 'car'와 'front' 두 겹 사이에 사장을 opening에 잘라 그림), 호출 버튼(IB.callButton, s 0.16), 복도의 벽시계와 화분(IB.wallClock, IB.pottedPlant), 걷기와 뛰기(IB.walk, IB.run), 일상 인물(IB.PEOPLE.clerk, boss)로 지었다. 전달하는 생각: 간신히 잡은 것이 늘 반가운 것은 아니다.
   Motion notes: one locked shot, 7 s, the clerk 330 px tall (line 3 px) and the boss 345 px; both on twos, every drawing passing the one before as pose.prev, and the lift doors on ones (a machine). 0-0.67 s the clerk walks in from x 26 (half off the left edge) for 8 drawings at IB.walkLen / 12 (23.1 px) a drawing and stops at 0.67 s on phase 5/6 (one foot planted, the other put down where it is). The doors start shutting at 0.5 s at a constant 3.4 px a frame per door (300 px opening, 44 frames to shut). 0.67 s the take: the head jerks up (nod -0.16, spine back 0.08, both open hands up to the chest, eyes wide), 0.83 s the anticipation: hips 0.05 h lower and 8 px back, spine tipped back 0.1, arms thrown back, held 3 drawings. 1.08 s the run: 14 drawings at IB.runLen / 8 (60.5 px), starting on phase 1/8 so its first planted foot is the stopped near foot. 2.25 s the lunge: the run's last planted foot stays, the near foot lands 0.22 h ahead, the open hand goes into the gap at the doors' middle, one drawing 6 px past and the hold; the doors stop on the hand on that same frame with a 16 px gap, and from 2.33 s to 3.08 s nothing moves at all. 3.08 s the doors open on ones (outCubic over 20 frames); 3.17 s the clerk's face eases, 3.33 s he steps back to a stand: weight back onto the far foot with the hand out of the gap, the front foot lifted on its way back, one drawing 6 px past, standing at 3.58 s with the far foot where it was. 3.58 s the boss, hidden to the right of the opening (clipped to it), walks 12 drawings at IB.walkLen / 12 (24.2 px) from phase 5/6 to x 1220 and stops on phase 5/6 at 4.5 s; his face shows in the opening from 4.08 s and the clerk does a take at 4.17 s (one drawing past: hips 10 px back, spine -0.15, hands up; then held at -0.09). 4.75 s the clerk's awkward bow: an anticipation up, one drawing past (lean 0.3), the bow held at 0.25; bubble at 5.0 s; 5.17 s the boss's small nod back, one drawing past. From 5.25 s nothing moves. Colours: the clerk's sky shirt and the lift's lit mint arrow; the boss is in charcoal. */
const F = IB.FIG, FLOOR = 900, LIFT = [1180, FLOOR], OPEN = { w: 300, h: 440 };
const WHO = { ...IB.PEOPLE.clerk, h: 330, dir: 1, seed: 40 }, BOSS = { ...IB.PEOPLE.boss, h: 345, dir: -1, seed: 80 };
const H = WHO.h, AY = FLOOR - F.ankle * H;

/* ---------- the clerk: walk in, stop, run, lunge, stand, bow ---------- */
const PACE = IB.walkLen(WHO) / 12, RUN = IB.runLen(WHO) / 8;
const XL = LIFT[0] - 111, XR = XL - 14 * RUN, XS = XR - 0.035 * H, X0 = XS - 8 * PACE;   // the lunge's hip; the run's first drawing; the stop; the walk's start
const stopped = (x, ph, look) => { const p = IB.stand(x, FLOOR, look); p.feet = IB.walk(x, FLOOR, look, ph).feet.map((f) => [f[0], FLOOR - F.ankle * look.h, 0]); return p; };
const S = stopped(XS, 5 / 6, WHO), HY = S.hip[1];
const lastRun = IB.run(XR + 13 * RUN, FLOOR, WHO, (1 / 8 + 13 / 8) % 1), BACK = lastRun.feet[0][0];   // its planted (far) foot stays for the lunge
const LUNGE_HIP = [XL, HY + 30];   // low enough that the planted back foot stays within the leg's reach (0.52 h)
const GAP_HAND = [LIFT[0] - 2, LUNGE_HIP[1] - 0.2 * H];   // the open hand in the doors' gap, within reach of the leaning shoulder
const LUNGE = { hip: LUNGE_HIP, lean: 0.3, nod: 0.06, feet: [[BACK, AY - IB.footLift(0.35, H), 0.35], [XL + 0.22 * H, AY, 0]], hands: [[XL - 0.13 * H, LUNGE_HIP[1] - 0.02 * H], GAP_HAND], hand: ['grip', 'open'], face: { eye: 'closed', mouth: 'flat' } };
const S2 = (() => { const p = IB.stand(BACK - 0.04 * H, FLOOR, WHO); return { ...p, face: { mouth: 'smile' } }; })();   // stepped back to a stand on the far foot
const DRAW = {
  take: { ...S, hip: [XS - 4, HY], nod: -0.16, lean: -0.08, hands: [[XS + 0.1 * H, HY - 0.1 * H], [XS + 0.08 * H, HY - 0.07 * H]], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } },
  crouch: { ...S, hip: [XS - 8, HY + 0.05 * H], lean: -0.1, nod: 0.04, hands: [[XS - 0.14 * H, HY + 0.06 * H], [XS - 0.16 * H, HY + 0.04 * H]], hand: ['grip', 'grip'], face: { eye: 'wide', mouth: 'flat', brow: 1 } },
  lungePast: { ...LUNGE, hip: [XL + 6, LUNGE_HIP[1] + 3], lean: 0.36, nod: 0.1 },
  lunge: LUNGE,
  relief: { ...LUNGE, face: { eye: 'dot', mouth: 'smile' } },
  shift: { ...LUNGE, hip: [XL - 20, LUNGE_HIP[1] + 4], lean: 0.08, nod: 0, hands: [[XL - 20 + 0.02 * H, LUNGE_HIP[1] + 0.05 * H], [XL - 20 + 0.13 * H, LUNGE_HIP[1] - 0.12 * H]], hand: ['relax', 'relax'], face: { mouth: 'smile' } },   // weight back onto the far foot, the hand out of the gap
  stepBack: { ...S2, hip: [(XL - 20 + S2.hip[0]) / 2, S2.hip[1] + 6], lean: 0.02, hands: S2.hands.map(([x, y]) => [x + (XL - 20 - S2.hip[0]) / 2, y + 6]), feet: [S2.feet[0], [(LUNGE.feet[1][0] + S2.feet[1][0]) / 2, AY - 0.07 * H, 0.2]], face: { mouth: 'smile' } },   // the front foot lifted on its way back
  standPast: { ...S2, hip: [S2.hip[0] - 6, S2.hip[1]], lean: -0.04, face: { mouth: 'smile' } },
  stand: S2,
  takeBoss: { ...S2, hip: [S2.hip[0] - 10, S2.hip[1] + 4], lean: -0.15, nod: -0.12, hands: [[S2.hip[0] + 0.06 * H, S2.hip[1] - 0.06 * H], [S2.hip[0] + 0.03 * H, S2.hip[1] - 0.03 * H]], hand: ['open', 'open'], face: { eye: 'wide', mouth: 'open' } },
  takeHold: { ...S2, hip: [S2.hip[0] - 6, S2.hip[1] + 2], lean: -0.09, nod: -0.06, hands: [[S2.hip[0] + 0.05 * H, S2.hip[1] + 0.01 * H], [S2.hip[0] + 0.02 * H, S2.hip[1] + 0.03 * H]], face: { eye: 'wide', mouth: 'flat', brow: -1 } },
  bowUp: { ...S2, lean: -0.07, nod: -0.08, face: { eye: 'dot', mouth: 'flat', brow: -1 } },
  bowPast: { ...S2, lean: 0.3, nod: 0.3, hands: S2.hands.map(([x, y]) => [x + 22, y - 6]), face: { eye: 'closed', mouth: 'smile', brow: -1 } },
  bow: { ...S2, lean: 0.25, nod: 0.26, hands: S2.hands.map(([x, y]) => [x + 18, y - 5]), face: { eye: 'closed', mouth: 'smile', brow: -1 } },
};
// [frame at 24 fps, drawing] after the walk
const ACT = [[16, DRAW.take], [20, DRAW.crouch], [54, DRAW.lungePast], [56, DRAW.lunge], [76, DRAW.relief], [80, DRAW.shift], [82, DRAW.stepBack], [84, DRAW.standPast], [86, DRAW.stand],
  [100, DRAW.takeBoss], [102, DRAW.takeHold], [114, DRAW.bowUp], [116, DRAW.bowPast], [118, DRAW.bow]];
function clerkOn(f) {
  if (f < 16) { const k = f >> 1; return { ...IB.walk(X0 + k * PACE, FLOOR, WHO, (1 / 6 + k / 12) % 1), face: { mouth: 'flat' } }; }
  if (f >= 26 && f < 54) { const j = (f - 26) >> 1; return { ...IB.run(XR + j * RUN, FLOOR, WHO, (1 / 8 + j / 8) % 1), face: { eye: 'wide', mouth: 'open', brow: 1 } }; }
  return IB.held(ACT, f);
}

/* ---------- the boss: hidden right of the opening, walks to the doors ---------- */
const BPACE = IB.walkLen(BOSS) / 12, BX0 = LIFT[0] + 330, BXS = BX0 - 12 * BPACE;
const bossOn = (f) => {
  const face = { mouth: 'flat', brow: 1 };
  if (f < 86) return { ...stopped(BX0, 5 / 6, BOSS), face };
  if (f < 108) { const i = ((f - 86) >> 1) + 1; return { ...IB.walk(BX0 - i * BPACE, FLOOR, BOSS, (5 / 6 + i / 12) % 1), face }; }
  const B = stopped(BXS, 5 / 6, BOSS);
  if (f < 124) return { ...B, face };
  return f < 126 ? { ...B, nod: 0.16, face: { ...face, eye: 'closed' } } : { ...B, nod: 0.11, face };
};

/* ---------- the doors, on ones ---------- */
const SHUT = 16 / OPEN.w;   // the gap the hand holds
function doors(f) {
  if (f < 12) return 1;
  if (f < 74) return Math.max(SHUT, 1 - (f - 12) / 44);
  return MG.lerp(SHUT, 1, MG.ease.outCubic(Math.min(1, (f - 74) / 20)));
}

const withPrev = (on) => (t) => { const f = IB.frame(IB.twos(t)); return { ...on(f), prev: f > 0 ? on(f - 2) : undefined }; };
const clerkAt = withPrev(clerkOn), bossAt = withPrev(bossOn);
IB.actors = (t) => ({ clerk: clerkAt(t), boss: bossAt(t), doors: doors(IB.frame(t)) });
IB.actors.step = { doors: 1 };

MG.scene({
  title: 'work / elevator-door-dash',
  duration: 7, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t), c = clerkAt(t), b = bossAt(t), st = { open: doors(f), lit: true, floor: 3 };
    // the car, the boss inside it (clipped to the opening: he is behind the wall until he steps into it), then the doors and frame
    const lift = IB.elevator(ctx, LIFT, st, { ...OPEN, layer: 'car' });
    ctx.save(); IB.clipRect(ctx, lift.opening);
    IB.smear(ctx, (b.feet[0][0] + b.feet[1][0]) / 2, FLOOR - 9, 240, { h: 11, seed: 12 });
    IB.figure(ctx, b, { ...BOSS, face: b.face });
    ctx.restore();
    IB.elevator(ctx, LIFT, st, { ...OPEN, layer: 'front' });
    IB.callButton(ctx, [LIFT[0] + 240, 640], {}, { s: 0.16 });
    IB.pottedPlant(ctx, [1700, FLOOR], IB.PLANTS.tall);
    IB.wallClock(ctx, [470, 380], { r: 50, hands: [[0, -34], [-20, -10]] });
    // the clerk in front
    IB.smear(ctx, (c.feet[0][0] + c.feet[1][0]) / 2, FLOOR - 9, 300, { h: 14, seed: 9 });
    IB.figure(ctx, c, { ...WHO, face: c.face });
    IB.bubble(ctx, ['아… 안녕하세요'], t, 5.0, { tip: [S2.hip[0] + 20, HY - 0.42 * H], x: S2.hip[0] - 120, y: HY - 0.66 * H, seed: 500 });
  },
});
</script>
