<!doctype html>
<meta charset="utf-8">
<title>metaphor / bars-rise-climber</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/figure.js"></script>
<script>
/* 바닥에서 막대가 하나씩 솟을 때마다 작은 사람이 그 위로 뛰어올라 계단처럼 다섯 칸을 오르고, 가장 높은 파란 막대 꼭대기에 깃발을 꽂고 "다 왔다!" 한다. 원본에 없는 창작 장면으로, 막대그래프를 무대 소품으로 삼아 원본의 "사건마다 한 박자, 사이는 정지"를 옮겼다. 전달하는 생각: 성장은 한 칸씩 딛고 올라간 결과다.
   Motion notes: one locked shot, 7 s, figure 210 px tall (wide-shot size, line 2.55 px). A beat every 1.0 s, every time on the 12 fps grid: a bar rises (0.42 s on twos, IB.settle tau 0.1: 57% of its height on its first drawing, 82% on its second, done on the fifth), 0.08 s of nothing, then the hop. Hop = 4 drawings over 0.33 s: crouch (hip down 0.11 h, spine 0.35 rad), two airborne drawings at 33% and 72% of the way on an arc 90 px above the straight line with the legs tucked, a landing crouch, then the standing pose held dead still for 0.67 s while the next bar rises. The bars never move again once up. Colour: bars are white with graphite at the foot, only the last and tallest is blue; with the climber's yellow top and the green flag that makes the shot's three colours. Ending: pole drawn on in 2 drawings at 5.5 s, bubble at 6.0 s, and in the last second the only thing that moves is the flag, two drawings alternating on threes (8 fps). */
const { lerp, clamp } = MG;
const C = IB.C, F = IB.FIG, FLOOR = 910;
const WHO = { h: 210, dir: 1, skin: C.skin[2], top: C.yellow, topKind: 'long', bottom: C.ink, shoe: C.paper, hair: 'bun', seed: 90 };
const H = WHO.h;
const BARS = [90, 185, 290, 405, 530].map((h, k) => ({ x: 560 + k * 240, h, at: 0.5 + k, hop: 1.0 + k, seed: 200 + k * 10 }));
const BW = 170, START = [330, FLOOR];
const risen = (b, t) => IB.settle(IB.twos(t) - b.at + 1e-6, 0.1, 5 / 12);
const spot = (k) => (k < 0 ? START : [BARS[k].x, FLOOR - BARS[k].h]);   // where the climber stands after hop k

function pose(kind, x, y) {
  const p = IB.stand(x, y, WHO), hy = p.hip[1];
  if (kind === 'crouch') { p.hip = [x - 0.02 * H, hy + 0.11 * H]; p.lean = 0.35; p.hands = [[x - 0.13 * H, hy + 0.06 * H], [x - 0.16 * H, hy + 0.04 * H]]; }
  if (kind === 'air') { p.lean = 0.18; p.feet = [[x + 0.13 * H, hy + 0.33 * H, 0.3], [x - 0.02 * H, hy + 0.38 * H, 0.5]]; p.hands = [[x + 0.17 * H, hy - 0.37 * H], [x + 0.1 * H, hy - 0.41 * H]]; }
  if (kind === 'land') { p.hip = [x + 0.01 * H, hy + 0.09 * H]; p.lean = 0.25; p.hands = [[x + 0.16 * H, hy - 0.02 * H], [x + 0.12 * H, hy]]; }
  if (kind === 'flag') { p.hands = [[x + 0.26 * H, hy - 0.2 * H], p.hands[1]]; p.grip = [true, false]; }
  return p;
}
function poseAt(t) {
  const tt = IB.twos(t);
  let k = -1; while (k + 1 < BARS.length && tt >= BARS[k + 1].hop) k++;
  if (k < 0) return pose('stand', ...START);
  const step = Math.round((tt - BARS[k].hop) * 12), A = spot(k - 1), B = spot(k);
  if (step === 0) return pose('crouch', ...A);
  if (step < 3) { const u = [0.33, 0.72][step - 1]; return pose('air', lerp(A[0], B[0], u), lerp(A[1], B[1], u) - 90 * Math.sin(u * Math.PI)); }
  if (step === 3) return pose('land', ...B);
  return pose(k === BARS.length - 1 && tt >= 5.5 ? 'flag' : 'stand', ...B);
}

function bar(ctx, b, u) {
  if (u < 0.01) return;   // the beat's own drawing shows nothing yet: the bar is first seen one drawing later, already 57% up
  const h = b.h * u, last = b === BARS[BARS.length - 1];
  IB.smear(ctx, b.x, FLOOR - 4, BW * 1.25, { h: 10, seed: b.seed + 5, alpha: clamp(u * 2) });
  IB.box(ctx, b.x - BW / 2, FLOOR - h, BW, h, { fill: last ? C.blue : C.paper, w: 3.4, seed: b.seed });
  IB.shade(ctx, b.x - BW / 2 + 3, FLOOR - Math.min(h, 46), BW - 6, Math.min(h, 46) - 2, { from: 'bottom', seed: b.seed + 1, alpha: 0.45 });
}

MG.scene({
  title: 'metaphor / bars-rise-climber',
  duration: 7, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const tt = IB.twos(t);
    BARS.forEach((b) => bar(ctx, b, risen(b, t)));
    if (tt < BARS[0].hop + 0.25) IB.smear(ctx, START[0], FLOOR - 6, 130, { h: 9, seed: 9 });
    // the flag on the last bar: pole drawn on in two drawings, then the cloth, which flutters on threes
    const top = spot(4), px = top[0] + 0.27 * H;
    if (tt >= 5.5) {
      const grown = [0.5, 1][Math.min(1, Math.round((tt - 5.5) * 12))];
      IB.seg(ctx, px, top[1], px, top[1] - 250 * grown, { w: 3.4, seed: 300 });
      if (tt >= 68 / 12 - 1e-6) { const flap = Math.floor(IB.frame(t) / 3) % 2; IB.ink(ctx, [[px, top[1] - 248], [px + 64, top[1] - 232 + flap * 8], [px + 118 - flap * 10, top[1] - 208 - flap * 6], [px + 60, top[1] - 190 + flap * 6], [px, top[1] - 172]], { closed: true, fill: C.green, w: 3, seed: 301 + flap }); }
    }
    IB.figure(ctx, poseAt(t), { ...WHO, face: { mouth: tt >= 5.5 ? 'open' : 'smile' } });
    IB.bubble(ctx, ['다 왔다!'], t, 6.0, { tip: [top[0] - 36, top[1] - 0.93 * H], x: top[0] - 210, y: top[1] - 1.2 * H, seed: 500 });
  },
});
</script>
