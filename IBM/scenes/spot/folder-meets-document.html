<!doctype html>
<meta charset="utf-8">
<title>spot / folder-meets-document</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script>
/* 미러볼 아래 다리 달린 파란 폴더가 풍선을 차자 화면이 옆으로 밀려 서류가 드러나고, 둘이 따로 춤추다 다가가 손을 잡으면 하트 풍선이 떠오른다. 왼쪽 카피는 사건마다 한 줄씩 붙다가 마지막에 통째로 바뀐다. 전달하는 생각: 따로 놀던 두 가지가 마침내 한자리에 선다.
   Motion notes: one locked shot, no cuts, 11.6 s. Copy is pinned to the screen (x 90, top 351, pitch 95) and only the stage pans: 291 px on twos with per-step travel 9, 12, 12, 113, 117, 13, 9, 6 px (slow out, two big steps, three to settle), starting 1.75 s. Copy beats: line 1 at 1.0 s, line 2 at 1.92 s (the whole block snaps back 37 px and re-settles, tau 0.21 s, still after 0.7 s), full swap at 8.67 s. Characters act on twos and hold dead still between poses; a body never deforms, it tilts or turns as one rigid shape on two thin legs, and arms exist only while they are used (drawn on in 0.25 s). The only tone is stippled graphite where a limb leaves its body (IB.shade). The kicked balloon rises fast then drifts down left for 2 s and stays as a prop. Last second: pose held, only the heart balloon moves, easing up exponentially (tau 0.3 s). Floor is nothing but a blue chalk smear under each pair of feet plus flat confetti ovals. Disco ball tiles re-roll every 4 frames. */
const { prog, kf, lerp, rng, hash, clamp } = MG;
const C = IB.C, FLOOR = 893;
const COPY_A = ['첫 줄이 먼저 오고', '둘째 줄이 붙는다.'], COPY_B = ['마지막에는 통째로', '새 문장이 된다.'];

// stage pan, px left to travel, per 24 fps frame (measured on the disco ball; it steps on twos)
const PAN = [[42, 282], [44, 270], [46, 258], [48, 145], [50, 28], [52, 15], [54, 6], [56, 0]];
const pan = (f) => { let v = 291; for (const [k, x] of PAN) if (f >= k) v = x; return v; };

const CONFETTI = (() => { const r = rng(12), out = []; for (let i = 0; i < 46; i++) out.push([720 + r() * 1230, 812 + r() * 150, 26 + r() * 16, r() < 0.5 ? '#d1e2ee' : '#eadeac']); return out; })();

function leg(ctx, hx, hy, fx, fy, fill, seed, knee = 0) {
  // a thin trouser leg from hip to foot, optionally bent, shaded where it leaves the body, ending in a small boot
  const mx = (hx + fx) / 2 + knee, my = (hy + fy) / 2;
  const dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy) || 1, nx = (-dy / d) * 7, ny = (dx / d) * 7;
  const outline = [[hx - nx, hy - ny], [mx - nx, my - ny], [fx - nx, fy - ny], [fx + nx, fy + ny], [mx + nx, my + ny], [hx + nx, hy + ny]];
  IB.ink(ctx, outline, { closed: true, smooth: knee !== 0, fill, w: 0, seed });
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(Math.atan2(dy, dx) - Math.PI / 2);
  IB.shade(ctx, -6, 0, 12, 42, { from: 'top', seed: seed + 2 });
  ctx.restore();
  IB.ink(ctx, outline, { closed: true, smooth: knee !== 0, w: 2.8, seed });
  IB.ink(ctx, [[fx - 8, fy - 5], [fx + 8, fy - 5], [fx + 9, fy + 2], [fx + 17, fy + 8], [fx + 14, fy + 12], [fx - 9, fy + 12]], { closed: true, smooth: false, fill: C.paper, w: 2.6, seed: seed + 1 });
  IB.seg(ctx, fx - 7, fy + 2, fx + 8, fy + 2, { w: 1.8, seed: seed + 3 });
}

/* A thin arm from a root on the body's edge to a hand: tapered, shaded at the root, drawn on by p (0..1), with a small mitten hand once it has arrived. */
function arm(ctx, root, hand, p, seed, sag = 6) {
  if (p <= 0) return;
  const tip = [lerp(root[0], hand[0], p), lerp(root[1], hand[1], p)];
  const dx = tip[0] - root[0], dy = tip[1] - root[1], d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d, s = Math.sign(dx) * sag * p;
  const mid = [(root[0] + tip[0]) / 2 - nx * s, (root[1] + tip[1]) / 2 - ny * s];
  const shape = [[root[0] + nx * 6.5, root[1] + ny * 6.5], [mid[0] + nx * 4.5, mid[1] + ny * 4.5], [tip[0] + nx * 3.5, tip[1] + ny * 3.5], [tip[0] - nx * 3.5, tip[1] - ny * 3.5], [mid[0] - nx * 4.5, mid[1] - ny * 4.5], [root[0] - nx * 6.5, root[1] - ny * 6.5]];
  IB.ink(ctx, shape, { closed: true, fill: C.paper, w: 0, seed });
  ctx.save(); ctx.translate(root[0], root[1]); ctx.rotate(Math.atan2(dy, dx));
  IB.shade(ctx, 0, -6, 46, 12, { from: 'left', seed: seed + 1, alpha: 0.5 });
  ctx.restore();
  IB.ink(ctx, shape.slice(0, 3), { w: 2.8, seed: seed + 2, taper: false });
  IB.ink(ctx, shape.slice(3), { w: 2.8, seed: seed + 3, taper: false });
  if (p < 1) return;
  // mitten: a palm and three finger strokes pointing along the arm
  const a = Math.atan2(dy, dx);
  ctx.save(); ctx.translate(tip[0], tip[1]); ctx.rotate(a);
  IB.ink(ctx, [[-2, -6], [10, -9], [20, -5], [22, 3], [12, 8], [-2, 6]], { closed: true, fill: C.paper, w: 2.6, seed: seed + 4 });
  for (const y of [-3, 1, 5]) IB.seg(ctx, 12, y, 21, y + 1, { w: 1.6, seed: seed + 5 + y });
  ctx.restore();
}

/* A rigid body on two legs. p: { x, tilt, lift, feet: [[dx, dy], [dx, dy]], sx } — x is the hip centre on the floor line, feet are offsets from it. */
function actor(ctx, p, body, legFill, hipY, seed) {
  IB.smear(ctx, p.x + (p.feet[0][0] + p.feet[1][0]) / 2, FLOOR, 104, { h: 9, seed });
  const hy = FLOOR - 12 - hipY - (p.lift || 0);
  ctx.save();
  ctx.translate(p.x, hy);
  ctx.rotate(p.tilt || 0);
  const hips = [[-17, 0], [17, 0]].map(([x, y]) => { const c = Math.cos(p.tilt || 0), s = Math.sin(p.tilt || 0); return [p.x + x * c - y * s, hy + x * s + y * c]; });
  ctx.restore();
  p.feet.forEach(([dx, dy], i) => leg(ctx, hips[i][0], hips[i][1] - 4, p.x + dx, FLOOR - 12 + dy - (p.air || 0), legFill, seed + 3 + i * 5, p.knee ? p.knee[i] : 0));
  ctx.save();
  ctx.translate(p.x, hy);
  ctx.rotate(p.tilt || 0);
  ctx.scale(p.sx == null ? 1 : p.sx, 1);
  body(ctx);
  ctx.restore();
}
const folderBody = (ctx) => {
  IB.ink(ctx, [[-100, -190], [-28, -190], [-10, -167], [100, -167], [100, 0], [-100, 0]], { closed: true, smooth: false, fill: C.blue, w: 4, seed: 21 });
  IB.seg(ctx, -100, -167, -12, -167, { w: 3, seed: 22 });
};
const docBody = (ctx) => {
  IB.box(ctx, -86, -238, 173, 238, { fill: C.paper, w: 3.6, seed: 31 });
  IB.box(ctx, -71, -227, 95, 114, { fill: C.lavender, w: 2, seed: 32 });
  IB.box(ctx, -58, -227, 57, 52, { fill: C.yellow, w: 2, seed: 33 });
  IB.box(ctx, -60, -110, 82, 32, { fill: C.mint, w: 2, seed: 34 });
  for (let i = 0; i < 5; i++) IB.seg(ctx, 28, -176 + i * 15, 58, -176 + i * 15, { w: 2.2, seed: 35 + i });
  IB.ink(ctx, [[-28, -200], [-28, -248], [-38, -252], [-40, -214]], { w: 2.5, seed: 41 });   // paper clip
};

function folderPose(t) {
  const f = IB.frame(t), step = Math.floor(f / 6) % 2;   // a dance step every 6 frames
  const stand = { x: 1093, feet: [[-17, 0], [17, 0]] };
  if (t < 0.75) return stand;
  if (t < 0.96) return { x: 1093, tilt: -0.05, feet: [[2, -26], [17, 0]], knee: [16, 0] };            // wind-up
  if (t < 1.25) return { x: 1093, tilt: 0.17, feet: [[-64, -22], [20, 0]] };                            // kick
  if (t < 3.25) return stand;
  if (t < 4.25) return { x: 1093, feet: step ? [[10, 0], [-10, 0]] : [[-22, 0], [22, 0]], knee: step ? [-8, 8] : [0, 0] };   // shuffle
  if (t < 6.0) return { x: 1100, tilt: -0.15, feet: step ? [[4, 0], [44, -6]] : [[22, -6], [32, 0]], knee: [6, 6] };          // leaning groove
  if (t < 6.25) return { x: 1100, lift: -14, feet: [[-22, 0], [22, 0]], knee: [-10, 10] };              // crouch
  if (t < 6.42) return { x: 1150, tilt: 0.8, lift: 70, air: 60, feet: [[30, 0], [62, -18]] };           // spins through the air
  if (t < 6.58) return { x: 1130, tilt: -0.45, lift: -30, feet: [[-40, 0], [150, 0]] };                 // lands in a long lunge
  if (t < 8.33) return { x: 1268, feet: [[-17, 0], [17, 0]] };
  if (t < 8.67) return { x: lerp(1268, 1315, (IB.twos(t) - 8.33) / 0.34), tilt: -0.07, feet: step ? [[-20, 0], [10, -8]] : [[-6, -8], [22, 0]] };
  return { x: 1315, feet: [[-17, 0], [17, 0]] };
}
function docPose(t) {
  const f = IB.frame(t), step = Math.floor(f / 8) % 2;
  const twirl = (t0, x0, x1) => { const u = clamp((IB.twos(t) - t0) / 0.5); return { x: lerp(x0, x1, u), sx: Math.max(0.22, Math.abs(Math.cos(u * Math.PI))), tilt: Math.sin(u * Math.PI) * 0.16, feet: [[-10, 0], [12, -4]] }; };
  if (t < 3.7) return { x: 1700, feet: [[-16, 0], [16, 0]] };
  if (t < 4.2) return twirl(3.7, 1700, 1700);
  if (t < 4.5) return { x: 1700, feet: [[-16, 0], [16, 0]] };
  if (t < 6.2) return { x: 1700, tilt: step ? 0.05 : -0.05, feet: [[-26, 0], [26, 0]], akimbo: true };   // hands on hips, swaying
  if (t < 7.75) return { x: 1700, feet: [[-16, 0], [16, 0]] };
  if (t < 8.25) return twirl(7.75, 1700, 1598);
  return { x: 1598, feet: [[-16, 0], [16, 0]] };
}

function discoBall(ctx, cx, cy, R, f) {
  IB.seg(ctx, cx, -10, cx, cy - R, { w: 3, seed: 50 });
  const roll = Math.floor(f / 4), N = 8, pt = (i, j) => { const lon = (i / N - 0.5) * 2.9, lat = (j / N - 0.5) * 2.9; return [cx + R * Math.cos(lat) * Math.sin(lon), cy + R * Math.sin(lat)]; };
  IB.oval(ctx, cx, cy, R, R, { fill: '#e2e2e2', w: 0, n: 20 });
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const h = hash(i * 31 + j, roll + (i + j) % 3), col = h < 0.16 ? C.yellow : h < 0.3 ? C.blue : h < 0.38 ? C.lavender : h < 0.62 ? C.paper : null;
    if (col) IB.ink(ctx, [pt(i, j), pt(i + 1, j), pt(i + 1, j + 1), pt(i, j + 1)], { closed: true, smooth: false, fill: col, w: 0, wob: 0 });
  }
  for (let i = 1; i < N; i++) {
    IB.ink(ctx, Array.from({ length: N + 1 }, (_, j) => pt(i, j)), { w: 2.4, seed: 60 + i, taper: false });
    IB.ink(ctx, Array.from({ length: N + 1 }, (_, j) => pt(j, i)), { w: 2.4, seed: 70 + i, taper: false });
  }
  IB.oval(ctx, cx, cy, R, R, { w: 3.4, seed: 51, n: 20 });
}

function party(ctx) {
  // hoop stand: lavender tubing with an ink edge
  const tube = (pts, seed) => IB.tube(ctx, pts, { w: 13, edge: 2.75, fill: C.lavender, seed });
  tube([[1650, 370], [1650, 152], [1930, 152]], 80);
  tube([[1737, 337], [1737, 249], [1860, 249], [1860, 337], [1737, 337]], 81);
  tube([[1810, 362], [1930, 362]], 82);
  // net
  for (let i = 0; i < 6; i++) { IB.seg(ctx, 1708 + i * 20, 322, 1730 + i * 11, 420, { w: 2, seed: 90 + i }); IB.seg(ctx, 1808 - i * 20, 322, 1786 - i * 11, 420, { w: 2, seed: 96 + i }); }
  IB.oval(ctx, 1758, 320, 55, 6, { fill: C.bg, w: 2.6, seed: 89, n: 12 });
  // balloons
  [[1593, 357, C.yellow], [1688, 372, C.lavender], [1630, 265, C.blue], [1620, 306, C.lavender], [1684, 318, C.mint], [1641, 372, C.blue]].forEach(([x, y, col], i) => {
    IB.oval(ctx, x, y, 32, 35, { fill: col, w: 3, seed: 100 + i, n: 12 });
    IB.ink(ctx, IB.ellipse(x - 4, y - 2, 20, 23, 6, 3.4, 4.5), { w: 2.4, color: C.paper, seed: 110 + i });
  });
  // bunting
  const sag = (x) => 12 + 104 * Math.pow((x - 1500) / 430, 1.5);
  IB.ink(ctx, [1500, 1600, 1700, 1800, 1930].map((x) => [x, sag(x) - 14]), { w: 3, seed: 120 });
  [[1500, C.yellow], [1594, C.lavender], [1690, C.blue], [1782, C.mint], [1876, C.yellow]].forEach(([x, col], i) => {
    IB.ink(ctx, [[x, sag(x) - 16], [x + 78, sag(x + 78) - 12], [x + 10 + i * 4, sag(x) + 96]], { closed: true, smooth: false, fill: col, w: 3, seed: 121 + i });
  });
}

function balloonAt(t) {
  // on the floor by the folder, kicked at 0.96 s, up fast then a slow drift down to rest (stage coordinates)
  if (t < 0.96) return [960, 855];
  return kf(IB.twos(t), [[0.96, [960, 855]], [1.0, [874, 722], 'outQuad'], [1.25, [764, 623], 'outQuad'], [1.5, [706, 618], 'linear'], [2.0, [622, 687], 'linear'], [2.5, [560, 820], 'linear'], [3.0, [530, 872], 'outQuad'], [3.6, [485, 872], 'outCubic']]);
}

MG.scene({
  title: 'spot / folder-meets-document',
  duration: 11.625, ref: [90.083, 101.708], fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = IB.frame(t);
    ctx.setTransform(1, 0, 0, 1, pan(f), 0);

    for (const [x, y, rx, col] of CONFETTI) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, 5, 0, 0, 7); ctx.fill(); }
    discoBall(ctx, 1302, 215, 105, f);
    party(ctx);

    const [bx, by] = balloonAt(t);
    if (by > 840) IB.smear(ctx, bx, 903, 70, { h: 7, seed: 15, alpha: clamp((by - 840) / 30) });
    IB.oval(ctx, bx, by, 40, 33, { fill: C.lavender, w: 3, seed: 16, n: 12 });
    IB.ink(ctx, [[bx + 38, by - 2], [bx + 47, by - 7], [bx + 46, by + 4]], { closed: true, fill: C.lavender, w: 2.4, seed: 17 });

    const fp = folderPose(t), dp = docPose(t);
    const tt = IB.twos(t);
    // arms appear only to hold hands, from behind each body's edge: the folder reaches at 9.25 s, the document answers at 9.5 s, one swing at 10 s
    if (tt >= 9.25) {
      const sw = kf(tt, [[10.0, 0], [10.17, 1, 'outQuad'], [10.5, 0, 'inOutQuad']]);
      const H = [1458, 734 - sw * 52];
      arm(ctx, [1524, 652], [H[0] + 12, H[1]], prog(tt, 9.5, 0.25), 420, -8);
      arm(ctx, [1403, 648], [H[0] - 12, H[1]], prog(tt, 9.25, 0.25), 400, 8);
    }
    actor(ctx, dp, docBody, '#d9d9d9', 106, 300);
    if (dp.akimbo) for (const s of [-1, 1]) { IB.tube(ctx, [[dp.x + s * 86, 648], [dp.x + s * 114, 688], [dp.x + s * 90, 718]], { w: 11, edge: 2.6, fill: C.paper, smooth: true, seed: 320 + s }); IB.oval(ctx, dp.x + s * 88, 720, 8, 7, { fill: C.paper, w: 2.4, seed: 324 + s, n: 8 }); }
    actor(ctx, fp, folderBody, C.sky, 106, 200);

    // heart balloon: the only thing moving in the last second
    if (tt >= 10.6) {
      const hy = lerp(720, 415, IB.settle(tt - 10.6, 0.3)), hx = 1456;
      IB.seg(ctx, hx, hy + 22, hx - 2, hy + 62, { w: 2, seed: 410 });
      IB.ink(ctx, [[hx, hy + 24], [hx - 22, hy - 2], [hx - 12, hy - 20], [hx, hy - 8], [hx + 12, hy - 20], [hx + 22, hy - 2]], { closed: true, fill: C.yellow, w: 2.6, seed: 411 });
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (t < 8.667) IB.copy(ctx, t >= 1.917 ? COPY_A : COPY_A.slice(0, 1), t, t >= 1.917 ? 1.917 : 1.0);
    else IB.copy(ctx, COPY_B, t, 8.667, { from: 47 });
  },
});
</script>
