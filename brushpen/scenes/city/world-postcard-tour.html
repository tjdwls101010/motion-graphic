<!doctype html>
<meta charset="utf-8">
<title>city / world-postcard-tour</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/props/nature.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../../kit/sets/landmarks.js"></script>
<script src="../../kit/props/citylife.js"></script>
<script>
/* 세계 엽서: 종이비행기 하나가 뉴욕, 런던, 파리, 도쿄, 서울, 시드니, 로마, 기자의 랜드마크를 차례로 가로질러 날고, 도시와 도시 사이는 원본의 스피드라인 휩으로 넘어간다. 도시마다 하나씩 작은 움직임이 있다(여객선, 빅벤의 분침과 런던 아이, 에펠탑의 반짝임, 벚꽃잎, 광화문 위의 새, 오페라하우스 앞 배, 콜로세움의 비둘기, 피라미드 위의 새). 원본에 없는 창작 장면이다. 전달하는 생각: 한 줄기 비행이 세계를 한 장씩 넘긴다.
   Motion notes: 12.5 s, eight cards: the first 2.0 s, the six after it 1.5 s, the last 1.5 s with its final 0.75 s still. Each card holds and is joined to the next by the reference's whip (insert/mesh-eyes-whip): the card slides out left in 2 drawings on ones (-1150, -1500 px), two frames of whip on a bare stage, and the next card slides in from the right over 4 frames (1500, 1100, 600, 180 px) under the whip's streaks, the whip tinted with the colours leaving and arriving. The paper plane crosses every card left to right on twos (1070 px a second, bobbing 40 px), so the eye follows one thing through the cuts. In each card one thing moves: on ones for machines (the ferries, Big Ben's minute hand), on twos for drawn things (waves, sparkle, petals, wings). The last card holds still from 11.75 s. Colours: each city's own (the ferry's yellow, the Eye's sky capsules, the tower's bronze, Fuji's blue, the hill's mint, the stone of Rome and the sand of Giza). */
const SEG = 36, N = 8;
const plane = (u) => [-200 + u * 1070, 320 + Math.sin(u * 3.2) * 40];
const CARDS = [
  (ctx, u, d, ff) => { IB.river(ctx, [-100, 2100], 800, { d, h: 300 }); IB.skyline(ctx, 800); IB.liberty(ctx, [900, 800], { h: 600 }); IB.ferry(ctx, [260 + ff * 9, 830], { s: 0.7 }); },
  (ctx, u, d, ff) => { IB.skyline(ctx, 860); IB.bigBen(ctx, [700, 860], { h: 640, time: [11, 59 + Math.floor(ff / 18)] }); IB.londonEye(ctx, [1320, 860], { r: 300, rot: ff * 0.002 }); },
  (ctx, u, d) => { IB.skyline(ctx, 880); IB.eiffel(ctx, [960, 880], { h: 720, sparkle: d % 2 }); IB.lamppost(ctx, [480, 880], { h: 380 }); IB.lamppost(ctx, [1440, 880], { h: 380 }); },
  (ctx, u, d) => { IB.fuji(ctx, [1200, 860], { w: 1100, h: 320 }); IB.skyline(ctx, 860); IB.tokyoTower(ctx, [680, 860], { h: 640 }); IB.petals(ctx, [0, 100, 1920, 980], { d, n: 30, seed: 44 }); },
  (ctx, u, d) => { IB.skyline(ctx, 880); IB.namsanTower(ctx, [1450, 880], { h: 330, hill: 200 }); IB.gwanghwamun(ctx, [780, 880], { h: 400 }); [0, 1].forEach((i) => IB.flapper(ctx, [600 + u * 500 + i * 70, 300 - i * 30], { wing: (d + i) % 2, s: 1.2, color: IB.C.ink, seed: 60 + i })); },
  (ctx, u, d, ff) => { IB.river(ctx, [-100, 2100], 780, { d, h: 320 }); IB.skyline(ctx, 780); IB.operaHouse(ctx, [960, 790], { h: 260 }); IB.ferry(ctx, [1700 - ff * 8, 830], { s: 0.55, dir: -1 }); },
  (ctx, u, d) => { IB.skyline(ctx, 860); IB.colosseum(ctx, [960, 860], { h: 340 }); [0, 1, 2].forEach((i) => IB.flapper(ctx, [700 + u * 420 + i * 60, 360 + i * 25 - u * 80], { wing: (d + i) % 2, s: 1.1, seed: 70 + i })); },
  (ctx, u, d) => { IB.skyline(ctx, 880); IB.pyramids(ctx, [560, 880], { h: 340 }); if (u < 1.5) IB.flapper(ctx, [1100 + u * 400, 330 - u * 60], { wing: d % 2, s: 1.3, color: IB.C.ink, seed: 80 }); },
];
const TINT = [[IB.C.yellow], [IB.C.sky], [IB.C.mustard], [IB.C.sky], [IB.C.mint], [IB.C.paper], ['#e6e2d6'], [IB.C.yellow]];
const FIRST = 48, START = (i) => (i === 0 ? 0 : FIRST + (i - 1) * SEG), LEN = (i) => (i === 0 ? FIRST : SEG);   // the first card is 0.5 s longer, so the gallery's poster (0.72 of the length) falls on a held card
const stateAt = (f) => {   // which card, its own frame, and its slide offset; whip frames
  let i = 0; while (i < N - 1 && f >= START(i + 1)) i++;
  const k = f - START(i), L = LEN(i);
  if (i === N - 1) return { i, k, off: k < 4 ? [1500, 1100, 600, 180][k] : 0, whip: k < 4 };
  if (i > 0 && k < 4) return { i, k, off: [1500, 1100, 600, 180][k], whip: true };
  if (k < L - 4) return { i, k, off: 0, whip: false };
  if (k < L - 2) return { i, k, off: [-1150, -1500][k - (L - 4)], whip: true };
  return { i: -1, k, off: 0, whip: true };
};

IB.actors = (t) => { const f = Math.floor(t * 24), s = stateAt(f), u = Math.max(0, s.k) / 24; return { card: s.i, slide: s.off, plane: s.i >= 0 && f < 282 ? plane(Math.floor(u * 12) / 12).map(Math.round) : null }; };

MG.scene({
  title: 'city / world-postcard-tour',
  duration: 12.5, ref: null, fps: 24,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    const f = Math.floor(t * 24), s = stateAt(f);
    if (s.i >= 0) {
      const u = s.k / 24, still = f >= 282, uu = still ? 34 / 24 : u, d = Math.floor(uu * 12), ff = still ? 34 : s.k;
      ctx.save(); ctx.translate(s.off, 0);
      CARDS[s.i](ctx, uu, d, ff);
      if (!still) IB.paperPlane(ctx, plane(Math.floor(u * 12) / 12), { s: 1.1, rot: Math.cos(u * 3.2) * 0.12, seed: 400 });
      ctx.restore();
    }
    if (s.whip) IB.whip(ctx, f, { seed: 9 + s.i, tint: TINT[Math.max(0, s.i)] });
  },
});
</script>
