<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script>
/* 터미널 프롬프트 위에 작은 픽셀 컴퓨터 그림이 뜨고 이름이 한 글자씩 타이핑된다. 조용한 커서가 짧은 서명으로 바뀌는 채널 아이디다. Motion notes: the picture pops in over 0.25 s from 0.15 s, the caret blinks at 1 Hz, and the name types from 1.1 to 2.4 s. */
const BEATS = { picture: 0.15, type: 1.1 };
const FRAME = { cx: 960, pictureY: 330, pictureW: 900, pictureH: 500, textY: 820 };
const CAMERA = [[0, [1, 0, 0]], [2.7, [1, 0, 0]]];
const NAME = 'YOUR NAME';

MG.scene({
  title: 'bumper / pixel-typing-logo',
  duration: 2.7,
  ref: [273, 275.7],
  setup(stage) {
    return MG.canvas(stage);
  },
  render(t, ctx) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#f1f1f1';
    ctx.fillRect(0, 0, 1920, 1080);
    const [scale, x, y] = MG.kf(t, CAMERA);
    ctx.setTransform(scale, 0, 0, scale, x, y);
    // The original pixel vignette pops above the cursor.
    const pop = MG.prog(t, BEATS.picture, 0.25, 'outBack');
    ctx.save();
    ctx.translate(FRAME.cx, FRAME.pictureY);
    ctx.scale(pop, pop);
    ctx.fillStyle = '#211d24';
    ctx.fillRect(-FRAME.pictureW / 2, -FRAME.pictureH / 2, FRAME.pictureW, FRAME.pictureH);
    ctx.fillStyle = '#9ca3a0';
    ctx.fillRect(-380, -175, 285, 265);
    ctx.fillStyle = '#d6d8d5';
    ctx.fillRect(-350, -145, 230, 205);
    ctx.fillStyle = '#263d2f';
    ctx.fillRect(-330, -125, 190, 145);
    ctx.fillStyle = '#5a8b63';
    for (let i = 0; i < 6; i++) ctx.fillRect(-318, -110 + i * 20, 140 - (i % 2) * 38, 5);
    ctx.fillStyle = '#c4c6c4';
    ctx.fillRect(-370, 100, 315, 42);
    ctx.fillStyle = '#141319';
    ctx.fillRect(105, -175, 205, 215);
    ctx.fillStyle = '#bd857b';
    ctx.fillRect(80, -60, 55, 105);
    ctx.fillStyle = '#c8a59c';
    ctx.fillRect(-30, 120, 150, 35);
    ctx.fillStyle = '#e5dfd9';
    ctx.fillRect(-220, 145, 260, 35);
    ctx.fillStyle = '#5e6868';
    ctx.fillRect(20, 55, 355, 195);
    ctx.fillStyle = '#8b9796';
    ctx.fillRect(65, 80, 270, 35);
    ctx.restore();
    // The wide monospace name types beside the blinking block caret.
    ctx.font = '700 100px "JetBrains Mono"';
    ctx.textBaseline = 'middle';
    const text = '> ' + MG.typed(NAME, MG.prog(t, BEATS.type, 1.3));
    const width = ctx.measureText(text + '▌').width;
    const left = FRAME.cx - width / 2;
    ctx.fillStyle = '#333';
    ctx.fillText(text, left, FRAME.textY);
    if (MG.blink(t)) ctx.fillRect(left + ctx.measureText(text).width + 8, FRAME.textY - 50, 42, 100);
  },
});
</script>
