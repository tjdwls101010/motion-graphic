<!doctype html>
<meta charset="utf-8">
<title>overlay / step-badge-progress</title>
<link rel="stylesheet" href="../../../core/base.css">
<link rel="stylesheet" href="../../kit/overlay.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/overlay.js"></script>
<script>
/* 구석에 챕터 배지가 머무는 동안 체크 표시가 된 종이 라벨이 설치와 설정 단계를 소개한다. Motion notes: the paper lands at 0.25 s over 0.2 s, the text types over 0.8 s, and the check draws in two strokes at 0.6 s; the paper holds for 3 s and leaves at 3.9 s. */
const BEATS = { paper: .25, type: .3, check: .6, exit: 3.9 };
const POS = { label: [1280, 110, 500], check: [1190, 105] };
const CAMERA = [[0, [1, 0, 0]], [4.2, [1, 0, 0]]];

MG.scene({
  title: 'overlay / step-badge-progress',
  duration: 4.2,
  ref: [493.3, 497.5],
  setup(stage) {
    const world = OV.root(stage);
    const badge = OV.badge(world, '0단계 · 설치와 설정');
    const label = OV.label(world, ...POS.label);
    const check = OV.check(world, ...POS.check);
    return { world, badge, label, check };
  },
  render(t, r) {
    OV.camera(r.world, t, CAMERA);
    // The badge is fixed while the paper stamps down and types its step name.
    const pop = MG.prog(t, BEATS.paper, .2, 'outBack');
    const exit = 1 - MG.prog(t, BEATS.exit, .3);
    r.label.el.style.opacity = String(MG.clamp(pop * 3) * exit);
    r.label.el.style.transform = `rotate(-1deg) scale(${.9 + .1 * pop})`;
    r.label.text.textContent = MG.typed('0단계 · 설치와 설정', MG.prog(t, BEATS.type, .8));
    // The check follows the handwriting in two pen strokes.
    MG.draw(r.check.first, MG.prog(t, BEATS.check, .12));
    MG.draw(r.check.second, MG.prog(t, BEATS.check + .12, .2));
    r.check.el.style.opacity = String(exit);
  },
});
</script>
