<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../kit/base.css">
<link rel="stylesheet" href="../../kit/terminal.css">
<script src="../../kit/motion.js"></script>
<script src="../../kit/stage.js"></script>
<script src="../../kit/terminal.js"></script>
<script>
/* A slash-command menu is annotated with three roles as the selection advances. The labels turn the technical menu into a sequence of different perspectives. Motion notes: the slash key pops at 0 s, the three arrows draw over 0.35 s at 0.3, 4.5 and 9.3 s, and down-key pops at 3.5 and 8 s separate the holds. */
const BEATS = { slash: 0, ceo: 0.3, down1: 3.5, engineer: 4.5, down2: 8, qa: 9.3 };
const FRAME = { keyX: 560, keyY: 690, arrowX: 1080, arrowY: 224 };
const CAMERA = [[0, [1, 0, 0]], [12, [1, 0, 0]]];

MG.scene({
  title: 'terminal / annotation-arrows',
  duration: 12,
  ref: [184, 196],
  setup(stage) {
    const root = Terminal.root(stage);
    const win = Terminal.window(root);
    Terminal.header(win.body);
    const commands = [
      '/plan-ceo-review       CEO/founder-mode plan review. (gstack)',
      '/plan-eng-review       Engineering plan review. (gstack)',
      '/qa                    Fix browser/API/CLI bugs and test flows. (gstack)',
      '/add-dir               Add a new working directory',
      '/advisor               Let Claude consult a stronger model at key moments',
    ];
    const rows = commands.map((text) => Terminal.line(win.body, text));
    win.body.append(MG.el('div', { class: 'term-rule' }));
    Terminal.line(win.body, '❯ ▌');
    win.body.append(MG.el('div', { class: 'term-rule' }));
    Terminal.status(win.body);
    Terminal.webcam(root);
    const slash = Terminal.key(root, '/', FRAME.keyX, FRAME.keyY);
    const down = Terminal.key(root, '↓', FRAME.keyX, FRAME.keyY);
    const arrows = [
      Terminal.arrow(root, 'CEO 모자', FRAME.arrowX, FRAME.arrowY),
      Terminal.arrow(root, '엔지니어 모자', FRAME.arrowX, FRAME.arrowY + 28),
      Terminal.arrow(root, 'QA 모자', FRAME.arrowX, FRAME.arrowY + 56),
    ];
    return { root, rows, slash, down, arrows };
  },
  render(t, refs) {
    Terminal.camera(refs.root, t, CAMERA);
    // The selected row brightens while the other commands stay subdued.
    const selected = t < BEATS.engineer ? 0 : t < BEATS.qa ? 1 : 2;
    refs.rows.forEach((row, i) => { row.style.color = i === selected ? '#d5ded9' : '#84918d'; });
    // Key presses punctuate the selection changes.
    Terminal.pop(refs.slash, t, BEATS.slash, 0.45);
    Terminal.pop(refs.down, t, t < BEATS.down2 ? BEATS.down1 : BEATS.down2, t < BEATS.down2 ? 4.2 : 8.7);
    // Each annotation draws from the label toward its selected row.
    const starts = [BEATS.ceo, BEATS.engineer, BEATS.qa];
    const ends = [BEATS.down1, BEATS.down2, 12.1];
    refs.arrows.forEach((arrow, i) => Terminal.arrowShow(arrow, t, starts[i], ends[i]));
  },
});
</script>
