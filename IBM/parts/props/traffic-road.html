<!doctype html>
<meta charset="utf-8">
<title>props / traffic-road</title>
<link rel="stylesheet" href="../../../core/base.css">
<script src="../../../core/motion.js"></script>
<script src="../../../core/stage.js"></script>
<script src="../../kit/ink.js"></script>
<script src="../../kit/time.js"></script>
<script src="../../kit/marks.js"></script>
<script src="../../kit/figure.js"></script>
<script src="../../kit/props/vehicles.js"></script>
<script src="../../kit/props/traffic.js"></script>
<script src="../sample.js"></script>
<script>
/* 소품 견본: 찻길의 것 — 옆에서 본 횡단보도 IB.crosswalk, 버스 IB.bus와 치수 IB.BUS, 출발할 때의 매연 IB.exhaust. 횡단보도의 흰 줄은 바닥에 누운 평행사변형이라 선 위 34px에서 아래 30px까지 놓이고, 먼 변은 소실 x 쪽으로, 가까운 변은 반대로 3.5%씩 벌려 원근을 약하게 준다. 버스는 몸통 1100x440에 한 가지 색(초록)과 흰 창 줄, 앞유리, 글자 없는 짙은 행선판, 앞쪽의 두 짝 문(state.door 0 닫힘~1 열림, 기계라 1프레임 단위), 뒤쪽 배기관이다. state.pitch는 뒷바퀴가 땅에 닿는 점을 축으로 몸통만 앞을 드는 출발의 주저앉음(바퀴는 도로에 남는다). 매연은 배기관 입에서 공 하나, 둘, 셋이 뒤로 굴러 커지다가(반지름 44까지) 큰 공 둘(50, 32)이 끊긴 외곽선으로 남는 넉 장(2프레임 단위)이고 버스를 따라가지 않는다. */
const C = IB.C, ROAD = 900;
MG.scene({
  title: 'props / traffic-road',
  duration: 4, ref: null, fps: 24, loop: true,
  setup: (stage) => MG.canvas(stage),
  render(t, ctx) {
    IB.bg(ctx);
    SAMPLE.title(ctx, 'props/traffic.js — crosswalk, bus, BUS, exhaust');
    const c = SAMPLE.grid(2, 1), f = IB.frame(t), d2 = Math.floor(f / 2);
    SAMPLE.cell(ctx, c[0], SAMPLE.fit(c[0], [960, ROAD], 150), () => {
      IB.smear(ctx, 960, ROAD - 9, 1500, { h: 14, seed: 9, alpha: 0.5 });
      IB.crosswalk(ctx, [380, 1560, ROAD], {});
    }, 'IB.crosswalk([x0, x1, y], { far: 34, near: 30, p: 0.035 })');
    const door = f < 24 ? 1 : f < 32 ? 1 - (f - 24) / 8 : 0, k = d2 - 18, go = f >= 36 ? (f - 36) / 24 : 0, x = 900 + 360 * go * go;
    SAMPLE.cell(ctx, c[1], [180, ROAD + 40 - 640, 640 * c[1][2] / c[1][3], 640], () => {
      IB.bus(ctx, [x, ROAD], { door, spin: (x - 900) / IB.BUS.r, pitch: f >= 36 && f < 42 ? 0.012 : 0 });
      if (k >= 0 && k < 4) IB.exhaust(ctx, [900 - IB.BUS.len / 2 - 12, ROAD - IB.BUS.r + 15], { k });
    }, `IB.bus(at, { door: ${door.toFixed(2)}, spin, pitch }); IB.exhaust({ k: ${k >= 0 && k < 4 ? k : '-'} })`);
  },
});
</script>
